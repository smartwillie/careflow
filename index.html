CommonSpirit Health System updated its High-Alert Medications guidelines. This revision now includes a dual-witness for ALL insulin routes, including subcutaneous administration.\n- Endorsement: Reviewed and vetted by:\n   - CommonSpirit Health System Medication Safety Committee\n   - Nursing Executive Council\n   - System Pharmacy and Therapeutics Committee\n\nWHAT TO DO:\n- For all insulin types and routes, including subcutaneous, a dual-sign off is required in the medication administration record (EMAR) to ensure an independent double-check by two licensed practitioners.\n- Independent double check process: Both practitioners must independently verify the patient''s name, medication, dose, route, and time (the five rights) BEFORE administration.\n\nWHAT TO SHARE:\n- High alert medications, such as insulin, carry a significant risk of harm when used incorrectly; the new dual-verification standard is a critical patient safety measure.\n- Share this KDS with clinical staff as appropriate.","source":"Sac Market KDS - Insulin Witness.pdf","lastUpdated":"2026-06-10"},{"id":"suicide_documentation_tips_for_nursing","title":"Suicide Documentation Tips for Nursing","category":"Behavioral Health & Safety","keywords":["suicide","documentation","tips","nursing","cssrs","columbia","severity","rating","scale","screener","frequent","risk","assessment","moderate","high","admission","ad","hoc","activities","intervention","iview","i","view","observation","hourly","safe","room","checklist","shift","level","1:1","poc","plan","of","care","skin","check","bed","bug","valuables","belongings","family","security","medications","pharmacy","protective","factors","behavior","condition"],"content":"SUICIDE DOCUMENTATION TIPS FOR NURSING\n\n1. Complete CSSRS (Columbia Suicide Severity Rating Scale) upon initial assessment/admission. This is part of the adult admission history and is the initial screening to identify the level of risk. This form can also be found in Ad Hoc under Admission documentation.\n\n2. If the patient is screened as Moderate or High risk, you must complete the CSSRS Risk Assessment (only needs to be completed once, but MUST include risk and protective factors). This form is located in Ad Hoc under Admission documentation.\n\n3. CSSRS Frequent Screener Tool needs to be completed at a minimum of every shift, or with any changes in patient condition or behavior. If the patient is High Risk, this needs to be completed every 4 hours. This form is located under Activities and Intervention; it is a continuous task generated automatically depending on the level of risk (moderate or high).\n\n4. Hourly documentation in I-View under Observation/Suicide Intervention, including the first 5 boxes:\n   - Reason for Observation\n   - Observation Noted\n   - Suicide Interventions by Safety [Attendant]\n   - Suicide Interventions by RN\n   - Safety Intervention by Safety [Attendant]\n\n5. Safe Room Checklist once a shift in I-View.\n\n6. Document the level of observation in I-View:\n   - Every 4 hours for 1:1 observation\n   - Every shift for all other levels\n   - Every time the observation level changes\n\n7. Initiate POC (Plan of Care) for suicide and update the POC every shift.\n\n8. Following skin check, document Bed Bug Exposure or No Bed Bug.\n\n9. Valuables and belongings: send to family. If family is not available, send to security. Medications need to be sent to the pharmacy.","source":"Suicide Documenation Tips for Nursing.pdf","lastUpdated":"2026-06-11"},{"id":"timekeeping_policy_2023","title":"Timekeeping Policy","category":"HR & Administrative","keywords":["timekeeping","time","attendance","clock","badge","swipe","quick","badge","ivr","interactive","voice","response","overtime","non-exempt","exempt","clocking","request","payroll","adjustment","form","paf","pto","attestation","sign","timecard","editor","manager","auto","forward","meal","rest","period","off-the-clock","corrective","action","pay","period","dignity","health","policy","120.2.007"],"content":"DIGNITY HEALTH ADMINISTRATIVE POLICY AND PROCEDURE\nSUBJECT: Timekeeping | POLICY NUMBER: 120.2.007 | EFFECTIVE DATE: July 5, 2023\n\nPOLICY:\nAll employees must accurately record hours worked using the existing time and attendance system. Time worked is any time spent performing assigned job duties. Off-the-clock work is strictly forbidden. Altering, falsifying, or tampering with time records, or clocking in/out for another employee, may result in disciplinary action up to and including termination.\n\nNON-EXEMPT EMPLOYEES:\n- Must record start time, meal period in/out times, and stop time for every shift.\n- Paid working time includes: on-call, call back, education in-service, float assignments, and time to put on/take off required specialized clothing or protective gear (typically 7-10 minutes).\n- Three approved methods to record time:\n   1. Swipe ID badge at time clock closest to primary work area\n   2. Quick Badge on a computer\n   3. Interactive Voice Response (IVR) system, where approved\n- Seek pre-authorization from manager to work overtime when possible. All overtime worked and recorded will be paid.\n- If hours are not recorded before pay period closes: submit a Clocking request ASAP for manager review/approval before pay period closes.\n- Corrections after pay period closes: use a Payroll Adjustment Form (PAF).\n- Consistent failure to accurately record hours may require additional training and corrective action.\n- Must review and electronically sign time records at end of last worked shift of pay period, including attestation: \"I hereby declare that the hours recorded in the timekeeping system accurately identify all time that I have worked during the designated pay period.\" California employees additionally attest to meal/rest period compliance.\n- All time cards must be signed by employee and approved by manager (or designee).\n- Off-site non-exempt employees must use one of the three approved timekeeping methods for their location.\n\nEXEMPT EMPLOYEES:\n- Paid an annualized salary bi-weekly. Daily time records are pre-populated.\n- Must enter all paid time off (PTO/Vacation, Jury Duty, Bereavement, and other paid time off) into the timekeeping system.\n\nMANAGERS:\n- Must timely review electronic time cards and correction requests daily.\n- Responsible for verifying accuracy/completeness of time and attendance records for direct reports.\n- May designate an Editor (a person with knowledge of staff schedules to act as timekeeper).\n- If away 2+ weeks: must use Auto Forward feature to temporarily assign approval rights to another approver.\n- Must review, edit, and approve all time recorded by Payroll deadlines.\n- Changes to an employee''s time records must never be made without the employee''s approval; document any Editor/manager changes.\n\nRESPONSIBILITIES SUMMARY:\nEmployee: record actual time worked/absences; verify and sign timecard at end of pay period.\nEditor: review Calendar/Clocking requests for accuracy, approve/deny, review time cards, complete Editor sign off.\nManager: review Calendar/Clocking requests, review and approve time cards, submit timecard corrections after pay period close via PAF.","source":"Timekeeping policy 2023.pdf","lastUpdated":"2026-06-11"},{"id":"unscheduled_absences_tardiness","title":"Unscheduled Absences/Tardiness","category":"HR & Administrative","keywords":["unscheduled","absence","tardiness","tardy","attendance","occurrence","no","call","no","show","corrective","action","ssa","sacramento","service","area","pto","sick","leave","schedule","scheduled","absences","resignation","voluntary","12","month","period","threshold","department","manager","physician","statement","chronic","condition","medical","certification","employee","health","human","resources","disciplinary","termination","performance","appraisal","bereavement","jury","duty"],"content":"SACRAMENTO SERVICE AREA (SSA) HUMAN RESOURCES POLICY AND PROCEDURE\nSUBJECT: Unscheduled Absences/Tardiness | APPROVED: 03/27/2014\nApplies to: Mercy General Hospital, Mercy Hospital of Folsom, Mercy San Juan Medical Center, Methodist Hospital of Sacramento, GSSA Operations\n\nPURPOSE:\nRegular work attendance is essential to productivity, morale, cost effectiveness, and quality patient care. SSA allows up to 5 unscheduled absences in a 12-month period. Excessive absenteeism or tardiness is cause for corrective action up to and including termination.\n\nDEFINITIONS:\n- Unscheduled Absence: unplanned absence without advance supervisor approval. NOT included: absences covered by Federal/State law, work-related illness/injury, SB 1471, bereavement leave, house convenience, or jury duty.\n- Scheduled Absence: planned days off with advance supervisor approval.\n- Tardiness: reporting after scheduled start time without 24-hour prior approval, or not in assigned work area ready to work at scheduled time. PTO is not used for tardiness, and time may not be made up at end of shift unless requested by manager. Write \"Tardy\" on the timecard so Payroll does not apply PTO.\n- No Call/No Show: failure to appear for work as scheduled or to call prior to shift start per department policy.\n- Occurrence: each separate incident of unscheduled time off (full or partial shift), one or more days, separated by a day or days of work (exceptions for relapse per Extended Sick Leave policy).\n\nASSESSING UNSCHEDULED ABSENCES/TARDINESS:\n- Thresholds warranting corrective action (per Corrective Action Policy):\n   - Unscheduled Absence (excludes scheduled PTO/sick leave): more than 5 occurrences in 12 months\n   - Tardiness: more than 5 occurrences in 12 months\n\nCORRECTIVE ACTION:\n- Each new occurrence: Department Manager (or designee) reviews occurrences for the preceding 12 months, including the latest.\n- If occurrences exceed threshold, corrective action may be initiated; each succeeding occurrence over threshold may result in further discipline up to termination.\n- No Call/No Show: a single occurrence may warrant corrective action. THREE consecutive No Call/No Shows = voluntary resignation without notice.\n- Corrective action is normally progressive, but may be ACCELERATED for patterns including:\n   a. Series of Fridays, Mondays, or other repeating-day patterns\n   b. Weekend absences\n   c. Days preceding a holiday or scheduled day(s) off\n   d. Absence on days that were requested off but not accommodated\n   e. Calls from someone other than the employee to explain absence/tardiness\n   f. More than 2 occurrences of tardiness/absence in 2 consecutive pay periods\n   g. Calls to anyone in the department other than the manager, supervisor, or designee\n\nDEPARTMENT MANAGER RESPONSIBILITIES:\n- Monitor unscheduled absences within department; clearly define and communicate attendance expectations; act promptly.\n- May require a physician statement verifying illness or proof of need for any other unscheduled absence.\n- If employee has a chronic condition and files medical certification: forward to HR and/or Employee Health. Do not request a new certification for the same condition more often than every 3 months unless there is probable reason the absence is unrelated to the specified condition.\n- Employee attendance must be reflected in the employee''s annual performance appraisal.","source":"Unscheduled Absences-Tardiness.pdf","lastUpdated":"2026-06-11"},{"id":"restraint_management_policy","title":"Restraint Management Policy","category":"Patient Safety","keywords":["restraint","seclusion","violent","self-destructive","non-violent","behavioral","non-behavioral","order","physician","lp","licensed","practitioner","rn","face-to-face","one","hour","four","hours","two","hours","emergency","emergent","prn","standing","order","trial","release","discontinue","discontinuation","monitoring","reassessment","15","minutes","2","hours","skin","integrity","circulation","vital","signs","toileting","hand","mitts","side","rails","chemical","restraint","ivy","armboard","iv","armboard","death","cms","plan","of","care","poc","alternatives","de-escalation","sitter","documentation","attending","physician","notification","24","hours","wrist","two-point","geri","chair","net","bed","freedom","splint","training","competency"],"content":"SUBJECT: Restraint Management | DEPARTMENT: All\n\nPURPOSE: To define the organization policy regarding restraint of a patient. Applies to all hospital patients (any age, inpatient or outpatient) who are restrained or secluded.\n\nI. ALTERNATIVES TO THE USE OF RESTRAINT\n- Restraints are limited to situations with adequate and appropriate clinical justification, based on assessed patient needs.\n- Restraints may only be used when less restrictive interventions are ineffective to protect patient, staff, or others from harm.\n- Alternatives to consider/attempt first include: re-orientation, de-escalation, limit setting, increased observation/monitoring, sitter/video sitter observation, change in physical environment, review/modification of medication regimens.\n\nII. PROHIBITIONS ON THE USE OF RESTRAINTS\n- Prohibited reasons: coercion, discipline, convenience, or staff retaliation.\n- Prohibited: restraint based solely on patient''s history of dangerous behavior.\n- Prohibited: routine use of restraints for fall prevention. A patient \"might\" fall is NOT adequate basis; history of falling without current clinical basis is inadequate to justify restraint.\n\nIII. REQUIREMENTS FOR ORDERING RESTRAINTS\n- A physician or other Licensed Practitioner (LP) responsible for the patient''s care must order restraints prior to application.\n- Emergency situations: order must be obtained during the emergency application, or within ONE HOUR of restraint application.\n\nIV. USE OF RESTRAINT PROTOCOLS\n- A protocol cannot substitute for a physician/LP order prior to each episode of restraint use.\n- Orders must NEVER be written as a standing order or PRN.\n- Staff cannot discontinue and restart restraint under the same order (this = PRN, not permitted). \"Trial release\" is not permitted.\n- EXCEPTION: a temporary, directly-supervised release for patient needs (toileting, feeding, ROM exercises) under direct staff supervision is NOT considered a discontinuation.\n\nV. NOTIFICATION OF ATTENDING PHYSICIAN\n- Attending physician must be consulted ASAP if they did not order the restraint.\n- If attending physician unavailable, responsibility delegates to another physician (who becomes the attending).\n- Consultation may occur via telephone (face-to-face not required for consultation).\n- When renewing/writing a new order for continued restraint, medical record must document findings of physician/LP re-evaluation supporting continued use.\n\nVI. ORDERS FOR RESTRAINT - SAFETY/NON-VIOLENT/NON-SELF-DESTRUCTIVE BEHAVIOR\n- Non-behavioral restraint orders (for medical care-related safety needs) are renewed EACH CALENDAR DAY based on LP assessment.\n\nVII. DOCUMENTING RESTRAINT IN PLAN OF CARE\n- Restraint use should be reflected in the plan of care/treatment plan; reviewed and updated in writing within 24 HOURS of restraint initiation.\n\nVIII. DISCONTINUATION OF RESTRAINT\n- Restraints should be discontinued ASAP once patient meets removal criteria.\n- Physicians, other LPs, and RNs involved in care may determine if restraints should be discontinued.\n\nIX. ORDERING RESTRAINTS FOR VIOLENT OR SELF-DESTRUCTIVE BEHAVIOR (BEHAVIORAL RESTRAINT)\n- Orders/renewals for behavioral restraint (jeopardizing immediate physical safety of patient/staff/others), up to TOTAL of 24 HOURS:\n   - Up to 4 hours: adults 18+\n   - Up to 2 hours: children/adolescents ages 9-17\n   - Up to 1 hour: patients under age 9\n- If discontinued before order expires, a NEW order is required to reinitiate.\n- At end of timeframe, if continued restraint is needed based on individualized assessment, ANOTHER ORDER is required.\n- When original order is about to expire, RN must contact physician/LP, report most recent assessment results, and request renewal.\n- Onsite assessment before renewal is at discretion of physician/LP in discussion with RN.\n- If patient remains in behavioral restraint 24 HOURS after original order, physician/LP must conduct an in-person face-to-face re-evaluation before writing a new order.\n\nX. SPECIAL ASSESSMENT - VIOLENT/SELF-DESTRUCTIVE BEHAVIOR RESTRAINT\n- A physician/LP, or trained RN/PA, must see the patient FACE-TO-FACE within ONE (1) HOUR after initiation (applies also when a drug/medication is used as restraint for violent/self-destructive behavior).\n- The 1-hour face-to-face evaluation MUST be in person -- telephone/telemedicine NOT permitted.\n- Evaluation includes medical/physical and behavioral assessment, plus: patient''s immediate situation, patient''s reaction to the intervention, and need to continue/terminate restraint or seclusion.\n- If face-to-face not conducted by an LP, attending physician/LP must be notified ASAP after the evaluation.\n\nXI. ASSESSMENT/MONITORING - NON-VIOLENT/NON-SELF-DESTRUCTIVE RESTRAINT\nAssessment:\n   - Comprehensive assessment prior to use of any restraint device.\n   - Identify behavior/action requiring restraint/seclusion consideration.\n   - Evaluate and attempt all appropriate alternatives; document.\n   - Re-assess for continued need at least every 2 HOURS and PRN.\nReassessment/Monitoring:\n   - Responsible RN evaluates/monitors at least every 2 hours.\n   - Any qualified care team staff performs these checks at minimum every 2 hours:\n     visual safety/observation, skin integrity (inspect under restraint), circulation (color, temperature, edema, sensation), level of consciousness, fluid/nutrition assistance, toileting assistance, bodily hygiene, patient response to restraint, vital signs (including respiratory status), repositioning (document in ADL section).\n\nXII. ASSESSMENT/MONITORING - VIOLENT/SELF-DESTRUCTIVE RESTRAINT\n- Comprehensive assessment prior to use of any restraint device.\n- Responsible RN must assess patient upon INITIATION and EVERY 15 MINUTES (more frequent if warranted), documenting: visual safety observation, skin integrity, circulation, level of consciousness, fluid/nutrition assist, toileting assist, bodily hygiene, patient response to restraint, vital signs (every 1-2 hours), repositioning (ADL section).\n\nXIII. APPLICATION OF RESTRAINTS\n- Type of restraint used must be consistent with the type ordered.\n- Apply with safe and appropriate techniques per manufacturer instructions and intended purpose.\n- Apply/remove in a manner that preserves patient dignity, comfort, and well-being.\n- Secure restraints to bedsprings/frame if patient is in bed.\n- NEVER tie restraints to mattress or side rails. Knots must release quickly in an emergency.\n- Only authorized, trained staff with demonstrated competency apply/remove restraint devices.\n\nXIV. EMERGENT USE OF RESTRAINTS WITHOUT PRIOR ORDER\n- RN is authorized to initiate emergent restraint use prior to obtaining an order; an order must follow per policy requirements.\n\nXV. DOCUMENTATION OF RESTRAINT USE\nEach episode must document: in-person medical/behavioral evaluation (incl. 1-hour face-to-face for violent/self-destructive), description of behavior and intervention used, alternatives/less restrictive interventions attempted, condition/symptoms warranting restraint, patient response and rationale for continued use, individual assessments/reassessments, monitoring intervals, plan of care revisions, behavior/safety concerns necessitating restraint, injuries, deaths, identity of ordering physician/LP, orders for restraint, notification of attending physician, consultations.\n\nXVI. REPORTING DEATHS ASSOCIATED WITH RESTRAINTS (to CMS)\nReport if death occurs: while restrained; within 24 hours after restraint removal; or within 1 week after restraint where restraint reasonably contributed to death.\nFor death involving ONLY a two-point soft wrist restraint and NO seclusion:\n   - Record in internal facility log within 7 days of death (patient name, DOB, attending physician, primary diagnosis, MR number).\n   - Do NOT need to notify CMS by phone.\n   - Make an entry in patient''s medical record including date/time logged.\n\nDEFINITIONS:\nPhysical Restraint: any manual method, physical/mechanical device, material, or equipment that immobilizes or reduces a patient''s ability to move arms, legs, body, or head freely. Examples that may qualify: sheets tucked too tightly, net/enclosed beds, Freedom splints immobilizing a limb, side rails preventing voluntary exit, Geri chairs/recliners (only if patient cannot easily remove and exit on their own).\n\nGENERAL EXCEPTIONS:\n- A device the patient can EASILY REMOVE (intentionally, in same manner staff applied it) is NOT a restraint.\n- NOT restraints: orthopedically prescribed devices, surgical dressings/bandages, protective helmets, physical holding for routine exams/tests, preventing falls out of bed, or enabling activity participation without harm risk (excludes physical escort).\n- Handcuffs/manacles/shackles/chain-type devices applied by non-hospital law enforcement for custody/detention/public safety are NOT governed by this policy.\n\nIV ARMBOARDS: generally not a restraint unless tied down/attached to bed, or entire limb immobilized so patient cannot access their body.\n\nBODILY POSITIONING DEVICES: mechanical supports for proper body position/balance/alignment that ALLOW greater freedom of mobility are NOT restraints.\n\nHAND MITTS: ARE considered a restraint, including pinning/attaching to bedding or combining with wrist restraint.\n\nAGE/DEVELOPMENTALLY APPROPRIATE SAFETY INTERVENTIONS: stroller/swing/high-chair safety belts, raised crib rails, crib covers are NOT considered restraint.\n\nSIDE RAILS:\n- Raising rails for patients on stretcher, recovering from anesthesia, sedated, with involuntary movement, or on certain therapeutic beds to prevent falling = NOT a restraint.\n- Using side rails to restrict freedom to exit bed = IS a restraint.\n- Segmented rails with one segment down to allow free exit = NOT a restraint.\n- If patient physically cannot get out of bed regardless of rails, raising all 4 rails = NOT a restraint (no impact on movement).\n\nCHEMICAL RESTRAINT: a drug/medication used to manage behavior or restrict freedom of movement that is NOT standard treatment/dosage for the patient''s condition.\nExceptions: medications used as part of standard medical/psychiatric treatment at standard dosage are NOT chemical restraint. PRN vs standing order status does NOT itself determine restraint status. Criteria for standard treatment: drug used within FDA/manufacturer parameters, follows national practice standards, and use is based on patient''s symptoms/clinical situation/expected and actual response.\n\nSECLUSION: involuntary confinement of a patient alone in a room/area from which they are physically prevented from leaving.\nExceptions: a restrained patient alone in an UNLOCKED room is not seclusion; confinement on a locked unit/ward WITH OTHERS is not seclusion. TIMEOUT (voluntary, patient can leave when they choose) is NOT seclusion.\n\nTRAINING/EDUCATION:\n- Physicians/LPs authorized to order restraint must have working knowledge of this policy.\n- Specific education: requirements for ordering/discontinuing restraints (non-violent and violent), assessment/documentation requirements.\n- Staff annual competency covers: authority to order/initiate/discontinue, circumstances for initiation after alternatives, requirement to discontinue ASAP, who can assess/monitor, time frames for assessment/monitoring, definition of restraint, definition of medication used as restraint.\n\nREFERENCES: CMS Conditions of Participation for Acute Care Hospitals (Oct 2008, 482.13(e)/(f)); Joint Commission 2013 Accreditation Standards for Acute Care Hospitals - PC.03.02.1\n\nRelated Elsevier Clinical Skills: Restraint Application and Monitoring - CE; Restraint-Free Environment - CE; Restraint Application and Monitoring (Pediatric) - CE; Restraint Weaning (Rehabilitation Nursing); Hand Mitt Restraints - CE; Extremity Restraints - CE; Restraints for Violent or Self-Destructive Behavior - CE/NCPD; Restraints for Nonviolent or Non-Self-Destructive Behavior - CE/NCPD","source":"Restraint Management Policy.pdf","lastUpdated":"2026-06-11"},{"id":"severe_sepsis_septic_shock","title":"Severe Sepsis / Septic Shock Clinical Guideline","category":"Critical Care","keywords":["sepsis","septic shock","severe sepsis","lactate","vasopressor","norepinephrine","blood culture","antibiotics","fluid resuscitation","MAP","crystalloid","lactated ringers","SIRS","organ dysfunction","procalcitonin","bundle","SEP-1","maternal","MEWT","ICU","norepinephrine","central line","arterial line","urine output"],"content":"CommonSpirit Health Clinical Guideline A-2004G | Effective: August 1, 2025\n\nOBJECTIVE: Guideline for treating adult and maternal patients (\u226518 yo) who screen positive for sepsis, severe sepsis, or septic shock.\n\nKEY GUIDELINES:\n\u2022 All adult ED patients screened for sepsis ASAP.\n\u2022 Two large-bore peripheral IVs for initial fluid resuscitation. PIV acceptable for vasopressor infusion first 24 hours.\n\u2022 Vasopressors >24 hours or escalating dose: place central line (PICC acceptable).\n\u2022 Septic shock: start vasopressors peripherally first, do not delay for central access.\n\u2022 Hypotension + vasopressor support: place arterial line for hemodynamic monitoring.\n\u2022 Initial lactate >2 mmol/L: repeat within 6 hours.\n\nINITIAL RESUSCITATION BUNDLE (within 1 hour of recognition):\n1. Lactate measurement (arterial or venous). Repeat if >2 mmol/L within 6 hours.\n2. Two sets of blood cultures. Do not delay antibiotics >30 min if unable to draw cultures.\n3. Antibiotics ASAP \u2014 goal within 1 hour of suspected sepsis.\n4. Sepsis-induced hypotension, septic shock, or lactate \u22654 mmol/L: fluid bolus 30 ml/kg balanced crystalloids (Lactated Ringers preferred over Normal Saline).\n   - Use ideal body weight if BMI >30.\n   - Goals: MAP \u226565 mmHg, urine output >0.5 ml/kg/hr, lactate trending down.\n5. Advanced heart failure (NYHA III/IV), CKD Stage IV/V, or pulmonary edema: modify fluid volume.\n\nSEPTIC SHOCK BUNDLE (within 6 hours):\n\u2022 Apply vasopressors if hypotension persists after initial fluid bolus \u2014 Norepinephrine is first-line.\n\u2022 Reassess if unresponsive to fluids or lactate \u22654.\n\nMATERNAL PATIENTS: Use MEWT (Maternal Early Warning Triggers) Algorithm. \u226520 weeks gestation or up to 6 weeks postpartum. HR >110 + MAP <65 or HR >130: start sepsis treatment. ICU admission/HLOC strongly recommended.\n\nPROCALCITONIN: Do NOT use to make initial antibiotic decisions. Use to assist in discontinuation of empiric antibiotics only.\n\nDISCHARGE READINESS: Reconcile meds at ICU and hospital discharge. Refer to post-hospital rehab if ventilated >48 hrs or ICU stay >72 hrs.\n\nDEFINITIONS:\n\u2022 Severe Sepsis: Life-threatening organ dysfunction caused by dysregulated host response to infection.\n\u2022 Septic Shock: Sepsis subset with circulatory/cellular/metabolic dysfunction + higher mortality risk. Hypotension persisting despite 30 ml/kg fluid bolus, or lactate \u22654 mmol/L.\n\u2022 SIRS Criteria (Adult): HR >90, RR >20, Temp >38\u00b0C or <36\u00b0C, WBC >12K or <4K.\n\u2022 Acute Organ Dysfunction (Adult): MAP <65 or SBP <90, lactate >2, creatinine >2, bilirubin >2, urine output <0.5 ml/kg/hr x2 hrs, platelets <100K, GCS <13.\n\u2022 Sepsis Recovery starts when: sepsis confirmed + ABX \u226524 hrs + lactate normal/improving + no vasopressors in last 4 hours.","source":"Sepsis.pdf","lastUpdated":"2026-06-17"},{"id":"blood_therapeutics","title":"Blood Therapeutics \u2014 CSH Blood Therapeutics Clinical Guideline","category":"Transfusion & Blood Products","keywords":["blood","transfusion","RBC","red blood cell","platelets","plasma","cryoprecipitate","hemoglobin","Hgb","hemorrhage","anemia","INR","coagulation","fibrinogen","restrictive transfusion","PRBC","blood products","massive transfusion","MTP","platelet count","FFP","cryo","factor VIII","von Willebrand"],"content":"Mercy Hospital of Folsom / CSH Blood Therapeutics Clinical Guideline | Board Approved: 8/24/2023\n\nPOLICY:\n\u2022 Promote safe, evidence-based approaches to blood transfusion.\n\u2022 Restrictive transfusion strategy is at least as effective as liberal strategy in most patients.\n\u2022 Always consider alternatives to transfusion regardless of lab values.\n\u2022 Transfusion decisions must be clinical judgments \u2014 NOT based on lab parameters alone.\n\u2022 Routine premedication NOT advised unless history of prior transfusion reactions.\n\u2022 Patients should be included in transfusion decision-making when possible.\n\nRBC TRANSFUSION \u2014 ADULT INPATIENTS (unit by unit, reassess before next unit):\n\u2022 Hgb <7 g/dL (stable patients).\n\u2022 Acute hemorrhage with hemodynamic instability (any Hgb).\n\u2022 Hgb <8 g/dL with severe anemia symptoms or anticipated significant blood loss.\n\u2022 Hemoglobinopathy transfusion/exchange.\n\u2022 Acute ischemic heart disease (AMI/unstable angina): Hgb <8 g/dL.\n\u2022 Post-op cardiovascular surgery: Hgb <7.5 g/dL.\n\nRBC TRANSFUSION \u2014 PREMATURE INFANT:\n\u2022 Hgb <8 without symptoms.\n\u2022 Hgb <9 + supplemental O2 + (tachycardia >180 or tachypnea >60 for >24 hrs, OR doubled O2 requirement in 48 hrs, OR lactate >2.5, OR weight gain <10 g/kg/day on >120 kcal/kg/day, OR major surgery within 72 hrs).\n\u2022 On respiratory support (vent/CPAP/high-flow >2 LPM): Hgb <10.\n\u2022 Cyanotic heart disease or ECMO: Hgb <13.\n\u2022 Major surgery: Hgb <12.\n\nPLATELET TRANSFUSION (unit by unit, reassess):\n\u2022 Plt <10K/mm\u00b3 (stable, non-bleeding).\n\u2022 Plt <20K/mm\u00b3 for low-risk procedures.\n\u2022 Plt <30K/mm\u00b3 in neonates.\n\u2022 Plt <50K/mm\u00b3 with active hemorrhage or high-risk invasive procedure.\n\u2022 Plt <100K/mm\u00b3 for neurosurgical, neuraxial, or ophthalmologic surgery.\n\u2022 Massive transfusion protocol.\n\u2022 Contraindications: TTP, HUS, HIT, ITP, severe alloimmune refractoriness.\n\nPLASMA TRANSFUSION:\n\u2022 Active hemorrhage + multiple coagulation factor deficiency, INR >2.0.\n\u2022 Planned high-bleed-risk procedure + INR >2.0.\n\u2022 Massive transfusion protocol.\n\u2022 TTP.\n\u2022 Warfarin reversal: Vitamin K is first-line. Plasma if PCC unavailable and active bleeding.\n\u2022 NOTE: Plasma has NO effect on mild coagulopathies (INR \u22641.8).\n\u2022 Dose: 10\u201315 ml/kg.\n\nCRYOPRECIPITATE:\n\u2022 Hypofibrinogenemia (fibrinogen <150 mg/dL) with active bleeding.\n\u2022 Massive transfusion protocol.\n\u2022 Contains: Factor VIII, von Willebrand factor, fibrinogen, Factor XIII.\n\nADVERSE EVENTS OF TRANSFUSION: Death, GVHD, infection, TRALI, immunosuppression, hemolysis, allergic/febrile reactions, volume overload, iron overload, SIRS, MOSF, cardiac events, bloodborne infections.\n\nKEY CLINICAL NOTES:\n\u2022 Chronic anemia: aggressive transfusion may cause volume overload \u2014 use caution.\n\u2022 Post-transfusion platelet count: obtain 10 min to 1 hr after. One apheresis unit typically raises adult plt by 20,000\u201340,000/\u00b5L.\n\u2022 Plasma transfusion has no effect on INR \u22641.8.\n\u2022 Do not reflexively transfuse to replace blood drawn for lab tests.","source":"bloodTherapeutics.pdf","lastUpdated":"2026-06-17"},{"id":"capnography_etco2_monitoring","title":"Capnography: Care of the Patient Receiving Continuous Wave EtCO2 Monitoring","category":"Respiratory Monitoring","keywords":["capnography","EtCO2","end tidal CO2","end-tidal","waveform","sedation","respiratory rate","apnea","hyperventilation","hypoventilation","bronchospasm","airway obstruction","procedural sedation","PCA","opioid","monitor tech","alarm"],"content":"Mercy Hospital Folsom | Board Approved: 11/17/2022 | Originated: 01/2013\n\nPURPOSE: Procedure for initiating and monitoring patients on Continuous Wave EtCO2 (capnography) monitoring.\n\nPOLICY:\n\u2022 Only nursing staff trained in capnography monitoring may care for these patients. Alarms stay ON at all times \u2014 verified by the responsible nurse at the start of every shift.\n\u2022 In non-monitored patients, the nurse may initiate monitoring at their discretion in emergent situations (risk of increased sedation). Obtain a written order ASAP after initiation.\n\u2022 Per LIP order, patient may come off continuous EtCO2 during activity or while off unit. Monitor MUST be on whenever patient is in bed or chair.\n\nDESIRED OUTCOMES:\n\u2022 Patient understands purpose of capnography monitoring.\n\u2022 Patient receives appropriate care related to monitoring.\n\u2022 Patient maintains level of consciousness while on sedating medications.\n\nCOMPETENCY (validated at hire and yearly):\n\u2022 RN: understanding of capnography, rationale for use, tubing/monitor application, waveform recognition (including variations), appropriate interventions.\n\u2022 Monitor Tech: waveform recognition including variations.\n\nEQUIPMENT: EtCO2 mobile monitor or module for hardwired bedside monitoring; oxygen tubing with EtCO2 capability.\n\nPATIENT CARE:\n\u2022 Check alarm settings per LIP order, tubing placement, and monitor connection at start of each shift and as needed.\n\u2022 Assess and document EtCO2 level on admission, then per unit standard or physician order.\n\u2022 Continuous monitoring required.\n\u2022 Immediately replace EtCO2 tubing after activity/return to unit if removed per order.\n\u2022 Respond immediately to alarms \u2014 adjust sampling device, attempt arousal if indicated.\n\u2022 Notify LIP for any reportable condition.\n\nREPORTABLE CONDITIONS (notify LIP \u2014 use these if no specific parameters ordered):\n\u2022 EtCO2 > 60 mmHg\n\u2022 EtCO2 < 20 mmHg\n\u2022 Respiratory rate < 8/min\n\u2022 Respiratory pause > 30 seconds\n\nDOCUMENTATION:\n\u2022 Document EtCO2 level per unit standard (with vital signs) or per physician order.\n\u2022 Document all deviations from baseline and patient response to therapy in progress note.\n\nWAVEFORM ASSESSMENT \u2014 examine height, frequency, rhythm, baseline, and shape:\n\u2022 Height = CO2 concentration; normal shows a spike with exhalation.\n\u2022 Frequency = respiratory rate.\n\u2022 Rhythm = state of the respiratory center.\n\u2022 Hyperventilation: shortened, lower-amplitude waveforms, rapid rate.\n\u2022 Hypoventilation: rising baseline/amplitude, slower rate.\n\u2022 Bronchospasm (asthma/COPD): \"shark-fin\" shaped waveform.\n\u2022 Return of Spontaneous Circulation (ROSC): abrupt rise in EtCO2 trend after CPR.\n\nPATIENT TEACHING: Review purpose of monitoring and diagnosis-specific teaching; assess teaching needs daily ahead of discharge and document on the family teaching record.","source":"EndTidalCO2.pdf","lastUpdated":"2026-06-21"},{"id":"vte_mechanical_prophylaxis","title":"Standardized Procedure \u2014 Initiating Mechanical VTE Prevention","category":"VTE Prevention","keywords":["VTE","venous thromboembolism","DVT","deep vein thrombosis","PE","pulmonary embolism","SCD","sequential compression device","mechanical prophylaxis","chemical prophylaxis","anticoagulation","risk stratification","ambulation","blood clot"],"content":"Mercy Hospital Folsom | Board Approved: 5/22/2025 | Originated: 07/2014\n\nPURPOSE: Standardized procedure allowing RNs to independently initiate Mechanical VTE Prophylaxis (SCDs) per CA Code Title 22 \u00a770706.2.\n\nPOLICY:\n\u2022 RN may apply mechanical VTE prophylaxis to adult (\u226518) patients who screen moderate or high risk on the VTE screening tool.\n\u2022 Functions under approved, evidence-based, hospital-approved standardized procedures.\n\nRISK-BASED PREVENTION:\n1. Low risk: No specific prophylaxis \u2014 early/persistent mobilization (ambulate \u22653x/day).\n2. Moderate risk: Mechanical or chemical prophylaxis appropriate (chemical preferred). If contraindications present, or patient had vascular surgery, obtain physician order.\n3. High risk: BOTH mechanical AND chemical prophylaxis, including critical care patients.\n\nPROCEDURE:\n\u2022 All surgical patients: SCDs applied intraop/intraprocedure unless otherwise ordered.\n\u2022 All inpatients: SCDs applied within 24 hours of unit arrival.\n\u2022 RN screens for VTE within 24 hours of hospital arrival. Moderate/high risk \u2192 knee-high SCD on at least one limb.\n\nRISK STRATIFICATION:\nLow Risk: ambulatory, no added VTE risk factors, expected stay <2 days, minor/same-day surgery <30 min.\n\nModerate Risk (one or more factors, if not low/high): age >50, active malignancy, active rheumatic disease, acute/chronic lung disease, central venous catheter, CHF, dehydration, estrogen contraceptives/HRT, impaired mobility, IBD (Crohn's/UC), known thrombotic state, moderate-major surgery, myeloproliferative disorder, MI, nephrotic syndrome/acute renal failure, obesity, prior VTE history, recent postpartum with immobility, sickle cell disease, varicose veins/chronic stasis.\n\nHigh Risk: acute spinal cord injury with paresis, multiple major trauma, critical care patients, abdominal/pelvic cancer surgery, hip/knee arthroplasty, or >2 moderate risk factors present.\n\nSCD CONTRAINDICATIONS & CARE:\n\u2022 Do NOT apply over a surgical site, wound, or IV site.\n\u2022 Do NOT apply if patient not assessed/treated for DVT prophylaxis within 48 hrs of admission, or if extremity has swelling/redness \u2014 notify physician, anticipate ultrasound order before applying.\n\u2022 Remove during hygiene or to allow ambulation/physical activity.\n\u2022 Remove at least every shift for 30 minutes to evaluate/document skin integrity.\n\nDOCUMENTATION:\n\u2022 Chart SCD application in musculoskeletal section of IView.\n\u2022 Document continued use each shift and discontinuation.\n\u2022 Physician order required to apply mechanical VTE prevention per standardized procedure.\n\u2022 Patient refusal of VTE preventive therapy requires physician notification.\n\nREPORTABLE CONDITIONS:\n\u2022 Redness or swelling of an extremity.\n\u2022 Patient condition changes to moderate/high VTE risk \u2014 request pharmacological prophylaxis.\n\nRN CERTIFICATION REQUIREMENTS: Active CA RN license; review of standardized procedure + written test \u226580% (initial and ongoing); must be employed by Mercy Hospital Folsom; approved by Interdisciplinary Practice Committee (IPC).\n\nDEFINITIONS:\n\u2022 DVT: Blood clot in a deep vein (leg, arm, pelvis) \u2014 may cause redness, pain, swelling.\n\u2022 PE: Pulmonary embolism \u2014 blocked pulmonary artery from a traveling clot; sharp chest pain, SOB, hemoptysis.\n\u2022 VTE: Disease state encompassing DVT and PE.","source":"VTE_Policy_2025_MHF.pdf","lastUpdated":"2026-06-21"},{"id":"code_stroke_alert","title":"Code Stroke Alert","category":"Emergency Response","keywords":["stroke","code stroke","tpa","thrombolytic","thrombectomy","nihss","ct","neurologist","ems","alert","brain attack","weakness","numbness","speech","vision","seizure","headache","dizziness","nausea","transfer center","hospitalist","rrt","robot","door to ct","iv tpa","hemorrhagic","ischemic","mercy folsom"],"content":"CODE STROKE ALERT — Mercy Hospital of Folsom\n\nPURPOSE: Identify and treat acute stroke patients within established time benchmarks to minimize neurological damage.\n\nTIME GOALS:\n• Door to MD evaluation: <10 minutes\n• Door to Head CT: <20 minutes\n• CT read by radiologist: <45 minutes\n• IV tPA administration: <45 minutes\n• Thrombectomy evaluation: <60 minutes\n\nSTROKE SYMPTOMS (any one warrants Code Stroke activation):\n1. Sudden change in mental status or consciousness\n2. Sudden weakness or numbness (face, arm, or leg — especially one-sided)\n3. Sudden trouble speaking, understanding speech, or swallowing\n4. Sudden vision trouble (one or both eyes)\n5. Sudden confusion\n6. New onset seizure\n7. Sudden severe headache with no known cause\n8. Blown (dilated, unresponsive) pupil\n9. Sudden dizziness, nausea, or vomiting\n\nED ACTIVATION PROCEDURE:\n1. Dial *8 to activate Code Stroke\n2. Notify Transfer Center: 916-851-2878\n3. Order STAT non-contrast head CT immediately\n4. Draw STAT labs: BMP, CBC, PT, PTT, INR, Troponin\n5. Document NIHSS (National Institutes of Health Stroke Scale) score\n6. IV access x2, cardiac monitor, pulse ox\n7. NPO — no oral medications or food/fluids\n8. Prepare for possible tPA administration or transfer\n\nINPATIENT ACTIVATION PROCEDURE:\n1. Primary nurse dials *8 to activate Code Stroke\n2. Page Hospitalist at 916-901-2304\n3. RRT (Rapid Response Team) responds to bedside\n4. Transport patient via robot/stretcher to CT scanner\n5. Follow ED procedure steps 3–8 above\n\nTREATMENT OPTIONS (physician-directed):\n• IV Thrombolytics (tPA/alteplase) — if within time window and no contraindications\n• Mechanical Thrombectomy — transfer to comprehensive stroke center if indicated\n• Transfer to appropriate level of stroke care as needed\n\nDOCUMENTATION REQUIRED:\n• Time of symptom onset (or last known well)\n• NIHSS score on arrival\n• Code Stroke activation time\n• All interventions with times\n• Physician orders and consults\n\nSource: Code Stroke Alert Policy, Mercy Hospital of Folsom. Board Approved: 2/27/2025.","source":"code stroke.pdf","lastUpdated":"2026-08-06"}];
function loadPolicies() {

function savePoliciesLS(db) {

}
function searchPolicies(query, policies) {
  if (!query.trim()) return [];
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  return policies.map(p => {
    const titleL = p.title.toLowerCase(), catL = p.category.toLowerCase();
    const kwStr = (p.keywords||[]).join(' ').toLowerCase();
    const contentL = (p.content||'').toLowerCase();
    let score = 0;
    for (const w of words) {
      if (titleL.includes(w)) score += 10;
      if (catL.includes(w)) score += 5;
      if (kwStr.includes(w)) score += 3;
      if (contentL.includes(w)) score += 1;
    }
    return { ...p, _score: score };
  }).filter(p => p._score > 0).sort((a, b) => b._score - a._score);
}

// ── CIRCULAR ROOM PROXIMITY ───────────────────────────────────────────────────
// ROOM_IDS wraps around the corridor perimeter like a clock:
//   top-row (0-13) → right-side (14-21) → bottom-row (22-35) → left-side (36-43)
// So 1101 (idx 0) and 1135B (idx 43) are neighbours, and
//    1112 (idx 13) and 1113 (idx 14) are neighbours at the top-right corner, etc.
const _RIDX = Object.fromEntries(ROOM_IDS.map((id, i) => [id, i]));

// Physical proximity overrides: rooms that share a real-world corner pocket
// but appear far apart on the simple perimeter walk.
// Cluster: 1121, 1122, 1123 (bottom-right) + 1111B, 1114, 1118 (right side).
// Keys are always sorted so lookup is order-independent.
const _PROX_OVERRIDE = new Map([
  ['1111B|1114',  3],   // already 3, kept for explicitness
  ['1111B|1118',  4],   // was 7
  ['1111B|1121',  5],   // was 10
  ['1111B|1122',  6],   // was 11
  ['1111B|1123',  7],   // was 12
  ['1114|1118',   4],   // already 4, kept for explicitness
  ['1114|1121',   4],   // was 7
  ['1114|1122',   5],   // was 8
  ['1114|1123',   6],   // was 9
  // 1118↔1121 (3), 1118↔1122 (4), 1118↔1123 (5) — corridor already correct
]);
function circDist(a, b) {
  const key = a < b ? `${a}|${b}` : `${b}|${a}`;
  if (_PROX_OVERRIDE.has(key)) return _PROX_OVERRIDE.get(key);
  const i = _RIDX[a], j = _RIDX[b];
  if (i == null || j == null) return 99;
  const d = Math.abs(i - j);
  return Math.min(d, ROOM_IDS.length - d);
}

                glucose: false, highAcuity: false, sitter: false,

                neuroCheck: false, dailyWeight: false,
                tubeFeed: false, tpn: false, dialysis: false, etoh: false, nurseId: null,
                preferredNurses: [], blockedNurses: [] };
    return acc;
  }, {});
}

// ── ASSIGNMENT RULES ──────────────────────────────────────────────────────────
function checkAssignment(nurseId, roomIds, allRooms) {
  const rms = roomIds.map(id => allRooms[id]).filter(Boolean);
  // Blocked-nurse check: any room in this assignment has this nurse blocked
  const blockedRoom = rms.find(r => r.occupied && (r.blockedNurses||[]).includes(nurseId));
  if (blockedRoom) return `Nurse is blocked from room ${blockedRoom.id}`;
  const hasTele = rms.some(r => r.occupied && r.type === 'TELE');
  const cap = hasTele ? 4 : 5;
  const occ = rms.filter(r => r.occupied);
  if (occ.length > cap) return `Exceeds ${cap}-patient limit (${hasTele?'TELE':'Med/Surg'} group)`;
  const cnt = k => occ.filter(r => r[k]).length;
  if (cnt('glucose')    > 2) return 'Exceeds 2 glucose-check patients';
  if (cnt('totalCare')  > 2) return 'Exceeds 2 total-care patients';
  if (cnt('prisoner')   > 2) return 'Exceeds 2 prisoner patients';
  if (cnt('highAcuity') > 2) return 'Exceeds 2 high-acuity patients';
  if (cnt('drip')       > 2) return 'Exceeds 2 infusion-drip patients';
  if (cnt('chestTube')  > 1) return 'Exceeds 1 chest-tube patient';
  if (cnt('drain')      > 2) return 'Exceeds 2 drain patients';
  return null;
}

// ── CORRIDOR LAYOUT ───────────────────────────────────────────────────────────
// A/B rooms get a tight PAIR_GAP; different room numbers get the normal GAP.
// placeLine distributes cards along [start → end], scaling the normal gaps to fill
// the available span while keeping pair gaps fixed and small.
function getCorridorLayout(W, H) {
  const PAD = 12, GAP = 6, PAIR_GAP = 2, CORNER_GAP = 18;
  const TOP_N = 14, SIDE_N = 8;

  // cw: fit TOP_N cards + (TOP_N-1) normal gaps across available width
  const cw = Math.max(44, Math.min(72, Math.floor((W - 2*PAD - (TOP_N-1)*GAP) / TOP_N)));

  // ch: total height = 2·PAD + (SIDE_N+2)·ch + 2·CORNER_GAP + (SIDE_N-1)·GAP
  // corner cards are the top/bottom row cards at the four corners;
  // CORNER_GAP is the breathing room between a corner card and the adjacent side card.
  const ch = Math.max(36, Math.min(58, Math.floor((H - 2*PAD - 2*CORNER_GAP - (SIDE_N-1)*GAP) / (SIDE_N+2))));

  const xL = PAD, xR = W - PAD - cw;
  const yT = PAD, yB = H - PAD - ch;
  const yMidT = yT + ch + CORNER_GAP;   // top edge of first side-column card
  const yMidB = yB - ch - CORNER_GAP;   // top edge of last side-column card

  // Returns true when idA/idB are the A and B beds of the same room number
  function isPair(idA, idB) {
    return idA.endsWith('A') && idB.endsWith('B') && idA.slice(0,-1) === idB.slice(0,-1);
  }

  // Place n cards from start to end with pair-aware gaps.
  // cardSize = cw (horizontal) or ch (vertical).
  // Direction is inferred from start vs end.
  function placeLine(ids, start, end, cardSize) {
    const n = ids.length;
    if (n === 1) return [start];
    const gapTypes = ids.slice(1).map((id, i) => isPair(ids[i], id) ? 'pair' : 'room');
    const pairCnt  = gapTypes.filter(t => t === 'pair').length;
    const roomCnt  = gapTypes.length - pairCnt;
    const span     = Math.abs(end - start);          // from first-card start to last-card start
    const S        = span - (n - 1) * cardSize;      // total gap pixels to distribute

    // Minimum pair gap; scale room gaps to fill remaining space
    let pairG, roomG;
    if (S <= 0) {
      pairG = roomG = 0;                             // cards touch — shouldn't happen at normal sizes
    } else if (pairCnt > 0 && S < pairCnt * PAIR_GAP) {
      pairG = roomG = S / (n - 1);                  // not enough room even for small pair gap, go uniform
    } else {
      pairG = PAIR_GAP;
      roomG = roomCnt > 0 ? (S - pairCnt * PAIR_GAP) / roomCnt : PAIR_GAP;
    }

    const dir = end >= start ? 1 : -1;
    const out = [start];
    for (let i = 0; i < n - 1; i++) {
      out.push(out[i] + dir * (cardSize + (gapTypes[i] === 'pair' ? pairG : roomG)));
    }
    return out;
  }

  // Slice ROOM_IDS into the four corridor sides
  const topIds    = ROOM_IDS.slice(0,          TOP_N);
  const rightIds  = ROOM_IDS.slice(TOP_N,      TOP_N + SIDE_N);
  const bottomIds = ROOM_IDS.slice(TOP_N + SIDE_N, TOP_N + SIDE_N + TOP_N);
  const leftIds   = ROOM_IDS.slice(TOP_N + SIDE_N + TOP_N);

  const topX    = placeLine(topIds,    xL,    xR,    cw);   // left → right
  const rightY  = placeLine(rightIds,  yMidT, yMidB, ch);   // top → bottom
  const bottomX = placeLine(bottomIds, xR,    xL,    cw);   // right → left
  const leftY   = placeLine(leftIds,   yMidB, yMidT, ch);   // bottom → top

  const positions = [
    ...topX.map(x    => ({ x, y: yT })),
    ...rightY.map(y  => ({ x: xR, y })),
    ...bottomX.map(x => ({ x, y: yB })),
    ...leftY.map(y   => ({ x: xL, y })),
  ];

  return { positions, cw, ch };
}

// ── ROOM DROPDOWN (portal) ────────────────────────────────────────────────────
function RoomDropdown({ room, nurses, nurseRooms, anchor, onAssign, onUnassign, onClose }) {
  const ref = useRef();
  const preferred = room.preferredNurses || [];
  const blocked   = room.blockedNurses   || [];

  useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    document.addEventListener('mousedown', h, true);
    return () => document.removeEventListener('mousedown', h, true);
  }, []);

  const menuH = nurses.length * 38 + 60;
  const spaceBelow = window.innerHeight - anchor.bottom;
  const style = {
    left: Math.min(anchor.left, window.innerWidth - 240),
    ...(spaceBelow > menuH
      ? { top: anchor.bottom + 4 }
      : { bottom: window.innerHeight - anchor.top + 4 })
  };

  // Sort: preferred first, blocked last
  const sorted = [...nurses].sort((a, b) => {
    const ap = preferred.includes(a.id) ? 0 : blocked.includes(a.id) ? 2 : 1;
    const bp = preferred.includes(b.id) ? 0 : blocked.includes(b.id) ? 2 : 1;
    return ap - bp;
  });

  return ReactDOM.createPortal(
    <div ref={ref} className="room-dropdown" style={style}>
      <div style={{ padding:'5px 10px 6px', fontSize:10, color:'var(--dd-label)', borderBottom:'1px solid var(--border-sub)', fontWeight:700, letterSpacing:'0.05em' }}>
        ASSIGN ROOM {room.id}
        {preferred.length > 0 && <span style={{ marginLeft:6, color:'#fbbf24' }}>⭐ {preferred.length} preferred</span>}
        {blocked.length   > 0 && <span style={{ marginLeft:6, color:'#f87171' }}>🚫 {blocked.length} blocked</span>}
      </div>
      {sorted.map(n => {
        const pts      = (nurseRooms[n.id]||[]).length;
        const isMe     = room.nurseId === n.id;
        const isPref   = preferred.includes(n.id);
        const isBlocked = blocked.includes(n.id);
        return (
          <div key={n.id}
            className={`dd-item${isMe?' active':''}`}
            onClick={() => { if (!isBlocked) { onAssign(n.id); onClose(); } }}
            style={{
              opacity:      isBlocked ? 0.45 : 1,
              cursor:       isBlocked ? 'not-allowed' : 'pointer',
              background:   isPref    ? 'rgba(251,191,36,0.10)' : undefined,
              borderLeft:   isPref    ? '3px solid #fbbf24' : isBlocked ? '3px solid #f87171' : '3px solid transparent',
            }}>
            <div style={{ width:8,height:8,borderRadius:'50%',background:n.color,flexShrink:0 }}/>
            <span style={{ flex:1, textDecoration: isBlocked ? 'line-through' : 'none' }}>{n.name}</span>
            <span style={{ fontSize:10,color:'var(--dd-label)' }}>{pts}pt</span>
            {isPref    && <span title="Preferred for this room" style={{ fontSize:12 }}>⭐</span>}
            {isBlocked && <span title="Blocked from this room" style={{ fontSize:12 }}>🚫</span>}
            {isMe      && <span style={{ color:'#22c55e',fontSize:11 }}>✓</span>}
          </div>
        );
      })}
      {room.nurseId && (
        <div className="dd-item" style={{ color:'#f87171',borderTop:'1px solid var(--border-sub)',marginTop:2 }}
          onClick={() => { onUnassign(); onClose(); }}>
          <span>✕</span><span>Unassign</span>
        </div>
      )}
    </div>,
    document.body
  );
}

  const flags = FLAG_DEFS.filter(f => room[f.key]);

    if (anchor) { setAnchor(null); return; }

            zIndex:3, boxShadow:'0 2px 6px rgba(0,0,0,0.5)'

        )}

        {/* Clean badge — pinned inside top-right of the card */}
        {!room.occupied && room.clean && (
          <div title="Room is clean" style={{
            position:'absolute', top:3, right:3,
            height:14, borderRadius:3,
            background:'#14532d',
            border:'1px solid #22c55e',
            display:'flex', alignItems:'center', gap:2,
            padding:'0 4px 0 3px',
            fontFamily:'monospace', fontSize:7, fontWeight:700,

              <path d="M1.5 1 L8.5 2.8 L1.5 5.5 Z" fill="#22c55e"/>
            </svg>
            Clean

        )}

        {/* Missing Bed badge — pinned inside bottom-left of the card */}
        {!room.occupied && room.missingBed && (
          <div title="Bed frame missing" style={{
            position:'absolute', bottom:3, left:3,
            height:14, borderRadius:3,
            background:'rgba(120,60,0,0.85)',
            border:'1px solid #FF9F0A',
            display:'flex', alignItems:'center', gap:2,
            padding:'0 4px',
            fontSize:7, fontWeight:700,
            color:'#FF9F0A', lineHeight:1,
            zIndex:4, boxShadow:'0 1px 4px rgba(255,159,10,0.30)',
            whiteSpace:'nowrap',
          }}>
            🛏 No Bed
          </div>
        )}

        {/* TELE heart — anchored top-left so it never competes with the room number for space */}
        {room.occupied && room.type==='TELE' && (
          <span style={{
            position:'absolute', top:2, left:3,
            color:'#f87171', fontSize: Math.max(9, Math.round(cw*0.19)),
            lineHeight:1, pointerEvents:'none', userSelect:'none',
          }}>♥</span>
        )}

        {/* Room number */}
        {(() => {

          const base  = isAB ? room.id.slice(0, -1) : room.id;
          const suf   = isAB ? room.id.slice(-1) : '';

            </div>

        })()}

        {/* Flags */}
        {room.occupied && flags.length > 0 && (
          <div style={{ display:'flex', flexWrap:'wrap', justifyContent:'center', gap:1, marginTop:2 }}>
            {(() => {
              const MAX = ch > 44 ? 4 : 2;
              const hasMore = flags.length > MAX;
              const shown = hasMore ? flags.slice(0, MAX - 1) : flags;
              return [
                ...shown.map(f => (
                  <span key={f.key} style={{

          anchor={anchor}
          onAssign={onAssignNurse}
          onUnassign={onUnassign}
          onClose={() => setAnchor(null)}
        />
      )}
    </>

}
