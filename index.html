// ── NURSE CARD ────────────────────────────────────────────────────────────────
function NurseCard({ nurse, rooms, allRooms, previewIds, onRemoveAll, onDrop, onRename, onDelete, locked, onToggleLock, showFeedback, onFeedbackGood, onFeedbackBad }) {
  const [dragOver, setDragOver] = useState(false);
  const [trashOver, setTrashOver] = useState(false);
  const [editing, setEditing] = useState(false);
  const [nameVal, setNameVal] = useState(nurse.name);
  const inputRef = useRef();

  useEffect(() => { if (editing && inputRef.current) inputRef.current.focus(); }, [editing]);
  // Keep local nameVal in sync when nurse.name changes externally (e.g. undo, sync)
  useEffect(() => { if (!editing) setNameVal(nurse.name); }, [nurse.name]);

  const nurseRms = rooms.map(id=>allRooms[id]).filter(Boolean);
  const occ = nurseRms.filter(r=>r.occupied);
  const hasTele = occ.some(r=>r.type==='TELE');
  const cap = hasTele ? 4 : 5;
  const pct = Math.min((occ.length/cap)*100, 100);
  const capColor = pct>=100 ? '#ef4444' : pct>=75 ? '#f59e0b' : '#22c55e';

  const flagDefs = FLAG_DEFS; // shared definition

  const incomingPreview = dragOver
    ? (previewIds||[]).filter(id => !rooms.includes(id) && allRooms[id]?.occupied)
    : [];

  return (
    <div
      className={`nurse-card${dragOver&&!trashOver?' drag-over':''}`}
      style={{ borderLeft:`3px solid ${nurse.color}` }}
      onDragOver={e=>{ e.preventDefault(); if(!trashOver) setDragOver(true); }}
      onDragLeave={e=>{ if(!e.currentTarget.contains(e.relatedTarget)) setDragOver(false); }}
      onDrop={e=>{ e.preventDefault(); setDragOver(false); onDrop(e,false); }}
    >
      {/* Header row */}
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6 }}>
        <div className="nurse-color-dot" style={{ background:nurse.color }}/>
        {editing ? (
          <input ref={inputRef} type="text" value={nameVal}
            placeholder="Enter name…"
            onChange={e=>setNameVal(e.target.value)}
            onBlur={()=>{
              const v = nameVal.trim();
              if (v) onRename(v);
              setNameVal(v || nurse.name);
              setEditing(false);
            }}
            onKeyDown={e=>{
              if(e.key==='Enter'){
                const v = nameVal.trim();
                if (v) onRename(v);
                setNameVal(v || nurse.name);
                setEditing(false);
              }
              if(e.key==='Escape'){ setNameVal(nurse.name); setEditing(false); }
            }}
            style={{ flex:1, minWidth:90, padding:'2px 6px', fontSize:13 }}
          />
        ) : (
          <span style={{ flex:1, fontWeight:700, fontSize:15, cursor:'text', color:'var(--text-1)' }}
            onDoubleClick={()=>{ setNameVal(nurse.name); setEditing(true); }}>
            {nurse.name}
          </span>
        )}
        <span style={{
          fontSize:11, fontWeight:700, letterSpacing:'0.02em',
          color: pct>=100 ? '#ef4444' : pct>=75 ? '#f59e0b' : 'var(--text-3)',
          background: pct>=100 ? 'rgba(239,68,68,0.12)' : pct>=75 ? 'rgba(245,158,11,0.12)' : 'transparent',
          padding: pct>=75 ? '1px 5px' : '0', borderRadius:4,
          transition:'color 0.2s, background 0.2s',
        }}>{occ.length}/{cap}</span>
        {hasTele && <span style={{ fontSize:10, background:'rgba(127,29,29,0.7)', color:'#fca5a5', borderRadius:4, padding:'1px 6px', letterSpacing:'0.04em' }}>TELE</span>}
        {/* Lock toggle — protects this nurse's rooms from Zap Assign reset */}
        <button
          onClick={onToggleLock}
          title={locked ? 'Locked — rooms kept on OpenAssign AI' : 'Unlocked — rooms reset on OpenAssign AI'}
          style={{
            background: locked ? 'rgba(251,191,36,0.18)' : 'transparent',
            border: locked ? '1px solid rgba(251,191,36,0.55)' : '1px solid transparent',
            borderRadius: 6, padding:'2px 5px', cursor:'pointer', fontSize:13, lineHeight:1,
            transition:'background 0.15s, border-color 0.15s',
          }}
        >{locked ? '🔒' : '🔓'}</button>
        <div className={`trash-zone${trashOver?' drag-over':''}`}
          onDragOver={e=>{ e.preventDefault(); e.stopPropagation(); setTrashOver(true); setDragOver(false); }}
          onDragLeave={()=>setTrashOver(false)}
          onDrop={e=>{ e.preventDefault(); e.stopPropagation(); setTrashOver(false); setDragOver(false); onDrop(e,true); }}
          onClick={onDelete}
          title="Drop room here to remove · Click to delete nurse"
        >🗑</div>
      </div>

      {/* Capacity bar */}
      <div className="cap-bar">
        <div className="cap-fill" style={{ width:pct+'%', background:capColor }}/>
      </div>

      {/* Flag pills */}
      <div style={{ display:'flex', gap:3, marginTop:5, flexWrap:'wrap' }}>
        {flagDefs.map(f=>{
          const c = occ.filter(r=>r[f.key]).length;
          if(!c) return null;
          return <span key={f.key} style={{ fontSize:9, padding:'1px 5px', borderRadius:4, fontWeight:700,
            background: c>=2 ? f.bg : 'var(--bg-base)',
            color:      c>=2 ? f.tc : 'var(--text-3)',
            border:`1px solid ${f.bg}`,
            boxShadow: c>=2 && f.glow ? `0 0 6px ${f.glow}66` : 'none' }}>
            {c} {f.label}
          </span>;
        })}
      </div>

      {/* Room badges — sorted in natural corridor order (1101, 1102 … 1110A, 1110B …) */}
      <div style={{ display:'flex', flexWrap:'wrap', marginTop:6, gap:3, minHeight: occ.length===0 ? 28 : 10,
        alignItems:'center', justifyContent: occ.length===0 ? 'center' : 'flex-start' }}>
        {occ.length===0 && !dragOver && (
          <span style={{ fontSize:10, color:'var(--text-5)', letterSpacing:'0.04em', userSelect:'none',
            display:'flex', alignItems:'center', gap:4 }}>
            <span style={{ opacity:0.5 }}>↓</span> drag rooms here
          </span>
        )}
        {[...rooms].sort((a,b) => _RIDX[a] - _RIDX[b]).map(id=>{
          const r = allRooms[id];
          if(!r?.occupied) return null;
          return (
            <NurseBadge key={id} room={r}
              onDragStart={e=>{ e.dataTransfer.setData('badgeRoomId',id); e.dataTransfer.setData('fromNurseId',nurse.id); }}
            />
          );
        })}
        {incomingPreview.map(id=>{
          const r = allRooms[id];
          return (
            <span key={'p'+id} className="badge-preview">
              {id}{r.type==='TELE'&&<span style={{ color:'#f87171',marginLeft:2 }}>♥</span>}
            </span>
          );
        })}
      </div>

      {rooms.length>0 && (
        <button className="btn btn-ghost" onClick={onRemoveAll}
          style={{ fontSize:10, padding:'2px 8px', marginTop:6, width:'100%' }}>
          Remove All Rooms
        </button>
      )}

      {/* Per-nurse Zap feedback strip */}
      {showFeedback && <NurseFeedbackStrip onGood={onFeedbackGood} onBad={onFeedbackBad} nurseColor={nurse.color} />}
    </div>
  );
}

// Unified car-dashboard tile: same shape for all stats.

function DashTile({ icon, value, label, color, accentColor, onClick, active, btnRef }) {
  const isBtn = !!onClick;

  return (
    <div
      ref={btnRef}

      className={`dash-tile${isBtn ? ' dash-tile-btn' : ''}${active ? ' dash-tile-active' : ''}`}

        <div style={{ fontSize:12, lineHeight:1, opacity:0.75, marginBottom:1 }}>{icon}</div>

      <div style={{
        fontSize:24, fontWeight:900, color: numColor, lineHeight:1,
        textShadow: `0 0 12px ${numColor}66`,
        letterSpacing:'-0.5px',

      {/* Label */}
      <div style={{
        fontSize:9, fontWeight:700, letterSpacing:'0.06em',

        transform: active ? 'rotate(180deg)' : 'none',
        transition:'transform 0.2s, opacity 0.2s',
      }}>▾</div>

  );
}

// ── STAT ROOM POPUP — generic popup listing rooms for a given property ────────
function StatRoomPopup({ title, icon, color, rooms, allRooms, nurseRooms, nurses, anchor, onClose }) {
  const ref = React.useRef();

  // Close on outside click
  React.useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    document.addEventListener('mousedown', h, true);
    return () => document.removeEventListener('mousedown', h, true);
  }, []);

  // Center below the anchor tile
  const PW = 380;
  const topPos = anchor ? Math.min(anchor.bottom + 8, window.innerHeight - 80) : 200;

  // Build nurse lookup: roomId → nurse name
  const nurseByRoom = {};
  nurses.forEach(n => { (nurseRooms[n.id]||[]).forEach(id => { nurseByRoom[id] = n; }); });

  const sorted = [...rooms].sort((a,b) => _RIDX[a.id] - _RIDX[b.id]);

  return ReactDOM.createPortal(
    <div ref={ref} style={{
      position:'fixed',
      left:'50%', transform:'translateX(-50%)',
      top: topPos,
      width: Math.min(PW, window.innerWidth - 24),
      maxHeight: `calc(100vh - ${topPos + 16}px)`,
      zIndex:610,
      background:'var(--modal-bg)', border:'1px solid var(--border-sub)',
      borderRadius:14, boxShadow:'0 16px 56px rgba(0,0,0,0.45)',
      display:'flex', flexDirection:'column', overflow:'hidden',
      animation:'dd-in 0.15s ease',
    }}>
      {/* Header */}
      <div style={{ padding:'11px 14px 9px', borderBottom:'1px solid var(--border-sub)',
        display:'flex', justifyContent:'space-between', alignItems:'center', flexShrink:0 }}>
        <div style={{ fontWeight:700, fontSize:13, color:'var(--text-1)', display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:16 }}>{icon}</span>
          {title}
          <span style={{ background:color, color:'#fff', borderRadius:10, padding:'1px 9px', fontSize:11, fontWeight:700 }}>
            {rooms.length}
          </span>
        </div>
        <button className="btn btn-ghost" onClick={onClose} style={{ padding:'3px 8px', fontSize:12 }}>✕</button>
      </div>
      {/* Room list */}
      <div style={{ overflowY:'auto', flex:1, padding:'10px 12px' }}>
        {rooms.length === 0 ? (
          <div style={{ textAlign:'center', padding:'22px 0', color:'var(--text-4)', fontSize:13 }}>
            No rooms with this flag
          </div>
        ) : (
          <div style={{ display:'flex', flexWrap:'wrap', gap:7 }}>
            {sorted.map(r => {
              const nurse = nurseByRoom[r.id];
              const fem   = r.gender === 'female';
              return (
                <div key={r.id} style={{
                  padding:'6px 10px', borderRadius:8, fontSize:12, fontWeight:700,
                  display:'flex', alignItems:'center', gap:6,
                  background: fem ? '#fce7f3' : '#dbeafe',
                  color:      fem ? '#9d174d'  : '#1d4ed8',
                  border:`1.5px solid ${fem ? '#f9a8d4' : '#93c5fd'}`,
                }}>
                  <span>{r.id}</span>
                  {r.type==='TELE' && <span style={{ color:'#f87171' }}>♥</span>}
                  {nurse && (
                    <span style={{
                      fontSize:9, fontWeight:700, padding:'1px 5px', borderRadius:4,
                      background: nurse.color+'33', color: nurse.color,
                      border:`1px solid ${nurse.color}66`,
                    }}>{nurse.name.split(' ')[0]}</span>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
      {/* Legend */}
      <div style={{ padding:'7px 12px', borderTop:'1px solid var(--border-sub)',
        display:'flex', gap:10, fontSize:10, color:'var(--text-4)', flexShrink:0 }}>
        <span style={{ background:'#fce7f3', color:'#9d174d', padding:'1px 6px', borderRadius:4 }}>Pink = Female</span>
        <span style={{ background:'#dbeafe', color:'#1d4ed8', padding:'1px 6px', borderRadius:4 }}>Blue = Male</span>
        <span style={{ marginLeft:'auto' }}>♥ = TELE</span>
      </div>
    </div>,
    document.body
  );
}

// ── FEEDBACK BAR ──────────────────────────────────────────────────────────────
const FB_REASONS = [
  { key:'spread',     label:'Rooms too spread out',  icon:'📍' },
  { key:'load',       label:'Uneven workload',        icon:'⚖️' },
  { key:'heavy',      label:'Too many heavy rooms',   icon:'🔴' },
  { key:'mix',        label:'TELE/Med mixed',         icon:'💔' },
  { key:'cluster',    label:'Lack of cluster',        icon:'🗺️' },
];

function FeedbackBar({ onGood, onBad }) {
  const [phase, setPhase] = React.useState('ask'); // 'ask' | 'reason' | 'done-good' | 'done-bad'

  function handleGood() {
    onGood();
    setPhase('done-good');
  }
  function handleBad(key) {
    onBad(key);
    setPhase('done-bad');
  }

  const base = {
    marginTop:10, borderRadius:10, padding:'9px 12px', fontSize:12,
    display:'flex', alignItems:'center', gap:8, flexWrap:'wrap',
    background:'rgba(0,0,0,0.22)', border:'1px solid rgba(255,255,255,0.12)',
  };

  if (phase === 'done-good') return (
    <div style={{...base, justifyContent:'center', color:'#86efac'}}>
      ✓ Got it — reinforcing this pattern
    </div>
  );
  if (phase === 'done-bad') return (
    <div style={{...base, justifyContent:'center', color:'#fca5a5'}}>
      ✓ Noted — adjusting for next time
    </div>
  );
  if (phase === 'reason') return (
    <div style={base}>
      <span style={{color:'rgba(255,255,255,0.6)', fontSize:11, flexShrink:0}}>What's wrong?</span>
      {FB_REASONS.map(r => (
        <button key={r.key} onClick={() => handleBad(r.key)} style={{
          background:'rgba(239,68,68,0.18)', border:'1px solid rgba(239,68,68,0.4)',
          color:'#fca5a5', borderRadius:16, padding:'3px 10px', fontSize:11,
          cursor:'pointer', display:'flex', alignItems:'center', gap:4,
        }}>{r.icon} {r.label}</button>
      ))}
      <button onClick={()=>setPhase('ask')} style={{marginLeft:'auto',background:'transparent',border:'none',color:'rgba(255,255,255,0.4)',cursor:'pointer',fontSize:12}}>✕</button>
    </div>
  );
  return (
    <div style={base}>
      <span style={{color:'rgba(255,255,255,0.65)', fontSize:11, flex:1}}>How was this assignment?</span>
      <button onClick={handleGood} style={{
        background:'rgba(34,197,94,0.18)', border:'1px solid rgba(34,197,94,0.4)',
        color:'#86efac', borderRadius:16, padding:'4px 14px', fontSize:12, cursor:'pointer', fontWeight:700,
      }}>👍 Good</button>
      <button onClick={()=>setPhase('reason')} style={{
        background:'rgba(239,68,68,0.18)', border:'1px solid rgba(239,68,68,0.4)',
        color:'#fca5a5', borderRadius:16, padding:'4px 14px', fontSize:12, cursor:'pointer', fontWeight:700,
      }}>👎 Needs work</button>
    </div>
  );
}

// ── CORRIDOR GRID ─────────────────────────────────────────────────────────────
function CorridorGrid({ allRooms, selected, nurses, nurseRooms, dragPreviewIds, onSelect, onDragStart, onDblClick, onAssignNurse, onUnassign, onClearSelection,
                        dashStats, onUnassignedClick, unassignedOpen, unassignedBtnRef,
                        onZapAssign, zapLoading, fuelMode, onToggleFuel, fbWeights, onExportSheet, onMonkeyClick }) {
  const ref = useRef();
  const [dims, setDims] = useState({ w:900, h:580 });

  useEffect(()=>{
    const obs = new ResizeObserver(entries=>{
      const {width,height} = entries[0].contentRect;
      setDims({ w:width, h:height });
    });
    if(ref.current) obs.observe(ref.current);
    return ()=>obs.disconnect();
  },[]);

  const { w, h } = dims;
  const { positions, cw, ch } = getCorridorLayout(w, h);

  const nurseColorMap = {};
  nurses.forEach(n=>(nurseRooms[n.id]||[]).forEach(id=>{ nurseColorMap[id]=n.color; }));

  const PAD=12;
  const rx=PAD, ry=PAD, rw=w-2*PAD-cw, rh=h-2*PAD-ch;

  // Build A/B pair groups for background highlight
  const pairGroups = [];
  ROOM_IDS.forEach((id, i) => {
    if (!id.endsWith('A')) return;
    const bId = id.slice(0,-1) + 'B';
    const bIdx = ROOM_IDS.indexOf(bId);
    if (bIdx < 0) return;
    const aPos = positions[i], bPos = positions[bIdx];
    pairGroups.push({ key: id, aPos, bPos });
  });

  return (
    <div ref={ref} className="corridor-container">
      <div style={{ position:'absolute', inset:0, zIndex:0 }} onClick={onClearSelection}/>
      <svg style={{ position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none' }}>
        <rect x={rx+cw/2} y={ry+ch/2} width={rw} height={rh} rx={18} ry={18} className="corridor-path"/>
      </svg>

      {/* A/B pair grouping backgrounds */}
      {pairGroups.map(({ key, aPos, bPos }) => {
        const INSET = 3;
        const x1 = Math.min(aPos.x, bPos.x) - INSET;
        const y1 = Math.min(aPos.y, bPos.y) - INSET;
        const x2 = Math.max(aPos.x, bPos.x) + cw + INSET;
        const y2 = Math.max(aPos.y, bPos.y) + ch + INSET;
        return (
          <div key={key+'-grp'} style={{
            position:'absolute', left:x1, top:y1, width:x2-x1, height:y2-y1,
            borderRadius:11, zIndex:0, pointerEvents:'none',
            border:'1.5px solid rgba(139,92,246,0.32)',
            background:'rgba(139,92,246,0.07)',
          }}/>
        );
      })}

      {/* Center dashboard */}
      <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', pointerEvents:'none' }}>
        <div style={{ pointerEvents:'auto' }}>
          <CenterDashboard
            vacant={dashStats.vacant}    occupied={dashStats.occupied}
            assigned={dashStats.assigned} unassigned={dashStats.unassigned}
            tele={dashStats.tele}        sitter={dashStats.sitter}
            discharge={dashStats.discharge} isolation={dashStats.isolation}
            restraint={dashStats.restraint} centralLine={dashStats.centralLine}
            foley={dashStats.foley}
            sitterRooms={dashStats.sitterRooms}
            dischargeRooms={dashStats.dischargeRooms}
            isolationRooms={dashStats.isolationRooms}
            centralLineRooms={dashStats.centralLineRooms}
            foleyRooms={dashStats.foleyRooms}
            neuroCheck={dashStats.neuroCheck}
            dailyWeight={dashStats.dailyWeight}
            neuroCheckRooms={dashStats.neuroCheckRooms}
            dailyWeightRooms={dashStats.dailyWeightRooms}
            nurses={nurses}
            nurseRooms={nurseRooms}
            unassignedOpen={unassignedOpen}
            onUnassignedClick={onUnassignedClick}
            unassignedBtnRef={unassignedBtnRef}
            onZapAssign={onZapAssign}
            zapLoading={zapLoading}
            fuelMode={fuelMode}
            onToggleFuel={onToggleFuel}
            fbWeights={fbWeights}
            onExportSheet={onExportSheet}
            onMonkeyClick={onMonkeyClick}
          />
        </div>
      </div>

      {ROOM_IDS.map((id,i)=>{
        const room = {...allRooms[id], _nurseColor: nurseColorMap[id]};
        return (
          <RoomCard key={id} room={room} pos={positions[i]} cw={cw} ch={ch}
            selected={selected.has(id)}
            nurses={nurses}
            nurseRooms={nurseRooms}
            onSelect={e=>onSelect(id,e)}
            onDragStart={e=>onDragStart(id,e)}
            onDblClick={()=>onDblClick(id)}
            onAssignNurse={nid=>onAssignNurse(id,nid)}
            onUnassign={()=>onUnassign(id)}
          />
        );
      })}

      <div style={{ position:'absolute', bottom:8, right:12, fontSize:9, color:'var(--text-5)' }}>
        Double-click to edit · Click to select · Drag to nurse · hover + to assign
      </div>
    </div>
  );
}

// ── POLICY SEARCH MODAL ───────────────────────────────────────────────────────
const POLICY_CATEGORIES = [
  'Allergies & Medications','Admission & Discharge','Administration','Behavioral Health',
  'Bladder Management','Death & Comfort Care','Domestic Abuse','Fall Prevention',
  'Infectious Disease','IR Procedure','Lab & Blood','Nursing Standards','On Call',
  'Professional Attire','RN Shift Workflow','Skin Care','Traveler','Ultrasound VAT',
  'Vascular & Central Line','Waste Management','Other',
];

function PolicySearchModal({ onClose }) {
  const [policies, setPolicies]   = useState(() => loadPolicies());
  const [query, setQuery]         = useState('');
  const [results, setResults]     = useState([]);
  const [view, setView]           = useState('search');
  const [viewing, setViewing]     = useState(null);
  const [editing, setEditing]     = useState(null);
  const inputRef = useRef();
  useEffect(() => { setTimeout(() => inputRef.current?.focus(), 80); }, []);

  function doSearch(q) { setResults(q.trim() ? searchPolicies(q, policies) : []); }
  function persistPolicies(next) { setPolicies(next); savePoliciesLS(next); }
  function openPolicy(p) { setViewing(p); setView('read'); }
  function startEdit(p)  { setEditing({...p}); setView('edit'); }
  function startAdd()    {
    setEditing({ id:'', title:'', category:'Other', keywords:[], content:'', source:'manual', lastUpdated: policyToday(), _isNew: true });
    setView('edit');
  }
  function saveEdit() {
    const p = { ...editing, lastUpdated: policyToday() };
    if (!p.id) p.id = p.title.toLowerCase().replace(/[^a-z0-9]/g,'_').slice(0,40);
    if (typeof p.keywords === 'string') p.keywords = p.keywords.split(',').map(k=>k.trim()).filter(Boolean);
    const isNew = p._isNew; delete p._isNew;
    const next = isNew ? [...policies, p] : policies.map(x => x.id === p.id && x.title === p.title ? p : x);
    persistPolicies(next);
    setViewing(p); setView('read');
    if (query) setResults(searchPolicies(query, next));
  }
  function deletePolicy(p) {
    if (!confirm(`Delete "${p.title}"?`)) return;
    const next = policies.filter(x => !(x.id === p.id && x.title === p.title));
    persistPolicies(next);
    setView('search'); setEditing(null);
    if (query) setResults(searchPolicies(query, next));
  }
  function resetToDefault() {
    if (!confirm('Reset all policies to the built-in defaults? Your edits will be lost.')) return;
    persistPolicies(POLICY_DB_DEFAULT);
    setView('search'); setResults([]); setQuery('');
  }

  // ── PDF generator ──
  function generatePolicyPdf(policy) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'letter' });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 48;
    const contentW = pageW - margin * 2;
    let y = margin;

    // Header bar
    doc.setFillColor(37, 99, 235);
    doc.rect(0, 0, pageW, 56, 'F');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.setTextColor(255, 255, 255);
    doc.text('CAREFLOW POLICY DOCUMENT', margin, 24);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.text('CONFIDENTIAL — FOR INTERNAL USE ONLY', margin, 38);
    y = 80;

    // Category pill background
    doc.setFillColor(219, 234, 254);
    const catLabel = policy.category || 'General';
    doc.setFontSize(8);
    const catW = doc.getTextWidth(catLabel) + 16;
    doc.roundedRect(margin, y, catW, 16, 4, 4, 'F');
    doc.setTextColor(29, 78, 216);
    doc.setFont('helvetica', 'bold');
    doc.text(catLabel, margin + 8, y + 11);
    y += 30;

    // Title
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(18);
    doc.setTextColor(15, 23, 42);
    const titleLines = doc.splitTextToSize(policy.title || 'Untitled Policy', contentW);
    doc.text(titleLines, margin, y);
    y += titleLines.length * 22 + 6;

    // Meta line
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(100, 116, 139);
    const metaParts = [];
    if (policy.lastUpdated) metaParts.push(`Updated: ${policy.lastUpdated}`);
    if (policy.source)      metaParts.push(`Source: ${policy.source}`);
    if (metaParts.length) { doc.text(metaParts.join('   ·   '), margin, y); y += 14; }

    // Keywords
    if (policy.keywords && policy.keywords.length) {
      const kw = (Array.isArray(policy.keywords) ? policy.keywords : policy.keywords.split(',').map(k=>k.trim())).join(', ');
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(8.5);
      doc.setTextColor(71, 85, 105);
      const kwLines = doc.splitTextToSize(`Keywords: ${kw}`, contentW);
      doc.text(kwLines, margin, y);
      y += kwLines.length * 12 + 4;
    }

    // Divider
    y += 8;
    doc.setDrawColor(203, 213, 225);
    doc.setLineWidth(0.75);
    doc.line(margin, y, pageW - margin, y);
    y += 18;

    // Content
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10.5);
    doc.setTextColor(30, 41, 59);
    const content = policy.content || '(No content available)';
    const lines = doc.splitTextToSize(content, contentW);
    const lineH = 15;
    for (const line of lines) {
      if (y + lineH > pageH - margin) {
        doc.addPage();
        y = margin;
        // page top border
        doc.setFillColor(37, 99, 235);
        doc.rect(0, 0, pageW, 4, 'F');
        y += 12;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10.5);
        doc.setTextColor(30, 41, 59);
      }
      doc.text(line, margin, y);
      y += lineH;
    }

    // Footer on each page
    const totalPages = doc.internal.getNumberOfPages();
    for (let i = 1; i <= totalPages; i++) {
      doc.setPage(i);
      doc.setFillColor(248, 250, 252);
      doc.rect(0, pageH - 32, pageW, 32, 'F');
      doc.setDrawColor(226, 232, 240);
      doc.setLineWidth(0.5);
      doc.line(0, pageH - 32, pageW, pageH - 32);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7.5);
      doc.setTextColor(148, 163, 184);
      doc.text('CareFlow — Charge Nurse Assignment System', margin, pageH - 12);
      doc.text(`Page ${i} of ${totalPages}`, pageW - margin, pageH - 12, { align: 'right' });
    }

    return doc.output('bloburi');
  }

  // ── Read view ──
  function ReadView({ policy }) {
    const [pdfUrl, setPdfUrl] = React.useState(null);
    React.useEffect(() => {
      let url = null;
      try { url = generatePolicyPdf(policy); } catch(e) { console.warn('PDF gen failed', e); }
      setPdfUrl(url);
      return () => { if (url) URL.revokeObjectURL(url); };
    }, [policy.id, policy.title, policy.content]);

    return (
      <>
        <div style={{position:'fixed',inset:0,zIndex:299,background:'rgba(0,0,0,0.25)'}} onClick={onClose}/>
        <div style={{position:'fixed',right:0,top:0,bottom:0,zIndex:300,
          width:'calc(50vw)',minWidth:480,
          background:'#ffffff',borderLeft:'1px solid #e2e8f0',
          display:'flex',flexDirection:'column',padding:'16px 20px 12px',
          boxShadow:'-10px 0 40px rgba(0,0,0,0.35)'}}>
          {/* Header */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,flexShrink:0}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <button onClick={()=>setView('search')}
                style={{fontSize:12,padding:'5px 12px',borderRadius:7,border:'1px solid #e2e8f0',
                  background:'#f8fafc',color:'#475569',cursor:'pointer',fontWeight:600}}>← Back</button>
              <span style={{fontSize:10,background:'#dbeafe',color:'#1d4ed8',borderRadius:5,
                padding:'3px 10px',fontWeight:700}}>{policy.category}</span>
            </div>
            <div style={{display:'flex',gap:6,flexShrink:0}}>
              <button onClick={()=>startEdit(policy)}
                style={{fontSize:12,padding:'5px 12px',borderRadius:7,border:'1px solid #e2e8f0',
                  background:'#f8fafc',color:'#475569',cursor:'pointer',fontWeight:600}}>✏ Edit</button>
              <button onClick={onClose}
                style={{fontSize:13,padding:'5px 10px',borderRadius:7,border:'1px solid #e2e8f0',
                  background:'#f8fafc',color:'#475569',cursor:'pointer',fontWeight:700}}>✕</button>
            </div>
          </div>
          {/* PDF iframe */}
          <div style={{flex:1,borderRadius:10,overflow:'hidden',border:'1px solid #e2e8f0',background:'#f1f5f9'}}>
            {pdfUrl
              ? <iframe src={pdfUrl} style={{width:'100%',height:'100%',border:'none',display:'block'}} title={policy.title}/>
              : <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',
                  color:'#94a3b8',fontSize:13}}>Generating PDF…</div>
            }
          </div>
        </div>
      </>
    );
  }

  if (view === 'read' && viewing) return <ReadView policy={viewing} />;

  // ── Edit view ──
  if (view === 'edit' && editing) return (
    <PolicyDrawer onClose={onClose}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <h2 style={{margin:0,fontSize:16,fontWeight:700,color:'var(--text-1)'}}>{editing._isNew?'+ New Policy':'✏ Edit Policy'}</h2>
        <button className="btn btn-ghost" onClick={onClose}>✕</button>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:10,overflowY:'auto',flex:1}}>
        {[['Title','title'],['Source / reference','source']].map(([lbl,key])=>(
          <label key={key} style={{display:'flex',flexDirection:'column',gap:4}}>
            <span style={{fontSize:11,color:'var(--text-3)',fontWeight:600}}>{lbl}</span>
            <input value={editing[key]||''} onChange={e=>setEditing(p=>({...p,[key]:e.target.value}))}
              style={{padding:'8px 12px',borderRadius:8,border:'1px solid rgba(255,255,255,0.15)',background:'rgba(255,255,255,0.06)',color:'var(--text-1)',fontSize:13}}/>
          </label>
        ))}
        <label style={{display:'flex',flexDirection:'column',gap:4}}>
          <span style={{fontSize:11,color:'var(--text-3)',fontWeight:600}}>Category</span>
          <select value={editing.category||'Other'} onChange={e=>setEditing(p=>({...p,category:e.target.value}))}
            style={{padding:'8px 12px',borderRadius:8,border:'1px solid rgba(255,255,255,0.15)',background:'rgba(30,30,42,1)',color:'var(--text-1)',fontSize:13}}>
            {POLICY_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </label>
        <label style={{display:'flex',flexDirection:'column',gap:4}}>
          <span style={{fontSize:11,color:'var(--text-3)',fontWeight:600}}>Keywords <span style={{fontWeight:400,opacity:.6}}>(comma-separated)</span></span>
          <input value={Array.isArray(editing.keywords)?editing.keywords.join(', '):editing.keywords||''}
            onChange={e=>setEditing(p=>({...p,keywords:e.target.value}))}
            style={{padding:'8px 12px',borderRadius:8,border:'1px solid rgba(255,255,255,0.15)',background:'rgba(255,255,255,0.06)',color:'var(--text-1)',fontSize:13}}/>
        </label>
        <label style={{display:'flex',flexDirection:'column',gap:4,flex:1}}>
          <span style={{fontSize:11,color:'var(--text-3)',fontWeight:600}}>Content</span>
          <textarea value={editing.content||''} onChange={e=>setEditing(p=>({...p,content:e.target.value}))}
            rows={10} style={{padding:'10px 12px',borderRadius:8,border:'1px solid rgba(255,255,255,0.15)',
            background:'rgba(255,255,255,0.06)',color:'var(--text-1)',fontSize:12,lineHeight:1.6,resize:'vertical',fontFamily:'inherit'}}/>
        </label>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',marginTop:14,paddingTop:12,borderTop:'1px solid rgba(255,255,255,0.08)'}}>

          ? <button className="btn btn-ghost" style={{color:'#f87171',borderColor:'rgba(248,113,113,0.3)'}} onClick={()=>deletePolicy(editing)}>🗑 Delete</button>
          : <div/>}
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-ghost" onClick={()=>setView(editing._isNew?'search':'read')}>Cancel</button>
          <button className="btn btn-primary" onClick={saveEdit}>Save</button>
        </div>
      </div>
    </PolicyDrawer>
  );

  // ── Manage view ──
  if (view === 'manage') return (
    <PolicyDrawer onClose={onClose}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <button className="btn btn-ghost" style={{fontSize:12,padding:'4px 10px'}} onClick={()=>setView('search')}>← Back</button>
          <h2 style={{margin:0,fontSize:16,fontWeight:700,color:'var(--text-1)'}}>Manage Policies</h2>
        </div>
        <button className="btn btn-ghost" onClick={onClose}>✕</button>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <span style={{fontSize:12,color:'var(--text-4)'}}>{policies.length} policies</span>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-ghost" style={{fontSize:11,color:'#fbbf24'}} onClick={resetToDefault}>↺ Reset</button>
          <button className="btn btn-primary" style={{fontSize:12}} onClick={startAdd}>+ Add</button>
        </div>
      </div>
      <div style={{overflowY:'auto',flex:1,display:'flex',flexDirection:'column',gap:5}}>
        {[...policies].sort((a,b)=>a.category.localeCompare(b.category)||a.title.localeCompare(b.title)).map((p,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 12px',
            borderRadius:8,background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.07)'}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12,fontWeight:700,color:'var(--text-1)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.title}</div>
              <div style={{fontSize:10,color:'var(--text-4)'}}>{p.category}</div>
            </div>
            <button className="btn btn-ghost" style={{fontSize:11,padding:'3px 10px',flexShrink:0}} onClick={()=>startEdit(p)}>Edit</button>
          </div>
        ))}
      </div>
    </PolicyDrawer>
  );

  // ── Search view (default) ──
  return (
    <PolicyDrawer onClose={onClose}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <h2 style={{margin:0,fontSize:16,fontWeight:800,color:'var(--text-1)'}}>🐒 Policy Search</h2>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-ghost" style={{fontSize:11}} onClick={()=>setView('manage')}>⚙ Manage</button>
          <button className="btn btn-ghost" onClick={onClose}>✕</button>
        </div>

  { key:'external',   label:'🌐 External',       cols:['name','phone','notes'],               headers:['Name / Service','Phone Number','Notes'] },
  { key:'quickNotes', label:'📌 Quick Notes',    cols:['note','detail'],                      headers:['Note','Detail'] },
];

function PhoneDirectory({ onClose }) {
  const [data,     setData]    = React.useState(() => loadPhoneDir());
  const [tab,      setTab]     = React.useState('internal');
  const [search,   setSearch]  = React.useState('');
  const [editing,  setEditing] = React.useState(null); // {id, col}
  const [editVal,  setEditVal] = React.useState('');
  const inputRef = React.useRef();

  React.useEffect(() => { if (editing && inputRef.current) inputRef.current.focus(); }, [editing]);

  const tabDef = PD_TABS.find(t => t.key === tab);
  const rows   = data[tab] || [];
  const q      = search.toLowerCase();
  const visible = q
    ? rows.filter(r => tabDef.cols.some(c => (r[c]||'').toLowerCase().includes(q)))
    : rows;

  function persist(next) { setData(next); savePhoneDir(next); }

  function startEdit(id, col, val) { setEditing({id,col}); setEditVal(val||''); }
  function commitEdit() {
    if (!editing) return;
    persist({ ...data, [tab]: data[tab].map(r => r.id===editing.id ? {...r,[editing.col]:editVal} : r) });
    setEditing(null);
  }

  function addRow() {
    const blank = Object.fromEntries([['id',pdId()], ...tabDef.cols.map(c=>[c,''])]);
    const next = { ...data, [tab]: [...data[tab], blank] };
    persist(next);
    // auto-edit first col of new row
    setEditing({ id: blank.id, col: tabDef.cols[0] }); setEditVal('');
  }
  function deleteRow(id) { persist({ ...data, [tab]: data[tab].filter(r => r.id !== id) }); }

  function resetToSeed() {
    if (!window.confirm('Reset this tab to the original directory data?')) return;
    persist({ ...data, [tab]: PHONE_DIR_SEED[tab] });
  }

  const cellStyle = { padding:'6px 10px', borderBottom:'1px solid var(--border-sub)', fontSize:12, color:'var(--text-1)', verticalAlign:'middle' };
  const hdrStyle  = { padding:'7px 10px', fontWeight:700, fontSize:11, textTransform:'uppercase', letterSpacing:'0.06em',
                      color:'var(--text-3)', borderBottom:'2px solid var(--border)', background:'var(--bg-panel)', position:'sticky', top:0, zIndex:2 };

  return ReactDOM.createPortal(
    <div style={{ position:'fixed', inset:0, zIndex:900, display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(0,0,0,0.55)', backdropFilter:'blur(4px)' }}
         onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div style={{ width:'min(860px,96vw)', height:'min(680px,92vh)', background:'var(--modal-bg)', borderRadius:18,
                    display:'flex', flexDirection:'column', boxShadow:'0 24px 72px rgba(0,0,0,0.55)', overflow:'hidden' }}>

        {/* Header */}
        <div style={{ padding:'14px 18px 0', background:'var(--bg-panel)', borderBottom:'1px solid var(--border)', flexShrink:0 }}>
          <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:10 }}>
            <span style={{ fontSize:20 }}>📞</span>
            <span style={{ fontWeight:800, fontSize:16, color:'var(--text-1)', flex:1 }}>Hospital Phone Directory</span>
            {/* Search */}
            <div style={{ display:'flex', alignItems:'center', gap:6, background:'var(--bg-base)', border:'1px solid var(--border-sub)', borderRadius:8, padding:'4px 10px' }}>
              <span style={{ opacity:0.45, fontSize:13 }}>🔍</span>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…"
                style={{ border:'none', background:'transparent', fontSize:12, color:'var(--text-1)', width:160, outline:'none' }}/>
              {search && <button onClick={()=>setSearch('')} style={{ border:'none',background:'transparent',cursor:'pointer',color:'var(--text-4)',fontSize:12 }}>✕</button>}
            </div>
            <button onClick={onClose} style={{ background:'transparent',border:'none',fontSize:18,cursor:'pointer',color:'var(--text-3)',lineHeight:1,padding:'2px 4px' }}>✕</button>
          </div>
          {/* Tabs */}
          <div style={{ display:'flex', gap:2 }}>
            {PD_TABS.map(t=>(
              <button key={t.key} onClick={()=>{ setTab(t.key); setSearch(''); setEditing(null); }}
                style={{ padding:'7px 14px', border:'none', borderRadius:'8px 8px 0 0', cursor:'pointer', fontSize:12, fontWeight:tab===t.key?700:500,
                  background: tab===t.key ? 'var(--modal-bg)' : 'transparent',
                  color: tab===t.key ? 'var(--text-1)' : 'var(--text-3)',
                  borderBottom: tab===t.key ? '2px solid var(--accent)' : '2px solid transparent',

                {t.label} <span style={{ fontSize:10, opacity:0.6 }}>({data[t.key]?.length||0})</span>

        {/* Table */}
        <div style={{ flex:1, overflowY:'auto' }}>
          <table style={{ width:'100%', borderCollapse:'collapse' }}>

                <tr><td colSpan={tabDef.cols.length+1} style={{ textAlign:'center', padding:32, color:'var(--text-4)', fontSize:13 }}>

              )}
              {visible.map(row=>(
                <tr key={row.id} style={{ transition:'background 0.1s' }}
                  onMouseEnter={e=>e.currentTarget.style.background='var(--bg-panel)'}

                        padding:'2px 4px', borderRadius:4, transition:'color 0.15s' }}

          </table>
        </div>

        {/* Footer */}
        <div style={{ padding:'10px 16px', borderTop:'1px solid var(--border)', display:'flex', gap:8, alignItems:'center', background:'var(--bg-panel)', flexShrink:0 }}>
          <button onClick={addRow} style={{ display:'flex',alignItems:'center',gap:6,padding:'6px 14px',borderRadius:8,border:'none',cursor:'pointer',
            background:'var(--accent)',color:'#fff',fontWeight:700,fontSize:12 }}>
            + Add Row
          </button>
          <span style={{ flex:1, fontSize:11, color:'var(--text-4)' }}>Click any cell to edit · Changes auto-save</span>
          <button onClick={resetToSeed} style={{ padding:'5px 12px',borderRadius:8,border:'1px solid var(--border-sub)',cursor:'pointer',
            background:'transparent',color:'var(--text-3)',fontSize:11 }}>↺ Reset tab</button>
