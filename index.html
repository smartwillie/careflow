<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareFlow — MED/TELE Charge Nurse</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* ═══════════════════════════════════════════════════════════
     CSS VARIABLES — Night mode (default)
  ═══════════════════════════════════════════════════════════ */
  :root {
    --bg-base:        #080f1d;
    --bg-panel:       #0a1628;
    --bg-card:        #1e293b;
    --border:         #1e293b;
    --border-sub:     #334155;
    --text-1:         #f1f5f9;
    --text-2:         #cbd5e1;
    --text-3:         #94a3b8;
    --text-4:         #64748b;
    --text-5:         #334155;
    --input-bg:       #0f172a;
    --cap-bg:         #0f172a;
    --legend-bg:      #1e293b;
    --corridor-path:  #1e3a5f;
    --station-bg:     rgba(15,23,42,0.92);
    --station-border: #1e3a5f;
    --station-label:  #1d4ed8;
    --room-vacant-bg: #2d3f55;
    --room-vacant-br: #3d5068;
    --room-vacant-tx: #7a91aa;
    --dd-bg:          #1e293b;
    --dd-border:      #3b4f6a;
    --dd-hover:       #334155;
    --dd-active:      #1e3a5f;
    --dd-text:        #cbd5e1;
    --dd-label:       #64748b;
    --sel-bar-bg:     #1c2a3a;
    --sel-bar-border: #1e3a5f;
    --sel-bar-text:   #93c5fd;
    --trash-bg:       #1e293b;
    --trash-border:   #475569;
    --modal-bg:       #1e293b;
    --scrollbar:      #334155;
    --btn-ghost-bg:   #334155;
    --btn-ghost-tx:   #94a3b8;
    --stat-border:    #334155;
  }

  /* ═══════════════════════════════════════════════════════════
     CSS VARIABLES — Day mode overrides
  ═══════════════════════════════════════════════════════════ */
  body[data-theme="day"] {
    --bg-base:        #e4ecf7;
    --bg-panel:       #f0f4fb;
    --bg-card:        #ffffff;
    --border:         #dde4ef;
    --border-sub:     #c8d4e6;
    --text-1:         #0f172a;
    --text-2:         #1e293b;
    --text-3:         #475569;
    --text-4:         #64748b;
    --text-5:         #94a3b8;
    --input-bg:       #ffffff;
    --cap-bg:         #e2e8f0;
    --legend-bg:      #f8fafc;
    --corridor-path:  #94a3b8;
    --station-bg:     rgba(240,244,251,0.96);
    --station-border: #bfdbfe;
    --station-label:  #1d4ed8;
    --room-vacant-bg: #dde5f0;
    --room-vacant-br: #b0bed4;
    --room-vacant-tx: #64748b;
    --dd-bg:          #ffffff;
    --dd-border:      #dde4ef;
    --dd-hover:       #f1f5f9;
    --dd-active:      #dbeafe;
    --dd-text:        #1e293b;
    --dd-label:       #64748b;
    --sel-bar-bg:     #eff6ff;
    --sel-bar-border: #bfdbfe;
    --sel-bar-text:   #1d4ed8;
    --trash-bg:       #f1f5f9;
    --trash-border:   #c8d4e6;
    --modal-bg:       #ffffff;
    --scrollbar:      #c8d4e6;
    --btn-ghost-bg:   #e2e8f0;
    --btn-ghost-tx:   #475569;
    --stat-border:    #c8d4e6;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-base);
    color: var(--text-1);
    transition: background 0.25s, color 0.25s;
  }
  .nurse-panel { width: 340px; min-width: 280px; flex-shrink: 0; }
  .room-panel  { flex: 1; position: relative; overflow: visible; }
  .corridor-container { position: relative; width: 100%; height: 100%; }

  /* ── Room card ── */
  .room-card {
    position: absolute;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    user-select: none;
    z-index: 1;
    overflow: visible;
  }
  .room-card:hover { transform: scale(1.1); z-index: 20; }
  .room-card.selected { border-color: #4ade80 !important; box-shadow: 0 0 0 3px rgba(74,222,128,0.3); z-index: 10; }
  .vacant  { background: var(--room-vacant-bg); border-color: var(--room-vacant-br); color: var(--room-vacant-tx); }
  .female  { background: #f9a8d4; border-color: #ec4899; color: #831843; }
  .male    { background: #bfdbfe; border-color: #60a5fa; color: #1e3a8a; }

  /* Assign button – hidden until card is hovered */
  .assign-btn {
    display: none;
    position: absolute; top: 2px; right: 2px;
    width: 15px; height: 15px; border-radius: 4px;
    background: rgba(15,23,42,0.75); border: 1px solid #475569;
    color: #94a3b8; font-size: 11px; line-height: 1;
    cursor: pointer; align-items: center; justify-content: center;
    z-index: 5;
  }
  body[data-theme="day"] .assign-btn {
    background: rgba(255,255,255,0.85); border-color: #94a3b8; color: #475569;
  }
  .room-card:hover .assign-btn { display: flex; }

  /* ── Nurse card ── */
  .nurse-card {
    background: var(--bg-card);
    border: 2px solid var(--border-sub);
    border-radius: 12px;
    padding: 10px; margin-bottom: 8px; position: relative;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.25s;
  }
  .nurse-card.drag-over {
    border-color: #22c55e;
    box-shadow: 0 0 0 3px rgba(34,197,94,0.25);
  }

  /* ── Badges ── */
  .badge {
    display: inline-flex; align-items: center; gap: 2px;
    padding: 3px 7px; border-radius: 5px; font-size: 11px; font-weight: 700;
    cursor: grab; margin: 2px; white-space: nowrap;
    transition: opacity 0.1s;
  }
  .badge:active { cursor: grabbing; opacity: 0.7; }
  .badge-male   { background: #dbeafe; color: #1d4ed8; border: 1px solid #93c5fd; }
  .badge-female { background: #fce7f3; color: #9d174d; border: 1px solid #f9a8d4; }
  .badge-preview {
    display: inline-flex; align-items: center; gap: 2px;
    padding: 3px 7px; border-radius: 5px; font-size: 11px; font-weight: 700;
    margin: 2px; white-space: nowrap;
    background: rgba(34,197,94,0.12); color: #86efac;
    border: 1.5px dashed #22c55e; opacity: 0.85;
    animation: pulse-in 0.2s ease;
  }
  @keyframes pulse-in { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 0.85; } }

  /* ── Trash zone ── */
  .trash-zone {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--trash-bg); border: 1px dashed var(--trash-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all 0.15s; cursor: pointer; flex-shrink: 0;
  }
  .trash-zone.drag-over { background: #7f1d1d; border-color: #ef4444; }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.68);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
    backdrop-filter: blur(2px);
  }
  .modal {
    background: var(--modal-bg); border-radius: 16px; padding: 24px; width: 360px;
    border: 1px solid var(--border-sub);
    box-shadow: 0 24px 80px rgba(0,0,0,0.45);
    transition: background 0.25s;
  }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--border-sub);
  }
  .toggle { width: 40px; height: 22px; border-radius: 11px; background: var(--border-sub); position: relative; cursor: pointer; transition: background 0.2s; border: none; flex-shrink: 0; }
  .toggle.on { background: #22c55e; }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: white; transition: transform 0.2s; }
  .toggle.on::after { transform: translateX(18px); }

  /* ── Toast ── */
  .warn-toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #7f1d1d; color: #fca5a5; padding: 10px 20px; border-radius: 8px;
    font-size: 13px; z-index: 2000; border: 1px solid #ef4444; white-space: nowrap;
    animation: fadeout 3s forwards; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  @keyframes fadeout { 0%{opacity:1} 70%{opacity:1} 100%{opacity:0;pointer-events:none} }

  /* ── Misc ── */
  .corridor-path { fill: none; stroke: var(--corridor-path); stroke-width: 1.5; stroke-dasharray: 8 5; opacity: 0.45; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
  .nurse-color-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  input[type=text] {
    background: var(--input-bg); border: 1px solid var(--border-sub); color: var(--text-1);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; width: 100%; outline: none;
    transition: background 0.25s, border-color 0.15s;
  }
  input[type=text]:focus { border-color: #3b82f6; }
  .btn { border-radius: 7px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.82; }
  .btn-primary { background: #3b82f6; color: white; }
  .btn-ghost   { background: var(--btn-ghost-bg); color: var(--btn-ghost-tx); }
  .cap-bar  { height: 4px; border-radius: 2px; background: var(--cap-bg); overflow: hidden; margin-top: 4px; }
  .cap-fill { height: 100%; border-radius: 2px; transition: width 0.35s; }
  .flag { font-size: 9px; background: rgba(0,0,0,0.22); border-radius: 3px; padding: 1px 3px; margin: 1px; display: inline-block; line-height: 1.3; }
  body[data-theme="day"] .flag { background: rgba(0,0,0,0.10); }

  /* ── Room dropdown (portal, fixed) ── */
  .room-dropdown {
    position: fixed; z-index: 9999;
    background: var(--dd-bg); border: 1px solid var(--dd-border); border-radius: 10px;
    padding: 4px; min-width: 210px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.55);
    animation: dd-in 0.12s ease;
    transition: background 0.2s;
  }
  @keyframes dd-in { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform: translateY(0); } }
  .dd-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 6px; cursor: pointer;
    font-size: 12px; color: var(--dd-text); transition: background 0.1s;
  }
  .dd-item:hover { background: var(--dd-hover); }
  .dd-item.active { background: var(--dd-active); }

  /* ── Theme toggle button ── */
  .theme-btn {
    width: 34px; height: 20px; border-radius: 10px;
    border: 1.5px solid var(--border-sub);
    background: var(--bg-card);
    cursor: pointer; position: relative;
    display: flex; align-items: center; padding: 2px;
    transition: background 0.25s, border-color 0.25s;
    flex-shrink: 0;
  }
  .theme-btn-knob {
    width: 14px; height: 14px; border-radius: 50%;
    background: #3b82f6; transition: transform 0.25s;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; line-height: 1;
  }
  body[data-theme="day"] .theme-btn-knob { transform: translateX(14px); background: #f59e0b; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useMemo } = React;

// ── ROOM GENERATION ───────────────────────────────────────────────────────────
const DOUBLE_ROOMS = new Set([1110,1111,1129,1130,1131,1132,1133,1134,1135]);
function generateRooms() {
  const list = [];
  for (let n = 1101; n <= 1135; n++) {
    DOUBLE_ROOMS.has(n) ? list.push(n+'A', n+'B') : list.push(String(n));
  }
  return list; // exactly 44
}
const ROOM_IDS = generateRooms();

function initRooms() {
  return ROOM_IDS.reduce((acc, id) => {
    acc[id] = { id, occupied: false, gender: 'male', type: 'MEDSURG',
                foley: false, drip: false, prisoner: false, totalCare: false,
                glucose: false, highAcuity: false, sitter: false, nurseId: null };
    return acc;
  }, {});
}

const NURSE_COLORS = ['#3b82f6','#22c55e','#f59e0b','#a855f7','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16','#06b6d4'];

const STORAGE_KEY = 'careflow_assignment';
const DEFAULT_NURSES = [
  { id:'n1', name:'RN — Smith', color:NURSE_COLORS[0] },
  { id:'n2', name:'RN — Jones', color:NURSE_COLORS[1] },
  { id:'n3', name:'RN — Patel', color:NURSE_COLORS[2] },
];

function loadFromStorage() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null; }
  catch(e) { return null; }
}

function mergeRooms(saved) {
  const defaults = initRooms();
  if (!saved) return defaults;
  const out = {};
  ROOM_IDS.forEach(id => { out[id] = { ...defaults[id], ...(saved[id] || {}) }; });
  return out;
}

// ── ASSIGNMENT RULES ──────────────────────────────────────────────────────────
function checkAssignment(nurseId, roomIds, allRooms) {
  const rms = roomIds.map(id => allRooms[id]).filter(Boolean);
  const hasTele = rms.some(r => r.occupied && r.type === 'TELE');
  const cap = hasTele ? 4 : 5;
  const occ = rms.filter(r => r.occupied);
  if (occ.length > cap) return `Exceeds ${cap}-patient limit (${hasTele?'TELE':'Med/Surg'} group)`;
  const cnt = k => occ.filter(r => r[k]).length;
  if (cnt('glucose')    > 2) return 'Exceeds 2 glucose-check patients';
  if (cnt('totalCare')  > 2) return 'Exceeds 2 total-care patients';
  if (cnt('prisoner')   > 2) return 'Exceeds 2 prisoner patients';
  if (cnt('highAcuity') > 2) return 'Exceeds 2 high-acuity patients';
  if (cnt('drip')       > 2) return 'Exceeds 2 infusion-drip patients';
  return null;
}

// ── CORRIDOR LAYOUT ───────────────────────────────────────────────────────────
// A/B rooms get a tight PAIR_GAP; different room numbers get the normal GAP.
// placeLine distributes cards along [start → end], scaling the normal gaps to fill
// the available span while keeping pair gaps fixed and small.
function getCorridorLayout(W, H) {
  const PAD = 12, GAP = 6, PAIR_GAP = 2, CORNER_GAP = 18;
  const TOP_N = 14, SIDE_N = 8;

  // cw: fit TOP_N cards + (TOP_N-1) normal gaps across available width
  const cw = Math.max(44, Math.min(72, Math.floor((W - 2*PAD - (TOP_N-1)*GAP) / TOP_N)));

  // ch: total height = 2·PAD + (SIDE_N+2)·ch + 2·CORNER_GAP + (SIDE_N-1)·GAP
  // corner cards are the top/bottom row cards at the four corners;
  // CORNER_GAP is the breathing room between a corner card and the adjacent side card.
  const ch = Math.max(36, Math.min(58, Math.floor((H - 2*PAD - 2*CORNER_GAP - (SIDE_N-1)*GAP) / (SIDE_N+2))));

  const xL = PAD, xR = W - PAD - cw;
  const yT = PAD, yB = H - PAD - ch;
  const yMidT = yT + ch + CORNER_GAP;   // top edge of first side-column card
  const yMidB = yB - ch - CORNER_GAP;   // top edge of last side-column card

  // Returns true when idA/idB are the A and B beds of the same room number
  function isPair(idA, idB) {
    return idA.endsWith('A') && idB.endsWith('B') && idA.slice(0,-1) === idB.slice(0,-1);
  }

  // Place n cards from start to end with pair-aware gaps.
  // cardSize = cw (horizontal) or ch (vertical).
  // Direction is inferred from start vs end.
  function placeLine(ids, start, end, cardSize) {
    const n = ids.length;
    if (n === 1) return [start];
    const gapTypes = ids.slice(1).map((id, i) => isPair(ids[i], id) ? 'pair' : 'room');
    const pairCnt  = gapTypes.filter(t => t === 'pair').length;
    const roomCnt  = gapTypes.length - pairCnt;
    const span     = Math.abs(end - start);          // from first-card start to last-card start
    const S        = span - (n - 1) * cardSize;      // total gap pixels to distribute

    // Minimum pair gap; scale room gaps to fill remaining space
    let pairG, roomG;
    if (S <= 0) {
      pairG = roomG = 0;                             // cards touch — shouldn't happen at normal sizes
    } else if (pairCnt > 0 && S < pairCnt * PAIR_GAP) {
      pairG = roomG = S / (n - 1);                  // not enough room even for small pair gap, go uniform
    } else {
      pairG = PAIR_GAP;
      roomG = roomCnt > 0 ? (S - pairCnt * PAIR_GAP) / roomCnt : PAIR_GAP;
    }

    const dir = end >= start ? 1 : -1;
    const out = [start];
    for (let i = 0; i < n - 1; i++) {
      out.push(out[i] + dir * (cardSize + (gapTypes[i] === 'pair' ? pairG : roomG)));
    }
    return out;
  }

  // Slice ROOM_IDS into the four corridor sides
  const topIds    = ROOM_IDS.slice(0,          TOP_N);
  const rightIds  = ROOM_IDS.slice(TOP_N,      TOP_N + SIDE_N);
  const bottomIds = ROOM_IDS.slice(TOP_N + SIDE_N, TOP_N + SIDE_N + TOP_N);
  const leftIds   = ROOM_IDS.slice(TOP_N + SIDE_N + TOP_N);

  const topX    = placeLine(topIds,    xL,    xR,    cw);   // left → right
  const rightY  = placeLine(rightIds,  yMidT, yMidB, ch);   // top → bottom
  const bottomX = placeLine(bottomIds, xR,    xL,    cw);   // right → left
  const leftY   = placeLine(leftIds,   yMidB, yMidT, ch);   // bottom → top

  const positions = [
    ...topX.map(x    => ({ x, y: yT })),
    ...rightY.map(y  => ({ x: xR, y })),
    ...bottomX.map(x => ({ x, y: yB })),
    ...leftY.map(y   => ({ x: xL, y })),
  ];

  return { positions, cw, ch };
}

// ── ROOM DROPDOWN (portal) ────────────────────────────────────────────────────
function RoomDropdown({ room, nurses, nurseRooms, anchor, onAssign, onUnassign, onClose }) {
  const ref = useRef();

  useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    document.addEventListener('mousedown', h, true);
    return () => document.removeEventListener('mousedown', h, true);
  }, []);

  const menuH = nurses.length * 38 + 60;
  const spaceBelow = window.innerHeight - anchor.bottom;
  const style = {
    left: Math.min(anchor.left, window.innerWidth - 220),
    ...(spaceBelow > menuH
      ? { top: anchor.bottom + 4 }
      : { bottom: window.innerHeight - anchor.top + 4 })
  };

  return ReactDOM.createPortal(
    <div ref={ref} className="room-dropdown" style={style}>
      <div style={{ padding:'5px 10px 6px', fontSize:10, color:'var(--dd-label)', borderBottom:'1px solid var(--border-sub)', fontWeight:700, letterSpacing:'0.05em' }}>
        ASSIGN ROOM {room.id}
      </div>
      {nurses.map(n => {
        const pts = (nurseRooms[n.id]||[]).length;
        const isMe = room.nurseId === n.id;
        return (
          <div key={n.id} className={`dd-item${isMe?' active':''}`}
            onClick={() => { onAssign(n.id); onClose(); }}>
            <div style={{ width:8,height:8,borderRadius:'50%',background:n.color,flexShrink:0 }}/>
            <span style={{ flex:1 }}>{n.name}</span>
            <span style={{ fontSize:10,color:'var(--dd-label)' }}>{pts}pt</span>
            {isMe && <span style={{ color:'#22c55e',fontSize:11 }}>✓</span>}
          </div>
        );
      })}
      {room.nurseId && (
        <div className="dd-item" style={{ color:'#f87171',borderTop:'1px solid var(--border-sub)',marginTop:2 }}
          onClick={() => { onUnassign(); onClose(); }}>
          <span>✕</span><span>Unassign</span>
        </div>
      )}
    </div>,
    document.body
  );
}

// ── ROOM CARD ────────────────────────────────────────────────────────────────
function RoomCard({ room, pos, cw, ch, selected, nurses, nurseRooms, onSelect, onDragStart, onDblClick, onAssignNurse, onUnassign }) {
  const [anchor, setAnchor] = useState(null);
  const cardRef = useRef();

  let cls = 'room-card ';
  if (!room.occupied) cls += 'vacant';
  else if (room.gender === 'female') cls += 'female';
  else cls += 'male';
  if (selected) cls += ' selected';

  const flags = [];
  if (room.foley)      flags.push('F');
  if (room.drip)       flags.push('IV');
  if (room.prisoner)   flags.push('🔒');
  if (room.totalCare)  flags.push('TC');
  if (room.glucose)    flags.push('BG');
  if (room.highAcuity) flags.push('HA');
  if (room.sitter)     flags.push('ST');

  function openMenu(e) {
    e.stopPropagation();
    if (anchor) { setAnchor(null); return; }
    setAnchor(cardRef.current.getBoundingClientRect());
  }

  return (
    <>
      <div ref={cardRef} className={cls}
        style={{ left: pos.x, top: pos.y, width: cw, height: ch }}
        onClick={onSelect}
        onDoubleClick={onDblClick}
        draggable={room.occupied}
        onDragStart={onDragStart}
        title={`Room ${room.id}${room.occupied ? (room.type==='TELE' ? ' · TELE' : ' · M/S') : ' · Vacant'}`}
      >
        {/* Assigned checkmark badge */}
        {room.nurseId && room._nurseColor && (
          <div style={{
            position:'absolute', top:-7, right:-7,
            width:17, height:17, borderRadius:'50%',
            background: room._nurseColor,
            border:'2px solid var(--bg-base)',
            display:'flex', alignItems:'center', justifyContent:'center',
            fontSize:10, fontWeight:900, color:'white', lineHeight:1,
            zIndex:3, boxShadow:'0 2px 6px rgba(0,0,0,0.5)'
          }}>✓</div>
        )}

        {/* Room number + TELE heart */}
        {(() => {
          const isAB  = room.id.endsWith('A') || room.id.endsWith('B');
          const base  = isAB ? room.id.slice(0, -1) : room.id;
          const suf   = isAB ? room.id.slice(-1) : '';
          const fsz   = Math.max(9, Math.round(cw * 0.17));
          return (
            <div style={{ fontSize: fsz, fontWeight:700, letterSpacing:'-0.2px', lineHeight:1.1, display:'flex', alignItems:'baseline', gap:1 }}>
              <span>{base}</span>
              {suf && <span style={{ fontSize: Math.max(7, Math.round(fsz*0.78)), fontWeight:800, opacity:0.75 }}>{suf}</span>}
              {room.occupied && room.type==='TELE' &&
                <span style={{ color:'#f87171', marginLeft:2, fontSize: Math.max(8, Math.round(cw*0.14)) }}>♥</span>}
            </div>
          );
        })()}

        {/* Flags */}
        {room.occupied && flags.length > 0 && (
          <div style={{ display:'flex', flexWrap:'wrap', justifyContent:'center', gap:1, marginTop:2 }}>
            {flags.slice(0, ch > 44 ? 3 : 2).map(f => <span key={f} className="flag">{f}</span>)}
          </div>
        )}

        {/* Assign button */}
        {room.occupied && (
          <button className="assign-btn" onClick={openMenu} title="Assign to nurse">+</button>
        )}
      </div>

      {anchor && (
        <RoomDropdown
          room={room} nurses={nurses} nurseRooms={nurseRooms}
          anchor={anchor}
          onAssign={onAssignNurse}
          onUnassign={onUnassign}
          onClose={() => setAnchor(null)}
        />
      )}
    </>
  );
}

// ── UNASSIGNED PANEL (dropdown, portal) ──────────────────────────────────────
function UnassignedPanel({ rooms, nurses, nurseRooms, onAssign, onDragStart, onClose, anchor, triggerRef }) {
  const ref = useRef();
  const [dropdown, setDropdown] = useState(null); // { room, btnAnchor }

  // Close on outside-click — but ignore clicks on the trigger button itself
  // (the trigger handles its own open/close toggle)
  useEffect(() => {
    const h = e => {
      if (triggerRef?.current?.contains(e.target)) return;
      if (ref.current && !ref.current.contains(e.target)) onClose();
    };
    document.addEventListener('mousedown', h, true);
    return () => document.removeEventListener('mousedown', h, true);
  }, []);

  // Position below the header stat that was clicked
  const PW = 420;
  const left = Math.min(Math.max(8, anchor.right - PW), window.innerWidth - PW - 8);
  const top  = anchor.bottom + 6;

  function openRoomDropdown(e, room) {
    e.stopPropagation();
    const rect = e.currentTarget.getBoundingClientRect();
    setDropdown(prev => prev?.room.id === room.id ? null : { room, anchor: rect });
  }

  return ReactDOM.createPortal(
    <>
      {/* Panel */}
      <div ref={ref} style={{
        position:'fixed', left, top, width:PW, maxHeight:'60vh', zIndex:600,
        background:'var(--modal-bg)', border:'1px solid var(--border-sub)',
        borderRadius:14, boxShadow:'0 16px 56px rgba(0,0,0,0.45)',
        display:'flex', flexDirection:'column', overflow:'hidden',
        animation:'dd-in 0.15s ease',
      }}>

        {/* Header */}
        <div style={{ padding:'11px 14px 9px', borderBottom:'1px solid var(--border-sub)', display:'flex', justifyContent:'space-between', alignItems:'center', flexShrink:0 }}>
          <div>
            <div style={{ fontWeight:700, fontSize:13, color:'var(--text-1)', display:'flex', alignItems:'center', gap:8 }}>
              Unassigned Rooms
              <span style={{ background:'#f59e0b', color:'white', borderRadius:10, padding:'1px 9px', fontSize:11, fontWeight:700 }}>
                {rooms.length}
              </span>
            </div>
            <div style={{ fontSize:10, color:'var(--text-4)', marginTop:3 }}>
              Drag a chip to a nurse · or click <b style={{ color:'var(--text-2)' }}>+</b> to assign
            </div>
          </div>
          <button className="btn btn-ghost" onClick={onClose} style={{ padding:'3px 8px', fontSize:12 }}>✕</button>
        </div>

        {/* Room chips */}
        <div style={{ overflowY:'auto', flex:1, padding:'10px 12px' }}>
          {rooms.length === 0 ? (
            <div style={{ textAlign:'center', padding:'22px 0', color:'#22c55e', fontSize:13, fontWeight:600 }}>
              ✓ All occupied rooms are assigned!
            </div>
          ) : (
            <div style={{ display:'flex', flexWrap:'wrap', gap:7 }}>
              {rooms.map(r => {
                const fem = r.gender === 'female';
                const active = dropdown?.room.id === r.id;
                return (
                  <div
                    key={r.id}
                    draggable
                    onDragStart={e => onDragStart(r.id, e)}
                    style={{
                      padding:'6px 8px 6px 10px', borderRadius:8, fontSize:12, fontWeight:700,
                      display:'flex', alignItems:'center', gap:5, userSelect:'none',
                      background: fem ? '#fce7f3' : '#dbeafe',
                      color:       fem ? '#9d174d'  : '#1d4ed8',
                      border:`1.5px solid ${fem ? '#f9a8d4' : '#93c5fd'}`,
                      cursor:'grab', transition:'transform 0.1s, box-shadow 0.1s',
                    }}
                    onMouseEnter={e => { e.currentTarget.style.transform='scale(1.06)'; e.currentTarget.style.boxShadow='0 4px 14px rgba(0,0,0,0.18)'; }}
                    onMouseLeave={e => { e.currentTarget.style.transform=''; e.currentTarget.style.boxShadow=''; }}
                  >
                    {/* drag-handle dots */}
                    <span style={{ opacity:0.35, fontSize:9, letterSpacing:'-1px', pointerEvents:'none' }}>⠿</span>
                    <span>{r.id}</span>
                    {r.type==='TELE' && <span style={{ color:'#f87171' }}>♥</span>}
                    {r.sitter && <span style={{ fontSize:9, color:'#7c3aed' }}>ST</span>}
                    {/* + assign button */}
                    <button
                      onClick={e => openRoomDropdown(e, r)}
                      title="Assign to nurse"
                      style={{
                        width:18, height:18, borderRadius:4, border:'none', cursor:'pointer', flexShrink:0,
                        display:'flex', alignItems:'center', justifyContent:'center',
                        fontSize:14, lineHeight:1, fontWeight:900,
                        background: active ? (fem?'#be185d':'#1d4ed8') : (fem?'rgba(190,24,93,0.15)':'rgba(29,78,216,0.15)'),
                        color: active ? 'white' : (fem?'#be185d':'#1d4ed8'),
                        transition:'background 0.15s, color 0.15s',

// ── NURSE CARD ────────────────────────────────────────────────────────────────
function NurseCard({ nurse, rooms, allRooms, previewIds, onRemoveAll, onDrop, onRename, onDelete }) {
  const [dragOver, setDragOver] = useState(false);
  const [trashOver, setTrashOver] = useState(false);
  const [editing, setEditing] = useState(false);
  const [nameVal, setNameVal] = useState(nurse.name);
  const inputRef = useRef();

  useEffect(() => { if (editing && inputRef.current) inputRef.current.focus(); }, [editing]);

  const nurseRms = rooms.map(id=>allRooms[id]).filter(Boolean);
  const occ = nurseRms.filter(r=>r.occupied);
  const hasTele = occ.some(r=>r.type==='TELE');
  const cap = hasTele ? 4 : 5;
  const pct = Math.min((occ.length/cap)*100, 100);
  const capColor = pct>=100 ? '#ef4444' : pct>=75 ? '#f59e0b' : '#22c55e';

  const flagDefs = [
    { key:'glucose',    label:'BG', color:'#16a34a' },
    { key:'totalCare',  label:'TC', color:'#be123c' },
    { key:'drip',       label:'IV', color:'#0891b2' },
    { key:'prisoner',   label:'🔒', color:'#b45309' },
    { key:'highAcuity', label:'HA', color:'#ea580c' },
  ];

  const incomingPreview = dragOver
    ? (previewIds||[]).filter(id => !rooms.includes(id) && allRooms[id]?.occupied)
    : [];

  return (
    <div
      className={`nurse-card${dragOver&&!trashOver?' drag-over':''}`}
      onDragOver={e=>{ e.preventDefault(); if(!trashOver) setDragOver(true); }}
      onDragLeave={e=>{ if(!e.currentTarget.contains(e.relatedTarget)) setDragOver(false); }}
      onDrop={e=>{ e.preventDefault(); setDragOver(false); onDrop(e,false); }}
    >
      {/* Header row */}
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6 }}>
        <div className="nurse-color-dot" style={{ background:nurse.color }}/>
        {editing ? (
          <input ref={inputRef} type="text" value={nameVal}
            onChange={e=>setNameVal(e.target.value)}
            onBlur={()=>{ onRename(nameVal); setEditing(false); }}
            onKeyDown={e=>{ if(e.key==='Enter'){onRename(nameVal);setEditing(false);} }}
            style={{ flex:1, padding:'2px 6px', fontSize:13 }}
          />
        ) : (
          <span style={{ flex:1, fontWeight:700, fontSize:13, cursor:'text', color:'var(--text-1)' }}
            onDoubleClick={()=>{ setNameVal(nurse.name); setEditing(true); }}>
            {nurse.name}
          </span>
        )}
        <span style={{ fontSize:11, color:'var(--text-4)', fontWeight:600 }}>{occ.length}/{cap}</span>
        {hasTele && <span style={{ fontSize:10, background:'#7f1d1d', color:'#fca5a5', borderRadius:4, padding:'1px 5px' }}>TELE</span>}
        <div className={`trash-zone${trashOver?' drag-over':''}`}
          onDragOver={e=>{ e.preventDefault(); e.stopPropagation(); setTrashOver(true); setDragOver(false); }}
          onDragLeave={()=>setTrashOver(false)}
          onDrop={e=>{ e.preventDefault(); e.stopPropagation(); setTrashOver(false); setDragOver(false); onDrop(e,true); }}
          onClick={onDelete}
          title="Drop room here to remove · Click to delete nurse"
        >🗑</div>
      </div>

      {/* Capacity bar */}
      <div className="cap-bar">
        <div className="cap-fill" style={{ width:pct+'%', background:capColor }}/>
      </div>

      {/* Flag pills */}
      <div style={{ display:'flex', gap:3, marginTop:5, flexWrap:'wrap' }}>
        {flagDefs.map(f=>{
          const c = occ.filter(r=>r[f.key]).length;
          if(!c) return null;
          return <span key={f.key} style={{ fontSize:9, padding:'1px 5px', borderRadius:4, fontWeight:700,
            background: c>=2?f.color:'var(--bg-base)', color: c>=2?'white':'var(--text-3)', border:`1px solid ${f.color}` }}>
            {c} {f.label}
          </span>;
        })}
      </div>

      {/* Room badges */}
      <div style={{ display:'flex', flexWrap:'wrap', marginTop:6, gap:3, minHeight:10 }}>
        {rooms.map(id=>{
          const r = allRooms[id];
          if(!r?.occupied) return null;
          return (
            <NurseBadge key={id} room={r}
              onDragStart={e=>{ e.dataTransfer.setData('badgeRoomId',id); e.dataTransfer.setData('fromNurseId',nurse.id); }}
            />
          );
        })}
        {incomingPreview.map(id=>{
          const r = allRooms[id];
          return (
            <span key={'p'+id} className="badge-preview">
              {id}{r.type==='TELE'&&<span style={{ color:'#f87171',marginLeft:2 }}>♥</span>}
            </span>
          );
        })}
      </div>

      {rooms.length>0 && (
        <button className="btn btn-ghost" onClick={onRemoveAll}
          style={{ fontSize:10, padding:'2px 8px', marginTop:6, width:'100%' }}>
          Remove All Rooms
        </button>
      )}
    </div>
  );
}

// ── CORRIDOR GRID ─────────────────────────────────────────────────────────────
function CorridorGrid({ allRooms, selected, nurses, nurseRooms, dragPreviewIds, onSelect, onDragStart, onDblClick, onAssignNurse, onUnassign, onClearSelection }) {
  const ref = useRef();
  const [dims, setDims] = useState({ w:900, h:580 });

  useEffect(()=>{
    const obs = new ResizeObserver(entries=>{
      const {width,height} = entries[0].contentRect;
      setDims({ w:width, h:height });
    });
    if(ref.current) obs.observe(ref.current);
    return ()=>obs.disconnect();
  },[]);

  const { w, h } = dims;
  const { positions, cw, ch } = getCorridorLayout(w, h);

  const nurseColorMap = {};
  nurses.forEach(n=>(nurseRooms[n.id]||[]).forEach(id=>{ nurseColorMap[id]=n.color; }));

  const PAD=12;
  const rx=PAD, ry=PAD, rw=w-2*PAD-cw, rh=h-2*PAD-ch;

  // Build A/B pair groups for background highlight
  const pairGroups = [];
  ROOM_IDS.forEach((id, i) => {
    if (!id.endsWith('A')) return;
    const bId = id.slice(0,-1) + 'B';
    const bIdx = ROOM_IDS.indexOf(bId);
    if (bIdx < 0) return;
    const aPos = positions[i], bPos = positions[bIdx];
    pairGroups.push({ key: id, aPos, bPos });
  });

  return (
    <div ref={ref} className="corridor-container">
      <div style={{ position:'absolute', inset:0, zIndex:0 }} onClick={onClearSelection}/>
      <svg style={{ position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none' }}>
        <rect x={rx+cw/2} y={ry+ch/2} width={rw} height={rh} rx={18} ry={18} className="corridor-path"/>
      </svg>

      {/* A/B pair grouping backgrounds */}
      {pairGroups.map(({ key, aPos, bPos }) => {
        const INSET = 3;
        const x1 = Math.min(aPos.x, bPos.x) - INSET;
        const y1 = Math.min(aPos.y, bPos.y) - INSET;
        const x2 = Math.max(aPos.x, bPos.x) + cw + INSET;
        const y2 = Math.max(aPos.y, bPos.y) + ch + INSET;
        return (
          <div key={key+'-grp'} style={{
            position:'absolute', left:x1, top:y1, width:x2-x1, height:y2-y1,
            borderRadius:11, zIndex:0, pointerEvents:'none',
            border:'1.5px solid rgba(139,92,246,0.32)',
            background:'rgba(139,92,246,0.07)',
          }}/>
        );
      })}

      {/* Nursing Station center */}
      <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', pointerEvents:'none' }}>
        <div style={{ textAlign:'center', background:'var(--station-bg)', border:'1px solid var(--station-border)', borderRadius:14, padding:'14px 28px', transition:'background 0.25s' }}>
          <div style={{ fontSize:22, fontWeight:800, letterSpacing:'-0.5px', color:'var(--station-label)', opacity:0.9 }}>MED/TELE</div>
          <div style={{ fontSize:11, color:'var(--text-4)', marginTop:2 }}>44 Beds</div>
          <div style={{ fontSize:10, color:'var(--text-5)', marginTop:1 }}>Nursing Station</div>
        </div>
      </div>

      {ROOM_IDS.map((id,i)=>{
        const room = {...allRooms[id], _nurseColor: nurseColorMap[id]};
        return (
          <RoomCard key={id} room={room} pos={positions[i]} cw={cw} ch={ch}
            selected={selected.has(id)}
            nurses={nurses}
            nurseRooms={nurseRooms}
            onSelect={e=>onSelect(id,e)}
            onDragStart={e=>onDragStart(id,e)}
            onDblClick={()=>onDblClick(id)}
            onAssignNurse={nid=>onAssignNurse(id,nid)}
            onUnassign={()=>onUnassign(id)}
          />
        );
      })}

      <div style={{ position:'absolute', bottom:8, right:12, fontSize:9, color:'var(--text-5)' }}>
        Double-click to edit · Click to select · Drag to nurse · hover + to assign
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const _saved = useMemo(loadFromStorage, []);
  const [rooms, setRooms] = useState(()=>mergeRooms(_saved?.rooms));
  const [nurses, setNurses] = useState(()=>_saved?.nurses || DEFAULT_NURSES);
  const [lastSaved, setLastSaved] = useState(()=>_saved?.savedAt || null);
  const [selected, setSelected] = useState(new Set());
  const [editingRoom, setEditingRoom] = useState(null);
  const [toast, setToast] = useState(null);
  const [newNurseName, setNewNurseName] = useState('');
  const [dragRoomIds, setDragRoomIds] = useState([]);
  const [pendingAssignment, setPendingAssignment] = useState(null);
  const [theme, setTheme] = useState(()=>localStorage.getItem('careflow_theme')||'night');
  const toastRef = useRef();
  const autoSaveRef = useRef();
  const colorIdx = useRef(_saved?.nurses?.length ?? DEFAULT_NURSES.length);

  // Apply theme to body
  useEffect(()=>{
    document.body.dataset.theme = theme;
    localStorage.setItem('careflow_theme', theme);
  }, [theme]);

  // Auto-save
  useEffect(()=>{
    clearTimeout(autoSaveRef.current);
    autoSaveRef.current = setTimeout(()=>{
      const savedAt = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ rooms, nurses, savedAt }));
      setLastSaved(savedAt);
    }, 800);
    return ()=>clearTimeout(autoSaveRef.current);
  }, [rooms, nurses]);

  function showToast(msg) {
    setToast(msg);
    clearTimeout(toastRef.current);
    toastRef.current = setTimeout(()=>setToast(null), 3200);
  }

  const nurseRooms = useMemo(()=>{
    const map = {};
    nurses.forEach(n=>{ map[n.id]=[]; });
    Object.values(rooms).forEach(r=>{
      if(r.nurseId && map[r.nurseId]) map[r.nurseId].push(r.id);
    });
    return map;
  }, [rooms, nurses]);

  function selectRoom(id, e) {
    if(!rooms[id].occupied) return;
    e.stopPropagation();
    setSelected(prev=>{
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  }

  useEffect(()=>{
    const h = e => { if(e.key==='Escape') setSelected(new Set()); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  function handleRoomDragStart(id, e) {
    const ids = selected.has(id) ? [...selected] : [id];
    e.dataTransfer.setData('roomIds', JSON.stringify(ids));
    e.dataTransfer.effectAllowed = 'move';
    setDragRoomIds(ids);
  }

  function commitAssign(nurseId, roomIds) {
    setRooms(prev=>{ const n={...prev}; roomIds.forEach(id=>{n[id]={...n[id],nurseId};}); return n; });
    setSelected(new Set());
    setDragRoomIds([]);
    setPendingAssignment(null);
  }

  function tryAssign(nurseId, roomIds) {
    const cand = [...new Set([...(nurseRooms[nurseId]||[]),...roomIds])];
    const err = checkAssignment(nurseId, cand, rooms);
    if(err) {
      setPendingAssignment({ warning: err, onConfirm: ()=>commitAssign(nurseId, roomIds) });
    } else {
      commitAssign(nurseId, roomIds);
    }
  }

  function handleDropOnNurse(nurseId, e, toTrash) {
    const badgeRoomId = e.dataTransfer.getData('badgeRoomId');
    const fromNurseId = e.dataTransfer.getData('fromNurseId');

    if(toTrash && badgeRoomId) {
      setRooms(prev=>({...prev,[badgeRoomId]:{...prev[badgeRoomId],nurseId:null}}));
      return;
    }
    if(toTrash) return;

    if(badgeRoomId && fromNurseId) {
      if(fromNurseId===nurseId) return;
      tryAssign(nurseId, [badgeRoomId]);
      return;
    }

    const rawIds = e.dataTransfer.getData('roomIds');
    if(!rawIds) return;
    const ids = JSON.parse(rawIds);
    const conflicts = [], toAssign = [];
    for(const id of ids) {
      const room = rooms[id];
      if(!room.occupied) continue;
      if(room.nurseId && room.nurseId!==nurseId) {
        conflicts.push(`Room ${id} already assigned to ${nurses.find(n=>n.id===room.nurseId)?.name||'another nurse'}`);
        continue;
      }
      toAssign.push(id);
    }
    if(conflicts.length) showToast('⚠ '+conflicts.join(' · '));
    if(!toAssign.length) return;
    tryAssign(nurseId, toAssign);
  }

  function assignRoomToNurse(roomId, nurseId) {
    const room = rooms[roomId];
    if(!room.occupied) return;
    if(room.nurseId && room.nurseId!==nurseId) {
      showToast(`⚠ Room ${roomId} already assigned to ${nurses.find(n=>n.id===room.nurseId)?.name}`);
      return;
    }
    tryAssign(nurseId, [roomId]);
  }

  function unassignRoom(roomId) {
    setRooms(prev=>({...prev,[roomId]:{...prev[roomId],nurseId:null}}));
  }

  // Drag from the Unassigned panel — reuses the same nurse-card drop handler
  function handleUnassignedDragStart(roomId, e) {
    e.dataTransfer.setData('roomIds', JSON.stringify([roomId]));
    e.dataTransfer.effectAllowed = 'move';
    setDragRoomIds([roomId]);
  }

  function addNurse() {
    const name = newNurseName.trim() || `RN — Nurse ${nurses.length+1}`;
    const color = NURSE_COLORS[colorIdx.current % NURSE_COLORS.length];
    colorIdx.current++;
    setNurses(prev=>[...prev,{id:'n'+Date.now(),name,color}]);
    setNewNurseName('');
  }

  function deleteNurse(nurseId) {
    if(!confirm(`Delete nurse? Rooms will be unassigned.`)) return;
    setNurses(prev=>prev.filter(n=>n.id!==nurseId));
    setRooms(prev=>{ const n={...prev}; Object.keys(n).forEach(id=>{ if(n[id].nurseId===nurseId) n[id]={...n[id],nurseId:null}; }); return n; });
  }

  function removeAllRooms(nurseId) {
    setRooms(prev=>{ const n={...prev}; Object.keys(n).forEach(id=>{ if(n[id].nurseId===nurseId) n[id]={...n[id],nurseId:null}; }); return n; });
  }

  function saveRoom(updated) {
    setRooms(prev=>({...prev,[updated.id]:updated}));
    setEditingRoom(null);
  }

  const [unassignedAnchor, setUnassignedAnchor] = useState(null);
  const unassignedBtnRef = useRef();
  const totalOcc    = Object.values(rooms).filter(r=>r.occupied).length;
  const totalAsg    = Object.values(rooms).filter(r=>r.occupied&&r.nurseId).length;
  const unassignedRooms = Object.values(rooms).filter(r=>r.occupied&&!r.nurseId);
  const totalTele   = Object.values(rooms).filter(r=>r.occupied&&r.type==='TELE').length;
  const totalSitter = Object.values(rooms).filter(r=>r.occupied&&r.sitter).length;

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100vh', overflow:'hidden' }}>
      {/* ── Header ── */}
      <div style={{ background:'var(--bg-panel)', borderBottom:'1px solid var(--border)', padding:'9px 20px', display:'flex', alignItems:'center', gap:16, flexShrink:0, transition:'background 0.25s' }}>
        <div>
          <span style={{ fontSize:21, fontWeight:800, background:'linear-gradient(90deg,#3b82f6,#22c55e)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent' }}>CareFlow</span>
          <span style={{ fontSize:12, color:'var(--text-4)', marginLeft:8 }}>MED/TELE</span>
        </div>
        <div style={{ marginLeft:'auto', display:'flex', gap:16, fontSize:11, color:'var(--text-4)', alignItems:'center' }}>
          <span><b style={{ color:'var(--text-4)' }}>{ROOM_IDS.length - totalOcc}</b> empty</span>
          <span><b style={{ color:'var(--text-1)' }}>{totalOcc}</b> occupied</span>
          <span><b style={{ color:'#22c55e' }}>{totalAsg}</b> assigned</span>
          <span
            ref={unassignedBtnRef}
            onClick={() => setUnassignedAnchor(a => {
              if (a) return null;
              // Use the ref (always valid) instead of e.currentTarget (nulled after event)
              return unassignedBtnRef.current?.getBoundingClientRect() ?? null;
            })}
            style={{ cursor:'pointer', borderBottom:'1px dashed #f59e0b', paddingBottom:1,
              background: unassignedAnchor ? 'rgba(245,158,11,0.12)' : 'transparent',
              borderRadius:4, padding:'1px 5px 2px' }}
            title="Click to toggle unassigned rooms panel">
            <b style={{ color:'#f59e0b' }}>{totalOcc-totalAsg}</b> unassigned
          </span>
          <span style={{ color:'var(--stat-border)' }}>|</span>
          <span><b style={{ color:'#f87171' }}>♥ {totalTele}</b> TELE</span>
          <span><b style={{ color:'#a78bfa' }}>👤 {totalSitter}</b> sitter</span>
          <span style={{ color:'var(--stat-border)' }}>|</span>
          <span>{new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</span>
          {lastSaved && (
            <span style={{ fontSize:10, color:'#22c55e', display:'flex', alignItems:'center', gap:4 }}>
              ✓ saved {new Date(lastSaved).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}
            </span>
          )}
          {/* Theme toggle */}
          <ThemeToggle theme={theme} onToggle={()=>setTheme(t=>t==='night'?'day':'night')}/>
          <button className="btn btn-ghost" onClick={()=>{
            setRooms(prev=>{
              const next={};
              Object.keys(prev).forEach(id=>{
                next[id]={...prev[id], occupied:true, gender:'female', type:'TELE',
                  foley:false, drip:false, prisoner:false, totalCare:false, glucose:false, highAcuity:false, nurseId:null};
              });
              return next;
            });
            setSelected(new Set());
          }} style={{ fontSize:11, padding:'4px 12px', border:'1px solid var(--border-sub)' }}>
            ↺ Reset
          </button>
        </div>
      </div>

      {/* ── Main ── */}
      <div style={{ display:'flex', flex:1, overflow:'hidden' }}>
        {/* Nurse panel */}
        <div className="nurse-panel" style={{ background:'var(--bg-panel)', borderRight:'1px solid var(--border)', display:'flex', flexDirection:'column', overflow:'hidden', transition:'background 0.25s' }}>
          <div style={{ padding:'12px 12px 8px', borderBottom:'1px solid var(--border)' }}>
            <div style={{ fontSize:11, fontWeight:700, color:'var(--text-4)', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:8, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <span>Nursing Staff</span>
              <span style={{ background:'var(--btn-ghost-bg)', color:'var(--btn-ghost-tx)', borderRadius:10, padding:'1px 8px', fontSize:11, fontWeight:700, letterSpacing:0 }}>{nurses.length}</span>
            </div>
            <div style={{ display:'flex', gap:6 }}>
              <input type="text" placeholder="Add nurse name…" value={newNurseName}
                onChange={e=>setNewNurseName(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&addNurse()}
                style={{ flex:1, fontSize:12 }}
              />
              <button className="btn btn-primary" onClick={addNurse} style={{ whiteSpace:'nowrap' }}>+ Add</button>
            </div>
          </div>

          {selected.size>0 && (
            <div style={{ padding:'6px 12px', background:'var(--sel-bar-bg)', borderBottom:'1px solid var(--sel-bar-border)', fontSize:11, color:'var(--sel-bar-text)', display:'flex', alignItems:'center', justifyContent:'space-between', transition:'background 0.25s' }}>
              <span>🔵 {selected.size} room{selected.size>1?'s':''} selected — drag to a nurse</span>
              <button className="btn btn-ghost" onClick={()=>setSelected(new Set())} style={{ fontSize:10, padding:'2px 8px' }}>Clear</button>
            </div>
          )}

          <div style={{ flex:1, overflowY:'auto', padding:12 }}>
            {nurses.length===0 && (
              <div style={{ textAlign:'center', color:'var(--text-4)', fontSize:13, marginTop:40 }}>No nurses added yet</div>
            )}
            {nurses.map(nurse=>(
              <NurseCard key={nurse.id} nurse={nurse}
                rooms={nurseRooms[nurse.id]||[]}
                allRooms={rooms}
                previewIds={dragRoomIds}
                onRemoveAll={()=>removeAllRooms(nurse.id)}
                onDrop={(e,trash)=>handleDropOnNurse(nurse.id,e,trash)}
                onRename={name=>setNurses(prev=>prev.map(n=>n.id===nurse.id?{...n,name}:n))}
                onDelete={()=>deleteNurse(nurse.id)}
              />
            ))}
          </div>

          <div style={{ padding:8, borderTop:'1px solid var(--border)' }}>
            <Legend/>
          </div>
        </div>

        {/* Room grid */}
        <div className="room-panel" style={{ background:'var(--bg-base)', transition:'background 0.25s' }}>
          <CorridorGrid
            allRooms={rooms}
            selected={selected}
            nurses={nurses}
            nurseRooms={nurseRooms}
            dragPreviewIds={dragRoomIds}
            onSelect={selectRoom}
            onDragStart={handleRoomDragStart}
            onDblClick={id=>setEditingRoom(rooms[id])}
            onAssignNurse={assignRoomToNurse}
            onUnassign={unassignRoom}
            onClearSelection={()=>setSelected(new Set())}
          />
        </div>
      </div>

      {unassignedAnchor && (
        <UnassignedPanel
          rooms={unassignedRooms}
          nurses={nurses}
          nurseRooms={nurseRooms}
          onAssign={assignRoomToNurse}
          onDragStart={handleUnassignedDragStart}
          onClose={()=>setUnassignedAnchor(null)}
          anchor={unassignedAnchor}
          triggerRef={unassignedBtnRef}
        />
      )}
      {editingRoom && <PatientModal room={editingRoom} onClose={()=>setEditingRoom(null)} onSave={saveRoom}/>}
      {pendingAssignment && (
        <WarningModal
          warning={pendingAssignment.warning}
          onOverride={pendingAssignment.onConfirm}
          onCancel={()=>setPendingAssignment(null)}
        />
      )}
      {toast && <div className="warn-toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
