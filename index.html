function SwipeRow({ onOpen, onDelete, children }) {
  const cardRef = React.useRef(null);
  const startX  = React.useRef(0);
  const dx       = React.useRef(0);
  const [hovered, setHovered] = React.useState(false);
  const THRESHOLD = 80;
  function onTouchStart(e) {
    startX.current = e.touches[0].clientX;
    dx.current = 0;
    if (cardRef.current) cardRef.current.style.transition = 'none';
  }
  function onTouchMove(e) {
    const d = e.touches[0].clientX - startX.current;
    if (d >= 0) return;
    dx.current = d;
    if (cardRef.current) cardRef.current.style.transform = `translateX(${d}px)`;
  }
  function onTouchEnd() {
    if (dx.current < -THRESHOLD) {
      if (cardRef.current) {
        cardRef.current.style.transition = 'transform 0.18s ease';
        cardRef.current.style.transform = 'translateX(-110%)';
      }
      setTimeout(onDelete, 180);
    } else {
      if (cardRef.current) {
        cardRef.current.style.transition = 'transform 0.22s ease';
        cardRef.current.style.transform = 'translateX(0)';
      }
    }
    dx.current = 0;
  }
  return (
    <div style={{position:'relative',overflow:'hidden',borderRadius:9}}>
      <div style={{position:'absolute',inset:0,background:'rgba(239,68,68,0.82)',display:'flex',alignItems:'center',justifyContent:'flex-end',paddingRight:20,borderRadius:9,pointerEvents:'none'}}>
        <span style={{fontSize:17,color:'#fff'}}>🗑</span>
      </div>
      <div ref={cardRef}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        onMouseEnter={()=>setHovered(true)}
        onMouseLeave={()=>setHovered(false)}
        style={{position:'relative',display:'flex',alignItems:'stretch'}}
      >
        <button onClick={onOpen}
          style={{flex:1,textAlign:'left',padding:'9px 12px',borderRadius:9,cursor:'pointer',
            background:hovered?'rgba(255,255,255,0.09)':'rgba(255,255,255,0.04)',
            border:`1px solid ${hovered?'rgba(255,255,255,0.22)':'rgba(255,255,255,0.09)'}`,
            color:'inherit',transition:'background 0.12s,border-color 0.12s',display:'block',width:'100%'}}
        >
          {children}
        </button>
        {hovered && (
          <button onClick={e=>{e.stopPropagation();onDelete();}}
            style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',
              background:'rgba(239,68,68,0.15)',border:'1px solid rgba(239,68,68,0.3)',
              borderRadius:6,color:'#f87171',fontSize:13,cursor:'pointer',padding:'3px 8px',lineHeight:1,
              transition:'background 0.12s'}}
            onMouseEnter={e=>e.currentTarget.style.background='rgba(239,68,68,0.3)'}
            onMouseLeave={e=>e.currentTarget.style.background='rgba(239,68,68,0.15)'}
          >🗑</button>
        )}
      </div>
    </div>
  );
}

function PolicySearchModal({ onClose }) {
  const [policies, setPolicies]   = useState(() => loadPolicies());
  const [query, setQuery]         = useState('');
  const [results, setResults]     = useState([]);
  const [view, setView]           = useState('search');
  const [viewing, setViewing]     = useState(null);
  const [editing, setEditing]     = useState(null);
  const inputRef = useRef();
  useEffect(() => { setTimeout(() => inputRef.current?.focus(), 80); }, []);

  function doSearch(q) { setResults(q.trim() ? searchPolicies(q, policies) : []); }
  function persistPolicies(next) { setPolicies(next); savePoliciesLS(next); }
  function openPolicy(p) { setViewing(p); setView('read'); }
  function startEdit(p)  { setEditing({...p}); setView('edit'); }
  function startAdd()    {
    setEditing({ id:'', title:'', category:'Other', keywords:[], content:'', source:'manual', lastUpdated: policyToday(), _isNew: true });
    setView('edit');
  }
  function cleanPolicyText(raw) {
    if (!raw) return '';
    // Replace common PDF bullet/symbol encoding artifacts with a real bullet
    let text = raw
      .replace(/%[ÏŸˆ¬Œœ°†‡]/g, '\n• ')
      .replace(/[•·●◦]/g, '\n• ')
      .replace(/\r\n|\r/g, '\n');

    // Normalise whitespace within lines
    text = text.split('\n').map(l => l.replace(/[ \t]+/g, ' ').trim()).join('\n');

    // Drop lone page numbers and boilerplate headers
    text = text
      .replace(/\nPage \d+( of \d+)?\n/gi, '\n')
      .replace(/\nCONFIDENTIAL[^\n]*\n/gi, '\n')
      .replace(/\n\d{1,3}\n/g, '\n');

    // Re-join wrapped lines: lines that don't end in sentence-ending punctuation
    // and whose next line starts lowercase (or continues mid-sentence) are joined.
    const lines = text.split('\n');
    const out = [];
    let buf = '';
    for (const raw of lines) {
      const line = raw.trim();
      if (!line) {
        if (buf) { out.push(buf); buf = ''; }
        out.push('');
        continue;
      }
      const isBullet = /^[•\-–]\s/.test(line) || /^\d+\.\s/.test(line);
      const isAllCaps = line.length > 3 && line === line.toUpperCase() && /[A-Z]/.test(line);
      if (isBullet || isAllCaps) {
        if (buf) out.push(buf);
        buf = line;
      } else if (!buf) {
        buf = line;
      } else {
        const endsPunct = /[.!?:;]\s*$/.test(buf);
        if (endsPunct || isAllCaps) { out.push(buf); buf = line; }
        else { buf += ' ' + line; }
      }
    }
    if (buf) out.push(buf);

    return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  function uploadPolicy(file) {
    const title = file.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
    function finish(rawText) {
      const text = cleanPolicyText(rawText);
      const words = (text||'').toLowerCase().match(/\b[a-z]{4,}\b/g) || [];
      const freq = {}; words.forEach(w => freq[w] = (freq[w]||0)+1);
      const keywords = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([w])=>w);
      setEditing({ id:'', title, category:'Other', keywords, content: text, source: file.name, lastUpdated: policyToday(), _isNew: true });
      setView('edit');
    }
    if (/\.pdf$/i.test(file.name) && window.pdfjsLib) {
      const reader = new FileReader();
      reader.onload = async e => {
        try {
          const pdf = await pdfjsLib.getDocument({data: new Uint8Array(e.target.result)}).promise;
          let text = '';
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            text += content.items.map(s=>s.str).join(' ') + '\n';
          }
          finish(text);
        } catch(err) { finish(''); }
      };
      reader.readAsArrayBuffer(file);
    } else if (/\.(txt|md|csv|text|rtf|log)$/i.test(file.name)) {
      const reader = new FileReader();
      reader.onload = e => finish(e.target.result);
      reader.readAsText(file);
    } else {
      finish(''); // other formats — open edit form with title pre-filled, user pastes content
    }
  }
  function saveEdit() {
    const p = { ...editing, lastUpdated: policyToday() };
    if (!p.id) p.id = p.title.toLowerCase().replace(/[^a-z0-9]/g,'_').slice(0,40);
    if (typeof p.keywords === 'string') p.keywords = p.keywords.split(',').map(k=>k.trim()).filter(Boolean);
    const isNew = p._isNew; delete p._isNew;
    const next = isNew ? [...policies, p] : policies.map(x => x.id === p.id && x.title === p.title ? p : x);
    persistPolicies(next);
    setViewing(p); setView('read');
    if (query) setResults(searchPolicies(query, next));
  }
  function deletePolicy(p) {
    if (!confirm(`Delete "${p.title}"?`)) return;
    const next = policies.filter(x => !(x.id === p.id && x.title === p.title));
    persistPolicies(next);
    setView('search'); setEditing(null);
    if (query) setResults(searchPolicies(query, next));
  }
  function resetToDefault() {
    if (!confirm('Reset all policies to the built-in defaults? Your edits will be lost.')) return;
    persistPolicies(POLICY_DB_DEFAULT);
    setView('search'); setResults([]); setQuery('');
  }

  // ── PDF generator ──
  function generatePolicyPdf(policy) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'letter' });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 48;
    const contentW = pageW - margin * 2;
    let y = margin;

    // Header bar
    doc.setFillColor(37, 99, 235);
    doc.rect(0, 0, pageW, 56, 'F');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.setTextColor(255, 255, 255);
    doc.text('CAREFLOW POLICY DOCUMENT', margin, 24);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.text('CONFIDENTIAL — FOR INTERNAL USE ONLY', margin, 38);
    y = 80;

    // Category pill background
    doc.setFillColor(219, 234, 254);
    const catLabel = policy.category || 'General';
    doc.setFontSize(8);
    const catW = doc.getTextWidth(catLabel) + 16;
    doc.roundedRect(margin, y, catW, 16, 4, 4, 'F');
    doc.setTextColor(29, 78, 216);
    doc.setFont('helvetica', 'bold');
    doc.text(catLabel, margin + 8, y + 11);
    y += 30;

    // Title
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(18);
    doc.setTextColor(15, 23, 42);
    const titleLines = doc.splitTextToSize(policy.title || 'Untitled Policy', contentW);
    doc.text(titleLines, margin, y);
    y += titleLines.length * 22 + 6;

    // Meta line
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(100, 116, 139);
    const metaParts = [];
    if (policy.lastUpdated) metaParts.push(`Updated: ${policy.lastUpdated}`);
    if (policy.source)      metaParts.push(`Source: ${policy.source}`);
    if (metaParts.length) { doc.text(metaParts.join('   ·   '), margin, y); y += 14; }

    // Keywords
    if (policy.keywords && policy.keywords.length) {
      const kw = (Array.isArray(policy.keywords) ? policy.keywords : policy.keywords.split(',').map(k=>k.trim())).join(', ');
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(8.5);
      doc.setTextColor(71, 85, 105);
      const kwLines = doc.splitTextToSize(`Keywords: ${kw}`, contentW);
      doc.text(kwLines, margin, y);
      y += kwLines.length * 12 + 4;
    }

    // Divider
    y += 8;
    doc.setDrawColor(203, 213, 225);
    doc.setLineWidth(0.75);
    doc.line(margin, y, pageW - margin, y);
    y += 18;

    // Content
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10.5);
    doc.setTextColor(30, 41, 59);
    const content = policy.content || '(No content available)';
    const lines = doc.splitTextToSize(content, contentW);
    const lineH = 15;
    for (const line of lines) {
      if (y + lineH > pageH - margin) {
        doc.addPage();
        y = margin;
        // page top border
        doc.setFillColor(37, 99, 235);
        doc.rect(0, 0, pageW, 4, 'F');
        y += 12;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10.5);
        doc.setTextColor(30, 41, 59);
      }
      doc.text(line, margin, y);
      y += lineH;
    }

    // Footer on each page
    const totalPages = doc.internal.getNumberOfPages();
    for (let i = 1; i <= totalPages; i++) {
      doc.setPage(i);
      doc.setFillColor(248, 250, 252);
      doc.rect(0, pageH - 32, pageW, 32, 'F');
      doc.setDrawColor(226, 232, 240);
      doc.setLineWidth(0.5);
      doc.line(0, pageH - 32, pageW, pageH - 32);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7.5);
      doc.setTextColor(148, 163, 184);
      doc.text('CareFlow — Charge Nurse Assignment System', margin, pageH - 12);
      doc.text(`Page ${i} of ${totalPages}`, pageW - margin, pageH - 12, { align: 'right' });
    }

    return doc.output('bloburi');
  }

  // ── Read view ──
  function ReadView({ policy }) {
    const [pdfUrl, setPdfUrl] = React.useState(null);
    const printFrameRef = React.useRef();
    React.useEffect(() => {
      let url = null;
      try { url = generatePolicyPdf(policy); } catch(e) { console.warn('PDF gen failed', e); }
      setPdfUrl(url);
      return () => { if (url) URL.revokeObjectURL(url); };
    }, [policy.id, policy.title, policy.content]);

    function handlePrint() {
      const frame = printFrameRef.current;
      try {
        if (frame && frame.contentWindow) {
          frame.contentWindow.focus();
          frame.contentWindow.print();
          return;
        }
      } catch(e) { console.warn('Print via iframe failed', e); }
      // Fallback: open in a new tab and let the user print from there
      if (pdfUrl) window.open(pdfUrl, '_blank');
    }

    return (
      <>
        <div style={{position:'fixed',inset:0,zIndex:299,background:'rgba(0,0,0,0.25)'}} onClick={onClose}/>
        <div style={{position:'fixed',right:0,top:0,bottom:0,zIndex:300,
          width:'calc(50vw)',minWidth:480,
          background:'#ffffff',borderLeft:'1px solid #e2e8f0',
          display:'flex',flexDirection:'column',padding:'16px 20px 12px',
          boxShadow:'-10px 0 40px rgba(0,0,0,0.35)'}}>
          {/* Header */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,flexShrink:0}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <button onClick={()=>setView('search')}
                style={{fontSize:12,padding:'5px 12px',borderRadius:7,border:'1px solid #e2e8f0',
                  background:'#f8fafc',color:'#475569',cursor:'pointer',fontWeight:600}}>← Back</button>
              <span style={{fontSize:10,background:'#dbeafe',color:'#1d4ed8',borderRadius:5,
                padding:'3px 10px',fontWeight:700}}>{policy.category}</span>
            </div>
            <div style={{display:'flex',gap:6,flexShrink:0}}>
              <button onClick={handlePrint} disabled={!pdfUrl}
                style={{fontSize:12,padding:'5px 12px',borderRadius:7,border:'1px solid #e2e8f0',
                  background:'#f8fafc',color:'#475569',cursor: pdfUrl ? 'pointer' : 'not-allowed',
                  fontWeight:600, opacity: pdfUrl ? 1 : 0.5}}>🖶 Print</button>
              <button onClick={()=>startEdit(policy)}
                style={{fontSize:12,padding:'5px 12px',borderRadius:7,border:'1px solid #e2e8f0',
                  background:'#f8fafc',color:'#475569',cursor:'pointer',fontWeight:600}}>✏ Edit</button>
              <button onClick={onClose}
                style={{fontSize:13,padding:'5px 10px',borderRadius:7,border:'1px solid #e2e8f0',
                  background:'#f8fafc',color:'#475569',cursor:'pointer',fontWeight:700}}>✕</button>
            </div>
          </div>
          {/* PDF iframe */}
          <div style={{flex:1,borderRadius:10,overflow:'hidden',border:'1px solid #e2e8f0',background:'#f1f5f9'}}>
            {pdfUrl
              ? <iframe ref={printFrameRef} src={pdfUrl} style={{width:'100%',height:'100%',border:'none',display:'block'}} title={policy.title}/>
              : <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',
                  color:'#94a3b8',fontSize:13}}>Generating PDF…</div>
            }
          </div>
        </div>
      </>
    );
  }

  if (view === 'read' && viewing) return <ReadView policy={viewing} />;

  // ── Edit view ──
  if (view === 'edit' && editing) return (
    <PolicyDrawer onClose={onClose}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <h2 style={{margin:0,fontSize:16,fontWeight:700,color:'var(--text-1)'}}>{editing._isNew?'+ New Policy':'✏ Edit Policy'}</h2>
        <button className="btn btn-ghost" onClick={onClose}>✕</button>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:10,overflowY:'auto',flex:1}}>
        {[['Title','title'],['Source / reference','source']].map(([lbl,key])=>(
          <label key={key} style={{display:'flex',flexDirection:'column',gap:4}}>
            <span style={{fontSize:11,color:'var(--text-3)',fontWeight:600}}>{lbl}</span>
            <input value={editing[key]||''} onChange={e=>setEditing(p=>({...p,[key]:e.target.value}))}
              style={{padding:'8px 12px',borderRadius:8,border:'1px solid rgba(255,255,255,0.15)',background:'rgba(255,255,255,0.06)',color:'var(--text-1)',fontSize:13}}/>
          </label>
        ))}
        <label style={{display:'flex',flexDirection:'column',gap:4}}>
          <span style={{fontSize:11,color:'var(--text-3)',fontWeight:600}}>Category</span>
          <select value={editing.category||'Other'} onChange={e=>setEditing(p=>({...p,category:e.target.value}))}
            style={{padding:'8px 12px',borderRadius:8,border:'1px solid rgba(255,255,255,0.15)',background:'rgba(30,30,42,1)',color:'var(--text-1)',fontSize:13}}>
            {POLICY_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </label>
        <label style={{display:'flex',flexDirection:'column',gap:4}}>
          <span style={{fontSize:11,color:'var(--text-3)',fontWeight:600}}>Keywords <span style={{fontWeight:400,opacity:.6}}>(comma-separated)</span></span>
          <input value={Array.isArray(editing.keywords)?editing.keywords.join(', '):editing.keywords||''}
            onChange={e=>setEditing(p=>({...p,keywords:e.target.value}))}
            style={{padding:'8px 12px',borderRadius:8,border:'1px solid rgba(255,255,255,0.15)',background:'rgba(255,255,255,0.06)',color:'var(--text-1)',fontSize:13}}/>
        </label>
        <label style={{display:'flex',flexDirection:'column',gap:4,flex:1}}>
          <span style={{fontSize:11,color:'var(--text-3)',fontWeight:600}}>Content</span>
          <textarea value={editing.content||''} onChange={e=>setEditing(p=>({...p,content:e.target.value}))}
            rows={10} style={{padding:'10px 12px',borderRadius:8,border:'1px solid rgba(255,255,255,0.15)',
            background:'rgba(255,255,255,0.06)',color:'var(--text-1)',fontSize:12,lineHeight:1.6,resize:'vertical',fontFamily:'inherit'}}/>
        </label>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',marginTop:14,paddingTop:12,borderTop:'1px solid rgba(255,255,255,0.08)'}}>
        {!editing._isNew
          ? <button className="btn btn-ghost" style={{color:'#f87171',borderColor:'rgba(248,113,113,0.3)'}} onClick={()=>deletePolicy(editing)}>🗑 Delete</button>
          : <div/>}
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-ghost" onClick={()=>setView(editing._isNew?'search':'read')}>Cancel</button>
          <button className="btn btn-primary" onClick={saveEdit}>Save</button>
        </div>
      </div>
    </PolicyDrawer>
  );

  // ── Manage view ──
  if (view === 'manage') return (
    <PolicyDrawer onClose={onClose}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <button className="btn btn-ghost" style={{fontSize:12,padding:'4px 10px'}} onClick={()=>setView('search')}>← Back</button>
          <h2 style={{margin:0,fontSize:16,fontWeight:700,color:'var(--text-1)'}}>Manage Policies</h2>
        </div>
        <button className="btn btn-ghost" onClick={onClose}>✕</button>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <span style={{fontSize:12,color:'var(--text-4)'}}>{policies.length} policies</span>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-ghost" style={{fontSize:11,color:'#fbbf24'}} onClick={resetToDefault}>↺ Reset</button>
          <label className="btn btn-ghost" style={{fontSize:12,cursor:'pointer'}} title="Upload any file — PDF and TXT content extracted automatically">
            ⬆ Upload
            <input type="file" style={{display:'none'}}
              onChange={e=>{const f=e.target.files[0];if(f)uploadPolicy(f);e.target.value='';}}/>
          </label>
          <button className="btn btn-primary" style={{fontSize:12}} onClick={startAdd}>+ Add</button>
        </div>
      </div>
      <div style={{overflowY:'auto',flex:1,display:'flex',flexDirection:'column',gap:5}}>
        {[...policies].sort((a,b)=>a.category.localeCompare(b.category)||a.title.localeCompare(b.title)).map((p,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 12px',
            borderRadius:8,background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.07)'}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12,fontWeight:700,color:'var(--text-1)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.title}</div>
              <div style={{fontSize:10,color:'var(--text-4)'}}>{p.category}</div>
            </div>
            <button className="btn btn-ghost" style={{fontSize:11,padding:'3px 10px',flexShrink:0}} onClick={()=>startEdit(p)}>Edit</button>
          </div>
        ))}
      </div>
    </PolicyDrawer>
  );

  // ── Search view (default) ──
  return (
    <PolicyDrawer onClose={onClose}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <h2 style={{margin:0,fontSize:16,fontWeight:800,color:'var(--text-1)'}}>🐼 Policy Search</h2>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-ghost" style={{fontSize:11}} onClick={()=>setView('manage')}>⚙ Manage</button>
          <button className="btn btn-ghost" onClick={onClose}>✕</button>
        </div>
      </div>
      <div style={{position:'relative',marginBottom:12}}>
        <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',fontSize:14,pointerEvents:'none',opacity:.5}}>🔍</span>
        <input ref={inputRef} type="text"
          placeholder={`Search ${policies.length} policies…`}
          value={query}
          onChange={e=>{ setQuery(e.target.value); doSearch(e.target.value); }}
          onKeyDown={e=>{ if(e.key==='Escape') onClose(); }}
          style={{width:'100%',boxSizing:'border-box',padding:'10px 14px 10px 34px',borderRadius:10,
            border:'1px solid rgba(255,255,255,0.18)',background:'rgba(255,255,255,0.07)',
            color:'var(--text-1)',fontSize:13,outline:'none'}}
        />
      </div>
      {!query && (
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',color:'var(--text-4)',gap:10,paddingBottom:20}}>
          <div style={{fontSize:36}}>🐼</div>
          <div style={{fontSize:13,fontWeight:700,color:'var(--text-2)'}}>Policy Monkey is ready!</div>
          <div style={{fontSize:11,textAlign:'center',lineHeight:1.8,maxWidth:300,opacity:.8}}>
            Type to search <strong style={{color:'var(--text-2)'}}>{policies.length}</strong> unit policies.<br/>
            fall · transfusion · c.diff · central line · MEWS
          </div>
        </div>
      )}
      {query && results.length === 0 && (
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',color:'var(--text-4)',gap:8}}>
          <div style={{fontSize:28}}>🙈</div>
          <div style={{fontSize:12}}>No match for <strong style={{color:'var(--text-2)'}}>{query}</strong></div>
          <button className="btn btn-ghost" style={{fontSize:11,marginTop:6}} onClick={startAdd}>+ Add policy</button>
        </div>
      )}
      {results.length > 0 && (
        <div style={{overflowY:'auto',flex:1,display:'flex',flexDirection:'column',gap:5}}>
          <div style={{fontSize:10,color:'var(--text-4)',marginBottom:2}}>{results.length} result{results.length!==1?'s':''} for "{query}"</div>
          {results.map((p,i)=>(
            <SwipeRow key={i}
              onOpen={()=>openPolicy(p)}
              onDelete={()=>{
                const next = policies.filter(x=>!(x.id===p.id&&x.title===p.title));
                persistPolicies(next);
                setResults(searchPolicies(query, next));
              }}
            >
              <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:3}}>
                <span style={{fontSize:12,fontWeight:700,color:'var(--text-1)',flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.title}</span>
                <span style={{fontSize:9,background:'rgba(59,130,246,0.18)',color:'#93c5fd',borderRadius:4,padding:'2px 6px',fontWeight:600,flexShrink:0,whiteSpace:'nowrap'}}>{p.category}</span>
              </div>
              {p.content && (
                <div style={{fontSize:11,color:'var(--text-3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {p.content.slice(0,120)}
                </div>
              )}
            </SwipeRow>
          ))}
        </div>
      )}
    </PolicyDrawer>
  );
}

// ── PHONE DIRECTORY MODAL ─────────────────────────────────────────────────────
const PD_TABS = [
  { key:'internal',   label:'📋 Internal',      cols:['dept','phone','ext','notes'],         headers:['Department / Person','Direct Phone #','Extension','Notes'] },
  { key:'external',   label:'🌐 External',       cols:['name','phone','notes'],               headers:['Name / Service','Phone Number','Notes'] },
  { key:'quickNotes', label:'📌 Quick Notes',    cols:['note','detail'],                      headers:['Note','Detail'] },
];

function PhoneDirectory({ onClose }) {
  const [data,     setData]    = React.useState(() => loadPhoneDir());
  const [tab,      setTab]     = React.useState('internal');
  const [search,   setSearch]  = React.useState('');
  const [editing,  setEditing] = React.useState(null); // {id, col}
  const [editVal,  setEditVal] = React.useState('');
  const inputRef = React.useRef();

  React.useEffect(() => { if (editing && inputRef.current) inputRef.current.focus(); }, [editing]);

  const tabDef = PD_TABS.find(t => t.key === tab);
  const rows   = data[tab] || [];
  const q      = search.toLowerCase();
  const visible = q
    ? rows.filter(r => tabDef.cols.some(c => (r[c]||'').toLowerCase().includes(q)))
    : rows;

  function persist(next) { setData(next); savePhoneDir(next); }

  function startEdit(id, col, val) { setEditing({id,col}); setEditVal(val||''); }
  function commitEdit() {
    if (!editing) return;
    persist({ ...data, [tab]: data[tab].map(r => r.id===editing.id ? {...r,[editing.col]:editVal} : r) });
    setEditing(null);
  }

  function addRow() {
    const blank = Object.fromEntries([['id',pdId()], ...tabDef.cols.map(c=>[c,''])]);
    const next = { ...data, [tab]: [...data[tab], blank] };
    persist(next);
    // auto-edit first col of new row
    setEditing({ id: blank.id, col: tabDef.cols[0] }); setEditVal('');
  }
  function deleteRow(id) { persist({ ...data, [tab]: data[tab].filter(r => r.id !== id) }); }

  function resetToSeed() {
    if (!window.confirm('Reset this tab to the original directory data?')) return;
    persist({ ...data, [tab]: PHONE_DIR_SEED[tab] });
  }

  const cellStyle = { padding:'6px 10px', borderBottom:'1px solid var(--border-sub)', fontSize:12, color:'var(--text-1)', verticalAlign:'middle' };
  const hdrStyle  = { padding:'7px 10px', fontWeight:700, fontSize:11, textTransform:'uppercase', letterSpacing:'0.06em',
                      color:'var(--text-3)', borderBottom:'2px solid var(--border)', background:'var(--bg-panel)', position:'sticky', top:0, zIndex:2 };

  return ReactDOM.createPortal(
    <div style={{ position:'fixed', inset:0, zIndex:900, display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(0,0,0,0.55)', backdropFilter:'blur(4px)' }}
         onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div style={{ width:'min(860px,96vw)', height:'min(680px,92vh)', background:'var(--modal-bg)', borderRadius:18,
                    display:'flex', flexDirection:'column', boxShadow:'0 24px 72px rgba(0,0,0,0.55)', overflow:'hidden' }}>

        {/* Header */}
        <div style={{ padding:'14px 18px 0', background:'var(--bg-panel)', borderBottom:'1px solid var(--border)', flexShrink:0 }}>
          <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:10 }}>
            <span style={{ fontSize:20 }}>📞</span>
            <span style={{ fontWeight:800, fontSize:16, color:'var(--text-1)', flex:1 }}>Hospital Phone Directory</span>
            {/* Search */}
            <div style={{ display:'flex', alignItems:'center', gap:6, background:'var(--bg-base)', border:'1px solid var(--border-sub)', borderRadius:8, padding:'4px 10px' }}>
              <span style={{ opacity:0.45, fontSize:13 }}>🔍</span>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…"
                style={{ border:'none', background:'transparent', fontSize:12, color:'var(--text-1)', width:160, outline:'none' }}/>
              {search && <button onClick={()=>setSearch('')} style={{ border:'none',background:'transparent',cursor:'pointer',color:'var(--text-4)',fontSize:12 }}>✕</button>}
            </div>
            <button onClick={onClose} style={{ background:'transparent',border:'none',fontSize:18,cursor:'pointer',color:'var(--text-3)',lineHeight:1,padding:'2px 4px' }}>✕</button>
          </div>
          {/* Tabs */}
          <div style={{ display:'flex', gap:2 }}>
            {PD_TABS.map(t=>(
              <button key={t.key} onClick={()=>{ setTab(t.key); setSearch(''); setEditing(null); }}
                style={{ padding:'7px 14px', border:'none', borderRadius:'8px 8px 0 0', cursor:'pointer', fontSize:12, fontWeight:tab===t.key?700:500,
                  background: tab===t.key ? 'var(--modal-bg)' : 'transparent',
                  color: tab===t.key ? 'var(--text-1)' : 'var(--text-3)',
                  borderBottom: tab===t.key ? '2px solid var(--accent)' : '2px solid transparent',
                }}>
                {t.label} <span style={{ fontSize:10, opacity:0.6 }}>({data[t.key]?.length||0})</span>
              </button>
            ))}
          </div>
        </div>

        {/* Table */}
        <div style={{ flex:1, overflowY:'auto' }}>
          <table style={{ width:'100%', borderCollapse:'collapse' }}>
            <thead>
              <tr>
                {tabDef.headers.map((h,i)=><th key={i} style={hdrStyle}>{h}</th>)}
                <th style={{...hdrStyle, width:36}}/>
              </tr>
            </thead>
            <tbody>
              {visible.length === 0 && (
                <tr><td colSpan={tabDef.cols.length+1} style={{ textAlign:'center', padding:32, color:'var(--text-4)', fontSize:13 }}>
                  {search ? 'No matches' : 'No entries yet'}
                </td></tr>
              )}
              {visible.map(row=>(
                <tr key={row.id} style={{ transition:'background 0.1s' }}
                  onMouseEnter={e=>e.currentTarget.style.background='var(--bg-panel)'}
                  onMouseLeave={e=>e.currentTarget.style.background=''}>
                  {tabDef.cols.map(col=>(
                    <td key={col} style={cellStyle} onClick={()=>startEdit(row.id,col,row[col])}>
                      {editing?.id===row.id && editing?.col===col
                        ? <input ref={inputRef} value={editVal} onChange={e=>setEditVal(e.target.value)}
                            onBlur={commitEdit}
                            onKeyDown={e=>{ if(e.key==='Enter') commitEdit(); if(e.key==='Escape'){setEditing(null);} }}
                            style={{ width:'100%', border:'1px solid var(--accent)', borderRadius:4, padding:'2px 6px', fontSize:12,
                              background:'var(--bg-base)', color:'var(--text-1)', outline:'none' }}/>
                        : <span style={{ display:'block', minHeight:18, cursor:'text',
                            color: row[col] ? 'var(--text-1)' : 'var(--text-4)',
                            fontFamily: (col==='ext'||col==='phone'||col==='detail') ? 'monospace' : 'inherit',
                          }}>{row[col] || (editing ? '' : '—')}</span>
                      }
                    </td>
                  ))}
                  <td style={{...cellStyle, textAlign:'center', padding:'4px 6px'}}>
                    <button onClick={()=>deleteRow(row.id)} title="Delete row"
                      style={{ background:'transparent',border:'none',cursor:'pointer',color:'var(--text-4)',fontSize:13,lineHeight:1,
                        padding:'2px 4px', borderRadius:4, transition:'color 0.15s' }}
                      onMouseEnter={e=>e.currentTarget.style.color='#ef4444'}
                      onMouseLeave={e=>e.currentTarget.style.color=''}>✕</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        {/* Footer */}
        <div style={{ padding:'10px 16px', borderTop:'1px solid var(--border)', display:'flex', gap:8, alignItems:'center', background:'var(--bg-panel)', flexShrink:0 }}>
          <button onClick={addRow} style={{ display:'flex',alignItems:'center',gap:6,padding:'6px 14px',borderRadius:8,border:'none',cursor:'pointer',
            background:'var(--accent)',color:'#fff',fontWeight:700,fontSize:12 }}>
            + Add Row
          </button>
          <span style={{ flex:1, fontSize:11, color:'var(--text-4)' }}>Click any cell to edit · Changes auto-save</span>
          <button onClick={resetToSeed} style={{ padding:'5px 12px',borderRadius:8,border:'1px solid var(--border-sub)',cursor:'pointer',
            background:'transparent',color:'var(--text-3)',fontSize:11 }}>↺ Reset tab</button>
        </div>
      </div>
    </div>,
    document.body
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const _saved = useMemo(loadFromStorage, []);
  const [rooms, setRooms] = useState(()=>mergeRooms(_saved?.rooms));
  const [nurses, setNurses] = useState(()=>_saved?.nurses || DEFAULT_NURSES);
  const [lastSaved, setLastSaved] = useState(()=>_saved?.savedAt || null);
  const [selected, setSelected] = useState(new Set());
  const [lockedNurses, setLockedNurses] = useState(new Set()); // nurse IDs whose assignments are protected from Zap reset
  const [editingRoom, setEditingRoom] = useState(null);
  const [toast, setToast] = useState(null);
  const [newNurseName, setNewNurseName] = useState('');
  const [dragRoomIds, setDragRoomIds] = useState([]);
  const [pendingAssignment, setPendingAssignment] = useState(null);
  const [theme, setTheme] = useState(()=>localStorage.getItem('careflow_theme')||'night');
  const [zapLoading,       setZapLoading]       = useState(false);
  const [phoneDir,         setPhoneDir]         = useState(false);
  const [exportSheetOpen,  setExportSheetOpen]  = useState(false);
  const [policySearchOpen, setPolicySearchOpen] = useState(false);
  const [rosterBuilderOpen, setRosterBuilderOpen] = useState(false);
  const [fuelMode, setFuelMode] = useState(false);
  const [feedbackStore, setFeedbackStore] = useState(() => loadFB());
  const [zapFeedbackNurses, setZapFeedbackNurses] = useState(new Set()); // Set of nurseIds awaiting per-nurse feedback
  const toastRef = useRef();
  const autoSaveRef = useRef();
  const colorIdx = useRef(_saved?.nurses?.length ?? DEFAULT_NURSES.length);

  // ── Feedback handlers (per-nurse) ─────────────────────────────────────────
  function handleFeedbackGood(nurseId) {
    setFeedbackStore(prev => {
      const weights = { ...prev.weights };
      // Nudge every weight 8% back toward 1.0 (baseline relaxation)
      Object.keys(weights).forEach(k => { weights[k] = +(weights[k] * 0.92 + 1.0 * 0.08).toFixed(3); });
      const entry = { ts: Date.now(), rating:'good', nurseId, reason:null };
      const next = { entries:[...prev.entries.slice(-99), entry], weights };
      saveFB(next); return next;
    });
    setZapFeedbackNurses(prev => { const s = new Set(prev); s.delete(nurseId); return s; });
  }
  function handleFeedbackBad(nurseId, reason) {
    setFeedbackStore(prev => {
      const weights = { ...prev.weights };
      const BOOST = 1.28, CAP = 4.0;
      if (reason === 'spread')   weights.diam        = +Math.min(weights.diam        * BOOST, CAP).toFixed(3);
      if (reason === 'load')     weights.load        = +Math.min(weights.load        * BOOST, CAP).toFixed(3);
      if (reason === 'heavy')    weights.acuity      = +Math.min(weights.acuity      * BOOST, CAP).toFixed(3);
      if (reason === 'mix')      weights.teleCluster = +Math.min(weights.teleCluster * BOOST, CAP).toFixed(3);
      if (reason === 'cluster')  weights.diam        = +Math.min(weights.diam        * BOOST * BOOST, CAP).toFixed(3);
      const entry = { ts: Date.now(), rating:'bad', nurseId, reason };
      const next = { entries:[...prev.entries.slice(-99), entry], weights };
      saveFB(next); return next;
    });
    setZapFeedbackNurses(prev => { const s = new Set(prev); s.delete(nurseId); return s; });
  }

  // Apply theme to body
  useEffect(()=>{
    document.body.dataset.theme = theme;
    localStorage.setItem('careflow_theme', theme);
  }, [theme]);

  // Auto-save
  useEffect(()=>{
    clearTimeout(autoSaveRef.current);
    autoSaveRef.current = setTimeout(()=>{
      const savedAt = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ rooms, nurses, savedAt }));
      setLastSaved(savedAt);
    }, 800);
    return ()=>clearTimeout(autoSaveRef.current);
  }, [rooms, nurses]);

  function showToast(msg) {
    setToast(msg);
    clearTimeout(toastRef.current);
    toastRef.current = setTimeout(()=>setToast(null), 3200);
  }

  const nurseRooms = useMemo(()=>{
    const map = {};
    nurses.forEach(n=>{ map[n.id]=[]; });
    Object.values(rooms).forEach(r=>{
      if(r.nurseId && map[r.nurseId]) map[r.nurseId].push(r.id);
    });
    return map;
  }, [rooms, nurses]);

  function selectRoom(id, e) {
    if(!rooms[id].occupied) return;
    e.stopPropagation();
    setSelected(prev=>{
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  }

  useEffect(()=>{
    const h = e => { if(e.key==='Escape') setSelected(new Set()); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  function handleRoomDragStart(id, e) {
    const ids = selected.has(id) ? [...selected] : [id];
    e.dataTransfer.setData('roomIds', JSON.stringify(ids));
    e.dataTransfer.effectAllowed = 'move';
    setDragRoomIds(ids);
  }

  function commitAssign(nurseId, roomIds) {
    setRooms(prev=>{ const n={...prev}; roomIds.forEach(id=>{n[id]={...n[id],nurseId};}); return n; });
    setSelected(new Set());
    setDragRoomIds([]);
    setPendingAssignment(null);
  }

  function tryAssign(nurseId, roomIds) {
    const cand = [...new Set([...(nurseRooms[nurseId]||[]),...roomIds])];
    const err = checkAssignment(nurseId, cand, rooms);
    if(err) {
      setPendingAssignment({ warning: err, onConfirm: ()=>commitAssign(nurseId, roomIds) });
    } else {
      commitAssign(nurseId, roomIds);
    }
  }

  function handleDropOnNurse(nurseId, e, toTrash) {
    const badgeRoomId = e.dataTransfer.getData('badgeRoomId');
    const fromNurseId = e.dataTransfer.getData('fromNurseId');

    if(toTrash && badgeRoomId) {
      setRooms(prev=>({...prev,[badgeRoomId]:{...prev[badgeRoomId],nurseId:null}}));
      return;
    }
    if(toTrash) return;

    if(badgeRoomId && fromNurseId) {
      if(fromNurseId===nurseId) return;
      tryAssign(nurseId, [badgeRoomId]);
      return;
    }

    const rawIds = e.dataTransfer.getData('roomIds');
    if(!rawIds) return;
    const ids = JSON.parse(rawIds);
    const conflicts = [], toAssign = [];
    for(const id of ids) {
      const room = rooms[id];
      if(!room.occupied) continue;
      if(room.nurseId && room.nurseId!==nurseId) {
        conflicts.push(`Room ${id} already assigned to ${nurses.find(n=>n.id===room.nurseId)?.name||'another nurse'}`);
        continue;
      }
      toAssign.push(id);
    }
    if(conflicts.length) showToast('⚠ '+conflicts.join(' · '));
    if(!toAssign.length) return;
    tryAssign(nurseId, toAssign);
  }

  function assignRoomToNurse(roomId, nurseId) {
    const room = rooms[roomId];
    if(!room.occupied) return;
    if(room.nurseId && room.nurseId!==nurseId) {
      showToast(`⚠ Room ${roomId} already assigned to ${nurses.find(n=>n.id===room.nurseId)?.name}`);
      return;
    }
    tryAssign(nurseId, [roomId]);
  }

  function unassignRoom(roomId) {
    setRooms(prev=>({...prev,[roomId]:{...prev[roomId],nurseId:null}}));
  }

  // ── AI Zap Assign ─────────────────────────────────────────────────────────
  function zapAssign() {
    if (!nurses.length) { showToast('⚠ Add nurses before running OpenAssign AI'); return; }

    setZapLoading(true);

    // Small delay so the spin animation is visible
    setTimeout(() => {
      try {
        const N = nurses.length;

        // ── Snapshot rooms at the moment Zap is pressed ──────────────────
        // Rooms belonging to LOCKED nurses are preserved; all others are
        // cleared back to unassigned so the AI gets a clean slate.
        const lockedRoomIds = new Set();
        nurses.forEach(n => {
          if (lockedNurses.has(n.id)) {
            (nurseRooms[n.id] || []).forEach(id => {
              if (rooms[id]?.occupied) lockedRoomIds.add(id);
            });
          }
        });

        // Reset: strip nurseId from every occupied room NOT protected by a lock
        const resetRooms = { ...rooms };
        Object.values(resetRooms).forEach(r => {
          if (r.occupied && !lockedRoomIds.has(r.id)) {
            resetRooms[r.id] = { ...r, nurseId: null };
          }
        });

        // Sync UI immediately so the list view reflects the reset
        setRooms(resetRooms);

        // ── Acuity point value per room ──────────────────────────────────
        function roomAcuityPts(r) {
          return (r.highAcuity ? 2 : 0) + (r.isolation ? 2 : 0) + (r.totalCare ? 2 : 0)
               + (r.chestTube ? 2 : 0) + (r.tpn ? 2 : 0)
               + (r.drain ? 1 : 0) + (r.neuroCheck ? 1 : 0) + (r.dailyWeight ? 1 : 0)
               + (r.tubeFeed ? 1 : 0) + (r.etoh ? 1 : 0) + (r.dialysis ? 1 : 0) + (r.drip ? 1 : 0)
               + (r.foley ? 1 : 0) + (r.centralLine ? 1 : 0) + (r.glucose ? 1 : 0)
               + (r.restraint ? 1 : 0) + (r.sitter ? 1 : 0) + (r.prisoner ? 1 : 0) + (r.discharge ? 1 : 0);
        }

        // Nurse state: locked nurses seed with their preserved rooms;
        // unlocked nurses start empty.
        const shuffledNurses = [...nurses].sort(() => Math.random() - 0.5);
        const ns = {};
        shuffledNurses.forEach(n => {
          const isLocked = lockedNurses.has(n.id);
          const existing = isLocked
            ? (nurseRooms[n.id] || []).filter(id => resetRooms[id]?.occupied)
            : [];
          ns[n.id] = {
            nurse: n,
            rooms:          [...existing],
            teleCount:      existing.filter(id => resetRooms[id]?.type === 'TELE').length,
            medCount:       existing.filter(id => resetRooms[id]?.type !== 'TELE').length,
            haCount:        existing.filter(id => resetRooms[id]?.highAcuity).length,
            acuityPts:      existing.reduce((s, id) => s + roomAcuityPts(resetRooms[id] || {}), 0),
            isolationCount: existing.filter(id => resetRooms[id]?.isolation).length,
            totalCareCount: existing.filter(id => resetRooms[id]?.totalCare).length,
            glucoseCount:   existing.filter(id => resetRooms[id]?.glucose).length,
            dripCount:      existing.filter(id => resetRooms[id]?.drip).length,
            chestTubeCount:  existing.filter(id => resetRooms[id]?.chestTube).length,
            drainCount:      existing.filter(id => resetRooms[id]?.drain).length,
            neuroCheckCount:  existing.filter(id => resetRooms[id]?.neuroCheck).length,
            dailyWeightCount: existing.filter(id => resetRooms[id]?.dailyWeight).length,
            tubeFeedCount:    existing.filter(id => resetRooms[id]?.tubeFeed).length,
            tpnCount:         existing.filter(id => resetRooms[id]?.tpn).length,
          };
        });

        // Snapshot learned weights from feedback store
        const fbW = feedbackStore.weights;

        // All occupied rooms that are NOT locked get re-assigned
        const unassigned = Object.values(resetRooms).filter(r => r.occupied && !lockedRoomIds.has(r.id));

        // Sort rooms: heaviest acuity first — ECO mode manages its own ordering internally
        const toAssign = [...unassigned].sort((a, b) => {
          const wa = (a.isolation?4:0)+(a.highAcuity?3:0)+(a.totalCare?2:0)+(a.type==='TELE'?1:0)+(a.etoh?1:0)+(a.dialysis?1:0)+(a.drip?1:0)+(a.foley?1:0)+(a.centralLine?1:0)+(a.glucose?1:0)+(a.restraint?1:0)+(a.sitter?1:0)+(a.prisoner?1:0)+(a.discharge?1:0);
          const wb = (b.isolation?4:0)+(b.highAcuity?3:0)+(b.totalCare?2:0)+(b.type==='TELE'?1:0)+(b.etoh?1:0)+(b.dialysis?1:0)+(b.drip?1:0)+(b.foley?1:0)+(b.centralLine?1:0)+(b.glucose?1:0)+(b.restraint?1:0)+(b.sitter?1:0)+(b.prisoner?1:0)+(b.discharge?1:0);
          if (wa !== wb) return wb - wa;
          return Math.random() - 0.5;
        });

        // ── Proximity: diameter = max circDist between ANY two rooms ────────
        // This checks EVERY pair, not just consecutive sorted neighbors.
        // Example: {1116(17),1120(21),1124(25),1126(27)} looks fine by
        // consecutive gaps [4,4,2] but has diameter circDist(1116,1126)=10 — not ideal.
        // Example: {1105(4),1106(5),1111B(12),1123(24)} tight core at 1105/1106,
        // diameter circDist(1105,1123)=20 — heavy penalty but acuity may justify it.
        function clusterDiameter(roomIds) {
          if (roomIds.length <= 1) return 0;
          let maxD = 0;
          for (let i = 0; i < roomIds.length; i++)
            for (let j = i + 1; j < roomIds.length; j++) {
              const d = circDist(roomIds[i], roomIds[j]);
              if (d > maxD) maxD = d;
            }
          return maxD;
        }

        // Also: chain-gap = max consecutive step in sorted circular cluster.
        // Used as a secondary tiebreaker below diameter.
        function maxChainGap(roomIds) {
          if (roomIds.length <= 1) return 0;
          const N    = ROOM_IDS.length;
          const idxs = roomIds.map(id => _RIDX[id]).sort((a, b) => a - b);
          const gaps = [];
          for (let i = 0; i < idxs.length - 1; i++) gaps.push(idxs[i+1] - idxs[i]);
          gaps.push(N - idxs[idxs.length-1] + idxs[0]);
          const maxGapIdx = gaps.reduce((mi, g, i) => g > gaps[mi] ? i : mi, 0);
          const inner = gaps.filter((_, i) => i !== maxGapIdx);
          return inner.length === 0 ? 0 : Math.max(...inner);
        }

        // Diameter penalty table (index = circDist steps between farthest pair)
        //   0-5  : ideal — all rooms within a tight corridor pocket
        //   6-9  : soft stretch — acceptable when acuity forces it
        //   10-13: significant spread — "1116 too far from 1126" territory
        //   14+  : hard block — nurse would be covering too large a territory
        const DIAM_PEN = [
          0,  0,  0,  0,  0,  0,  //  0-5  ideal
         20, 45, 80,125,            //  6-9  soft stretch
        180,250,340,450,            // 10-13 significant
        ];
        const DIAM_HARD = 14; // diameter > 13 → Infinity

        // Chain-gap secondary penalty (used alongside diameter)
        const CHAIN_PEN = [0, 0, 0, 0, 0, 0, 15, 35, 65, 105, 155, 210, 275, 350];

        // Score a nurse for a candidate room (lower = better fit, Infinity = blocked)
        function score(state, room) {
          const { rooms: nRooms, teleCount, medCount, haCount,
                  acuityPts, isolationCount, totalCareCount, glucoseCount } = state;

          // ── Hard limits ──────────────────────────────────────────────────
          const capTele = teleCount > 0 || room.type === 'TELE';
          const cap     = capTele ? 4 : 5;
          if (nRooms.length + 1 > cap)               return Infinity;
          if (room.type === 'TELE' && teleCount >= 4) return Infinity;
          if (room.highAcuity     && haCount >= 2)    return Infinity;
          if (acuityPts + roomAcuityPts(room) > 6)   return Infinity;
          if (room.glucose    && glucoseCount >= 2)   return Infinity;
          if (room.totalCare  && totalCareCount >= 2) return Infinity;

          // ── Proximity hard limit: diameter > 13 → blocked ────────────────
          const projRooms = [...nRooms, room.id];
          const diam = clusterDiameter(projRooms);
          if (diam >= DIAM_HARD) return Infinity;

          // ── Soft penalties ───────────────────────────────────────────────
          let penalty = 0;
          const projAcuity = acuityPts + roomAcuityPts(room);

          // Primary: penalise large diameter — scaled by learned weight
          penalty += (diam < DIAM_PEN.length ? DIAM_PEN[diam] : 450 + (diam - 13) * 80) * fbW.diam;

          // Secondary: penalise large consecutive steps in the sorted cluster
          const gap = maxChainGap(projRooms);
          penalty += gap < CHAIN_PEN.length ? CHAIN_PEN[gap] : 350 + (gap - 13) * 60;

          // Cohesion nudge: prefer rooms near the existing cluster centroid
          if (nRooms.length > 0) {
            const minDist = Math.min(...nRooms.map(id => circDist(room.id, id)));
            penalty += minDist * 2.5;
          }

          // Soft acuity cap — scaled by learned weight
          if (projAcuity > 4) penalty += 60 * (projAcuity - 4) * fbW.acuity;

          // Isolation: strongly discourage a 2nd isolation room on same nurse
          if (room.isolation && isolationCount >= 1) penalty += 90;

          // If nurse already has isolation, discourage stacking totalCare
          if (isolationCount >= 1 && room.totalCare && totalCareCount >= 1) penalty += 70;
          if (room.isolation && totalCareCount >= 2) penalty += 70;

          // ── ECO overflow: soft type-mix discouragement ───────────────────
          // (main ECO assignment is handled by buildEcoClusters; score() is
          //  only called for rooms that overflow the dedicated-type nurses)
          if (fuelMode) {
            if (teleCount > 0 && room.type !== 'TELE') penalty += 80 * fbW.teleCluster;
            if (medCount  > 0 && room.type === 'TELE') penalty += 80 * fbW.teleCluster;
          }

          // ── Load balance — scaled by learned weight ───────────────────────
          const load = nRooms.length * 5 * fbW.load;

          // ── HA spread: discourage stacking high-acuity ───────────────────
          const haSpread = room.highAcuity ? haCount * 18 : 0;

          // ── Tele mix (normal mode) ────────────────────────────────────────
          const telePenalty = (!fuelMode && room.type === 'TELE' && teleCount >= 3) ? 15 : 0;

          // ── Random noise (different result each press) ────────────────────
          const noise = (Math.random() - 0.5) * 10;

          return load + haSpread + telePenalty + penalty + noise;
        }

        // ── Helper: apply a room assignment to a nurse state ────────────────
        function commitToState(state, room) {
          state.rooms.push(room.id);
          if (room.type === 'TELE') state.teleCount++; else state.medCount++;
          if (room.highAcuity)     state.haCount++;
          state.acuityPts      += roomAcuityPts(room);
          if (room.isolation)  state.isolationCount++;
          if (room.totalCare)  state.totalCareCount++;
          if (room.glucose)    state.glucoseCount++;
          if (room.drip)       state.dripCount++;
          if (room.chestTube)   state.chestTubeCount++;
          if (room.drain)       state.drainCount++;
          if (room.neuroCheck)  state.neuroCheckCount++;
          if (room.dailyWeight) state.dailyWeightCount++;
          if (room.tubeFeed)    state.tubeFeedCount++;
          if (room.tpn)         state.tpnCount++;
        }

        // ── ECO shared helpers ───────────────────────────────────────────────
        // Hard acuity / stacking limits — same rules used everywhere.
        function _ecoPasses(state, r) {
          if (r.highAcuity && state.haCount >= 2)        return false;
          if (state.acuityPts + roomAcuityPts(r) > 6)    return false;
          if (r.glucose    && state.glucoseCount    >= 2) return false;
          if (r.totalCare  && state.totalCareCount  >= 2) return false;
          if (r.drip       && state.dripCount       >= 2) return false;
          if (r.isolation  && state.isolationCount  >= 2) return false;
          if (r.chestTube   && state.chestTubeCount   >= 1) return false;
          if (r.drain       && state.drainCount       >= 2) return false;
          if (r.neuroCheck  && state.neuroCheckCount  >= 3) return false;
          if (r.dailyWeight && state.dailyWeightCount >= 3) return false;
          if (r.tubeFeed    && state.tubeFeedCount    >= 2) return false;
          if (r.tpn         && state.tpnCount         >= 1) return false;
          return true;
        }
        // Proximity + acuity score for one candidate room (lower = better).
        // Returns Infinity if the projected cluster exceeds DIAM_HARD.
        function _ecoScore(state, r, projRooms) {
          const diam = clusterDiameter(projRooms);
          if (diam >= DIAM_HARD) return Infinity;
          let s = (diam < DIAM_PEN.length ? DIAM_PEN[diam] : 450+(diam-13)*80) * fbW.diam;
          if (state.rooms.length > 0)
            s += Math.min(...state.rooms.map(id => circDist(r.id, id))) * 20;
          s -= roomAcuityPts(r) * 14 * fbW.acuity;
          if (r.isolation && state.isolationCount >= 1)                              s += 90;
          if (state.isolationCount >= 1 && r.totalCare && state.totalCareCount >= 1) s += 70;
          if (r.isolation && state.totalCareCount >= 2)                              s += 70;
          s += (Math.random() - 0.5) * 6;
          return s;
        }

        // ── Step 2: MedSurg cluster builder (cap = 5) ───────────────────────
        // For each nurse:
        //   a) Seed with the heaviest-acuity valid room from their corridor section
        //   b) Greedily fill to 5 (proximity + acuity — no round-robin)
        // Returns { assigned:{roomId→nurseId}, overflow:[rooms not placed] }
        function buildMedClusters(medPool, medNurses) {
          if (medNurses.length === 0) return { assigned: {}, overflow: [...medPool] };
          const CAP       = 5;
          const remaining = [...medPool];
          const assigned  = {};

          const byCorr = [...remaining].sort((a, b) => _RIDX[a.id] - _RIDX[b.id]);
          const stride  = Math.ceil(byCorr.length / medNurses.length);

          for (let ni = 0; ni < medNurses.length; ni++) {
            const n = medNurses[ni], state = ns[n.id];

            // (a) Seed: heaviest valid room in this nurse's spatial section
            const section      = byCorr.slice(ni * stride, ni * stride + stride);
            const sectionAvail = section
              .filter(r => remaining.some(rem => rem.id === r.id) && _ecoPasses(state, r))
              .sort((a, b) => roomAcuityPts(b) - roomAcuityPts(a));

            if (sectionAvail.length > 0) {
              const seed = sectionAvail[Math.floor(Math.random() * Math.min(2, sectionAvail.length))];
              const idx  = remaining.findIndex(r => r.id === seed.id);
              if (idx !== -1) {
                remaining.splice(idx, 1);
                assigned[seed.id] = n.id;
                commitToState(state, seed);
              }
            }

            // (b) Greedy fill to cap
            while (state.rooms.length < CAP && remaining.length > 0) {
              let bestIdx = -1, bestScore = Infinity;
              for (let i = 0; i < remaining.length; i++) {
                const r = remaining[i];
                if (!_ecoPasses(state, r)) continue;
                const s = _ecoScore(state, r, [...state.rooms, r.id]);
                if (s < bestScore) { bestScore = s; bestIdx = i; }
              }
              if (bestIdx === -1) break;
              const room = remaining[bestIdx];
              remaining.splice(bestIdx, 1);
              assigned[room.id] = n.id;
              commitToState(state, room);
            }
          }

          return { assigned, overflow: remaining };
        }

        // ── Step 3: TELE cluster builder (cap = 4, MedSurg mixing allowed) ──
        // medOverflow = leftover MedSurg rooms injected after Step 2.
        // For each nurse:
        //   a) Seed with a TELE room from their TELE corridor section
        //      (fallback to any available TELE if section empty)
        //   b) Greedily fill to 4 — MedSurg rooms allowed but soft-penalised
        // Dynamic cap: TELE involved → 4, pure MedSurg nurse → 5
        // Returns { assigned:{roomId→nurseId}, overflow:[rooms not placed] }
        function buildTeleClusters(telePool, medOverflow, teleNurses) {
          if (teleNurses.length === 0) return { assigned: {}, overflow: [...telePool, ...medOverflow] };
          const TELE_CAP  = 4;
          const remaining = [...telePool, ...medOverflow]; // TELE first, then MedSurg
          const assigned  = {};

          // Section seeding draws only from TELE rooms
          const teleByCorr = [...telePool].sort((a, b) => _RIDX[a.id] - _RIDX[b.id]);
          const stride     = Math.max(1, Math.ceil(teleByCorr.length / teleNurses.length));

          for (let ni = 0; ni < teleNurses.length; ni++) {
            const n = teleNurses[ni], state = ns[n.id];

            // (a) Seed: heaviest valid TELE room in section; fallback to any TELE
            const section      = teleByCorr.slice(ni * stride, ni * stride + stride);
            const sectionAvail = section
              .filter(r => remaining.some(rem => rem.id === r.id) && _ecoPasses(state, r))
              .sort((a, b) => roomAcuityPts(b) - roomAcuityPts(a));
            const seedPool = sectionAvail.length > 0 ? sectionAvail :
              remaining.filter(r => r.type === 'TELE' && _ecoPasses(state, r))
                       .sort((a, b) => roomAcuityPts(b) - roomAcuityPts(a));

            if (seedPool.length > 0) {
              const seed = seedPool[Math.floor(Math.random() * Math.min(2, seedPool.length))];
              const idx  = remaining.findIndex(r => r.id === seed.id);
              if (idx !== -1) {
                remaining.splice(idx, 1);
                assigned[seed.id] = n.id;
                commitToState(state, seed);
              }
            }

            // (b) Greedy fill to TELE cap
            while (state.rooms.length < TELE_CAP && remaining.length > 0) {
              let bestIdx = -1, bestScore = Infinity;
              for (let i = 0; i < remaining.length; i++) {
                const r = remaining[i];
                if (!_ecoPasses(state, r)) continue;
                // Dynamic cap enforced per candidate
                const effectiveCap = (state.teleCount > 0 || r.type === 'TELE') ? TELE_CAP : 5;
                if (state.rooms.length >= effectiveCap) continue;
                let s = _ecoScore(state, r, [...state.rooms, r.id]);
                if (s === Infinity) continue;
                // Soft penalty for MedSurg rooms mixed into a TELE nurse's cluster
                if (r.type !== 'TELE') s += 60 * fbW.teleCluster;
                if (s < bestScore) { bestScore = s; bestIdx = i; }
              }
              if (bestIdx === -1) break;
              const room = remaining[bestIdx];
              remaining.splice(bestIdx, 1);
              assigned[room.id] = n.id;
              commitToState(state, room);
            }
          }

          return { assigned, overflow: remaining };
        }

        // ── Main assignment ──────────────────────────────────────────────────
        const newAssignments = {};

        if (fuelMode) {
          // ECO MODE — 3-step cluster assignment:
          //   Step 1: pool all MedSurg rooms → dedicate to MedSurg nurses (cap 5)
          //   Step 2: any leftover MedSurg rooms fold into TELE pool → TELE nurses (cap 4)
          //   Step 3: anything still unassigned → normal score() greedy across all nurses

          const acuityKey = r => (r.isolation?4:0)+(r.highAcuity?3:0)+(r.chestTube?3:0)+(r.totalCare?2:0)+(r.drain?1:0)+(r.etoh?1:0)+(r.dialysis?1:0)+(r.drip?1:0)+(r.foley?1:0)+(r.centralLine?1:0)+(r.glucose?1:0)+(r.restraint?1:0)+(r.sitter?1:0)+(r.prisoner?1:0)+(r.discharge?1:0);

          const telePool = unassigned
            .filter(r => r.type === 'TELE')
            .sort((a,b) => acuityKey(b)-acuityKey(a) || _RIDX[a.id]-_RIDX[b.id]);
          const medPool = unassigned
            .filter(r => r.type !== 'TELE')
            .sort((a,b) => acuityKey(b)-acuityKey(a) || _RIDX[a.id]-_RIDX[b.id]);

          const unlockedNurses = shuffledNurses.filter(n => !lockedNurses.has(n.id));
          const total = telePool.length + medPool.length;
          const teleNurseCount = total > 0
            ? Math.min(Math.round(unlockedNurses.length * telePool.length / total), unlockedNurses.length)
            : 0;
          const teleNurses = unlockedNurses.slice(0, teleNurseCount);
          const medNurses  = unlockedNurses.slice(teleNurseCount);

          // Step 1→2: fill MedSurg nurses (cap 5); leftover MedSurg → TELE pool
          const medResult  = buildMedClusters(medPool, medNurses);
          Object.assign(newAssignments, medResult.assigned);

          // Step 3: fill TELE nurses (cap 4) with TELE pool + leftover MedSurg
          const teleResult = buildTeleClusters(telePool, medResult.overflow, teleNurses);
          Object.assign(newAssignments, teleResult.assigned);

          // Final safety net: anything buildTeleClusters couldn't place → score() greedy
          for (const room of teleResult.overflow) {
            let best = null, bestScore = Infinity;
            for (const state of Object.values(ns)) {
              const s = score(state, room);
              if (s < bestScore) { bestScore = s; best = state; }
            }
            if (best && bestScore < Infinity) {
              newAssignments[room.id] = best.nurse.id;
              commitToState(best, room);
            }
          }

        } else {
          // NORMAL MODE: single proximity + acuity greedy pass
          for (const room of toAssign) {
            let best = null, bestScore = Infinity;
            for (const state of Object.values(ns)) {
              const s = score(state, room);
              if (s < bestScore) { bestScore = s; best = state; }
            }
            if (best && bestScore < Infinity) {
              newAssignments[room.id] = best.nurse.id;
              commitToState(best, room);
            }
          }
        }

        const count = Object.keys(newAssignments).length;
        const skipped = unassigned.length - count;

        if (!count && !lockedRoomIds.size) {
          showToast('⚠ Nurses are at capacity — add more nurses or clear assignments first');
        } else {
          // Apply new assignments on top of the already-reset room map
          const finalRooms = { ...resetRooms };
          Object.entries(newAssignments).forEach(([id, nurseId]) => {
            finalRooms[id] = { ...finalRooms[id], nurseId };
          });
          setRooms(finalRooms);
          const lockedCount = lockedRoomIds.size;
          const msg = skipped
            ? `⚡ Assigned ${count} rooms · ${skipped} skipped (capacity)${lockedCount ? ` · ${lockedCount} locked` : ''}`
            : `⚡ Assigned ${count} room${count>1?'s':''} across ${N} nurse${N>1?'s':''}${lockedCount ? ` · ${lockedCount} locked` : ''}`;
          showToast(msg);
          setZapFeedbackNurses(new Set(nurses.map(n => n.id))); // show per-nurse feedback strips
        }
      } finally {
        setZapLoading(false);
      }
    }, 320); // 320 ms spin — user can see the animation before result lands
  }

    const wasOccupied = rooms[updated.id]?.occupied;
    const becomingVacant  = wasOccupied && !updated.occupied;

    // When toggling to vacant: clear all patient properties (keep clean as-is)
    // When toggling to occupied: clear clean flag (new patient = room no longer "clean")
    // Otherwise (already vacant or already occupied): preserve everything as updated
    const finalRoom = becomingVacant
      ? { ...updated,
          nurseId: null,
          foley: false, drip: false, prisoner: false, totalCare: false,
          glucose: false, highAcuity: false, sitter: false,
          discharge: false, isolation: false, restraint: false, centralLine: false,
          chestTube: false, drain: false, etoh: false, dialysis: false }
      : becomingOccupied
        ? { ...updated, clean: false, missingBed: false }
        : updated;
    setRooms(prev => ({ ...prev, [updated.id]: finalRoom }));
    if (becomingVacant) {
      setSelected(prev => { const next = new Set(prev); next.delete(updated.id); return next; });
    }
    setEditingRoom(null);

            onZapAssign={zapAssign}
            zapLoading={zapLoading}
            fuelMode={fuelMode}
            onToggleFuel={() => setFuelMode(f => !f)}
            fbWeights={feedbackStore.weights}
            onExportSheet={() => setExportSheetOpen(true)}
            onMonkeyClick={() => setPolicySearchOpen(true)}
          />
        </div>
      </div>

      {unassignedAnchor && (
        <UnassignedPanel
          rooms={unassignedRooms}
          nurses={nurses}
          nurseRooms={nurseRooms}
          onAssign={assignRoomToNurse}
          onDragStart={handleUnassignedDragStart}
          onClose={()=>setUnassignedAnchor(null)}
          anchor={unassignedAnchor}
          triggerRef={unassignedBtnRef}
        />
      )}
      {editingRoom && <PatientModal room={editingRoom} nurses={nurses} nurseRooms={nurseRooms} onClose={()=>setEditingRoom(null)} onSave={saveRoom}/>}
      {pendingAssignment && (
        <WarningModal
          warning={pendingAssignment.warning}
          onOverride={pendingAssignment.onConfirm}
          onCancel={()=>setPendingAssignment(null)}
        />
      )}
      {phoneDir         && <PhoneDirectory    onClose={()=>setPhoneDir(false)}/>}
      {exportSheetOpen  && <ExportSheetModal nurses={nurses} rooms={rooms} onClose={()=>setExportSheetOpen(false)}/>}
      {policySearchOpen && <PolicySearchModal onClose={()=>setPolicySearchOpen(false)}/>}
      {rosterBuilderOpen && <RosterBuilderModal onClose={()=>setRosterBuilderOpen(false)}/>}
      {toast && <div className="warn-toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
