              background:`${assignedNurse.color}22`, border:`1px solid ${assignedNurse.color}66`,
              borderRadius:20, padding:'1px 9px', fontSize:11, fontWeight:600, color:'var(--text-2)' }}>
              <span style={{ width:7, height:7, borderRadius:'50%', background:assignedNurse.color, display:'inline-block' }}/>
              {assignedNurse.name}
            </span>
          )}
        </div>
        <span style={{ fontSize:13, color:'var(--text-4)', display:'inline-block',
          transition:'transform 0.2s', transform: open ? 'rotate(0deg)' : 'rotate(-90deg)' }}>▾</span>
      </div>
      {open && (
        <div style={{ display:'flex', flexDirection:'column', gap:5, paddingBottom:6 }}>
          {nurses.map(n => {
            const isAssigned = nurseId === n.id;
            const isPref     = preferredNurses.includes(n.id);
            const isBlocked  = blockedNurses.includes(n.id);
            const pts        = (nurseRooms?.[n.id] || []).length;
            return (
              <div key={n.id} onClick={() => onAssign(n.id)}
                style={{
                  display:'flex', alignItems:'center', gap:9,
                  padding:'8px 11px', borderRadius:9, cursor:'pointer',
                  background: isAssigned ? `${n.color}22` : isPref ? 'rgba(251,191,36,0.08)' : 'rgba(255,255,255,0.03)',
                  border: isAssigned ? `1.5px solid ${n.color}88`
                        : isPref     ? '1px solid rgba(251,191,36,0.30)'
                        : isBlocked  ? '1px solid rgba(248,113,113,0.20)'
                        : '1px solid var(--border-sub)',
                  opacity: isBlocked && !isAssigned ? 0.5 : 1,
                  transition:'background 0.15s, border-color 0.15s',
                }}>
                <div style={{ width:10, height:10, borderRadius:'50%', background:n.color, flexShrink:0 }}/>
                <span style={{ flex:1, fontSize:13, fontWeight:600, color:'var(--text-1)',
                  textDecoration: isBlocked && !isAssigned ? 'line-through' : 'none' }}>{n.name}</span>
                <span style={{ fontSize:11, color:'var(--text-4)' }}>{pts}pt</span>
                {isPref    && !isAssigned && <span style={{ fontSize:11 }}>⭐</span>}
                {isBlocked && !isAssigned && <span style={{ fontSize:11 }}>🚫</span>}
                {isAssigned && (
                  <span style={{ fontSize:11, fontWeight:700, color:'#fff',
                    background:n.color, borderRadius:20, padding:'1px 9px' }}>✓ Assigned</span>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function PatientModal({ room, nurses, nurseRooms, onClose, onSave }) {
  const [s, setS] = useState({...room});
  const set = (k,v) => setS(p=>({...p,[k]:v}));
  const assignedNurse = room.nurseId ? (nurses||[]).find(n => n.id === room.nurseId) : null;
  const GridToggle = ({ on, onChange, label, color }) => (
    <div className="toggle-grid-item">
      <span style={{
        fontSize:14, fontWeight:500,
        color: on ? 'var(--text-1)' : 'var(--text-3)',
        transition:'color 0.15s', lineHeight:1.2, flexShrink:1, minWidth:0,
        letterSpacing:'-0.1px',
      }}>{label}</span>
      <button className={`toggle${on?' on':''}`}
        style={on ? { background: color } : {}}
        onClick={()=>onChange(!on)}/>
    </div>
  );

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">

        {/* ── Fixed header ── */}
        <div className="modal-header">
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <h2 style={{ margin:0, fontSize:18, fontWeight:700, color:'var(--text-1)' }}>Room {room.id}</h2>
            </div>
            <button className="btn btn-ghost" onClick={onClose}>✕</button>
          </div>
        </div>

        {/* ── Scrollable body ── */}
        <div className="modal-body">
          <div className="toggle-row">
            <span style={{ fontSize:13, color:'var(--text-2)' }}>Occupied</span>
            <button className={`toggle${s.occupied?' on':''}`} onClick={()=>set('occupied',!s.occupied)}/>
          </div>

          {/* Vacant-only toggles: Clean/Dirty + Missing Bed */}
          {!s.occupied && (
            <>
              <div className="toggle-row">
                <div style={{ display:'flex', flexDirection:'column', gap:2 }}>
                  <span style={{ fontSize:13, color: s.clean ? '#30D158' : 'var(--text-2)', fontWeight: s.clean ? 700 : 400, transition:'color 0.2s' }}>
                    {s.clean ? '✓ Clean' : 'Dirty'}
                  </span>
                  <span style={{ fontSize:10, color:'var(--text-4)' }}>Room housekeeping status</span>
                </div>
                <button
                  className={`toggle${s.clean?' on':''}`}
                  style={s.clean ? { background:'#30D158' } : {}}
                  onClick={()=>set('clean',!s.clean)}
                />
              </div>
              <div className="toggle-row" style={{ borderBottom:'none' }}>
                <div style={{ display:'flex', flexDirection:'column', gap:2 }}>
                  <span style={{ fontSize:13, color: s.missingBed ? '#FF9F0A' : 'var(--text-2)', fontWeight: s.missingBed ? 700 : 400, transition:'color 0.2s' }}>
                    {s.missingBed ? '⚠ Missing Bed' : 'Bed Available'}
                  </span>
                  <span style={{ fontSize:10, color:'var(--text-4)' }}>Flag if bed frame is missing</span>
                </div>
                <button
                  className={`toggle${s.missingBed?' on':''}`}
                  style={s.missingBed ? { background:'#FF9F0A' } : {}}
                  onClick={()=>set('missingBed',!s.missingBed)}
                />
              </div>
            </>
          )}

          {s.occupied && (<>
            <div className="toggle-row">
              <span style={{ fontSize:13, color:'var(--text-2)' }}>Gender</span>
              <div style={{ display:'flex', gap:6 }}>
                {['male','female'].map(g=>(
                  <button key={g} className="btn" onClick={()=>set('gender',g)}
                    style={{ background:s.gender===g?(g==='male'?'#1d4ed8':'#be185d'):'var(--btn-ghost-bg)', color:s.gender===g?'white':'var(--btn-ghost-tx)', padding:'4px 10px' }}>
                    {g==='male'?'♂ Male':'♀ Female'}
                  </button>
                ))}
              </div>
            </div>

            <div className="toggle-row" style={{ marginBottom:6 }}>
              <span style={{ fontSize:13, color:'var(--text-2)' }}>Type</span>
              <div style={{ display:'flex', gap:6 }}>
                {['MEDSURG','TELE'].map(t=>(
                  <button key={t} className="btn" onClick={()=>set('type',t)}
                    style={{ background:s.type===t?(t==='TELE'?'#dc2626':'#0369a1'):'var(--btn-ghost-bg)', color:s.type===t?'white':'var(--btn-ghost-tx)', padding:'4px 10px' }}>
                    {t==='TELE'?'♥ TELE':'MED/SURG'}
                  </button>
                ))}
              </div>
            </div>

            {/* 2-column acuity toggle grid */}
            <div style={{
              fontSize:17, fontWeight:700, color:'var(--text-1)',
              letterSpacing:'-0.3px', padding:'12px 4px 6px',
              borderTop:'1px solid var(--border)', marginTop:4,
            }}>Acuity &amp; Flags</div>
            <div className="toggle-grid">
              <GridToggle on={s.foley}       onChange={v=>set('foley',v)}       label="Foley Catheter"  color="#8b5cf6"/>
              <GridToggle on={s.drip}        onChange={v=>set('drip',v)}        label="Infusion Drip"   color="#0891b2"/>
              <GridToggle on={s.totalCare}   onChange={v=>set('totalCare',v)}   label="Total Care"      color="#be123c"/>
              <GridToggle on={s.highAcuity}  onChange={v=>set('highAcuity',v)}  label="High Acuity"     color="#ea580c"/>
              <GridToggle on={s.isolation}   onChange={v=>set('isolation',v)}   label="Isolation"       color="#f97316"/>
              <GridToggle on={s.centralLine} onChange={v=>set('centralLine',v)} label="Central Line"    color="#3b82f6"/>
              <GridToggle on={s.chestTube}   onChange={v=>set('chestTube',v)}   label="Chest Tube"      color="#0d9488"/>
              <GridToggle on={s.tpn}         onChange={v=>set('tpn',v)}         label="TPN"             color="#4c1d95"/>
              <GridToggle on={s.tubeFeed}    onChange={v=>set('tubeFeed',v)}    label="Tube Feed"       color="#92400e"/>
              <GridToggle on={s.drain}       onChange={v=>set('drain',v)}       label="Drain"           color="#9333ea"/>
              <GridToggle on={s.neuroCheck}  onChange={v=>set('neuroCheck',v)}  label="Neuro Check"     color="#1e40af"/>
              <GridToggle on={s.dailyWeight} onChange={v=>set('dailyWeight',v)} label="Daily Weight"    color="#065f46"/>
              <GridToggle on={s.glucose}     onChange={v=>set('glucose',v)}     label="Glucose Check"   color="#16a34a"/>
              <GridToggle on={s.restraint}   onChange={v=>set('restraint',v)}   label="Restraint"       color="#dc2626"/>
              <GridToggle on={s.sitter}      onChange={v=>set('sitter',v)}      label="Sitter"          color="#7c3aed"/>
              <GridToggle on={s.prisoner}    onChange={v=>set('prisoner',v)}    label="Prisoner"        color="#b45309"/>
              <GridToggle on={s.discharge}   onChange={v=>set('discharge',v)}   label="Discharge"       color="#0ea5e9"/>
              <GridToggle on={s.dialysis}    onChange={v=>set('dialysis',v)}    label="Dialysis"        color="#6366f1"/>
              <GridToggle on={s.etoh}        onChange={v=>set('etoh',v)}        label="ETOH"            color="#b45309"/>
            </div>

            {/* Nurse assignment picker */}
            {nurses && nurses.length > 0 && (
              <NursePickerSection
                nurses={nurses} nurseRooms={nurseRooms}
                nurseId={s.nurseId}
                preferredNurses={s.preferredNurses||[]}
                blockedNurses={s.blockedNurses||[]}
                onAssign={nid => setS(p=>({...p, nurseId: p.nurseId===nid ? null : nid}))}
              />
            )}

            {/* Nurse Preferences */}
            {nurses && nurses.length > 0 && (
              <div style={{ marginTop:4 }}>
                <div style={{
                  fontSize:17, fontWeight:700, color:'var(--text-1)',
                  letterSpacing:'-0.3px', padding:'12px 4px 6px',
                  borderTop:'1px solid var(--border)',
                }}>Nurse Preferences</div>
                <div style={{ fontSize:11, color:'var(--text-4)', marginBottom:10, padding:'0 2px' }}>
                  ⭐ Preferred &nbsp;·&nbsp; 🚫 Blocked — cannot be assigned
                </div>
                <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
                  {nurses.map(n => {
                    const isPref    = (s.preferredNurses||[]).includes(n.id);
                    const isBlocked = (s.blockedNurses||[]).includes(n.id);
                    function togglePref() {
                      setS(p => {
                        const wasPref = (p.preferredNurses||[]).includes(n.id);
                        return {
                          ...p,
                          preferredNurses: wasPref
                            ? (p.preferredNurses||[]).filter(id=>id!==n.id)
                            : [...(p.preferredNurses||[]), n.id],
                          blockedNurses: (p.blockedNurses||[]).filter(id=>id!==n.id),
                        };
                      });
                    }
                    function toggleBlock() {
                      setS(p => {
                        const wasBlocked = (p.blockedNurses||[]).includes(n.id);
                        return {
                          ...p,
                          blockedNurses: wasBlocked
                            ? (p.blockedNurses||[]).filter(id=>id!==n.id)
                            : [...(p.blockedNurses||[]), n.id],
                          preferredNurses: (p.preferredNurses||[]).filter(id=>id!==n.id),
                        };
                      });
                    }
                    return (
                      <div key={n.id} style={{
                        display:'flex', alignItems:'center', gap:8,
                        padding:'7px 10px', borderRadius:9,
                        background: isPref    ? 'rgba(251,191,36,0.10)'
                                  : isBlocked ? 'rgba(248,113,113,0.08)'
                                  : 'rgba(255,255,255,0.03)',
                        border: isPref    ? '1px solid rgba(251,191,36,0.30)'
                              : isBlocked ? '1px solid rgba(248,113,113,0.25)'
                              : '1px solid var(--border-sub)',
                        transition:'background 0.15s',
                      }}>
                        <div style={{ width:8, height:8, borderRadius:'50%', background:n.color, flexShrink:0 }}/>
                        <span style={{
                          flex:1, fontSize:13, fontWeight:600,
                          color: isBlocked ? 'var(--text-4)' : 'var(--text-1)',
                          textDecoration: isBlocked ? 'line-through' : 'none',
                        }}>{n.name}</span>
                        {isPref    && <span style={{ fontSize:10, color:'#fbbf24', fontWeight:700 }}>PREFERRED</span>}
                        {isBlocked && <span style={{ fontSize:10, color:'#f87171', fontWeight:700 }}>BLOCKED</span>}
                        <button onClick={togglePref} title="Mark preferred"
                          style={{
                            fontSize:17, lineHeight:1, padding:'3px 6px', borderRadius:6,
                            cursor:'pointer', border: isPref ? '1px solid rgba(251,191,36,0.5)' : '1px solid transparent',
                            background: isPref ? 'rgba(251,191,36,0.22)' : 'transparent',
                          }}>⭐</button>
                        <button onClick={toggleBlock} title="Block from room"
                          style={{
                            fontSize:17, lineHeight:1, padding:'3px 6px', borderRadius:6,
                            cursor:'pointer', border: isBlocked ? '1px solid rgba(248,113,113,0.45)' : '1px solid transparent',
                            background: isBlocked ? 'rgba(248,113,113,0.20)' : 'transparent',
                          }}>🚫</button>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

          </>)}
        </div>

        {/* ── Fixed footer ── */}
        <div className="modal-footer">
          <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" onClick={()=>onSave(s)}>Save</button>
          </div>
        </div>

      </div>
    </div>
  );
}

// ── UNASSIGNED PANEL (dropdown, portal) ──────────────────────────────────────
function UnassignedPanel({ rooms, nurses, nurseRooms, onAssign, onDragStart, onClose, anchor, triggerRef }) {
  const ref = useRef();
  const [dropdown, setDropdown] = useState(null); // { room, btnAnchor }

  // Close on outside-click — but ignore clicks on the trigger button itself
  // (the trigger handles its own open/close toggle)
  useEffect(() => {
    const h = e => {
      if (triggerRef?.current?.contains(e.target)) return;
      if (ref.current && !ref.current.contains(e.target)) onClose();
    };
    document.addEventListener('mousedown', h, true);
    return () => document.removeEventListener('mousedown', h, true);
  }, []);

  // Center horizontally on viewport; sit just below the trigger with safe bottom margin
  const PW = 460;
  const topPos = Math.min(anchor.bottom + 8, window.innerHeight - 80);

  function openRoomDropdown(e, room) {
    e.stopPropagation();
    const rect = e.currentTarget.getBoundingClientRect();
    setDropdown(prev => prev?.room.id === room.id ? null : { room, anchor: rect });
  }

  return ReactDOM.createPortal(
    <>
      {/* Panel — horizontally centered, scrollable */}
      <div ref={ref} style={{
        position:'fixed',
        left:'50%', transform:'translateX(-50%)',
        top: topPos,
        width: Math.min(PW, window.innerWidth - 24),
        maxHeight: `calc(100vh - ${topPos + 16}px)`,
        zIndex:600,
        background:'var(--modal-bg)', border:'1px solid var(--border-sub)',
        borderRadius:14, boxShadow:'0 16px 56px rgba(0,0,0,0.45)',
        display:'flex', flexDirection:'column', overflow:'hidden',
        animation:'dd-in 0.15s ease',
      }}>

        {/* Header */}
        <div style={{ padding:'11px 14px 9px', borderBottom:'1px solid var(--border-sub)', display:'flex', justifyContent:'space-between', alignItems:'center', flexShrink:0 }}>
          <div>
            <div style={{ fontWeight:700, fontSize:13, color:'var(--text-1)', display:'flex', alignItems:'center', gap:8 }}>
              Unassigned Rooms
              <span style={{ background:'#f59e0b', color:'white', borderRadius:10, padding:'1px 9px', fontSize:11, fontWeight:700 }}>
                {rooms.length}
              </span>
            </div>
            <div style={{ fontSize:10, color:'var(--text-4)', marginTop:3 }}>
              Drag a chip to a nurse · or click <b style={{ color:'var(--text-2)' }}>+</b> to assign
            </div>
          </div>
          <button className="btn btn-ghost" onClick={onClose} style={{ padding:'3px 8px', fontSize:12 }}>✕</button>
        </div>

        {/* Room chips */}
        <div style={{ overflowY:'auto', flex:1, padding:'10px 12px' }}>
          {rooms.length === 0 ? (
            <div style={{ textAlign:'center', padding:'22px 0', color:'#22c55e', fontSize:13, fontWeight:600 }}>
              ✓ All occupied rooms are assigned!
            </div>
          ) : (
            <div style={{ display:'flex', flexWrap:'wrap', gap:7 }}>
              {rooms.map(r => {
                const fem = r.gender === 'female';
                const active = dropdown?.room.id === r.id;
                return (
                  <div
                    key={r.id}
                    draggable
                    onDragStart={e => onDragStart(r.id, e)}
                    style={{
                      padding:'6px 8px 6px 10px', borderRadius:8, fontSize:12, fontWeight:700,
                      display:'flex', alignItems:'center', gap:5, userSelect:'none',
                      background: fem ? '#fce7f3' : '#dbeafe',
                      color:       fem ? '#9d174d'  : '#1d4ed8',
                      border:`1.5px solid ${fem ? '#f9a8d4' : '#93c5fd'}`,
                      cursor:'grab', transition:'transform 0.1s, box-shadow 0.1s',
                    }}
                    onMouseEnter={e => { e.currentTarget.style.transform='scale(1.06)'; e.currentTarget.style.boxShadow='0 4px 14px rgba(0,0,0,0.18)'; }}
                    onMouseLeave={e => { e.currentTarget.style.transform=''; e.currentTarget.style.boxShadow=''; }}
                  >
                    {/* drag-handle dots */}
                    <span style={{ opacity:0.35, fontSize:9, letterSpacing:'-1px', pointerEvents:'none' }}>⠿</span>
                    <span>{r.id}</span>
                    {r.type==='TELE' && <span style={{ color:'#f87171' }}>♥</span>}
                    {r.sitter && <span style={{ fontSize:9, color:'#7c3aed' }}>ST</span>}
                    {/* + assign button */}
                    <button
                      onClick={e => openRoomDropdown(e, r)}
                      title="Assign to nurse"
                      style={{
                        width:18, height:18, borderRadius:4, border:'none', cursor:'pointer', flexShrink:0,
                        display:'flex', alignItems:'center', justifyContent:'center',
                        fontSize:14, lineHeight:1, fontWeight:900,
                        background: active ? (fem?'#be185d':'#1d4ed8') : (fem?'rgba(190,24,93,0.15)':'rgba(29,78,216,0.15)'),
                        color: active ? 'white' : (fem?'#be185d':'#1d4ed8'),
                        transition:'background 0.15s, color 0.15s',
                      }}
                    >+</button>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* Legend */}
        {rooms.length > 0 && (
          <div style={{ padding:'7px 12px', borderTop:'1px solid var(--border-sub)', display:'flex', gap:10, fontSize:10, color:'var(--text-4)', flexShrink:0 }}>
            <span>♥ = TELE</span>
            <span style={{ background:'#fce7f3', color:'#9d174d', padding:'1px 6px', borderRadius:4 }}>Pink = Female</span>
            <span style={{ background:'#dbeafe', color:'#1d4ed8', padding:'1px 6px', borderRadius:4 }}>Blue = Male</span>
          </div>
        )}
      </div>

      {/* Nurse picker dropdown for + button */}
      {dropdown && (
        <RoomDropdown
          room={dropdown.room}
          nurses={nurses}
          nurseRooms={nurseRooms}
          anchor={dropdown.anchor}
          onAssign={nid => { onAssign(dropdown.room.id, nid); setDropdown(null); }}
          onUnassign={() => setDropdown(null)}
          onClose={() => setDropdown(null)}
        />
      )}
    </>,
    document.body
  );
}

// ── EXPORT SHEET MODAL ────────────────────────────────────────────────────────
// ── ROSTER BUILDER ────────────────────────────────────────────────────────────
function FileZone({ file, onFile, onClear, icon, label, hint, required }) {
  const chosen = !!file;
  return (
    <label style={{
      display:'block', cursor:'pointer', borderRadius:10,
      border:`2px dashed ${chosen ? '#22c55e' : 'var(--border)'}`,
      padding:'12px 16px', marginBottom:10,
      background: chosen ? 'rgba(34,197,94,0.06)' : 'var(--bg-card)',
      transition:'border-color 0.2s,background 0.2s',
    }}>
      <input type="file" accept=".xlsx,.xls,.xlsm,.csv" style={{display:'none'}}
        onChange={e => { const f=e.target.files[0]; if(f) onFile(f); e.target.value=''; }}/>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <span style={{fontSize:22}}>{icon}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,fontWeight:700,color:'var(--text-1)'}}>
            {label} {required && <span style={{color:'#f87171',fontSize:10,marginLeft:4}}>required</span>}
          </div>
          <div style={{fontSize:11,color:chosen?'#22c55e':'var(--text-2)',marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
            {chosen ? `✓ ${file.name}` : hint}
          </div>
        </div>
        {chosen && (
          <button onClick={e=>{e.preventDefault();e.stopPropagation();onClear();}}
            style={{flexShrink:0,background:'none',border:'none',color:'var(--text-2)',cursor:'pointer',fontSize:16,lineHeight:1}}>✕</button>
        )}
      </div>
    </label>
  );
}

function MultiFileZone({ files, onAdd, onRemove, icon, label, hint }) {
  const hasFiles = files && files.length > 0;
  const [dragging, setDragging] = React.useState(false);
  const inputRef = React.useRef(null);

  function handleDrop(e) {
    e.preventDefault(); setDragging(false);
    const dropped = Array.from(e.dataTransfer.files).filter(f => /\.(xlsx|xlsm|xls|csv)$/i.test(f.name));
    dropped.forEach(f => onAdd(f));
  }

  return (
    <div style={{marginBottom:10}}>
      <label
        onDragOver={e=>{e.preventDefault();setDragging(true);}}
        onDragLeave={()=>setDragging(false)}
        onDrop={handleDrop}
        style={{
          display:'block', cursor:'pointer', borderRadius:10,
          border:`2px dashed ${dragging ? '#3b82f6' : hasFiles ? '#22c55e' : 'var(--border)'}`,
          padding:'11px 16px',
          background: dragging ? 'rgba(59,130,246,0.07)' : hasFiles ? 'rgba(34,197,94,0.06)' : 'var(--bg-card)',
          transition:'border-color 0.2s,background 0.2s',
        }}>
        <input ref={inputRef} type="file" accept=".xlsx,.xls,.xlsm,.csv" multiple style={{display:'none'}}
          onChange={e => { Array.from(e.target.files).forEach(f => onAdd(f)); e.target.value=''; }}/>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:22}}>{icon}</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:700,color:'var(--text-1)',display:'flex',alignItems:'center',gap:6}}>
              {label}
              {hasFiles && (
                <span style={{background:'#3b82f6',color:'white',borderRadius:10,fontSize:10,fontWeight:800,padding:'1px 7px'}}>
                  {files.length}
                </span>
              )}
            </div>
            <div style={{fontSize:11,color:hasFiles?'#22c55e':'var(--text-2)',marginTop:2}}>
              {hasFiles ? `${files.length} file${files.length>1?'s':''} selected — click or drop to add more` : hint}
            </div>
          </div>
          <span style={{fontSize:18,color:'var(--text-2)',flexShrink:0}}>＋</span>
        </div>
      </label>

      {hasFiles && (
        <div style={{display:'flex',flexDirection:'column',gap:4,marginTop:4,marginLeft:4}}>
          {files.map((f,i) => (
            <div key={i} style={{
              display:'flex',alignItems:'center',gap:8,
              background:'var(--bg-card)',borderRadius:7,
              border:'1px solid var(--border)',padding:'5px 10px',
            }}>
              <span style={{fontSize:14}}>📄</span>
              <span style={{flex:1,fontSize:12,color:'var(--text-1)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                {f.name}
              </span>
              <button
                onClick={e=>{e.preventDefault();e.stopPropagation();onRemove(i);}}
                style={{flexShrink:0,background:'none',border:'none',color:'var(--text-2)',cursor:'pointer',fontSize:15,lineHeight:1,padding:'0 2px'}}
                title="Remove">✕</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function RosterBuilderModal({ onClose }) {
  const [files, setFiles]   = React.useState({ roster:null, tracker:null, assign:[], msHistory:null });
  const [result, setResult] = React.useState(null);
  const [err,    setErr]    = React.useState('');
  const [busy,   setBusy]   = React.useState(false);
  const [view,   setView]   = React.useState('upload');

  function setFile(key, f) { setFiles(p => ({...p, [key]: f})); }

  function readWb(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        try { resolve(XLSX.read(new Uint8Array(e.target.result), { type:'array', cellDates:true })); }
        catch(ex) { reject(ex); }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    });
  }

  // ── Skill-grade name normalization (mirrors daily-roster-builder / ms-turn) ──
  const _PAREN_RE = /\([^)]*\)/g;
  const _GEN_KW   = new Set(['JR','SR','II','III','IV','V','VI','VII','VIII','IX','X']);
  function _isGenSuffix(s) {
    s = s.toUpperCase();
    return _GEN_KW.has(s) || (s.length >= 2 && s.length <= 4 && /^[ILil]+$/.test(s));
  }
  function normalizeName(raw) {
    if (!raw || typeof raw !== 'string') return null;
    let s = raw.replace(_PAREN_RE, '').trim(); if (!s) return null;
    let last, first;
    if (s.includes(',')) { [last, first] = s.split(',', 2); }
    else { const p = s.split(/\s+/); if (p.length < 2) return null; last=p[0]; first=p.slice(1).join(' '); }
    const lt = last.trim().split(/\s+/);
    if (lt.length > 1 && _isGenSuffix(lt[lt.length-1])) last = lt.slice(0,-1).join(' ');
    last  = last.replace(/\W+/g,'').toUpperCase();
    first = first.replace(/\W+/g,'').toUpperCase();
    return last ? [last, first] : null;
  }
  const _NAME_ALIASES = {
    'EIERMAN,DESTINY':     ['EIRMAN','DESTINY'],
    'HUELE,EVAJOANNE':     ['HUELE','EVA'],
    'MANALO,ANNKRISTIE':   ['MANALO','ANN'],
    'WILHELM,NICHOLAS':    ['WILHELM','NICK'],
    'WILHEM,NICHOLAS':     ['WILHELM','NICK'],
    'WILHEM,NICK':         ['WILHELM','NICK'],
    'MENDEZRIVERA,VICTOR': ['MENDEZRIVERA','ANDREW'],
    'AGUILAR,NORANATALIE': ['AGUILAR','NORA'],
    'CALVAN,SUERTE':       ['CALVAN','SUE'],
  };
  const _NICK_MAP = {
    'AGUILAR,NORA':'NORA','ADHIKARI,BIMALA':'BIMALA','BALGOS,DENNIS':'DENNIS',
    'BELY,JULIA':'JULIA','BERANGO,KATHRYN':'KATHRYN','BOREHAM,JANA':'JANA',
    'BROTHERS,JOHN':'JOHN','BURLAKOTI,MUNA':'MUNA','CARPENTER,SUSANNA':'SUSANNA',
    'CHEN,AIHUA':'AIHUA','CICHELLA,COURTNIE':'COURTNIE','FORST,RYAN':'RYAN',
    'GAMBETTI,ALBERT':'AL','GAAS,REINETTE':'REINETTE','HABIBI,MARYAM':'MARYAM',
    'HECHONA,MEREMEL':'MEREMEL','HENDERSON,NATALIE':'NATALIE','HERNANDEZ,DONNA':'DONNA',
    'IMMEKER,REBECCA':'REBECCA','JARDINIANO,CATHERINE':'CATHERINE','JARDIANIANO,CATHERINE':'CATHERINE',
    'JOHN,JOMINA':'JOMINA','JONES,STEVEN':'STEVEN','KAUR,KAMALDEEP':'KAMALDEEP',
    'LOPEZ,DENISE':'DENISE','MADUIKE,SAMANTHA':'SAMANTHA','MAGNO,ROWENA':'ROWENA',
    'MCKEETH,CURTIS':'CURTIS','OYANGOREN,MASOCORRO':'MA','ROBSON,KELLI':'KELLI',
    'RYAN,MALGORZATA':'GOSIA','SHOQUIST,MICHAEL':'MICHAEL','SIGL,JOCELYN':'JOCELYN',
    'TRAN,TRANG':'TRANG','VARELA,CARMEN':'CARMEN','VARGHESE,ANU':'ANU',
    'VARGHESE,ASHA':'ASHA','VLASIK,MARIYA':'MARIYA','WALTON,RAVEN':'RAVEN',
  };
  function normKey(raw) {
    const n = normalizeName(raw); if (!n) return null;
    const k = n[0]+','+n[1];
    const a = _NAME_ALIASES[k]; return a ? a[0]+','+a[1] : k;
  }
  function getNick(rawName) {
    const k = normKey(rawName); if (!k) return rawName;
    if (_NICK_MAP[k]) return _NICK_MAP[k];
    const first = k.split(',')[1] || ''; return first || rawName;
  }

  // ── Date extraction (mirrors skill: handles Date obj, M/D strings, DO NOT ASSIGN, etc.) ──
  const _MD_RE = /(\d{1,2})\/(\d{1,2})/;
  function extractMD(val) {
    if (val == null) return null;
    if (val instanceof Date) { if (isNaN(val)) return null; return `${val.getMonth()+1}/${val.getDate()}`; }
    const s = String(val).trim(); if (!s) return null;
    if (/DO NOT ASSIGN/i.test(s)) return 'NA';
    if (/NEVER FLOAT/i.test(s)) return null;
    const m = _MD_RE.exec(s); if (m) return `${parseInt(m[1])}/${parseInt(m[2])}`;
    return null;
  }

  // ── Cell access helpers (1-indexed row/col) ──
  function getCell(ws, row, col) {
    const addr = XLSX.utils.encode_cell({r:row-1, c:col-1});
    const cell = ws[addr]; if (!cell) return null;
    if (cell.t==='d') return cell.v;
    return cell.v !== undefined ? cell.v : null;
  }
  function wsMaxRow(ws) { if (!ws['!ref']) return 0; return XLSX.utils.decode_range(ws['!ref']).e.r + 1; }
  function wsMaxCol(ws) { if (!ws['!ref']) return 0; return XLSX.utils.decode_range(ws['!ref']).e.c + 1; }

  // ── Tracker lookup: name col + rightward date scan (freshest = rightmost non-empty) ──
  function buildLookup(ws, nameCol, startDateCol, startRow, endRow) {
    const maxCol = wsMaxCol(ws), maxRow = wsMaxRow(ws);
    const table = {};
    for (let r = startRow; r <= Math.min(endRow, maxRow); r++) {
      const key = normKey(String(getCell(ws,r,nameCol)||''));
      if (!key) continue;
      let latest = null;
      for (let c = startDateCol; c <= maxCol; c++) { const md = extractMD(getCell(ws,r,c)); if (md !== null) latest = md; }
      if (latest !== null && !(key in table)) table[key] = latest;
    }
    return table;
  }

  function loadTracker(wb, shift) {
    const isNoc = shift === 'noc';
    const hcName    = isNoc ? 'NOC RN HC LIST'       : 'DAY RN HC LIST';
    const floatName = isNoc ? 'NOC RN FLOAT ROTATION' : 'DAY RN FLOAT ROTATION';
    const lookups = { rn_hc:{}, rn_float:{}, cna_sit:{}, cna_float:{} };
    const findWs = name => { const k = wb.SheetNames.find(n => n.toUpperCase()===name.toUpperCase()); return k ? wb.Sheets[k] : null; };

    const hcWs = findWs(hcName);
    if (hcWs) lookups.rn_hc = buildLookup(hcWs, 1, 3, 3, wsMaxRow(hcWs));
    const floatWs = findWs(floatName);
    if (floatWs) lookups.rn_float = buildLookup(floatWs, 1, 4, 4, wsMaxRow(floatWs));

    const cnaWs = findWs('CNA ROTATION');
    if (cnaWs) {
      const maxRow = wsMaxRow(cnaWs);
      let sitHdr=null, sitbreakHdr=null;
      for (let r=1; r<=Math.min(maxRow,400); r++) {
        const v = getCell(cnaWs,r,1); if (!v||typeof v!=='string') continue;
        const up = v.trim().toUpperCase();
        if (up==='CNA ROTATION LIST'||up.includes('IF CNA FLOATS')) continue;
        if (up.includes('SITTER BREAK ROTATION')) sitbreakHdr=r;
        else if (up.includes('SITTER ROTATION')) sitHdr=r;
      }
      const findDayHdr = (after,before) => { for(let r=after;r<before;r++){ const v=getCell(cnaWs,r,1); if(v&&typeof v==='string'&&v.toUpperCase().includes('EMPLOYEE-DAY')) return r; } return null; };
      const findNocHdr = (after,before) => { for(let r=after;r<before;r++){ const v=getCell(cnaWs,r,1); if(v&&typeof v==='string'&&v.toUpperCase().includes('EMPLOYEE-NOC')) return r; } return null; };
      const floatDayHdr = findDayHdr(1, sitHdr||maxRow);
      if (floatDayHdr) lookups.cna_float = buildLookup(cnaWs,1,3,floatDayHdr+1,(sitHdr||maxRow)-1);
      if (sitHdr) {
        const sitDayHdr = findDayHdr(sitHdr, sitbreakHdr||maxRow);
        const sitEnd = (sitbreakHdr||maxRow)-1;
        if (sitDayHdr) {
          if (isNoc) { const nHdr=findNocHdr(sitDayHdr,sitbreakHdr||maxRow); if(nHdr) lookups.cna_sit=buildLookup(cnaWs,1,3,nHdr+1,sitEnd); }
          else { const nHdr=findNocHdr(sitDayHdr,sitbreakHdr||maxRow); lookups.cna_sit=buildLookup(cnaWs,1,3,sitDayHdr+1,nHdr?nHdr-1:sitEnd); }
        }
      }
    }
    return lookups;
  }

  async function generate() {
    setErr(''); setBusy(true);
    const dbg = [];
    try {
      if (!files.roster)  throw new Error('Please select the Daily Roster file.');
      if (!files.tracker) throw new Error('Please select the Rotation Tracker file.');

      const rWb = await readWb(files.roster);
      const tWb = await readWb(files.tracker);
      dbg.push(`Roster sheets: ${rWb.SheetNames.join(', ')}`);
      dbg.push(`Tracker sheets: ${tWb.SheetNames.join(', ')}`);

      // Pick the MT / Med Tele sheet.
      // Strategy 1: scan rows 8-14 of each sheet for "TELEMETRY" or "MED.*TEL" in the department line.
      // Strategy 2: fall back to sheet-name matching ("MT", "MED/TELE", "Med Tele", etc.)
      // Strategy 3: try Sheet2 first, then first sheet with data (xlsx default).
      const normSN = n => n.toLowerCase().replace(/[^a-z0-9]/g, '');
      function sheetHasTelemetry(ws) {
        if (!ws) return false;
        for (let r = 8; r <= 14; r++) {
          const v = getCell(ws, r, 1);
          if (v && typeof v === 'string' && /TELEMETRY|MED.*TEL/i.test(v)) return true;
        }
        return false;
      }
      let rWs = null, usedSheet = '';
      // Strategy 1: department name scan (most reliable for xlsm multi-unit files)
      const telSheet = rWb.SheetNames.find(n => sheetHasTelemetry(rWb.Sheets[n]));
      // Strategy 2: sheet name matching
      const mtByName = !telSheet && rWb.SheetNames.find(n => {
        const nn = normSN(n);
        return nn === 'mt' || nn === 'medtele' || nn.startsWith('medtele') ||
               (nn.startsWith('med') && nn.includes('tele'));
      });
      const mtSheet = telSheet || mtByName || null;
      dbg.push(`MT sheet: ${mtSheet||'(none)'} via ${telSheet?'dept':mtByName?'name':'(none)'}`);
      const ordered = mtSheet
        ? [mtSheet, ...rWb.SheetNames.filter(n => n !== mtSheet)]
        : rWb.SheetNames.filter(n=>n==='Sheet2').concat(rWb.SheetNames.filter(n=>n!=='Sheet2'));
      for (const sn of ordered) {
        const ws = rWb.Sheets[sn];
        if (!ws) continue;
        if (wsMaxRow(ws) > 5) { rWs = ws; usedSheet = sn; break; }
      }
      if (!rWs) throw new Error('Could not read any sheet from the roster file.');
      dbg.push(`Using roster sheet: "${usedSheet}"`);

      // Detect shift from any cell in rows 1-20 containing "Coverage Period"
      let shift = 'day';
      outer: for (let r=1; r<=20; r++) {
        for (let c=1; c<=5; c++) {
          const v = getCell(rWs,r,c);
          if (v && typeof v==='string' && v.includes('Coverage Period')) {
            const m = /(\d{3,4})\s*-\s*(\d{3,4})/.exec(v);
            if (m) { const s=parseInt(m[1]); shift=(s>=1700||s<600)?'noc':'day'; }
            break outer;
          }
        }
      }
      dbg.push(`Shift: ${shift.toUpperCase()}`);

      // Find header row and name column by scanning for "Employee Name" anywhere in rows 1-30
      let headerRow = -1, nameCol = 3, profCol = 6, codeCol = 10;
      outer2: for (let r=1; r<=30; r++) {
        for (let c=1; c<=20; c++) {
          const v = getCell(rWs,r,c);
          if (v && typeof v==='string' && /employee.?name/i.test(v)) {
            headerRow = r; nameCol = c;
            dbg.push(`Found "Employee Name" at row ${r} col ${c}`);
            // Now scan the same row for Profile/Type, and Code columns
            for (let cc=1; cc<=20; cc++) {
              const hv = String(getCell(rWs,r,cc)||'').toUpperCase();
              if (/\bPROFILE\b|\bTYPE\b|\bCLASS\b|\bPOSITION\b/.test(hv) && cc!==nameCol) profCol=cc;
              if (/\bCODE\b|\bSCHED/.test(hv) && cc!==nameCol) codeCol=cc;
            }
            break outer2;
          }
        }
      }
      // Fall back to known skill positions if header not found
      if (headerRow === -1) {
        headerRow = 14; nameCol = 3; profCol = 6; codeCol = 10;
        dbg.push(`Header not found, using defaults: row ${headerRow}, name col ${nameCol}`);
      }
      dbg.push(`Columns — name:${nameCol} profile:${profCol} code:${codeCol}`);

      const dataStart = headerRow + 1;
      // Find data end: scan from dataStart until we hit 3 consecutive empty name cells
      let dataEnd = headerRow; // start at header so we can detect 0-data case
      let emptyRun = 0;
      for (let r=dataStart; r<=Math.min(wsMaxRow(rWs), dataStart+200); r++) {
        const name = getCell(rWs,r,nameCol);
        const hasName = name && String(name).trim().length > 0;
        if (hasName) { dataEnd=r; emptyRun=0; }
        else { emptyRun++; if (emptyRun>=3) break; }
      }
      dbg.push(`Data rows: ${dataStart}–${dataEnd} (${dataEnd-dataStart+1} rows)`);

      if (dataEnd < dataStart) {
        throw new Error(
          `No employee rows found in roster.\n` +
          `Looked in col ${nameCol} starting at row ${dataStart}.\n` +
          dbg.join('\n')
        );
      }

      const lookups = loadTracker(tWb, shift);
      dbg.push(`Tracker — RN HC: ${Object.keys(lookups.rn_hc).length}, Float: ${Object.keys(lookups.rn_float).length}, CNA Sit: ${Object.keys(lookups.cna_sit).length}, Float: ${Object.keys(lookups.cna_float).length}`);
      const hasAnyHC  = Object.keys(lookups.rn_hc).length>0;
      const hasAnyFlt = Object.keys(lookups.rn_float).length>0||Object.keys(lookups.cna_float).length>0;
      const hasAnySit = Object.keys(lookups.cna_sit).length>0;

      // Profile classification (exact match to skill spec)
      const RN_CLASS  = new Set(['RN','RES/BRK','RN CHG']);
      const CNA_CLASS = new Set(['CNA']);
      const CNA_NO_DATES = new Set(['SA(P)']);
      const NO_TRACK  = new Set(['US','NSM','MON TECH','MGR']);
      const NO_NUMBER = new Set(['LT DUTY']);
      const NO_DATES  = new Set(['PRCPT']);
      const EMP_OVERRIDES = { 'BHANGU,PAVANDEEP': new Set(['skip_left']) };

      let rnSeq=0, cnaSeq=0;
      const rows=[], unmatched=[];

      for (let r=dataStart; r<=dataEnd; r++) {
        const nameVal = getCell(rWs,r,nameCol);
        const profVal = getCell(rWs,r,profCol);
        const codeVal = getCell(rWs,r,codeCol);
        const name    = nameVal ? String(nameVal).trim() : '';
        if (!name) continue;
        const profile = profVal ? String(profVal).trim() : '';
        const code    = codeVal ? String(codeVal).trim().toUpperCase() : '';

        const key       = normKey(name);
        const overrides = (key && EMP_OVERRIDES[key]) || new Set();
        const isRN      = RN_CLASS.has(profile);
        const isCNA     = CNA_CLASS.has(profile);
        const isCNAND   = CNA_NO_DATES.has(profile);
        const noTrack   = NO_TRACK.has(profile);
        const noNumber  = NO_NUMBER.has(code);
        const noDate    = NO_DATES.has(code);

        let seq=null, hc='', flt='', sit='';

        if (!noNumber && !noTrack) {
          if (isRN)              { rnSeq++;  seq=rnSeq; }
          else if (isCNA||isCNAND) { cnaSeq++; seq=cnaSeq; }

          if (!noDate && !isCNAND) {
            if (isRN && key) {
              const attempted=[];
              if (!overrides.has('skip_left'))  { hc  = lookups.rn_hc[key]    || ''; attempted.push(hc); }
              if (!overrides.has('skip_right')) { flt = lookups.rn_float[key] || ''; attempted.push(flt); }
              if (attempted.length && attempted.every(x=>!x)) unmatched.push(name);
            } else if (isCNA && key) {
              if (!overrides.has('skip_left'))  sit = lookups.cna_sit[key]   || '';
              if (!overrides.has('skip_right')) flt = lookups.cna_float[key] || '';
              if (!sit && !flt) unmatched.push(name);
            }
          }
        }

        rows.push({ seq:seq?String(seq):'', name, profile, code, shift, hc, flt, sit,
          rooms:'', isMedSurg:false, excelRow:r,
          isRN, isCNA:isCNA||isCNAND, noTrack });
      }
      dbg.push(`Processed: ${rows.length} employees (RN: ${rnSeq}, CNA: ${cnaSeq}, unmatched: ${unmatched.length})`);

      // ── Optional assignment sheets: room assignment + Med/Surg detection (ms-turn style) ──
      let turnOrder = null;
      const assignFiles = Array.isArray(files.assign) ? files.assign : (files.assign ? [files.assign] : []);
      if (assignFiles.length > 0) {
        const HEART = '♥';
        const ROOM_RE = /\d+[A-Za-z]?[♥]?/g;
        const SKIP_KW = ['FOLEY','LINE','NAME','EXT','SHIFT','CENSUS','SITTER'];
        const looksLikeRooms = v => {
          if (!v) return false;
          const s = String(v);
          if (SKIP_KW.some(k => s.toUpperCase().includes(k))) return false;
          const t = s.match(ROOM_RE)||[];
          return t.length >= 2 && !t.some(x => x.length > 5);
        };

        for (const assignFile of assignFiles) {
          const aWb = await readWb(assignFile);
          const aWs = aWb.Sheets[aWb.SheetNames[0]];
          if (!aWs) continue;
          const maxR=wsMaxRow(aWs), maxC=wsMaxCol(aWs);
          let nameRow=null, roomRow=null, bestScore=0;
          for (let nr=1; nr<=Math.min(maxR-1,7); nr++) {
            for (let rr=nr+1; rr<=Math.min(nr+7,maxR); rr++) {
              let score=0;
              for (let c=1;c<=maxC;c++) { if(looksLikeRooms(getCell(aWs,rr,c))) score++; }
              if (score > bestScore) { bestScore=score; nameRow=nr; roomRow=rr; }
            }
          }
          if (nameRow && roomRow && bestScore >= 2) {
            for (let c=1; c<=maxC; c++) {
              const nmV = getCell(aWs,nameRow,c);
              const rmV = getCell(aWs,roomRow,c);
              if (!nmV||!rmV) continue;
              const nm = String(nmV).trim(); if (nm.length < 2) continue;
              const rm = String(rmV).trim();
              const row = rows.find(x => {
                const nk = normKey(x.name), ak = normKey(nm);
                return nk && ak && nk===ak;
              }) || rows.find(x => x.name.toUpperCase()===nm.toUpperCase());
              if (row) {
                row.rooms = row.rooms ? `${row.rooms} / ${rm}` : rm;
                const tokens = rm.match(ROOM_RE)||[];
                if (tokens.length >= 2 && !tokens.some(t => t.includes(HEART))) row.isMedSurg = true;
              }
            }
          }
          dbg.push(`Assignment "${assignFile.name}": nameRow=${nameRow} roomRow=${roomRow} score=${bestScore}`);
        }

        // Med/Surg turn order: RN + RES/BRK only, not RN CHG
        const eligible = rows.filter(r => r.isRN && r.profile !== 'RN CHG');
        if (eligible.length) {
          turnOrder = eligible.map(r => ({
            name: r.name, nick: getNick(r.name), profile: r.profile,
            isMedSurgToday: r.isMedSurg, lastMS: null, daysAgo: 9999,
          }));
        }
      }

      // ── Optional Med/Surg history (MedSurg_Assignments_Summary.xlsx) ──
      if (files.msHistory && turnOrder) {
        const mWb = await readWb(files.msHistory);
        const byDayName = mWb.SheetNames.find(n=>n==='By Day') || mWb.SheetNames[0];
        const mWs = mWb.Sheets[byDayName];
        if (mWs) {
          const lastMSMap = {};
          for (let r=2; r<=wsMaxRow(mWs); r++) {
            const dateV  = getCell(mWs,r,1);
            const nurseV = getCell(mWs,r,2);
            if (!dateV||!nurseV) continue;
            const nick = String(nurseV).split('/')[0].trim();
            const md = extractMD(dateV);
            if (!md) continue;
            // Parse to Date for comparison (assume current year)
            const parts = md.split('/');
            const yr = 2026;
            const dt = new Date(yr, parseInt(parts[0])-1, parseInt(parts[1]));
            if (!lastMSMap[nick] || dt > lastMSMap[nick]) lastMSMap[nick] = { dt, label: md };
          }
          const today = new Date();
          turnOrder.forEach(t => {
            const rec = lastMSMap[t.nick];
            if (rec) {
              t.lastMS  = rec.label;
              t.daysAgo = Math.floor((today - rec.dt) / 86400000);
            }
          });
        }
      }

      // Sort: NEVER first, then most days ago
      if (turnOrder) {
        turnOrder.sort((a,b) => {
          if (a.daysAgo===9999 && b.daysAgo!==9999) return -1;
          if (b.daysAgo===9999 && a.daysAgo!==9999) return 1;
          return b.daysAgo - a.daysAgo;
        });
      }

      const hasRooms = rows.some(r=>r.rooms);
      setResult({ rows, rnCount:rnSeq, cnaCount:cnaSeq, unmatched, shift:shift.toUpperCase(),
        hasHC:hasAnyHC, hasFlt:hasAnyFlt, hasSit:hasAnySit, hasRooms, turnOrder, dbg,
        rWb, usedSheet, headerRow, nameCol, profCol });
      setView('preview');
    } catch(e) {
      setErr((e.message || String(e)) + (dbg.length ? '\n\nDiagnostic:\n'+dbg.join('\n') : ''));
    } finally {
      setBusy(false);
    }
  }

  function downloadExcel() {
    if (!result || !result.rWb) return;

    // Use the original roster workbook as the base (preserves layout/formatting)
    const wb = result.rWb;
    const ws = wb.Sheets[result.usedSheet];
    const hdr = result.headerRow; // 1-indexed

    // Date sort: M/D strings ascending (e.g. '3/9' < '7/22')
    function mdVal(s) {
      if (!s || s === 'NA') return s === 'NA' ? 99999 : Infinity;
      const [m,d] = s.split('/').map(Number);
      return m*100 + (d||0);
    }

    // Remove only the sheets that aren't Sheet2; we'll add our own
    for (const sn of [...wb.SheetNames]) {
      if (sn !== result.usedSheet) { delete wb.Sheets[sn]; }
    }
    wb.SheetNames = [result.usedSheet];

    // xlsm MT-sheet remapping: Profile col4→col6, Time col5→col11 (mirrors Python xlsm_remap_sheet)
    // profCol===4 means we read from an xlsm MT sheet, not Sheet2
    if (result.profCol === 4) {
      ws['!merges'] = []; // clear all merged cells first
      const remapEnd = result.rows.length > 0 ? Math.max(...result.rows.map(r => r.excelRow)) : hdr;
      for (let ri0 = hdr - 1; ri0 <= remapEnd - 1; ri0++) {
        const pCell = ws[XLSX.utils.encode_cell({r:ri0, c:3})]; // Profile was at col4 (0-based 3)
        const tCell = ws[XLSX.utils.encode_cell({r:ri0, c:4})]; // Time was at col5 (0-based 4)
        // Copy to Sheet2 target positions
        if (pCell) ws[XLSX.utils.encode_cell({r:ri0, c:5})]  = {...pCell}; // → col6 (0-based 5)
        else        delete ws[XLSX.utils.encode_cell({r:ri0, c:5})];
        if (tCell) ws[XLSX.utils.encode_cell({r:ri0, c:10})] = {...tCell}; // → col11 (0-based 10)
        else        delete ws[XLSX.utils.encode_cell({r:ri0, c:10})];
        // Clear source cols and unused cols 7-10 (0-based 3,4,6,7,8,9)
        [3,4,6,7,8,9].forEach(c => delete ws[XLSX.utils.encode_cell({r:ri0, c})]);
      }
      // Rename sheet to Sheet2
      wb.Sheets['Sheet2'] = ws;
      wb.SheetNames = ['Sheet2'];
      delete wb.Sheets[result.usedSheet];
    }

    // Strip merged cells that overlap col B(1), M(12), N(13), O(14)
    // for header row and all data rows — so our writes aren't swallowed by merges
    const targetCols = new Set([1,12,13,14]); // 0-based col indices
    const dataRowIdxSet = new Set(result.rows.map(r => r.excelRow - 1));
    dataRowIdxSet.add(hdr - 1);
    if (ws['!merges']) {
      ws['!merges'] = ws['!merges'].filter(mr => {
        if (!dataRowIdxSet.has(mr.s.r)) return true;
        for (let c = mr.s.c; c <= mr.e.c; c++) {
          if (targetCols.has(c)) return false;
        }
        return true;
      });
    }

    // Write column headers in header row: 'hc' → M, 'float' → O
    function setCell(ri, ci, val) { // ri/ci are 0-based
      const addr = XLSX.utils.encode_cell({r:ri, c:ci});
      if (val === null || val === undefined || val === '') { delete ws[addr]; return; }
      ws[addr] = typeof val === 'number' ? {t:'n', v:val} : {t:'s', v:String(val)};
    }
    setCell(hdr-1, 12, 'hc');
    setCell(hdr-1, 14, 'float');

    // Write each employee row: col B = seq#, col L = clear, col M = HC/sit, col O = float
    result.rows.forEach(r => {
      const ri = r.excelRow - 1; // 0-based
      if (r.seq) setCell(ri, 1, parseInt(r.seq, 10)); else setCell(ri, 1, null);
      setCell(ri, 11, null); // clear Hours (col L)
      const leftDate = r.isRN ? r.hc : r.sit;
      setCell(ri, 12, leftDate || null);
      setCell(ri, 14, r.flt || null);
    });

    // Clear rows below last data row (summary block)
    const lastDataExcelRow = result.rows.length > 0
      ? Math.max(...result.rows.map(r => r.excelRow)) : hdr;
    const maxR = (() => {
      if (!ws['!ref']) return lastDataExcelRow;
      const ref = XLSX.utils.decode_range(ws['!ref']);
      return ref.e.r + 1; // convert to 1-based
    })();
    for (let r = lastDataExcelRow + 1; r <= maxR; r++) {
      for (let c = 0; c < 20; c++) {
        const addr = XLSX.utils.encode_cell({r:r-1, c});
        delete ws[addr];
      }
    }
    // Update sheet ref to trim to last data row
    if (ws['!ref']) {
      const ref = XLSX.utils.decode_range(ws['!ref']);
      ref.e.r = lastDataExcelRow - 1;
      ws['!ref'] = XLSX.utils.encode_range(ref);
    }

    // Helper: append a new sheet from array-of-arrays
    function appendSheet(name, aoa) {
      const newWs = XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb, newWs, name);
    }

    // RN HC List — sorted by HC ascending
    const rnClass = result.rows.filter(r => r.isRN);
    const hcSorted = [...rnClass].filter(r=>r.hc).sort((a,b) => mdVal(a.hc) - mdVal(b.hc));
    const hcAoa = [
      ['RN-class — sorted by HC (ascending)'],
      [],
      ['#', 'HC', 'Name'],
      ...hcSorted.map((r,i) => [i+1, r.hc, r.name])
    ];
    appendSheet('RN HC List', hcAoa);

    // RN Float List — sorted by Float ascending
    const fltSorted = [...rnClass].filter(r=>r.flt).sort((a,b) => mdVal(a.flt) - mdVal(b.flt));
    const fltAoa = [
      ['RN-class — sorted by Float (ascending)'],
      [],
      ['Float', 'Name'],
      ...fltSorted.map(r => [r.flt, r.name])
    ];
    appendSheet('RN Float List', fltAoa);

    // MS Turn sheet (if turn analysis was done)
    if (result.turnOrder && result.turnOrder.length > 0) {
      const dateStr = new Date().toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'numeric'});
      const shiftLabel = result.shift || 'DAY';
      const msAoa = [
        [`${dateStr} ${shiftLabel} Shift — Med/Surg Turn`],
        [],
        ['NURSE', 'PROFILE', 'LAST MED/SURG', 'DAYS AGO'],
        ...result.turnOrder.map(t => [
          t.name, t.profile,
          t.lastDate || (t.daysAgo === 9999 ? 'NEVER' : ''),
          t.daysAgo === 9999 ? 'NEVER' : (t.daysAgo ?? '')
        ]),
        [],
        ['RECOMMENDATION'],
        ['Next Med/Surg:', result.turnOrder[0]?.name || '']
      ];
      appendSheet('MS Turn', msAoa);
    }

    const today = new Date().toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'2-digit'}).replace(/\//g,'-');
    XLSX.writeFile(wb, `Final_${today}.xlsx`);
  }

  function doPrint() {

              {result.turnOrder && result.turnOrder.length > 0 && (

                  <div style={{fontSize:12,fontWeight:800,color:'#f59e0b',marginBottom:8,letterSpacing:'0.05em'}}>
                    🏥 MED/SURG TURN ORDER
                    {!files.msHistory && <span style={{fontWeight:400,fontSize:10,marginLeft:8,color:'var(--text-2)'}}>Upload Med/Surg History for days-ago ranking</span>}
                  </div>
                  {(() => {
                    const never = result.turnOrder.filter(t => t.daysAgo===9999);
                    const had   = result.turnOrder.filter(t => t.daysAgo!==9999);
                    return (
                      <div>
                        {never.length > 0 && (
                          <div style={{marginBottom:8}}>
                            <div style={{fontSize:10,fontWeight:700,color:'#ef4444',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Has NEVER had Med/Surg — assign first:</div>

                              <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'4px 0',borderBottom:'1px solid rgba(245,158,11,0.1)'}}>

                                {t.isMedSurgToday && <span style={{fontSize:9,fontWeight:700,color:'#f59e0b',background:'rgba(245,158,11,0.2)',borderRadius:3,padding:'1px 5px'}}>TODAY</span>}

                        {had.length > 0 && (
                          <div>
                            <div style={{fontSize:10,fontWeight:700,color:'#60a5fa',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>
                              {never.length > 0 ? 'Then by most overdue:' : 'Most overdue for Med/Surg:'}
                            </div>
                            {had.map((t,i) => (
                              <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'4px 0',borderBottom:'1px solid rgba(245,158,11,0.1)'}}>
                                <span style={{width:20,height:20,borderRadius:'50%',background:'#60a5fa',color:'white',fontSize:10,fontWeight:800,display:'inline-flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{never.length+i+1}</span>
                                <span style={{fontWeight:600,color:'var(--text-1)',fontSize:12}}>{t.name}</span>
                                <span style={{fontSize:10,color:'var(--text-2)'}}>{t.profile}</span>
                                {t.lastMS && <span style={{fontSize:10,color:'var(--text-2)'}}>last: {t.lastMS}</span>}
                                {t.daysAgo < 9999 && <span style={{fontSize:10,color:t.daysAgo>20?'#4ade80':t.daysAgo>10?'#fbbf24':'#f87171'}}>{t.daysAgo}d ago</span>}
                                {t.isMedSurgToday && <span style={{fontSize:9,fontWeight:700,color:'#f59e0b',background:'rgba(245,158,11,0.2)',borderRadius:3,padding:'1px 5px'}}>TODAY</span>}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })()}
                </div>
              )}

              {/* Diagnostic panel */}
              {result.dbg && result.dbg.length > 0 && (
                <details style={{marginTop:12}}>
                  <summary style={{cursor:'pointer',fontSize:10,color:'var(--text-2)',userSelect:'none'}}>🔍 Diagnostic info</summary>
                  <pre style={{margin:'6px 0 0',padding:'8px 10px',background:'var(--bg-card)',borderRadius:6,fontSize:10,color:'var(--text-2)',overflowX:'auto',whiteSpace:'pre-wrap'}}>
                    {result.dbg.join('\n')}
                  </pre>
                </details>
              )}

              {result.rows.length === 0 && (
                <div style={{textAlign:'center',padding:'32px 0',color:'var(--text-2)',fontSize:13}}>
                  ⚠️ No employee rows were found. Check the Diagnostic info above.
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ExportSheetModal({ nurses, rooms, onClose }) {
  const [status, setStatus] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const printFrameRef = React.useRef();

  // Strip "11" prefix, drop leading zero → "1106"→"6", "1111A"→"11A"
  function fmtRoom(room) {
    const num = room.id.replace(/^11/, '').replace(/^0/, '');
    return room.type === 'TELE' ? num + '♥' : num;  // ♥ as unicode
  }

  // Build rooms cell: 2 per line, ~22 spaces between (matching template),
  // single blank line (\n\n) between pairs — same format as completed example
  function buildRoomsCell(nurseId) {
    const assigned = Object.values(rooms)
      .filter(r => r.nurseId === nurseId && r.occupied)
      .sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
    if (!assigned.length) return '';
    const parts = assigned.map(fmtRoom);
    const lines = [];
    for (let i = 0; i < parts.length; i += 2) {
      const left  = parts[i];
      const right = parts[i + 1];
      // Pad left to 20 chars (matching template visual column width)
      lines.push(right ? left.padEnd(20) + right : left);
    }
    return lines.join('\n\n');   // ONE blank line between pairs
  }

  // Plain array of room labels for a nurse (used by the print view)
  function buildRoomsList(nurseId) {
    return Object.values(rooms)
      .filter(r => r.nurseId === nurseId && r.occupied)
      .sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }))
      .map(fmtRoom);
  }

  function buildGroup(groupNurses) {
    return groupNurses.slice(0, 10).map(n => ({
      name: n.name,
      nurseId: n.id,
      rooms: buildRoomsCell(n.id),
      roomList: buildRoomsList(n.id),
    }));
  }

  // Acuity/summary stats for the rooms assigned to a group of nurses
  function groupStats(group) {
    const ids = new Set(group.map(g => g.nurseId));
    const assigned = Object.values(rooms).filter(r => r.occupied && ids.has(r.nurseId));
    const count = key => assigned.filter(r => r[key]).length;
    const listRooms = key => assigned.filter(r => r[key])
      .sort((a,b) => a.id.localeCompare(b.id, undefined, { numeric: true }))
      .map(fmtRoom);
    return {
      totalCare:      count('totalCare'),
      iso:            count('isolation'),
      fsbg:           count('glucose'),
      q2:             count('neuroCheck'),
      discharge:      count('discharge'),
      sitterRooms:    listRooms('sitter'),
      foleyRooms:     listRooms('foley'),
      lineRooms:      listRooms('centralLine'),
      restraintRooms: listRooms('restraint'),
    };
  }

  function buildPreview() {
    const am = nurses.filter(n => n.shift !== 'PM');
    const pm = nurses.filter(n => n.shift === 'PM');
    return { am: buildGroup(am), pm: buildGroup(pm) };
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function doPrint() {
    const now   = new Date();
    const mm    = String(now.getMonth()+1).padStart(2,'0');
    const dd    = String(now.getDate()).padStart(2,'0');
    const yyyy  = now.getFullYear();
    const today = `${mm}/${dd}/${yyyy}`;

    function buildRows(group) {
      return group.map(({ name, roomList }, i) => `
      <tr>
        <td>${i+1}</td>
        <td>${escapeHtml(name)}</td>
        <td>${roomList.length ? roomList.map(escapeHtml).join(', ') : '<span class="empty">no rooms assigned</span>'}</td>
      </tr>`).join('');
    }

    function buildSection(title, group, stats) {
      return `
  <h2>${title}</h2>
  <table>
    <thead><tr><th style="width:36px">#</th><th style="width:160px">Nurse</th><th>Assigned Rooms</th></tr></thead>
    <tbody>${group.length ? buildRows(group) : `<tr><td colspan="3"><span class="empty">No nurses on this shift</span></td></tr>`}</tbody>
  </table>
  <div class="acuity">
    Total Care: <b>${stats.totalCare}</b> &nbsp;·&nbsp;
    Isolation: <b>${stats.iso}</b> &nbsp;·&nbsp;
    FSBG: <b>${stats.fsbg}</b> &nbsp;·&nbsp;
    Q2 Turns: <b>${stats.q2}</b> &nbsp;·&nbsp;
    D/C: <b>${stats.discharge}</b>
    ${stats.sitterRooms.length ? `&nbsp;·&nbsp; Sitter: <b>${stats.sitterRooms.join(', ')}</b>` : ''}
    ${stats.foleyRooms.length ? `&nbsp;·&nbsp; Foley: <b>${stats.foleyRooms.join(', ')}</b>` : ''}
    ${stats.lineRooms.length ? `&nbsp;·&nbsp; Line: <b>${stats.lineRooms.join(', ')}</b>` : ''}
    ${stats.restraintRooms.length ? `&nbsp;·&nbsp; Restraint: <b>${stats.restraintRooms.join(', ')}</b>` : ''}
  </div>`;
    }

    const html = `<!DOCTYPE html><html><head><title>ChargeFlow Assignment Sheet — ${today}</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; padding: 28px; color:#0f172a; }
  h1 { font-size: 19px; margin: 0 0 2px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color:#475569; margin: 22px 0 8px; }
  .meta { font-size: 12px; color:#64748b; margin-bottom: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #cbd5e1; padding: 7px 10px; text-align: left; vertical-align: top; }
  th { background: #f1f5f9; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color:#475569; }
  tr:nth-child(even) td { background: #f8fafc; }
  .empty { color:#94a3b8; font-style: italic; }
  .acuity { font-size: 11px; color:#475569; margin-top: 6px; }
  @media print { body { padding: 12px; } h2:first-of-type { margin-top: 0; } }
</style></head><body>
  <h1>ChargeFlow — Assignment Sheet</h1>
  <div class="meta">Date: ${today}</div>
  ${buildSection('AM Shift', preview.am, groupStats(preview.am))}
  ${buildSection('PM / NOC Shift', preview.pm, groupStats(preview.pm))}
</body></html>`;

    const frame = printFrameRef.current;
    if (!frame) { return; }
    const doc = frame.contentDocument || frame.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
    setTimeout(() => {
      try { frame.contentWindow.focus(); frame.contentWindow.print(); }
      catch(e) { console.warn('Print failed', e); }
    }, 200);
  }

  async function doExport() {
    setLoading(true);
    setStatus('Building sheet…');
    try {
      const XLSX = window.XLSX;

      const binary = atob(STAFFING_TEMPLATE_B64);
      const buf = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) buf[i] = binary.charCodeAt(i);

      const wb = XLSX.read(buf, { type: 'array', cellStyles: true, cellNF: true });
      const ws = wb.Sheets[wb.SheetNames[0]];

      const now   = new Date();
      const mm    = String(now.getMonth()+1).padStart(2,'0');
      const dd    = String(now.getDate()).padStart(2,'0');
      const yyyy  = now.getFullYear();
      const today = `${mm}/${dd}/${yyyy}`;
      const cols  = ['C','D','E','F','G','H','I','J','K','L'];

      // Styles matching the completed example exactly:
      // Names: Calibri bold 15pt, centered
      const nameStyle = {
        font:      { bold: true, sz: 15, name: 'Calibri' },
        alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
      };
      // Rooms: Calibri bold 14pt, top-aligned, wrap text (matches C9-K9 in example)
      const roomStyle = {
        font:      { bold: true, sz: 14, name: 'Calibri' },
        alignment: { vertical: 'top', wrapText: true },
      };

      function setCell(ref, val, style) {
        if (ws[ref]) {
          ws[ref].t = 's';
          ws[ref].v = val;
          ws[ref].w = val;
          delete ws[ref].f;
          if (style) ws[ref].s = style;
        } else {
          ws[ref] = { t: 's', v: val, w: val, ...(style ? { s: style } : {}) };
        }
      }

      // Dates
      setCell('C3',  `DATE\n\n${today}`);
      setCell('C14', `DATE\n\n${today}`);

      // AM shift: row 5 names, row 9 rooms · PM/NOC shift: row 16 names, row 20 rooms
      const preview = buildPreview();
      preview.am.forEach(({ name, rooms: roomsStr }, i) => {
        const col = cols[i];
        if (!col) return;
        setCell(col + '5', name,     nameStyle);
        setCell(col + '9', roomsStr, roomStyle);
      });
      preview.pm.forEach(({ name, rooms: roomsStr }, i) => {
        const col = cols[i];
        if (!col) return;
        setCell(col + '16', name,     nameStyle);
        setCell(col + '20', roomsStr, roomStyle);
      });

      // ── AM shift summary fields ──
      const amStats = groupStats(preview.am);
      setCell('K3', `TOTAL CARE\n\n${amStats.totalCare}`);
      setCell('N3', `DAY ACUITY: \nISO - ${amStats.iso}\nFSBG - ${amStats.fsbg}\nQ2 TURNS - ${amStats.q2}\nTOTALS - ${amStats.iso + amStats.fsbg + amStats.q2}`);
      setCell('N5', ` AM PYSCH SITTER\n\n${amStats.sitterRooms.join('\n')}`);
      { const lines = [];
        if (amStats.foleyRooms.length) lines.push(`FOLEY-${amStats.foleyRooms.join(', ')}`);
        if (amStats.lineRooms.length)  lines.push(`LINE-${amStats.lineRooms.join(', ')}`);
        setCell('N9', lines.join('\n')); }
      setCell('N12', `D/C - ADMITS\n\nD/C= ${amStats.discharge}\nADMITS=`);

      // ── PM/NOC shift summary fields ──
      const pmStats = groupStats(preview.pm);
      setCell('L14', `TOTAL CARE\n\n${pmStats.totalCare}`);
      setCell('N14', `NIGHT ACUITY: \nISO - ${pmStats.iso}\nFSBG - ${pmStats.fsbg}\nQ2 TURNS - ${pmStats.q2}\nTOTALS - ${pmStats.iso + pmStats.fsbg + pmStats.q2}`);
      setCell('N16', `  PM PSYCH SITTER \n \n${pmStats.sitterRooms.join('\n')}`);
      setCell('N20', `PM SAFETY SITTER \n\n${pmStats.restraintRooms.join('\n')}`);
      setCell('N23', `D/C - ADMITS\n\nD/C=  ${pmStats.discharge}\nADMITS = `);

      setStatus('Downloading…');
      const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx', cellStyles: true });
      const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = `ChargeFlow_${mm}-${dd}-${yyyy}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus('✓ Downloaded successfully!');
    } catch(e) {
      console.error(e);
      setStatus('✗ Error: ' + e.message);
    }
    setLoading(false);
  }

  const preview = buildPreview();
  const totalNurses = preview.am.length + preview.pm.length;

  function renderGroup(title, group) {
    const assignedCount = group.filter(n=>n.rooms).length;
    return (
      <div style={{ marginBottom:14 }}>
        <div style={{ fontSize:11, fontWeight:700, color:'var(--text-4)', textTransform:'uppercase',
          letterSpacing:'0.09em', marginBottom:8 }}>
          {title} — {assignedCount} of {group.length} nurses assigned
        </div>
        <div style={{ borderRadius:10, overflow:'hidden', border:'1px solid var(--border-sub)' }}>
          {group.length === 0 ? (
            <div style={{ padding:'18px 14px', color:'var(--text-4)', fontSize:12, fontStyle:'italic' }}>
              No nurses on this shift. Use the AM/PM toggle on each nurse card to assign them.
            </div>
          ) : group.map(({ name, rooms: roomsStr }, i) => (
            <div key={i} style={{
              display:'flex', gap:0, borderBottom: i < group.length-1 ? '1px solid var(--border-sub)' : 'none',
            }}>
              <div style={{ width:130, flexShrink:0, padding:'8px 12px',
                borderRight:'1px solid var(--border-sub)',
                fontSize:12, fontWeight:700, color:'var(--text-1)',
                background: roomsStr ? 'rgba(79,142,247,0.08)' : 'transparent',
                display:'flex', alignItems:'center' }}>
                #{i+1} {name}
              </div>
              <div style={{ flex:1, padding:'8px 12px',
                fontSize:11, color: roomsStr ? 'var(--text-2)' : 'var(--text-5)',
                fontStyle: roomsStr ? 'normal' : 'italic',
                fontFamily:'monospace', lineHeight:1.6, whiteSpace:'pre' }}>
                {roomsStr.replace(/\n\n/g, '  ·  ') || 'no rooms assigned'}
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ width: 540 }}>
        <div className="modal-header">
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <div style={{ display:'flex', alignItems:'center', gap:8 }}>
              <span style={{ fontSize:20 }}>📋</span>
              <h2 style={{ margin:0, fontSize:17, fontWeight:800, color:'var(--text-1)' }}>Export Assignment Sheet</h2>
            </div>
            <button className="btn btn-ghost" onClick={onClose}>✕</button>
          </div>
          <p style={{ margin:'6px 0 0', fontSize:12, color:'var(--text-3)', lineHeight:1.5 }}>
            Fills today's nurse assignments into the MHF MED/TELE staffing template and downloads the completed sheet.
          </p>
        </div>

        <div className="modal-body" style={{ paddingTop:14, paddingBottom:14 }}>
          {totalNurses === 0 ? (
            <div style={{ padding:'18px 14px', color:'var(--text-4)', fontSize:12, fontStyle:'italic',
              border:'1px solid var(--border-sub)', borderRadius:10, marginBottom:14 }}>
              No nurses added yet.
            </div>
          ) : (
            <>
              {renderGroup('AM Shift', preview.am)}
              {renderGroup('PM / NOC Shift', preview.pm)}
            </>
          )}

          {status && (
            <div style={{ fontSize:12, padding:'7px 11px', borderRadius:8, marginBottom:4,
              background: status.startsWith('✓') ? 'rgba(52,211,153,0.10)' : status.startsWith('✗') ? 'rgba(248,113,113,0.10)' : 'rgba(255,255,255,0.04)',
              color: status.startsWith('✓') ? '#34d399' : status.startsWith('✗') ? '#f87171' : 'var(--text-3)',
              border: `1px solid ${status.startsWith('✓') ? 'rgba(52,211,153,0.25)' : status.startsWith('✗') ? 'rgba(248,113,113,0.25)' : 'var(--border-sub)'}`,
            }}>{status}</div>
          )}
        </div>

        <div className="modal-footer">
          <div style={{ display:'flex', gap:8, justifyContent:'flex-end', alignItems:'center' }}>
            <span style={{ fontSize:11, color:'var(--text-4)', marginRight:'auto' }}>
              Template: MHF MED/TELE Staffing Record
            </span>
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button className="btn btn-ghost" onClick={doPrint} disabled={totalNurses === 0}
              style={{ opacity: totalNurses === 0 ? 0.5 : 1 }}>
              🖶 Print
            </button>
            <button className="btn btn-primary" onClick={doExport} disabled={loading}
              style={{ background:'linear-gradient(135deg,#4338ca,#4f8ef7)', minWidth:140,
                opacity: loading ? 0.7 : 1 }}>
              {loading ? 'Generating…' : '⬇ Download Sheet'}
            </button>
          </div>
        </div>
        <iframe ref={printFrameRef} title="print-frame" style={{position:'absolute',width:0,height:0,border:'none',visibility:'hidden'}} />
      </div>
    </div>
  );
}
