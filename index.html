ts CANNOT be returned for re-issue once they have left the Blood Bank. They can be \nreturned, but they will be disposed of. \n \nH. \nIn a non-emergent situation blood may not be infused in less than 1 ½ hours without a physician  \n             order. \n \nI. \nTransfusion must be completed within 4 hours after release of the blood from the Blood Bank. \n \nJ. \nHold blood bags 4 hours after transfusion in case of delayed reaction. Discard blood bag and \ntubing in Bio-Hazardous waste receptacle. \n \nPROCEDURE: (Refer to attachment “Standard Blood Request Process” Algorithm) \nA. \nReview order from physician for blood transfusions.  Assure the following is included in the order: \n1. \nProducts to be administered \n2. \nNumber of units/volume to be administered and/or hold instructions \n3. \nDate to be administered \n4. \nSpecial processing (i.e. CMV negative; irradiated) \n5. \nPre-medication orders, if indicated \n\nMercy Hospital Folsom \n \n \nPage 2 of 14 \nPrinted copies are for reference only.  Refer to the electronic copy in Policy Manager for current \ndocument version. \n \n \nB. \nAssessment \n1. \nAssess if patient has received transfusions in the past and the patient’s response to \nblood products such as febrile reactions or fluid overload. \n2.       Obtain physician order to pre-medicate if patient has history of febrile reactions to blood \nproducts, especially if they receive frequent blood products for chronic conditions.  Allow \n30-60 minutes for oral pre-medication, 10 minutes for IV pre-medication to become \neffective.  \n \nC. \nAssess for presence and accuracy of Blood Bank ID Band (BBID).   \n1. \nA BBID is required for Packed Red Blood cells, Whole Blood, Granulocytes and \nAutologous Blood. \n2.          A BBID is NOT required for Fresh Frozen Plasma, Platelets, Rh Immune Globulin and  \n \nCryoprecipitates. \n3.          The BBID number, patient name, medical record number and date of birth MUST  \n \n \nMATCH. \n4.  \nIf NOT present or incorrect, notify the Blood Bank. \n \nD. \nObtain patient or patient’s representative signature on the “Consent For Blood/Blood Product \nTransfusion” Consent Form, which is to be used for all blood and blood product transfusions.  \n1.       Place completed consent form in the chart.  \n2. \nThe consent remains in effect for the duration of hospitalization or the outpatient series \nadmission.  \n \nE.  \nObtain blood products from the lab no more than 30 minutes prior to beginning of transfusion.   \n1. \nThe Dignity Health Request for Blood Issue, which includes BBID number is necessary to \nobtain blood product from the lab.  \n2.       The BBID number from patient’s armband must be checked and written on the slip before \n             going to the laboratory for blood check-out.  (Trained Non-licensed personnel can obtain \nblood products from Lab). \n3. \nPer unit of blood product, print Blood Transfusion Order Requisition from electronic \nhealth record (EHR) and staple to green Request for Blood Issue Form and bring both to \nthe lab. \n \nF. \nDonor and recipient information is verified immediately before transfusion in the presence of the \nrecipient, and includes the following: \n           * Conclusive identification of the recipient in the presence of the recipient with two patient \nidentifiers by either two persons (eg. By checking wristband for name and hospital number), or \nusing bedside identification technology (scanning BBID wristband). \n          * Patient identifiers on the blood or component unit label match the identity of the recipient. \n           *Review of intended recipients blood type \n          * Donor unit identification number and donor blood type \n           *Interpretation of crossmatch tests, where applicable \n           *Donor unit expiration date and time \n           *Special transfusion requirements (if warranted) \n           * Sign, date and time the blood slip \n \n \n \n \nIf the Blood Product is administered ","source":"Blood product management.pdf","lastUpdated":"2026-05-31"},{"id":"transfusion_reaction_tip_sheet","title":"Transfusion Reaction Tip Sheet","category":"Lab & Blood","keywords":["transfusion","reaction","tip","sheet","lab","blood"],"content":"","source":"reactionTipSheet.pdf","lastUpdated":"2026-05-31"},{"id":"bladder_management","title":"Bladder Management","category":"Bladder Management","keywords":["bladder","management","effective","date","november","revised","december","page","administrative","protocol","copyright","commonspirit","health","internal","only","subject","number","clinical","national","system","offices","acute","care","facilities","non"],"content":"Effective Date:  November 22, 2021    Revised:  December 7, 2022 \n \n \n \n \nPage 1 of 4 \nBladder Management \nAdministrative Protocol \n© Copyright 2021-2022 CommonSpirit Health.  For Internal Use Only \nCOMMONSPIRIT HEALTH \nADMINISTRATIVE PROTOCOL \n \n \nSUBJECT:   Bladder Management Protocol \nPROCEDURE NUMBER:  Clinical A-006PROT \nEFFECTIVE DATE:  November 22, 2021 \nREVISED DATE:  December 7, 2022 \n \n X  National/System Offices  \n X  Acute Care Facilities \n X   Non-Acute Care Facilities \n \n \nASSOCIATED DOCUMENTS:  \nCommonSpirit Administrative Policy  \nClinical A-006, Bladder Management \n \n \nCRITERIA FOR IMPLEMENTATION: A clinician order  \n \n \nPROTOCOL:  \n \nSTEP 1. Assess patients every shift and upon transfer to lower acuity unit to determine the patient’s \nbladder management needs. \n \nBladder management tools such as wraps, external catheters, wicking systems and straight catheterization \nmust always be considered prior to the insertion of an indwelling urinary catheter (IUC).  \n \nRefer to the following table to determine preferred actions based on bladder assessment  \n \nPatient Issue  \nIntervention \n \nIncontinence  \n \nPrefer: Use an external catheter/wicking system with a good fit  \n \nAlternative: Utilize a wrap for men  \n \n \nMeasuring Intake and Output \n \nPrefer: Use an external catheter/wicking system with a good fit \n \nAlternative #1: If an external device cannot maintain a good seal, consider \nusing a wrap and weighing  \n \nAlternative #2: Perform straight catheterization at least every six hours \n  \n \n \n\nEffective Date:  November 22, 2021    Revised:  December 7, 2022 \n \n \n \n \nPage 2 of 4 \nBladder Management \nAdministrative Protocol \n© Copyright 2021-2022 CommonSpirit Health.  For Internal Use Only \nPatient Issue  \nIntervention \n \nPre- and Post-Procedure  \n \nPrefer: External catheter/wicking system or straight catheterization at least \nevery 6 hours for non-genitourinary surgical patients.   \n \nAlternative: IUC removed at the conclusion of the case or in recovery  \n \nFollow provider orders for genitourinary surgery \n \nAcute Phase  \nPerineal Wounds \n \nPrefer: External catheter/wicking system or wrap if site can be kept dry  \n \nAlternative: Perform straight catheterization at least every six hours. \n \nObtain a wound care consult  \n \nUrinary Retention \n \nPrefer: Assess medications or conditions that can cause retention and \ndiscuss with the provider if appropriate to reduce or discontinue \n \nAlternative: If this is ineffective, follow Step 3. Urinary Retention \nAssessment and Management for Adults \n \n \nConsult provider for bladder management plan after 3 straight catheterizations. \nIf the preferred and alternative methods are unsuccessful, an IUC may be needed. Confer with the provider \nand obtain an order for IUC insertion if indicated. Re-evaluate the continuing need each shift.  \n \nAn order from a physician is required for the insertion of an IUC. Criteria for insertion or continuation of an \nIUC may include: \n \n● acute urinary retention that cannot be managed using less-invasive methods \n● need for accurate I&O in critically ill patients when alternative methods for measurement are \ninadequate \n● perioperative use for urologic or genitourinary tract procedures \n● assist in healing of open sacral  or perineal wounds in incontinent patients \n● end-of-life comfort care \n● prolonged immobilization due to trauma or surgery \n● order for physician-managed IUC \n● epidural in place (for laboring patients in the Family Birth Center, remove an indwelling foley catheter \nprior to the active pushing phase of the second stage of labor) \n \nIf the patient fits any one of the criteria above, document the appropriate justification in the patient’s medical \nrecord \n \n \n \n\nEffective Date:  November 22, 2021    Revised:  December 7, 2022 \n \n \n \n \nPage 3 of 4 \nBladder Management \nAdministrative Protocol \n© Copyright 2021-2022 CommonSpirit Health.  For Internal Use Only \nSTEP 2. If the patient does not meet criteria for continuation of an IUC and there is no specific \nphysician order to continue the catheter, the nurse shall remove the IUC. \n \n● Monitor patients that have not voided more than 300ml or who have symptoms of distention within 6 \nhours of IUC removal for retention (refer to Step 3 “Urinary Retention Assessment for Adults”) \n \n● Patients who are identified as being anuric for >2 days must have their urinary catheter discontinued \n \n● For laboring patients, remove an IUC prior to the active pushing phase of the second stage of labor \n \n● If the RN is uncertain as to whether to remove the IUC, the provider must be contacted \n \n● Document in the patient's medical record the time the IUC was removed \n \n● Exceptions: Provider-managed indwelling catheters, end-of-life comfort care (do not collect urine \ncultures). Consult provider for patient self-catheterization plan if applicable \n \nSTEP 3. Urinary Retention Assessment and Management for Adults  \n \nAssessment of the suprapubic area shall be completed at minimum of every 6 hours for any fullness or \nlower abdominal discomfort or when the patient has the urge to void but cannot \n \nAssess patients that have not voided more than 300ml or who have symptoms of distention within 6 hours of \nIUC removal \nPerform Bladder Scan \n(If bladder scanner is not readily available, clinical assessment to determine bladder distention/discomfort must be done) \nIf bladder volume <400 ml \nIf bladder volume is >400 \nand <800 ml  \nIf bladder volume >800 ml \n \n \nObserve patient \n \n \nPerform straight catheterization \nConsult provider for bladder \nmanagement plan after 3 straight \ncatheterizations \n \nPerform straight catheterization \nand consult provider \nContinue to perform bladder scans and assess for symptoms \nof distention at least every 6 hours until return to spontaneous void  \n \nFor patients with low urine output, (i.e. end-stage renal disease), \ncontact the provider for bladder volume criteria and/frequency of \nstraight catheterization \nRe-evaluate with the provider dai","source":"bladderManagement.pdf","lastUpdated":"2026-05-31"},{"id":"interventional_radiology_periprocedural","title":"Interventional Radiology Periprocedural Instructions","category":"IR Procedure","keywords":["interventional","radiology","periprocedural","instructions"],"content":"","source":"Copy of Interventional Radiology - Periprocedural Instructions (1).docx","lastUpdated":"2026-05-31"},{"id":"interventional_radiology_periprocedural","title":"Interventional Radiology Periprocedural Instructions (v2)","category":"IR Procedure","keywords":["interventional","radiology","periprocedural","instructions"],"content":"","source":"Interventional Radiology - Periprocedural Instructions (1).docx","lastUpdated":"2026-05-31"},{"id":"waffle_overlay_protocol","title":"Waffle Overlay Protocol","category":"Skin Care","keywords":["waffle","overlay","protocol","skin","care","update","linet","bed","concerns","too","high","reaching","above","side","rails","reach","out","available","department","lead","shift","guidance","risk","include","scored"],"content":"Waffle\nOverlay\nUpdate:\nIf your patient is on a Linet bed and you have\nconcerns that the waffle overlay may be too\nhigh (reaching above side rails), please reach\nout to any available department lead who is on\nshift for guidance\nAt Risk Patients Include:\n●\nPatients that are scored as a 1-2 for mobility\nand/or moisture on the Braden Score\n●\nPatients who score <16 on the Braden scale\n●\nPatients that are unable to turn independently\nand require assistance for position changes\n●\nExamples: C-Diff, Diabetes, Incontinence\n●\nWaffle overlays need to be utilized\nREGARDLESS of the surface (mattress) that\nthe patient is on\nPlease Insure the Waffle Overlay is\nInflated Properly:\n●\nInflation status of the waffle MUST be\nchecked with every position change\nincluding:\n○\nBed maneuvers\n○\nTurning\n○\nToileting\n○\nBed height adjustments\n●\nProper inflation is checked by placing a\ngloved hand under the patient’s sacrum,\nunder the waffle, making sure to have a\nsugar-cube sized space present between the\nwaffle and the surface that the waffle is on\n●\nIf there is no space - more air is needed\n●\nIf a large space is present - remove air from\nthe waffle\nONLY 2 Layers are to be\non a Patient Bed:\n●\nAn example would be a fitted sheet over\nthe waffle overlay and 1 chux pad\n●\nAny combination of 2 layers is acceptable.\n●\nThe waffle overlay can be used to help\npull up/reposition the patient in the bed\n●\nRefrain from using 2 chux pads or several\nlayers under the patient","source":"Waffle Overlay Up.pdf","lastUpdated":"2026-05-31"},{"id":"on_call_quick_note","title":"On Call Quick Note","category":"On Call","keywords":["call","quick","note","keeping","open","assigned","beds","shift","change","supports","represented","employee","icu","always","able","increase","census","immediately","pulling","break","relief","lead","while","waiting","standby"],"content":"- Keeping our open assigned beds at shift change to 4-6 MS/T supports an On Call represented employee. ICU should always be able to increase their census by 1 immediately by pulling Break relief or lead while waiting for their represented standby to come in. \n- This allocated employee is the first on the list to be HC’d. \n- Follow our Call Off list per CBA in reverse order when requiring stand by to report. \n- Standby/Call Back is not utilized by our unrepresented  Department leads. Including the same department leads in the HC opportunities is generous however is not considered mandatory as part of the rotation as the CBA does not include them. \n- Remember - a standby employee at 0930/2130 must be 1) Remaining on call for the remainder of the shift 2) Required to report at 1100 or 3) HC’d for the remainder of the shift. This is 4 or 8 hour increments. They can not be released mid shift. \n- For those updating timecards - Remember to apply HC for any Standby time for them to incur benefit time. If they want to use PTO to complete their pay - please use 815 HCLC to support the dollar aspect of the shift.","source":"on call quicknote.docx","lastUpdated":"2026-05-31"},{"id":"traveler_reminders","title":"Traveler Reminders","category":"Traveler","keywords":["traveler","reminders","list","travelers","assigned","christelle","adalon","noc","start","date","october","february","phone","chelsea","goodrum","day","jess","son","padao","erika","post","florinda","sayson","november","tbd"],"content":"list of travelers who will be assigned to our unit:\n1. Christelle Adalon (NOC)\nStart Date: October 14, 2025 – February 7, 2026\nPhone: 727-303-6927\n2. Chelsea Goodrum (DAY)\nStart Date: October 14, 2025 – February 7, 2026\nPhone: 510-909-1259\n3. Jess Son Padao (NOC)\nStart Date: October 28, 2025 – February 7, 2026\nPhone: 478-283-7170\n4. Erika Post (DAY)\nStart Date: October 28, 2025 – February 14, 2026\nPhone: 574-207-3871\n5. Florinda Sayson (DAY)\nStart Date: November 10, 2025 – TBD\nPhone: 707-999-1608\n6. Christy Deakle (DAY)\nStart Date: November 11, 2025 – February 14, 2026\nPhone: 228-202-4612\n7. Jocelyn Flores (NOC)\nStart Date: November 11, 2025 – February 21, 2026\nPhone: 916-525-5702\nPlease also keep the following reminders in mind:\n* Travelers should be House Canceled (HC'd) before float pool or staff.\n* If staff Request Self Cancel (RSC), please grant the RSC and bring in the traveler.\n* If you anticipate Mandatory House Canceling a traveler, please check with Raj before proceeding.","source":"traveler reminders.docx","lastUpdated":"2026-05-31"},{"id":"adding_patient_back_to_omnicell__waste_r","title":"Adding Patient Back to Omnicell (Waste/Return)","category":"Allergies & Medications","keywords":["adding","back","omnicell","waste","return","allergies","medications","add","default","login","screen","select","upper","left","fill","out","information","name","fin","number","match","transactions","reconciled","together","new"],"content":"How to add a patient back to Omnicell to waste or return\n1.\nFrom the default login screen select\nin the upper left of the screen.\n2.\nFill out the patient’s information. The name and FIN number must match the patient for the\ntransactions to be reconciled together. Select “Add new patient” when complete.\n3.\nThis will pull you into that patient profile. You can also select the patient from the local list.\n4.\nSelect waste or return meds button on the right side of the screen.\n5.\nSelect the Stocked Meds\nTab at the bottom of the screen. Find the medication you\nneed to waste or return in the list of medications.\n6.\nSelect “OK” when the fields are completed. This will require a witness.","source":"Adding a patient back to Omnicell to waste or return.pdf","lastUpdated":"2026-05-31"},{"id":"allergy_types_documentation","title":"Allergy Types Documentation","category":"Allergies & Medications","keywords":["allergy","types","documentation","allergies","medications","cerner","support","matters","drug","adding","modifying","information","type","documented","alert","fire","providers","placing","orders","related","specific","substance","change","defaulted","without"],"content":"Cerner Support RN: x36200 (916.733.6200) \n  \nAllergy Types – It Matters \nDRUG: When adding/modifying patient drug allergy information, if a TYPE other than ALLERGY is documented, \nan alert will not fire to providers when placing orders related to that specific drug/substance.   \nDo not change the defaulted type of Allergy without discussing with the provider. Other options (Side effect, \nIntolerance, Sensitivity, or Other) do not alert providers/pharmacy.  \nFOOD: If the patient has a food allergy, sensitivity, side effect, or intolerance, edit the CATEGORY dropdown to \nFOOD – this will alert Dietary/Nutrition Services.  If the food allergy is not explicitly listed in Cerner, enter it as \nbest you can with the CATEGORY of FOOD and call the diet office/kitchen to bring it to their attention.","source":"AllergyTypesDocumentation.pdf","lastUpdated":"2026-05-31"},{"id":"waste_management_quick_tips","title":"Waste Management Quick Tips","category":"Waste Management","keywords":["waste","management","quick","tips"],"content":"","source":"Copy of Waste Management Quick Tips.pdf","lastUpdated":"2026-05-31"},{"id":"patient_belongings_and_valuables_policy","title":"Patient Belongings and Valuables Policy 2025","category":"Admission & Discharge","keywords":["belongings","valuables","admission","discharge","effective","date","page","subject","personal","internal","only","mercy","hospital","folsom","associated","documents","own","medications","custody","disposal","prohibited","items","departments","applies","inpatient"],"content":"Effective Date: 12/11/2024  \n \n \n \n \n                                        Page 1 of 8 \nSubject: Patient Personal Belongings and Valuables                                    For Internal Use Only \nMercy Hospital of Folsom \nPolicy and Procedure  \nSUBJECT: Patient Personal Belongings and Valuables  \nASSOCIATED DOCUMENTS: Patient's Own Medications and Custody and Disposal of \nProhibited Items \nDEPARTMENTS:  \nThis Policy applies to all inpatient acute care areas, (e.g., Inpatient Care Units, \nObservation, Emergency Department, Perioperative, and onsite procedural departments).  \n \nPOLICY: It is the policy of Mercy Hospital of Folsom not to accept responsibility for patient \nbelongings and valuables. All valuables are to be left at home or removed from the facility \nand taken to another secure location outside of the facility.  \nPURPOSE: The purpose of this Policy is to establish and implement guidelines relating to \nmanaging patient belongings and/or patient valuables.  \nMercy Hospital of Folsom requests that patients DO NOT keep belongings or valuables in their \nrooms or on their person; if a patient chooses to do so, the patient assumes all risk for the \nloss and or damage. Patients who choose to keep belongings and valuables in their rooms or \non their person assume all responsibility for these belongings and valuables.  \na.   Please note this Policy does not apply to medications brought from home by the \npatient. Please refer to policy titled \"Patient's Own Medications\" \nb.   Staff are to report any loss or damage of the patient’s essential items (as \ndefined below) by following established facility procedures.  \nPROCEDURE:  \nI. GENERAL - ALL PATIENTS  \nA.   See Addendum A (All Care Areas Algorithm)  \n      B.   Admission and registration of the patient  \n1. Admitting personnel will direct patients to send patient belongings and               \nvaluables home with family or designee.  \n2.   If sending with the family or designee is not possible, the patient is encouraged to \nallow valuables to be secured in the hospital’s designated secure location (e.g., \nfacility safe in security office).  \n3.   As a component of the admission and consent for treatment process, patients      \n      will be informed that the hospital assumes no responsibility for items  \nmaintained in their room or on their person. Patients acknowledge this by \nsigning the Consent for Treatment form.  \n \n \nC.   Admission of the patient to care area:  \n1. Facility may accept custody of a patient’s belongings, if it is determined that the \nfollowing three elements are present:  \n                            a. acceptance is in the facility’s and the patient’s best interests;  \n\n \nEffective Date: 12/11/2024  \n \n \n \n \n                                        Page 2 of 8 \nSubject: Patient Personal Belongings and Valuables                                    For Internal Use Only \nb. acceptance is not likely to disrupt or compromise hospital operations,  \n    patient or employee safety;  \nc. the patient is not capable of being responsible for the belongings and   \n    family or designee is unavailable to take custody of the belongings.  \n2. Essential items  \na. On admission, the nurse or designee will document all essential items in \n    detail in the designated area of the EHR (See definition “essential  \n    items”).    \n          i. This includes but is not limited to eye wear, dentures, prosthesis,  \nand hearing aids.  \n                                       ii. This also includes personal necessary medical equipment or  \n                                              supplies such as walkers, canes, and wheelchairs (See definition  \n                                               “Medical equipment or supplies”).  \n3. Any patient valuables that are not sent home or secured are to be documented in   \nthe electronic health record (EHR) in the following manner:  \n                          a. The patient is encouraged by the nurse to secure their valuables.  \n                                           i. The patient is advised the facility does not assume responsibility  \nfor items kept in the facility by a patient and encourages that such  \nitems be sent home with family or designee.  \n                                           ii. Valuables identified to be placed in the facility’s secure location  \n   are documented in the EHR as “Valuables inventoried according  \n to facility policy”.  \n                                                       a. Any money is counted in front of the patient or surrogate  \ndecision maker by two staff members and listed on the  \n Valuables receipt.  \nb. Patient signature of valuables inventory obtained.  \n                                                       c. Patient given valuables receipt.  \n                                                       d. If the patient is confused or unconscious at the time of  \n                                                          admission, all valuables will be bagged and logged in the  \n                                                          presence of two staff members and placed in the facility’s  \n                                                           secure location.  \n                                           iii. If the patient refuses to secure their valuables, a record of advice  \nregarding retention of valuables will be recorded in the EHR.  \n  a. Patient asked to sign a disclaimer notice \n                              i. Disclaimer notice placed in the patient’s medical record.  \n                             b. Document  \n                                           i.  Patient advised to send valuables to facility safe in security office to   \n                                               secure and patient refused. \n                              ii. Notation in EHR that a disclaimer notice was signed.  \n                                       iii. A description of the valuables remaining with the patient using   \n                         ","source":"Patient Belongings and Valuable Policy 2025.pdf","lastUpdated":"2026-05-31"},{"id":"inpatient_documentation___suicide_watch","title":"Inpatient Documentation – Suicide Watch","category":"Behavioral Health","keywords":["inpatient","documentation","suicide","watch","behavioral","health"],"content":"","source":"inpatient documentation suicide.pdf","lastUpdated":"2026-05-31"},{"id":"ehr_tipsheet___personal_belongings","title":"EHR Tipsheet – Personal Belongings","category":"Admission & Discharge","keywords":["ehr","tipsheet","personal","belongings","admission","discharge","valuables","form","updated","valuable","adhoc","now","displays","workflow","summary","pages","newly","created","associated","task","add","new","content","essential","items"],"content":"Valuables and Belongings Form Updated \nValuable and Belongings AdHoc form has been updated, now displays on \nWorkflow Summary Pages, and has a newly-created associated task. \n \n●​ Valuable and Belongings form has been updated to add new content: \n○​ Essential Items \n○​ Description of Essential Items Remaining with Patient \n○​ Valuables Inventoried According to Facility Policy \n○​ Patient Advised to Send Valuables to Facility Secure Location and \nRefused \n○​ Essential Items Reconciliation Completed \n○​ Essential Items with Patient at Discharge \n○​ Valuables Form Signed by Pt/Caregiver \n○​ Essential Items at Discharge Comment \n \n●​ Valuables component has been added to the following Workflow \nSummary pages: \n○​ BH Discharge Workflow \n○​ Discharge Workflow Nursing \n○​ Nursing Shift Handoff I \n○​ Perioperative Non Provider Inpatient Workflow \n○​ Periop Communication - Postop Summary \n \n●​ New task created to retrieve valuables and medications at discharge or \ntransfer to an outside facility is added. \n○​ Nurses now receive a Done/Not Done task to retrieve valuables \nfrom a secured location when it was documented that valuables \nwere sent to security or medications were sent to pharmacy. \n○​ Previously available tasks are still active. \n \n\n●​ Discharge Instructions currently containing Valuables and Belongings \ninformation are updated with new content.","source":"EHR Tipsheet Personal Belongings.pdf","lastUpdated":"2026-05-31"},{"id":"ua_culture_ticket_to_test","title":"UA Culture Ticket to Test","category":"Lab & Blood","keywords":["culture","ticket","test","lab","blood","urinalysis","reflex","goal","perform","testing","appropriate","indications","change","odor","appearance","cloudy","sediments","urine","alone","prompt","dysuria","urgency","frequency","expected","hours"],"content":"Ticket to Test: Urinalysis with Reflex to Culture - \nThe goal is to perform testing on patients with appropriate indications. \n● Change in odor or appearance (e.g., cloudy, sediments) of urine alone should NOT prompt testing \n● Dysuria, Urgency, or Frequency is expected 48 hours after \nindwelling catheter removal and should NOT prompt testing \n● Altered mental status alone is not an indication for urine culture \nIf at least one is checked, send a urine sample to the lab with this COMPLETED form. (If the patient does not meet criteria, notify the ordering physician) ⬜ Provider notified and override was requested \nDate/time of submission: ____________________________ \nNurse submitting specimen (please print):_____________________________________________ Manager/Charge nurse reviewer (please print):_________________________________________ THIS FORM IS NOT TO BE PART OF THE PERMANENT RECORD","source":" MHF UA_Culture Ticket to Test.docx","lastUpdated":"2026-05-31"},{"id":"artificial_nails_policy__oct_2024","title":"Artificial Nails Policy (Oct 2024)","category":"Professional Attire","keywords":["artificial","nails","oct","professional","attire","october","know","need","facility","northern","california","division","had","high","limited","finding","tjc","icu","wearing","dignity","health","hand","hygiene","states","basic"],"content":"Artificial Nails October 2024\nKnow: What you Need to Know \nA facility in the Northern California Division had a high limited finding by TJC for an ICU RN wearing artificial nails. (IC.02.01.01)\nDignity Health’s hand hygiene policy states:\nBasic nail polish should not be chipped and in good condition.\nThe natural nails of health care workers are to be kept neatly manicured and short, not extending more than ¼ inch past the tips of the fingers\nWearing artificial nails is prohibited for personnel who perform direct hands-on patient care or have a role in patient care services, such as environmental services, pharmacy, sterile processing or nutrition services.  \nDignity Health’s hand hygiene policy defines artificial nails as:\nAny fingernail enhancement, resin bonding, shellac or methacrylate polymer (long wearing nail polish), extensions, tips, gels, or acrylics that are not a part of the natural nail. \nDo: What you Need to Do \nCommunicate with appropriate team members the information about nails in the hand hygiene policy.\nPerform leadership rounding to identify violations of the hand hygiene policy.\nContinue to hold team members accountable for violations of the hand hygiene policy.\nReach out to your facility's Infection Preventionist if you have additional questions.\nShare: What you Need to Share \nShare this communication with appropriate team members at huddles.\nEmphasize extensions, wraps, tips, gels, polygels, dips, silk, overlays, acrylics and/or any enhancements not part of the natural nail are considered artificial nails.","source":"Artificial Nails KDS Oct 2024.docx","lastUpdated":"2026-05-31"},{"id":"c__difficile_ticket_to_test","title":"C. difficile Ticket to Test","category":"Infectious Disease","keywords":["difficile","ticket","test","infectious","disease","complete","form","before","collecting","stool","specimen","diff","testing","boxes","checked","meet","criteria","appropriate","call","physician","evening","night","request","order","does"],"content":"Ticket to Test: C. difficile \n \nPlease complete this form before collecting a stool specimen for C. diff testing.  \nAll boxes must be checked to meet the criteria for appropriate testing.  \nDo not call the physician during the evening or at night to request an order for C. diff testing if the patient does not have \nsigns/symptoms of GI infection.  \nAn order is only valid for 24 hours. Do not collect a sample if the order has expired. \n \nIs the stool loose or watery (must take the shape of the \ncontainer) \nYes⬜ \nLaxatives with hard stop in EHR (prior \n48 hours): \nHas the patient been tested for C. diff in the last 7 days? \nNo⬜ \n●​Bisacodyl \n●​Bisacodyl-magnesium citrate \n●​Castor oil \n●​Chromium picolinate-inulin \n●​Citric acid/MgOxide/Na picosulfate \n●​Docusate-senna \n●​Dulcolax \n●​Glycerin \n●​Golytely \n●​Kayexalate \n●​Lactulose \n●​Mag sulfate (excluding IV MgSO4) \n●​mag/Na/K sulfates \n●​Magnesium citrate \n●​Magnesium hydroxide \n●​Metoclopramide \n●​Mineral oil \n●​Polyethylene glycol 3350 \n●​Potassium bitartrate \n●​Potassium bitartrate-sodium bicarbonate \n●​Psyllium-senna \n●​Senna \n●​Sodium biphosphate \n●​Sodium citrate \n●​Sodium picosulfate \n●​Sodium phosphate \n●​Sodium phosphate \n●​Sorbitol \nExamples of procedures and conditions that \ncan induce diarrhea: (Not a hard stop) \n \n●​Fecal impaction \n●​New tube feeding \n•​ Adjusted protocol in the last 24 hrs \n●​Oral contrast \n●​Enema \nHas the patient had a positive test for C. diff in the last 30 \ndays? \nNo⬜ \nIs the diarrhea clinically signiﬁcant (3 or more loose/liquid \nstools in a 24 hour period OR greater than 600mL rectal \ntube or ostomy output in a 24 hour period)? \nYes⬜ \nHas the patient taken a laxative in the last 48 hours? \nNo⬜ \n(see laxative list in box on the right) \nHas the patient had a procedure, or have a condition \nthat can induce liquid/loose stools? \n \n*This is not a hard stop, but something to consider \nwhen reviewing clinical correlation and discussion with \nproviders on appropriateness of test. \n \nNo⬜ \nHas the patient been admitted to our facility for longer than \n3 days? \n \n*If this box is the only section not meeting \ncriteria, contact Infection Prevention for \nconsultation. \n \nNo⬜ \n \nIf the patient has been admitted for > 3 days, Infection Prevention must be \nconsulted prior to sending the specimen to the lab.  \n \nIf testing criteria is met, send the specimen to the lab with this COMPLETED and SIGNED form. \n \nNurse submitting specimen (please print):​\n \nManager/Charge nurse reviewer (please print):​\n \nLab employee receiving specimen (please print): ​\n​ \n    \n                                                                           THIS FORM IS NOT TO BE PART OF THE PERMANENT RECORD                             05/2026 MHF Infection Prevention","source":"MHF C. difficile Ticket to Test.pdf","lastUpdated":"2026-05-31"},{"id":"c__diff_know_do_share_ticket","title":"C. diff Know-Do-Share Ticket","category":"Infectious Disease","keywords":["diff","know","share","ticket","infectious","disease","updated","test","discard","copies","old","start","using","newly","tickets","immediately","update","clinical","summary","refreshed","moving","forward","primarily","formatting","content"],"content":"KNOW DO SHARE \n    \n \n \nUpdated C. diff Ticket-to-Test \n \n \n \nKNOW  \n \n​\n \nDO \n●​ Please discard all copies of the OLD ticket-to-test for C. diff.  \n●​ Start using these newly updated tickets immediately. \n \nSHARE  \n \n●​ Please share this update with all clinical staff. \n \nSummary \n●​ A refreshed ticket- to-test for C. diff will be used moving forward. \n●​ This is primarily a formatting update. The content remains largely unchanged.","source":"C Diff Ticket to Test Know Do Share.pdf","lastUpdated":"2026-05-31"},{"id":"c__diff_refresher_education","title":"C. diff Refresher Education","category":"Infectious Disease","keywords":["diff","refresher","education","infectious","disease","difficile","transmission","prevented","play","critical","role","preventing","spores","transmitted","via","improperly","sanitized","hands","through","contaminated","shared","equipment","meticulous","hand","hygiene"],"content":"C- Difficile Refresher\nHow Can C. Difficile Transmission Be Prevented?\nStaff play a critical role in preventing C. difficile transmission. Spores are transmitted from patient to patient via improperly sanitized hands and also through the use of contaminated shared equipment. Meticulous hand hygiene—using soap and water—and strict adherence to isolation protocols are therefore the foundation for effective C. difficile transmission prevention. \nHandwashing and strict isolation should be observed when caring for patients even after resolution of CDI symptoms, as they are still capable of shedding spores long after clinical symptoms subside. It is important for nurses to communicate with their institutional epidemiology staff to determine appropriate duration of isolation for the patient with a current or prior history of CDI on a case-by-case basis. \nAlso, nurses must be careful to clean equipment that is shared between patients, and partner with housekeeping services to effectively clean areas of potential contamination. Typically, regular active cleansing ingredients in hospital disinfectants are quaternary ammonium compounds and do not kill spores. The Centers for Disease Control (CDC) currently recommends using hypochlorite-based germicides, such as bleach-based solutions, for cleaning C. difficile-contaminated environmental surfaces and equipment.\nCommon Spirit Health does not Test for CURE of C-Difficile infections.\nRepeat stool testing for test of cure is NOT recommended. Up to 50% of patients have positive C- diff PCR for as long as six weeks after the completion of therapy. Therefore, signs and symptoms rather than repeat testing should be used to assess whether a patient has responded to therapy for C. diff. Please reach out to Infection Prevention and or your managers if this is requested. \nMHF Infection Prevention February 2023","source":"C.diff refresher educationx.docx","lastUpdated":"2026-05-31"},{"id":"foley_free_initiative___ticket_to_foley","title":"Foley-Free Initiative – Ticket to Foley","category":"Infectious Disease","keywords":["foley","free","initiative","ticket","infectious","disease"],"content":"","source":"MHF Foley Free Initiative - Ticket To Foley.docx","lastUpdated":"2026-05-31"},{"id":"nasal_decolonization_protocol","title":"Nasal Decolonization Protocol","category":"Infectious Disease","keywords":["nasal","decolonization","protocol","infectious","disease","know","share","apr","surgical","mercy","hospital","folsom","begin","prior","surgery","april","process","reducing","eliminating","bacteria","particularly","staphylococcus","aureus","including","methicillin"],"content":"Know Do Share \n \nApr 10, 2025\n \nNasal Decolonization of Surgical Patients at Mercy Hospital Folsom \nWhat to Know \n●​ Nasal decolonization will begin on all patients prior to surgery on  April 14, 2025 \n●​ Nasal decolonization is a process of reducing or eliminating bacteria, particularly \nStaphylococcus aureus, including Methicillin-resistant Staphylococcus aureus,that may \nbe present in the nose \n●​ Nasal carriage of S. aureus is a known risk factor for surgical site infections (SSIs) \n●​ Reducing these bacteria before surgery can significantly lower the chance of \ndeveloping an infection \nWhat to Do \n●​ Educate all surgical patients about the nasal decolonization protocol \n●​ The Profend Nasal Antiseptic Kit swabsticks are designed to be applied to the \ncircumference of the patient's nostril and anterior nares.  \n●​ Two swabsticks are applied to each nostril for 15 seconds per swabstick. Thus, using 4 \nswabsticks, for a total treatment time of 60 seconds \n●​ Scan here to watch the video \n \nWhat to Share \n●​ Nurses are responsible for educating patients, applying the Profend and charting it in the \nmedical record on every surgical patient prior to surgery, which includes patients being \nheld in other areas of the hospital prior to surgery \n \nFor questions, reach out to \n \nErin Brittell CA-FOLSOM","source":"_Nasal Decolonization KDS 4.10.2025.pdf","lastUpdated":"2026-05-31"},{"id":"nasal_decolonization_protocol__docx","title":"Nasal Decolonization Protocol (DOCX)","category":"Infectious Disease","keywords":["nasal","decolonization","protocol","docx","infectious","disease","know","share","apr","surgical","mercy","hospital","folsom","begin","prior","surgery","april","process","reducing","eliminating","bacteria","particularly","staphylococcus","aureus","including"],"content":"Know Do Share\nApr 10, 2025\nNasal Decolonization of Surgical Patients at Mercy Hospital Folsom\nWhat to Know\nNasal decolonization will begin on all patients prior to surgery on  April 14, 2025\nNasal decolonization is a process of reducing or eliminating bacteria, particularly Staphylococcus aureus, including Methicillin-resistant Staphylococcus aureus,that may be present in the nose\nNasal carriage of S. aureus is a known risk factor for surgical site infections (SSIs)\nReducing these bacteria before surgery can significantly lower the chance of developing an infection\nWhat to Do\nEducate all surgical patients about the nasal decolonization protocol\nThe Profend Nasal Antiseptic Kit swabsticks are designed to be applied to the circumference of the patient's nostril and anterior nares. \nTwo swabsticks are applied to each nostril for 15 seconds per swabstick. Thus, using 4 swabsticks, for a total treatment time of 60 seconds\nScan here to watch the video\n What to Share\nNurses are responsible for educating patients, applying the Profend and charting it in the medical record on every surgical patient prior to surgery, which includes patients being held in other areas of the hospital prior to surgery\nFor questions, reach out to Erin Brittell CA-FOLSOM","source":"Copy of  Nasal Decolonization KDS 4.10.2025.docx","lastUpdated":"2026-05-31"},{"id":"infection_control_education_sheet","title":"Infection Control Education Sheet","category":"Infectious Disease","keywords":["infection","control","education","sheet","infectious","disease","nursing","daily","safety","rounds","focus","hai","prevention","below","content","leaders","locking","completed","leadership","would","like","able","speak","best","practice"],"content":"Education for Nursing for Daily Patient Safety Rounds\nFocus is on HAI prevention\nBelow is the content of the rounds and what leaders will be locking for when Patient Safety Rounds are \ncompleted. Leadership would like you to be able to speak to the below best practice items when a leader \ncomes to you about your patients lines. All of the questions below reflect best practice in preventing \nHospital Acquired Infections (HAI) in our patients.\n\nA HAI affects 1 in 31 patients and these infections are largely preventable.\n\nAll HAIS are the 4th leading cause of Death in the US\n\nThese unanticipated infections develop during the course of health care treatment and result in \nsignificant patient illnesses and deaths (morbidity and mortality); \n\nprolong the duration of hospital stays;\n\nNecessitate additional diagnostic and therapeutic interventions, which generate added costs to \nthose already incurred by the patient’s underlying disease. \n\nHAIs are considered an undesirable outcome, and as most are preventable, they are considered \nan indicator of the quality of patient care, an adverse event, and a patient safety issue.  \nCLABSI Prevention Concerns\nWhat type of central line is in place?\nWhat is the insertion site of the central line?\nIs the central line dressing clean, dry, and intact?\nIs the central line dressing dated per policy?\nIs the CHG impregnated dressing applied at the insertion site?\nIs a securement device in place?\nAre the Curos caps in place on all ports/hubs?\nHAs Daily CHG bath been done per policy?\nIS the IV tubing dates, initialed and timed per policy?\nDo the IV tubing have medication names on labels per policy?\nCAUTI Prevention Concerns\nIs the tamper-resistant red seal intact?\nIs a securement device in place?\nIs the flow of urine unobstructed (no kinks or dependent loops)?\nIs the indwelling urinary catheter free of dependent loops?\nIs the urine collection bag below the level of the bladder?\nIs the urine collection bag off of the floor?\n\n            Dependent loops \nHow the Foley should look\nBedside shift report is the time to hold each other accountable. At this time look at the patient’s lines \nand or Foleys. Make sure that all of the practices are in place from the previous shift. If the nurse has not \nlabeled, dated and initiated or there is not a label than shows what is running in the line, this is the time to \nask them to complete this prior to them ending their shift. This way you are not completing something that \nshould have been done on a prior shift. If there is a pattern with a nurse please escalate this to your \nmanager. \n A Dressing should NEVER look like this!!\n\nA bloody dressing needs to be changed\n\nTape should NEVER be used to reinforce the dressing. You need a NEW dressing \n\nAll lines need to have the insertion date, time and initial for  all dressings    \nInfection Prevention J. Kamuchey 4/24/2023","source":"Education Sheet from Infection Control.pdf","lastUpdated":"2026-05-31"},{"id":"death_form_completion_guide","title":"Death Form Completion Guide","category":"Death & Comfort Care","keywords":["death","form","completion","guide","comfort","care","possible","signing","notification","due","possibly","needing","further","information","know","modifications","entered","everyone","initiating","modifying","document","click","sign","mandatory","fields"],"content":"Death Form Completion\nIt is possible that staff are not signing the Notification of Death form due to possibly needing further information for completion.  Please know that modifications can be entered but EVERYONE initiating and modifying the document, MUST click to SIGN it.\nIt is also MANDATORY that all fields of the Morgue Release of Remains forms be completed.  This includes ALL signatures.","source":"Death Form Completion.docx","lastUpdated":"2026-05-31"},{"id":"code_mercy_workflow","title":"Code Mercy Workflow","category":"Death & Comfort Care","keywords":["code","mercy","workflow","death","comfort","care","mhf","notification","unable","reach","next","kin","message","left","does","apply","contact","made","notified","known","voice","mail","full","leave","units"],"content":"MHF Code Mercy Workflow\nFor notification of death when unable to reach the next of kin and a message is left\nDOES NOT apply when:\nContact is made with the next of kin and they are notified of the death\nWhen there is no known next of kin\nIf there is a next of kin, but voice mail is full or unable to leave message\nUnits Responsibilities:\nUpon pronouncement of death when known next of kin are not present at the bedside and the call goes to voicemail:\nStaff leave the HIPAA compliant scripted voicemail and document in the EMR.\n“This is {name} calling from Mercy Hospital of Folsom.  Would you please call us back at    (leave your unit’s direct call back number). \nDocument in the EHR the time of the call, who was called, and that a message was left. \nIf there is no returned call from the next of kin by the time the body is transferred to the morgue (or within 4 hours), the staff will call the next of kin again and leave the “Code Mercy” scripted message.. \nThe number is the “Code Mercy”  line that the ANS team will manage.\n“This is {name} calling from Mercy Hospital of Folsom.  Would you please call us back at 916-984-7288* leave your name and number and reference “Code Mercy.” \nDocument in the EHR the time of the call, who was called, and that a message was left.\nNotify the NSM/Relief Charge of the “Code Mercy”.\nNotify the ANS of the “Code Mercy”with the patient name, and the name of the next of kin that was called.  \nThe ANS will document the information on the “Code Mercy Tracker”.\nANS Responsibilities:\nThe ANS will receive the Code Mercy contact call on the ANS landline.\nIf there is a voicemail, the ANS will cross reference the caller to a patient via the “Code Mercy Tracker” and return the call.\nIf contact is made, notify the next of kin of the death, inform them the body will be/has been taken to the offsite morgue and to please call them at 916-515-4010 to make further arrangements. If they are inquiring about details of the death, refer them to Regional pathology supervisor (PML) ph 916-515-4010.\nIf no contact is made, leave the HIPAA compliant “Code Mercy” scripted message:\n“This is {name} calling from Mercy Hospital of Folsom.  Would you please call us back at 916-984-7288 leave your name and number and reference “Code Mercy.” \nDocument in the EHR the time of the call, who was called, and outcome of the call (voicemail or details of conversation).\nUpdate the “Code Mercy Tracker” if contact was made.","source":"MHF Code Mercy Workflow.docx","lastUpdated":"2026-05-31"},{"id":"release_of_remains___know_do_share","title":"Release of Remains – Know-Do-Share","category":"Death & Comfort Care","keywords":["release","remains","know","share","death","comfort","care","date","february","need","mhf","team","new","floor","form","some","changes","morgue","forms","regarding","decedents","notifications","next","kin","essential"],"content":"Date February 24, 2025 \nWhat you need to Know MHF Team\nNew “RELEASE OF REMAINS FROM FLOOR OR UNIT” form\nThere are some changes to the morgue release of remains forms regarding decedents and notifications of next of kin. It is essential that everyone handling decedents complete all of the necessary documentation and initial and sign the new form. \nWhat to Do \nBedside RN  \n1. Complete notification of death form in Cerner. \n2. Print: \n● Copy of the notification of death form (with the release of remains signature lines) \n● Facesheet \n   (Both forms will go to the morgue with the patient) \nNiceTracker form will be filled in the Google drive. Ensure that all jewelry and personal items are removed from the patient. \n4. The Patient Arm/ID Band will remain in place. \n5. Match ID band to toe tag, bag tag, facesheet and notification of death form. \n6. Complete “RELEASE OF REMAINS FROM FLOOR OR UNIT” form. \n● Make sure to date and initial all boxes of section I and section II of the form \n● Print and sign your name on the appropriate line \n7. If unable to reach family or patient representatives, complete Code Mercy process and document in both Cerner and on the “RELEASE OF REMAINS FROM FLOOR OR UNIT” form.  ANS to complete Code Mercy tracker form in the Google drive. \n8. Notify transportation in teletracking when post mortem care and paperwork are complete and to pick the patient up to take the patient to the morgue. \n9. The Nurse Shift Manager must review the form before the body goes downstairs \n10. If there are unusual circumstances with family notification or the patient does not have family, leave a copy of the “RELEASE OF REMAINS FROM FLOOR OR UNIT” form with the ANS for follow up with AOC.\n11. Involve Social Work if the patient does not have family. Social Work will partner with Law Enforcement and the County to locate next of kin. \nTransportation \n1. Verify all required paperwork is in the packet, which includes: \n● “RELEASE OF REMAINS FROM FLOOR OR UNIT” form \n● Notification of death form (with the release of remains signature lines) \n● Facesheet \n● Consent for autopsy \n2. Verify that all jewelry and personal effects have been removed. \n3. Match ID band to toe tag, bag tag, facesheet and notification of death form. \n4. Initial transporter column and print and sign your name on the appropriate line of the,“RELEASE OF REMAINS FROM FLOOR OR UNIT” form.\nWhat to Share \nThis process provides a verification system and is imperative to ensure proper chain of custody of our descendants.","source":"Know Do Share MHF RELEASE OF REMAINS FROM FLOOR OR UNIT_.docx","lastUpdated":"2026-05-31"},{"id":"core_nursing_standards_of_practice","title":"Core Nursing Standards of Practice","category":"Nursing Standards","keywords":["core","nursing","standards","practice","page","commonspirit","health","subject","effective","date","original","national","system","offices","acute","care","facilities","non","purpose","adult","medical","surgical","telemetry","orthopedic","oncology"],"content":"Page 1 of 22 \n \nCOMMONSPIRIT HEALTH \nCORE NURSING STANDARDS OF PRACTICE  \n \n \nSUBJECT : Core Nursing Standards of Practice  \nEFFECTIVE DATE:  5/22/2024 \nORIGINAL EFFECTIVE  \nDATE:  3/12/2021 \n☐  National/System Offices \n☒  Acute Care Facilities \n☐  Non-Acute Care Facilities \n \nPURPOSE \nThe Standards of Practice for adult core nursing (Medical Surgical, Telemetry, \nOrthopedic, Oncology, and Acute Rehab) serve as guidelines for the provision of \nnursing care and professional performance expectations. These standards are based \nupon the 4thedition of the American Nurses Association (ANA) Scope and Standards \nof Practice. They are used in conjunction with CommonSpirit facility policies and \nprocedures and licensed practitioner (LP) orders. These standards of practice do not \nreplace clinical judgment but represent minimal, safe standards. These standards of \npractice provide a framework for evidence based care delivery. \n \nAFFECTED AREAS OR DEPARTMENTS \nMedical Telemetry, Surgical Acute, Medical Acute \n \nSTANDARDS OF CARE \n \nSTANDARD 1: NURSING PROCESS \n1. Assessment – The registered nurse performs and/or oversees the collection \nof pertinent data and information relative to the patient’s health or the situation. \nData will be obtained by interview, observation, physical examination and \nreview of the patient record. Priority of data collection is determined by the \npatient’s immediate health care needs (ANA, 2021). \na. A focused assessment for chief complaint should be completed within \n30 minutes of admission. \nb. Focused assessments/reassessments are completed PRN as indicated \nby patient condition and/or LP order. A focused assessment should be \ncompleted every 4 hours for the first 24 hours on post-operative/post-\nprocedure patients.  \nc. Vital signs should be obtained within 30 minutes of admission, and \nmonitored approximately every 8 hours thereafter unless patient \ncondition and/or LP order require more frequent monitoring.  \ni. Vital signs include temperature, heart rate, respiratory rate, blood \npressure, pulse oximetry and pain score. \nii. For patients on telemetry, vital signs should be monitored every \n4 hours. \niii. Vital signs should be obtained within 1 hour prior to patient \ntransfer or discharge (AMSN, 2021). See Policy “Patient \n\n \n \n  \nPage 2 of 22 \n \nAssessment/Reassessment and Care Planning”                     \nSee Policy “Basic Unit Care Standards” \nd. Admission history should be completed within 24 hours; updates should \nbe documented PRN when new/additional data is obtained. The \nadmission history includes the following information: \n1. \nReview general information: chief complaint,  \npreferred language, sensory deficits, etc. \n2. \nHeight and weight \n3. \nHealth history \n4. \nInfluenza/vaccination screening \n5. \nInfectious disease risk screening \n6. \nAllergies and current medications \n7. \nPsycho-social history \n8. \nSocial history \n9. \nNutrition \n10. \nEnvironmental/functional \n11. \nAdvance Directives status/review/assistance  \n12. \nSuicide Risk Screening \ne. Laboratory values and test results should be reviewed upon admission, \nevery shift, and PRN for new results. \ni. Critical results and values should be reported to the LP within 60 \nminutes of the nurse receiving the results. See Policy “Critical \nResults of Tests, Management of” \nf. Valuables and belongings should be accounted for, secured, and \ndocumented upon admission, with transfer, and at discharge. See \nPolicy “Patient Valuables And Property” \ng. Physical assessment should be completed within 4 hours of admission, \nwithin 4 hours of the start of each shift, and PRN for change in \ncondition. Follow the procedures outlined in Elsevier Clinical Skills-                  \nAssessment: Focused-CE/NCPD. \ni. Neurologic \n1. \nNeurologic assessment includes but is not limited \nto: level of consciousness (LOC), orientation status, \npupillary reaction to light, facial symmetry, sensory and \nmotor function, and notation of speech. \n2. \nFollow the procedure in Elsevier Clinical Skills -  \nAssessment: Musculoskeletal and Neurologic - CE/NCPD \nii. Cardiovascular \n1. \nCardiovascular assessment includes but is not \nlimited to: heart rate, regularity, and rhythm (if on \ntelemetry); auscultation of heart sounds; peripheral pulse \nstrength, rate, and regularity; capillary refill; presence of \nedema; complaints of shortness of breath or chest pain; \nand presence of devices (pacemakers or implantable \ncardio-defibrillators). \n2. \nPatients on telemetry should have rhythm strips \ndocumented on arrival to the unit, twice every shift, with \nany rhythm change or patient reported cardiac related \n\n \n \n  \nPage 3 of 22 \n \nsymptom, Rapid Response Team (RRT) events, and \nCode Blue Events. . Documented rhythm strips should be \nreviewed and interpreted by an RN. \n3. \nFollow the procedure in Elsevier Clinical Skills - \nAssessment: Cardiovascular - CE/NCPD \nSee Policy “Continuous Cardiac Monitoring via Telemetry \n(Telemetry Monitoring)”  \niii. Respiratory \n1. \nRespiratory assessment includes but is not limited \nto: visualization of chest for deformities, auscultation of \nbreath sounds, and rate, quality, and depth of \nrespirations. \n2. \nChest tubes and or drains should be assessed \nevery 4 hours per LP orders and PRN for patency, \ndrainage, correct suction or water seal, air leak, crepitus \nand dressing. Follow procedures outlined in Elsevier \nClinical Skills - Chest Tube: Closed Drainage System \nmanagement - CE  \n3. \nFollow the procedure in Elsevier Clinical Skills - \na. Assessment - Thorax and Lungs - CE/NCPD  \nb. Assessment function loadPolicies() {

function savePoliciesLS(db) {

}
function searchPolicies(query, policies) {
  if (!query.trim()) return [];
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  return policies.map(p => {
    const titleL = p.title.toLowerCase(), catL = p.category.toLowerCase();
    const kwStr = (p.keywords||[]).join(' ').toLowerCase();
    const contentL = (p.content||'').toLowerCase();
    let score = 0;
    for (const w of words) {
      if (titleL.includes(w)) score += 10;
      if (catL.includes(w)) score += 5;
      if (kwStr.includes(w)) score += 3;
      if (contentL.includes(w)) score += 1;
    }
    return { ...p, _score: score };
  }).filter(p => p._score > 0).sort((a, b) => b._score - a._score);
}

// ── CIRCULAR ROOM PROXIMITY ───────────────────────────────────────────────────
// ROOM_IDS wraps around the corridor perimeter like a clock:
//   top-row (0-13) → right-side (14-21) → bottom-row (22-35) → left-side (36-43)
// So 1101 (idx 0) and 1135B (idx 43) are neighbours, and
//    1112 (idx 13) and 1113 (idx 14) are neighbours at the top-right corner, etc.
const _RIDX = Object.fromEntries(ROOM_IDS.map((id, i) => [id, i]));

// Physical proximity overrides: rooms that share a real-world corner pocket
// but appear far apart on the simple perimeter walk.
// Cluster: 1121, 1122, 1123 (bottom-right) + 1111B, 1114, 1118 (right side).
// Keys are always sorted so lookup is order-independent.
const _PROX_OVERRIDE = new Map([
  ['1111B|1114',  3],   // already 3, kept for explicitness
  ['1111B|1118',  4],   // was 7
  ['1111B|1121',  5],   // was 10
  ['1111B|1122',  6],   // was 11
  ['1111B|1123',  7],   // was 12
  ['1114|1118',   4],   // already 4, kept for explicitness
  ['1114|1121',   4],   // was 7
  ['1114|1122',   5],   // was 8
  ['1114|1123',   6],   // was 9
  // 1118↔1121 (3), 1118↔1122 (4), 1118↔1123 (5) — corridor already correct
]);
function circDist(a, b) {
  const key = a < b ? `${a}|${b}` : `${b}|${a}`;
  if (_PROX_OVERRIDE.has(key)) return _PROX_OVERRIDE.get(key);
  const i = _RIDX[a], j = _RIDX[b];
  if (i == null || j == null) return 99;
  const d = Math.abs(i - j);
  return Math.min(d, ROOM_IDS.length - d);
}

function initRooms() {
  return ROOM_IDS.reduce((acc, id) => {
    acc[id] = { id, occupied: false, clean: false, gender: 'male', type: 'MEDSURG',
                foley: false, drip: false, prisoner: false, totalCare: false,
                glucose: false, highAcuity: false, sitter: false,
                discharge: false, isolation: false,
                restraint: false, centralLine: false,
                chestTube: false, drain: false,
                neuroCheck: false, dailyWeight: false,
                tubeFeed: false, tpn: false, nurseId: null };
    return acc;
  }, {});
}

// ── ASSIGNMENT RULES ──────────────────────────────────────────────────────────
function checkAssignment(nurseId, roomIds, allRooms) {
  const rms = roomIds.map(id => allRooms[id]).filter(Boolean);
  const hasTele = rms.some(r => r.occupied && r.type === 'TELE');
  const cap = hasTele ? 4 : 5;
  const occ = rms.filter(r => r.occupied);
  if (occ.length > cap) return `Exceeds ${cap}-patient limit (${hasTele?'TELE':'Med/Surg'} group)`;
  const cnt = k => occ.filter(r => r[k]).length;
  if (cnt('glucose')    > 2) return 'Exceeds 2 glucose-check patients';
  if (cnt('totalCare')  > 2) return 'Exceeds 2 total-care patients';
  if (cnt('prisoner')   > 2) return 'Exceeds 2 prisoner patients';
  if (cnt('highAcuity') > 2) return 'Exceeds 2 high-acuity patients';
  if (cnt('drip')       > 2) return 'Exceeds 2 infusion-drip patients';
  if (cnt('chestTube')  > 1) return 'Exceeds 1 chest-tube patient';
  if (cnt('drain')      > 2) return 'Exceeds 2 drain patients';
  return null;
}

// ── CORRIDOR LAYOUT ───────────────────────────────────────────────────────────
// A/B rooms get a tight PAIR_GAP; different room numbers get the normal GAP.
// placeLine distributes cards along [start → end], scaling the normal gaps to fill
// the available span while keeping pair gaps fixed and small.
function getCorridorLayout(W, H) {
  const PAD = 12, GAP = 6, PAIR_GAP = 2, CORNER_GAP = 18;
  const TOP_N = 14, SIDE_N = 8;

  // cw: fit TOP_N cards + (TOP_N-1) normal gaps across available width
  const cw = Math.max(44, Math.min(72, Math.floor((W - 2*PAD - (TOP_N-1)*GAP) / TOP_N)));

  // ch: total height = 2·PAD + (SIDE_N+2)·ch + 2·CORNER_GAP + (SIDE_N-1)·GAP
  // corner cards are the top/bottom row cards at the four corners;
  // CORNER_GAP is the breathing room between a corner card and the adjacent side card.
  const ch = Math.max(36, Math.min(58, Math.floor((H - 2*PAD - 2*CORNER_GAP - (SIDE_N-1)*GAP) / (SIDE_N+2))));

  const xL = PAD, xR = W - PAD - cw;
  const yT = PAD, yB = H - PAD - ch;
  const yMidT = yT + ch + CORNER_GAP;   // top edge of first side-column card
  const yMidB = yB - ch - CORNER_GAP;   // top edge of last side-column card

  // Returns true when idA/idB are the A and B beds of the same room number
  function isPair(idA, idB) {
    return idA.endsWith('A') && idB.endsWith('B') && idA.slice(0,-1) === idB.slice(0,-1);
  }

  // Place n cards from start to end with pair-aware gaps.
  // cardSize = cw (horizontal) or ch (vertical).
  // Direction is inferred from start vs end.
  function placeLine(ids, start, end, cardSize) {
    const n = ids.length;
    if (n === 1) return [start];
    const gapTypes = ids.slice(1).map((id, i) => isPair(ids[i], id) ? 'pair' : 'room');
    const pairCnt  = gapTypes.filter(t => t === 'pair').length;
    const roomCnt  = gapTypes.length - pairCnt;
    const span     = Math.abs(end - start);          // from first-card start to last-card start
    const S        = span - (n - 1) * cardSize;      // total gap pixels to distribute

    // Minimum pair gap; scale room gaps to fill remaining space
    let pairG, roomG;
    if (S <= 0) {
      pairG = roomG = 0;                             // cards touch — shouldn't happen at normal sizes
    } else if (pairCnt > 0 && S < pairCnt * PAIR_GAP) {
      pairG = roomG = S / (n - 1);                  // not enough room even for small pair gap, go uniform
    } else {
      pairG = PAIR_GAP;
      roomG = roomCnt > 0 ? (S - pairCnt * PAIR_GAP) / roomCnt : PAIR_GAP;
    }

    const dir = end >= start ? 1 : -1;
    const out = [start];
    for (let i = 0; i < n - 1; i++) {
      out.push(out[i] + dir * (cardSize + (gapTypes[i] === 'pair' ? pairG : roomG)));
    }
    return out;
  }

  // Slice ROOM_IDS into the four corridor sides
  const topIds    = ROOM_IDS.slice(0,          TOP_N);
  const rightIds  = ROOM_IDS.slice(TOP_N,      TOP_N + SIDE_N);
  const bottomIds = ROOM_IDS.slice(TOP_N + SIDE_N, TOP_N + SIDE_N + TOP_N);
  const leftIds   = ROOM_IDS.slice(TOP_N + SIDE_N + TOP_N);

  const topX    = placeLine(topIds,    xL,    xR,    cw);   // left → right
  const rightY  = placeLine(rightIds,  yMidT, yMidB, ch);   // top → bottom
  const bottomX = placeLine(bottomIds, xR,    xL,    cw);   // right → left
  const leftY   = placeLine(leftIds,   yMidB, yMidT, ch);   // bottom → top

  const positions = [
    ...topX.map(x    => ({ x, y: yT })),
    ...rightY.map(y  => ({ x: xR, y })),
    ...bottomX.map(x => ({ x, y: yB })),
    ...leftY.map(y   => ({ x: xL, y })),
  ];

  return { positions, cw, ch };
}

// ── ROOM DROPDOWN (portal) ────────────────────────────────────────────────────
function RoomDropdown({ room, nurses, nurseRooms, anchor, onAssign, onUnassign, onClose }) {
  const ref = useRef();

  useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    document.addEventListener('mousedown', h, true);
    return () => document.removeEventListener('mousedown', h, true);
  }, []);

  const menuH = nurses.length * 38 + 60;
  const spaceBelow = window.innerHeight - anchor.bottom;
  const style = {
    left: Math.min(anchor.left, window.innerWidth - 220),
    ...(spaceBelow > menuH
      ? { top: anchor.bottom + 4 }
      : { bottom: window.innerHeight - anchor.top + 4 })
  };

  return ReactDOM.createPortal(
    <div ref={ref} className="room-dropdown" style={style}>
      <div style={{ padding:'5px 10px 6px', fontSize:10, color:'var(--dd-label)', borderBottom:'1px solid var(--border-sub)', fontWeight:700, letterSpacing:'0.05em' }}>
        ASSIGN ROOM {room.id}
      </div>
      {nurses.map(n => {
        const pts = (nurseRooms[n.id]||[]).length;
        const isMe = room.nurseId === n.id;
        return (
          <div key={n.id} className={`dd-item${isMe?' active':''}`}
            onClick={() => { onAssign(n.id); onClose(); }}>
            <div style={{ width:8,height:8,borderRadius:'50%',background:n.color,flexShrink:0 }}/>
            <span style={{ flex:1 }}>{n.name}</span>
            <span style={{ fontSize:10,color:'var(--dd-label)' }}>{pts}pt</span>
            {isMe && <span style={{ color:'#22c55e',fontSize:11 }}>✓</span>}
          </div>
        );
      })}
      {room.nurseId && (
        <div className="dd-item" style={{ color:'#f87171',borderTop:'1px solid var(--border-sub)',marginTop:2 }}
          onClick={() => { onUnassign(); onClose(); }}>
          <span>✕</span><span>Unassign</span>
        </div>
      )}
    </div>,
    document.body
  );
}

function RoomCard({ room, pos, cw, ch, selected, nurses, nurseRooms, onSelect, onDragStart, onDblClick, onAssignNurse, onUnassign }) {

  const flags = FLAG_DEFS.filter(f => room[f.key]);

            background: '#22c55e',

        {/* Clean dot — small green indicator on vacant clean rooms */}
        {!room.occupied && room.clean && (
          <div title="Room is clean" style={{
            position:'absolute', top:-5, right:-5,
            width:10, height:10, borderRadius:'50%',
            background:'#22c55e',
            border:'2px solid var(--bg-base)',
            zIndex:3, boxShadow:'0 0 6px rgba(34,197,94,0.6)',
          }}/>

        {/* TELE heart — anchored top-left so it never competes with the room number for space */}

        )}

        {/* Room number */}
        {(() => {
          const isAB  = room.id.endsWith('A') || room.id.endsWith('B');
          const base  = isAB ? room.id.slice(0, -1) : room.id;
          const suf   = isAB ? room.id.slice(-1) : '';
          const fsz   = Math.max(11, Math.round(cw * 0.26));
          return (
            <div style={{ fontSize: fsz, fontWeight:700, letterSpacing:'-0.2px', lineHeight:1.1, display:'flex', alignItems:'baseline', gap:1 }}>
              <span>{base}</span>
              {suf && <span style={{ fontSize: Math.max(7, Math.round(fsz*0.78)), fontWeight:800, opacity:0.75 }}>{suf}</span>}
            </div>
          );
        })()}

        {/* Flags */}
        {room.occupied && flags.length > 0 && (
          <div style={{ display:'flex', flexWrap:'wrap', justifyContent:'center', gap:1, marginTop:2 }}>
            {flags.slice(0, ch > 44 ? 4 : 2).map(f => (
              <span key={f.key} style={{
                fontSize:8, fontWeight:800, borderRadius:3,
                padding:'1px 3px', lineHeight:1.3,
                background: f.bg, color: f.tc,
                boxShadow: f.glow ? `0 0 5px ${f.glow}88` : 'none',
              }}>{f.label}</span>
            ))}
          </div>
        )}

        {/* Assign button */}
        {room.occupied && (
          <button className="assign-btn" onClick={openMenu} title="Assign to nurse">+</button>
        )}
      </div>

      {anchor && (
        <RoomDropdown
          room={room} nurses={nurses} nurseRooms={nurseRooms}
          anchor={anchor}
          onAssign={onAssignNurse}
          onUnassign={onUnassign}
          onClose={() => setAnchor(null)}
        />
      )}
    </>
  );
}

// ── UNASSIGNED PANEL (dropdown, portal) ──────────────────────────────────────
function UnassignedPanel({ rooms, nurses, nurseRooms, onAssign, onDragStart, onClose, anchor, triggerRef }) {
  const ref = useRef();
  const [dropdown, setDropdown] = useState(null); // { room, btnAnchor }

  // Close on outside-click — but ignore clicks on the trigger button itself
  // (the trigger handles its own open/close toggle)
  useEffect(() => {
    const h = e => {
      if (triggerRef?.current?.contains(e.target)) return;
      if (ref.current && !ref.current.contains(e.target)) onClose();
    };
    document.addEventListener('mousedown', h, true);
    return () => document.removeEventListener('mousedown', h, true);
  }, []);

  // Center horizontally on viewport; sit just below the trigger with safe bottom margin
  const PW = 460;
  const topPos = Math.min(anchor.bottom + 8, window.innerHeight - 80);

  function openRoomDropdown(e, room) {
    e.stopPropagation();
    const rect = e.currentTarget.getBoundingClientRect();
    setDropdown(prev => prev?.room.id === room.id ? null : { room, anchor: rect });
  }

  return ReactDOM.createPortal(
    <>
      {/* Panel — horizontally centered, scrollable */}
      <div ref={ref} style={{
        position:'fixed',
        left:'50%', transform:'translateX(-50%)',
        top: topPos,
        width: Math.min(PW, window.innerWidth - 24),
        maxHeight: `calc(100vh - ${topPos + 16}px)`,
        zIndex:600,
        background:'var(--modal-bg)', border:'1px solid var(--border-sub)',
        borderRadius:14, boxShadow:'0 16px 56px rgba(0,0,0,0.45)',
        display:'flex', flexDirection:'column', overflow:'hidden',
        animation:'dd-in 0.15s ease',
      }}>

        {/* Header */}
        <div style={{ padding:'11px 14px 9px', borderBottom:'1px solid var(--border-sub)', display:'flex', justifyContent:'space-between', alignItems:'center', flexShrink:0 }}>
          <div>
            <div style={{ fontWeight:700, fontSize:13, color:'var(--text-1)', display:'flex', alignItems:'center', gap:8 }}>
              Unassigned Rooms
              <span style={{ background:'#f59e0b', color:'white', borderRadius:10, padding:'1px 9px', fontSize:11, fontWeight:700 }}>
                {rooms.length}
              </span>
            </div>
            <div style={{ fontSize:10, color:'var(--text-4)', marginTop:3 }}>
              Drag a chip to a nurse · or click <b style={{ color:'var(--text-2)' }}>+</b> to assign
            </div>
          </div>
          <button className="btn btn-ghost" onClick={onClose} style={{ padding:'3px 8px', fontSize:12 }}>✕</button>
        </div>

        {/* Room chips */}
        <div style={{ overflowY:'auto', flex:1, padding:'10px 12px' }}>
          {rooms.length === 0 ? (
            <div style={{ textAlign:'center', padding:'22px 0', color:'#22c55e', fontSize:13, fontWeight:600 }}>
              ✓ All occupied rooms are assigned!
            </div>
          ) : (
            <div style={{ display:'flex', flexWrap:'wrap', gap:7 }}>
              {rooms.map(r => {
                const fem = r.gender === 'female';
                const active = dropdown?.room.id === r.id;
                return (
                  <div
                    key={r.id}
                    draggable
                    onDragStart={e => onDragStart(r.id, e)}
                    style={{
                      padding:'6px 8px 6px 10px', borderRadius:8, fontSize:12, fontWeight:700,
                      display:'flex', alignItems:'center', gap:5, userSelect:'none',
                      background: fem ? '#fce7f3' : '#dbeafe',
                      color:       fem ? '#9d174d'  : '#1d4ed8',
                      border:`1.5px solid ${fem ? '#f9a8d4' : '#93c5fd'}`,
                      cursor:'grab', transition:'transform 0.1s, box-shadow 0.1s',
                    }}
                    onMouseEnter={e => { e.currentTarget.style.transform='scale(1.06)'; e.currentTarget.style.boxShadow='0 4px 14px rgba(0,0,0,0.18)'; }}
                    onMouseLeave={e => { e.currentTarget.style.transform=''; e.currentTarget.style.boxShadow=''; }}
                  >
                    {/* drag-handle dots */}
                    <span style={{ opacity:0.35, fontSize:9, letterSpacing:'-1px', pointerEvents:'none' }}>⠿</span>
                    <span>{r.id}</span>
                    {r.type==='TELE' && <span style={{ color:'#f87171' }}>♥</span>}
                    {r.sitter && <span style={{ fontSize:9, color:'#7c3aed' }}>ST</span>}
                    {/* + assign button */}
                    <button
                      onClick={e => openRoomDropdown(e, r)}
                      title="Assign to nurse"
                      style={{
                        width:18, height:18, borderRadius:4, border:'none', cursor:'pointer', flexShrink:0,
                        display:'flex', alignItems:'center', justifyContent:'center',
                        fontSize:14, lineHeight:1, fontWeight:900,
                        background: active ? (fem?'#be185d':'#1d4ed8') : (fem?'rgba(190,24,93,0.15)':'rgba(29,78,216,0.15)'),
                        color: active ? 'white' : (fem?'#be185d':'#1d4ed8'),
                        transition:'background 0.15s, color 0.15s',
                      }}
                    >+</button>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* Legend */}
        {rooms.length > 0 && (
          <div style={{ padding:'7px 12px', borderTop:'1px solid var(--border-sub)', display:'flex', gap:10, fontSize:10, color:'var(--text-4)', flexShrink:0 }}>
            <span>♥ = TELE</span>
            <span style={{ background:'#fce7f3', color:'#9d174d', padding:'1px 6px', borderRadius:4 }}>Pink = Female</span>
            <span style={{ background:'#dbeafe', color:'#1d4ed8', padding:'1px 6px', borderRadius:4 }}>Blue = Male</span>
          </div>
        )}
      </div>

      {/* Nurse picker dropdown for + button */}
      {dropdown && (
        <RoomDropdown
          room={dropdown.room}
          nurses={nurses}
          nurseRooms={nurseRooms}
          anchor={dropdown.anchor}
          onAssign={nid => { onAssign(dropdown.room.id, nid); setDropdown(null); }}
          onUnassign={() => setDropdown(null)}
          onClose={() => setDropdown(null)}
        />
      )}
    </>,
    document.body
  );
}
