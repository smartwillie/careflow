// ── NURSE FEEDBACK STRIP (inline, per-nurse) ──────────────────────────────────
const NURSE_FB_REASONS = [
  { key:'spread',  label:'Too spread',      icon:'📍' },
  { key:'load',    label:'Too many rooms',  icon:'⚖️' },
  { key:'heavy',   label:'Too heavy',       icon:'🔴' },
  { key:'mix',     label:'TELE/Med mix',    icon:'💔' },
  { key:'cluster', label:'Lack of cluster', icon:'🗺️' },
];
function NurseFeedbackStrip({ onGood, onBad, nurseColor }) {
  const [phase, setPhase] = React.useState('ask'); // ask | reason | done

  if (phase === 'done') return (
    <div style={{ marginTop:6, padding:'5px 8px', borderRadius:7, fontSize:10, textAlign:'center',
      background:'rgba(34,197,94,0.08)', color:'#86efac', border:'1px solid rgba(34,197,94,0.2)' }}>
      ✓ Feedback saved
    </div>
  );

  if (phase === 'reason') return (
    <div style={{ marginTop:6, padding:'6px 8px', borderRadius:7,
      background:'rgba(239,68,68,0.07)', border:'1px solid rgba(239,68,68,0.2)' }}>
      <div style={{ fontSize:9, color:'var(--text-4)', marginBottom:4, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.05em' }}>What's wrong?</div>
      <div style={{ display:'flex', flexWrap:'wrap', gap:4 }}>
        {NURSE_FB_REASONS.map(r=>(
          <button key={r.key} onClick={()=>{ onBad(r.key); setPhase('done'); }}
            style={{ fontSize:9, padding:'3px 7px', borderRadius:10, border:'1px solid rgba(239,68,68,0.35)',
              background:'rgba(239,68,68,0.12)', color:'#fca5a5', cursor:'pointer', display:'flex', alignItems:'center', gap:3 }}>
            {r.icon} {r.label}
          </button>
        ))}
        <button onClick={()=>setPhase('ask')}
          style={{ fontSize:9, padding:'2px 5px', borderRadius:10, border:'none', background:'transparent', color:'var(--text-4)', cursor:'pointer', marginLeft:'auto' }}>✕</button>
      </div>
    </div>
  );

  return (
    <div style={{ marginTop:6, padding:'5px 8px', borderRadius:7, display:'flex', alignItems:'center', gap:6,
      background:'rgba(255,255,255,0.04)', border:'1px solid rgba(255,255,255,0.08)' }}>
      <span style={{ fontSize:9, color:'var(--text-4)', flex:1, fontWeight:600 }}>This assignment?</span>
      <button onClick={()=>{ onGood(); setPhase('done'); }}
        style={{ fontSize:10, padding:'3px 9px', borderRadius:10, border:'1px solid rgba(34,197,94,0.4)',
          background:'rgba(34,197,94,0.12)', color:'#86efac', cursor:'pointer', fontWeight:700 }}>👍</button>
      <button onClick={()=>setPhase('reason')}
        style={{ fontSize:10, padding:'3px 9px', borderRadius:10, border:'1px solid rgba(239,68,68,0.4)',
          background:'rgba(239,68,68,0.12)', color:'#fca5a5', cursor:'pointer', fontWeight:700 }}>👎</button>
    </div>
  );
}

// ── NURSE CARD ────────────────────────────────────────────────────────────────
function NurseCard({ nurse, rooms, allRooms, previewIds, onRemoveAll, onDrop, onRename, onDelete, locked, onToggleLock, onToggleShift, showFeedback, onFeedbackGood, onFeedbackBad }) {
  const [dragOver, setDragOver] = useState(false);
  const [trashOver, setTrashOver] = useState(false);
  const [editing, setEditing] = useState(false);
  const [nameVal, setNameVal] = useState(nurse.name);
  const inputRef = useRef();

  useEffect(() => { if (editing && inputRef.current) inputRef.current.focus(); }, [editing]);
  // Keep local nameVal in sync when nurse.name changes externally (e.g. undo, sync)
  useEffect(() => { if (!editing) setNameVal(nurse.name); }, [nurse.name]);

  const nurseRms = rooms.map(id=>allRooms[id]).filter(Boolean);
  const occ = nurseRms.filter(r=>r.occupied);
  const hasTele = occ.some(r=>r.type==='TELE');
  const cap = hasTele ? 4 : 5;
  const pct = Math.min((occ.length/cap)*100, 100);
  // Green when fully assigned (complete), red when under capacity (incomplete/partial)
  const capColor = pct>=100 ? '#30D158' : '#FF453A';

  const flagDefs = FLAG_DEFS; // shared definition

  const incomingPreview = dragOver
    ? (previewIds||[]).filter(id => !rooms.includes(id) && allRooms[id]?.occupied)
    : [];

  return (
    <div
      className={`nurse-card${dragOver&&!trashOver?' drag-over':''}`}
      style={{ borderLeft:`3px solid ${nurse.color}` }}
      onDragOver={e=>{ e.preventDefault(); if(!trashOver) setDragOver(true); }}
      onDragLeave={e=>{ if(!e.currentTarget.contains(e.relatedTarget)) setDragOver(false); }}
      onDrop={e=>{ e.preventDefault(); setDragOver(false); onDrop(e,false); }}
    >
      {/* Header row: [dot] [name] [count·TELE·lock] ··flex gap·· [trash] */}
      <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:6 }}>
        <div className="nurse-color-dot" style={{ background:nurse.color }}/>
        {/* Name — natural width, no flex:1 so controls sit right beside it */}
        {editing ? (
          <input ref={inputRef} type="text" value={nameVal}
            placeholder="Enter name…"
            onChange={e=>setNameVal(e.target.value)}
            onBlur={()=>{
              const v = nameVal.trim();
              if (v) onRename(v);
              setNameVal(v || nurse.name);
              setEditing(false);
            }}
            onKeyDown={e=>{
              if(e.key==='Enter'){
                const v = nameVal.trim();
                if (v) onRename(v);
                setNameVal(v || nurse.name);
                setEditing(false);
              }
              if(e.key==='Escape'){ setNameVal(nurse.name); setEditing(false); }
            }}
            style={{ minWidth:90, padding:'2px 6px', fontSize:13 }}
          />
        ) : (
          <span style={{ fontWeight:700, fontSize:15, cursor:'text', color:'var(--text-1)', whiteSpace:'nowrap' }}
            onDoubleClick={()=>{ setNameVal(nurse.name); setEditing(true); }}>
            {nurse.name}
          </span>
        )}
        {/* Count */}
        <span style={{
          fontSize:11, fontWeight:700, letterSpacing:'0.02em',
          color: pct>=100 ? '#ef4444' : pct>=75 ? '#f59e0b' : 'var(--text-3)',
          background: pct>=100 ? 'rgba(239,68,68,0.12)' : pct>=75 ? 'rgba(245,158,11,0.12)' : 'transparent',
          padding: pct>=75 ? '1px 5px' : '0', borderRadius:4,
          transition:'color 0.2s, background 0.2s', whiteSpace:'nowrap',
        }}>{occ.length}/{cap}</span>
        {hasTele && <span style={{ fontSize:10, background:'rgba(127,29,29,0.7)', color:'#fca5a5', borderRadius:4, padding:'1px 6px', letterSpacing:'0.04em', whiteSpace:'nowrap' }}>TELE</span>}
        {/* Shift toggle */}
        <button
          onClick={onToggleShift}
          title={`Shift: ${nurse.shift==='PM'?'PM/NOC':'AM'} — click to switch (used by Export Sheet)`}
          style={{
            background: nurse.shift==='PM' ? 'rgba(99,102,241,0.18)' : 'rgba(245,158,11,0.18)',
            border: nurse.shift==='PM' ? '1px solid rgba(99,102,241,0.55)' : '1px solid rgba(245,158,11,0.55)',
            color: nurse.shift==='PM' ? '#a5b4fc' : '#fcd34d',
            borderRadius: 6, padding:'1px 6px', cursor:'pointer', fontSize:10, fontWeight:800,
            lineHeight:1.6, letterSpacing:'0.03em', whiteSpace:'nowrap',
            transition:'background 0.15s, border-color 0.15s',
          }}
        >{nurse.shift==='PM' ? 'PM' : 'AM'}</button>

        {/* Lock toggle */}
        <button
          onClick={onToggleLock}
          title={locked ? 'Locked — rooms kept on OpenAssign AI' : 'Unlocked — rooms reset on OpenAssign AI'}
          style={{
            background: locked ? 'rgba(251,191,36,0.18)' : 'transparent',
            border: locked ? '1px solid rgba(251,191,36,0.55)' : '1px solid transparent',
            borderRadius: 6, padding:'2px 5px', cursor:'pointer', fontSize:13, lineHeight:1,
            transition:'background 0.15s, border-color 0.15s',
          }}
        >{locked ? '🔒' : '🔓'}</button>

        {/* Push trash bin to far right */}
        <div style={{ flex:1 }}/>

        {/* Trash bin — prominent, alone in upper-right */}
        <div className={`trash-zone${trashOver?' drag-over':''}`}
          onDragOver={e=>{ e.preventDefault(); e.stopPropagation(); setTrashOver(true); setDragOver(false); }}
          onDragLeave={()=>setTrashOver(false)}
          onDrop={e=>{ e.preventDefault(); e.stopPropagation(); setTrashOver(false); setDragOver(false); onDrop(e,true); }}
          onClick={onDelete}
          title="Drop room here to remove · Click to delete nurse"
          style={{ color:'#4ade80', borderColor:'rgba(74,222,128,0.35)', opacity:0.8 }}
        >🗑</div>
      </div>

      {/* Capacity bar */}
      <div className="cap-bar">
        <div className="cap-fill" style={{ width:pct+'%', background:capColor }}/>
      </div>

      {/* Flag pills */}
      <div style={{ display:'flex', gap:3, marginTop:5, flexWrap:'wrap' }}>
        {flagDefs.map(f=>{
          const c = occ.filter(r=>r[f.key]).length;
          if(!c) return null;
          return <span key={f.key} style={{ fontSize:9, padding:'1px 5px', borderRadius:4, fontWeight:700,
            background: c>=2 ? f.bg : 'var(--bg-base)',
            color:      c>=2 ? f.tc : 'var(--text-3)',
            border:`1px solid ${f.bg}`,
            boxShadow: c>=2 && f.glow ? `0 0 6px ${f.glow}66` : 'none' }}>
            {c} {f.label}
          </span>;
        })}
      </div>

      {/* Room badges — sorted in natural corridor order (1101, 1102 … 1110A, 1110B …) */}
      <div style={{ display:'flex', flexWrap:'wrap', marginTop:6, gap:3, minHeight: occ.length===0 ? 28 : 10,
        alignItems:'center', justifyContent: occ.length===0 ? 'center' : 'flex-start' }}>
        {occ.length===0 && !dragOver && (
          <span style={{ fontSize:10, color:'var(--text-5)', letterSpacing:'0.04em', userSelect:'none',
            display:'flex', alignItems:'center', gap:4 }}>
            <span style={{ opacity:0.5 }}>↓</span> drag rooms here
          </span>
        )}
        {[...rooms].sort((a,b) => _RIDX[a] - _RIDX[b]).map(id=>{
          const r = allRooms[id];
          if(!r?.occupied) return null;
          return (
            <NurseBadge key={id} room={r}
              onDragStart={e=>{ e.dataTransfer.setData('badgeRoomId',id); e.dataTransfer.setData('fromNurseId',nurse.id); }}
            />
          );
        })}
        {incomingPreview.map(id=>{
          const r = allRooms[id];
          return (
            <span key={'p'+id} className="badge-preview">
              {id}{r.type==='TELE'&&<span style={{ color:'#f87171',marginLeft:2 }}>♥</span>}
            </span>
          );
        })}
      </div>

      {rooms.length>0 && (
        <div style={{ marginTop:16, borderTop:'1px solid var(--border)', paddingTop:10 }}>
          <button className="btn btn-ghost"
            onClick={() => {
              if (window.confirm(`Remove all ${occ.length} room${occ.length!==1?'s':''} from ${nurse.name}?`))
                onRemoveAll();
            }}
            style={{ fontSize:11, padding:'4px 10px', width:'100%',
              color:'#FF453A', borderColor:'rgba(255,69,58,0.25)',
              background:'rgba(255,69,58,0.06)' }}>
            Remove All Rooms
          </button>
        </div>
      )}

      {/* Per-nurse Zap feedback strip */}
      {showFeedback && <NurseFeedbackStrip onGood={onFeedbackGood} onBad={onFeedbackBad} nurseColor={nurse.color} />}
    </div>
  );
}

// ── CENTER DASHBOARD ─────────────────────────────────────────────────────────
// Unified car-dashboard tile: same shape for all stats.
// Pass onClick to make it interactive (unassigned dropdown trigger).
function DashTile({ icon, value, label, color, accentColor, onClick, active, btnRef }) {
  const isBtn = !!onClick;
  const numColor = accentColor || color;
  return (
    <div
      ref={btnRef}
      onClick={onClick}
      className={`dash-tile${isBtn ? ' dash-tile-btn' : ''}${active ? ' dash-tile-active' : ''}`}
    >
      {/* Value */}
      <div style={{
        fontSize:32, fontWeight:900, color: numColor, lineHeight:1,
        textShadow: numColor && !numColor.startsWith('var(') && numColor !== '#fff' ? `0 0 18px ${numColor}66` : 'none',
        letterSpacing:'-1px',
      }}>{value}</div>
      {/* Label */}
      <div style={{
        fontSize:10, fontWeight:700, letterSpacing:'0.07em',
        textTransform:'uppercase', color:'var(--dash-label)',
        lineHeight:1, textAlign:'center',
      }}>{label}</div>
      {/* Chevron */}
      <div style={{
        fontSize:8, color: numColor, lineHeight:1, marginTop:1,
        opacity: isBtn ? (active ? 0.9 : 0.28) : 0,
        visibility: isBtn ? 'visible' : 'hidden',
        transform: active ? 'rotate(180deg)' : 'none',
        transition:'transform 0.2s, opacity 0.2s',
      }}>▾</div>
    </div>
  );
}

// ── STAT ROOM POPUP — generic popup listing rooms for a given property ────────
function StatRoomPopup({ title, icon, color, rooms, allRooms, nurseRooms, nurses, anchor, onClose }) {
  const ref = React.useRef();

  // Close on outside click
  React.useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    document.addEventListener('mousedown', h, true);
    return () => document.removeEventListener('mousedown', h, true);
  }, []);

  // Center below the anchor tile
  const PW = 380;
  const topPos = anchor ? Math.min(anchor.bottom + 8, window.innerHeight - 80) : 200;

  // Build nurse lookup: roomId → nurse name
  const nurseByRoom = {};
  nurses.forEach(n => { (nurseRooms[n.id]||[]).forEach(id => { nurseByRoom[id] = n; }); });

  const sorted = [...rooms].sort((a,b) => _RIDX[a.id] - _RIDX[b.id]);

  return ReactDOM.createPortal(
    <div ref={ref} style={{
      position:'fixed',
      left:'50%', transform:'translateX(-50%)',
      top: topPos,
      width: Math.min(PW, window.innerWidth - 24),
      maxHeight: `calc(100vh - ${topPos + 16}px)`,
      zIndex:610,
      background:'var(--modal-bg)', border:'1px solid var(--border-sub)',
      borderRadius:14, boxShadow:'0 16px 56px rgba(0,0,0,0.45)',
      display:'flex', flexDirection:'column', overflow:'hidden',
      animation:'dd-in 0.15s ease',
    }}>
      {/* Header */}
      <div style={{ padding:'11px 14px 9px', borderBottom:'1px solid var(--border-sub)',
        display:'flex', justifyContent:'space-between', alignItems:'center', flexShrink:0 }}>
        <div style={{ fontWeight:700, fontSize:13, color:'var(--text-1)', display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:16 }}>{icon}</span>
          {title}
          <span style={{ background:color, color:'#fff', borderRadius:10, padding:'1px 9px', fontSize:11, fontWeight:700 }}>
            {rooms.length}
          </span>
        </div>
        <button className="btn btn-ghost" onClick={onClose} style={{ padding:'3px 8px', fontSize:12 }}>✕</button>
      </div>
      {/* Room list */}
      <div style={{ overflowY:'auto', flex:1, padding:'10px 12px' }}>
        {rooms.length === 0 ? (
          <div style={{ textAlign:'center', padding:'22px 0', color:'var(--text-4)', fontSize:13 }}>
            No rooms with this flag
          </div>
        ) : (
          <div style={{ display:'flex', flexWrap:'wrap', gap:7 }}>
            {sorted.map(r => {
              const nurse = nurseByRoom[r.id];
              const fem   = r.gender === 'female';
              return (
                <div key={r.id} style={{
                  padding:'6px 10px', borderRadius:8, fontSize:12, fontWeight:700,
                  display:'flex', alignItems:'center', gap:6,
                  background: fem ? '#fce7f3' : '#dbeafe',
                  color:      fem ? '#9d174d'  : '#1d4ed8',
                  border:`1.5px solid ${fem ? '#f9a8d4' : '#93c5fd'}`,
                }}>
                  <span>{r.id}</span>
                  {r.type==='TELE' && <span style={{ color:'#f87171' }}>♥</span>}
                  {nurse && (
                    <span style={{
                      fontSize:9, fontWeight:700, padding:'1px 5px', borderRadius:4,
                      background: nurse.color+'33', color: nurse.color,
                      border:`1px solid ${nurse.color}66`,
                    }}>{nurse.name.split(' ')[0]}</span>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
      {/* Legend */}
      <div style={{ padding:'7px 12px', borderTop:'1px solid var(--border-sub)',
        display:'flex', gap:10, fontSize:10, color:'var(--text-4)', flexShrink:0 }}>
        <span style={{ background:'#fce7f3', color:'#9d174d', padding:'1px 6px', borderRadius:4 }}>Pink = Female</span>
        <span style={{ background:'#dbeafe', color:'#1d4ed8', padding:'1px 6px', borderRadius:4 }}>Blue = Male</span>
        <span style={{ marginLeft:'auto' }}>♥ = TELE</span>
      </div>
    </div>,
    document.body
  );
}

// ── FEEDBACK BAR ──────────────────────────────────────────────────────────────
const FB_REASONS = [
  { key:'spread',     label:'Rooms too spread out',  icon:'📍' },
  { key:'load',       label:'Uneven workload',        icon:'⚖️' },
  { key:'heavy',      label:'Too many heavy rooms',   icon:'🔴' },
  { key:'mix',        label:'TELE/Med mixed',         icon:'💔' },
  { key:'cluster',    label:'Lack of cluster',        icon:'🗺️' },
];

function FeedbackBar({ onGood, onBad }) {
  const [phase, setPhase] = React.useState('ask'); // 'ask' | 'reason' | 'done-good' | 'done-bad'

  function handleGood() {
    onGood();
    setPhase('done-good');
  }
  function handleBad(key) {
    onBad(key);
    setPhase('done-bad');
  }

  const base = {
    marginTop:10, borderRadius:10, padding:'9px 12px', fontSize:12,
    display:'flex', alignItems:'center', gap:8, flexWrap:'wrap',
    background:'rgba(0,0,0,0.22)', border:'1px solid rgba(255,255,255,0.12)',
  };

  if (phase === 'done-good') return (
    <div style={{...base, justifyContent:'center', color:'#86efac'}}>
      ✓ Got it — reinforcing this pattern
    </div>
  );
  if (phase === 'done-bad') return (
    <div style={{...base, justifyContent:'center', color:'#fca5a5'}}>
      ✓ Noted — adjusting for next time
    </div>
  );
  if (phase === 'reason') return (
    <div style={base}>
      <span style={{color:'rgba(255,255,255,0.6)', fontSize:11, flexShrink:0}}>What's wrong?</span>
      {FB_REASONS.map(r => (
        <button key={r.key} onClick={() => handleBad(r.key)} style={{
          background:'rgba(239,68,68,0.18)', border:'1px solid rgba(239,68,68,0.4)',
          color:'#fca5a5', borderRadius:16, padding:'3px 10px', fontSize:11,
          cursor:'pointer', display:'flex', alignItems:'center', gap:4,
        }}>{r.icon} {r.label}</button>
      ))}
      <button onClick={()=>setPhase('ask')} style={{marginLeft:'auto',background:'transparent',border:'none',color:'rgba(255,255,255,0.4)',cursor:'pointer',fontSize:12}}>✕</button>
    </div>
  );
  return (
    <div style={base}>
      <span style={{color:'rgba(255,255,255,0.65)', fontSize:11, flex:1}}>How was this assignment?</span>
      <button onClick={handleGood} style={{
        background:'rgba(34,197,94,0.18)', border:'1px solid rgba(34,197,94,0.4)',
        color:'#86efac', borderRadius:16, padding:'4px 14px', fontSize:12, cursor:'pointer', fontWeight:700,
      }}>👍 Good</button>
      <button onClick={()=>setPhase('reason')} style={{
        background:'rgba(239,68,68,0.18)', border:'1px solid rgba(239,68,68,0.4)',
        color:'#fca5a5', borderRadius:16, padding:'4px 14px', fontSize:12, cursor:'pointer', fontWeight:700,
      }}>👎 Needs work</button>
    </div>
  );
}

function FlagTile({ icon, value, label, color, onClick, active, btnRef }) {
  const isBtn = !!onClick;
  const lit = value > 0;
  return (
    <div ref={btnRef} onClick={onClick}
      className={`flag-tile${isBtn ? ' flag-tile-btn' : ''}${active ? ' flag-tile-active' : ''}`}
      title={label}
    >
      <span style={{ fontSize:13, lineHeight:1, opacity: lit ? 1 : 0.38 }}>{icon}</span>
      <span style={{
        fontSize:20, fontWeight:900, lineHeight:1, letterSpacing:'-0.5px',
        color: lit ? 'var(--dash-val)' : 'var(--dash-val-muted)',
        textShadow: lit ? `0 0 18px ${color}99` : 'none',
      }}>{value}</span>
      <span style={{
        fontSize:9, fontWeight:800, letterSpacing:'0.07em', textTransform:'uppercase',
        color: lit ? 'var(--dash-label)' : 'var(--dash-val-muted)',
        lineHeight:1, textAlign:'center',
      }}>{label}</span>
    </div>
  );

function CenterDashboard({ vacant, occupied, assigned, unassigned, tele, medsurg, sitter,
                           discharge, isolation, restraint, centralLine, foley,
                           neuroCheck, dailyWeight, glucose, dialysis, etoh, drip,
                           sitterRooms, dischargeRooms, isolationRooms, centralLineRooms, foleyRooms,
                           neuroCheckRooms, dailyWeightRooms, glucoseRooms, dialysisRooms, etohRooms, dripRooms,
                           nurses, nurseRooms,
                           unassignedOpen, onUnassignedClick, unassignedBtnRef,
                           onZapAssign, zapLoading, fuelMode, onToggleFuel,
                           fbWeights, onExportSheet, onMonkeyClick }) {
  const [pressed, setPressed] = React.useState(false);
  // popup state: null | { key, anchor }
  const [statPopup, setStatPopup] = React.useState(null);
  const [dashCharacter, setDashCharacter] = React.useState(() => localStorage.getItem('careflow-dash-character') || 'grogu');
  const [showSettings, setShowSettings] = React.useState(false);
  const selectCharacter = (char) => { setDashCharacter(char); localStorage.setItem('careflow-dash-character', char); setShowSettings(false); };

  // Grogu idle — toggle class on runner; CSS specificity does the rest (no inline style fights)
  const _runnerRef = React.useRef(null);
  React.useEffect(() => {
    const CYCLE = 22000;
    const PAUSES = [[3000, 8000], [14000, 19000]];
    let lastIdle = false;
    let startMs = null;
    const runner = _runnerRef.current;

    // Capture exact CSS animation start time via event (fires on runner for monkey-walk)
    const onStart = (e) => {
      if (startMs === null && e.target === runner) startMs = performance.now();
    };
    runner?.addEventListener('animationstart', onStart);

    const id = setInterval(() => {
      // Fallback if animationstart already fired before useEffect ran
      if (startMs === null && runner?.getAnimations) {
        try {
          const anims = runner.getAnimations();
          if (anims.length > 0 && anims[0].currentTime != null) {
            startMs = performance.now() - ((anims[0].currentTime % CYCLE + CYCLE) % CYCLE);
          }
        } catch (_) {}
      }
      if (startMs === null) return;
      const t = (performance.now() - startMs) % CYCLE;
      const idle = PAUSES.some(([s, e]) => t >= s && t <= e);
      if (idle === lastIdle) return;
      lastIdle = idle;
      runner?.classList.toggle('grogu-idle', idle);
    }, 50);

    return () => {
      clearInterval(id);
      runner?.removeEventListener('animationstart', onStart);
    };
  }, []);
  const sitterRef      = React.useRef();
  const dischargeRef   = React.useRef();
  const isolationRef   = React.useRef();
  const centralLineRef = React.useRef();
  const foleyRef       = React.useRef();
  const neuroCheckRef  = React.useRef();
  const dailyWeightRef = React.useRef();
  const glucoseRef     = React.useRef();
  const dialysisRef    = React.useRef();
  const etohRef        = React.useRef();
  const dripRef        = React.useRef();

  function toggleStatPopup(key, ref) {
    setStatPopup(prev => prev?.key === key ? null : { key, anchor: ref.current?.getBoundingClientRect() });
  }

  // Is the model tuned away from baseline?
  const isTuned = fbWeights && Object.entries(fbWeights).some(([,v]) => Math.abs(v - 1.0) > 0.05);

  function handleZap() {
    if (zapLoading) return;
    setPressed(true);
    setTimeout(() => setPressed(false), 400);
    onZapAssign();
  }

  const allFull = assigned === occupied && occupied > 0;

  return (
    <div className="dash-card dash-cockpit" style={{
      padding:'58px 20px 16px',
      boxShadow:`0 8px 32px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.06) inset`,
    }}>

      {/* ── Policy monkey track ── */}
      <div className="rabbit-track">
        <div ref={_runnerRef} className="rabbit-runner" onClick={onMonkeyClick} title="Click to search unit policies">
          <div className="monkey-group">
            <div className="monkey-bubble" onClick={e=>{e.stopPropagation();onMonkeyClick();}}>{dashCharacter==="grogu"?"I am Grogu, ask me anything":dashCharacter==="monkey"?"🐒 Ask about policies!":dashCharacter==="sat"?"💃 Search policies!":dashCharacter==="dog"?"🐕 Fetch a policy!":"🐼 Search policies!"}</div>
            <div className="rabbit-flip">
              <span className="rabbit-emoji" style={{display:'inline-block'}}>
                {dashCharacter==="grogu" ? (
                  <img src={_GROGU_IMG_SRC} width="56" height="56" style={{display:'block'}}/>
                ) : dashCharacter==="sat" ? (
                  <img src={_SAT_IMG_SRC} width="56" height="56" style={{display:'block'}}/>
                ) : dashCharacter==="dog" ? (
                  <img src={_DOG_IMG_SRC} width="72" height="57" style={{display:'block',position:'relative',top:4}}/>
                ) : (
                  <span style={{fontSize:36,lineHeight:1,display:'block',transform:'scaleX(-1)'}}>{dashCharacter==="monkey"?"🐒":"🐼"}</span>
                )}
              </span>
              {dashCharacter!=="grogu" && dashCharacter!=="sat" && dashCharacter!=="dog" && (
                <span className="monkey-banana">{dashCharacter==="monkey"?"🍌":"🎋"}</span>
              )}
            </div>
            <div className="monkey-shadow"/>
          </div>
        </div>
      </div>

      {/* ── Header row: branding + ECO toggle ── */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between',
        gap:8, marginBottom:14, marginTop:10 }}>
        <div style={{ display:'flex', alignItems:'baseline', gap:6 }}>
          <span style={{ fontSize:15, fontWeight:800, letterSpacing:'-0.3px',
            color:'var(--dash-head)' }}>Unit</span>
          <span className="crazy-word" style={{ fontSize:22 }}>Overview</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
        <button
          onClick={()=>setShowSettings(true)}
          title="Dashboard Settings"
          style={{background:'none',border:'1px solid rgba(255,255,255,0.18)',borderRadius:8,cursor:'pointer',padding:'4px 7px',fontSize:14,color:'rgba(255,255,255,0.65)',lineHeight:1,display:'flex',alignItems:'center',marginTop:4,transition:'opacity 0.15s'}}
        >⚙️</button>
        <button
          onClick={onToggleFuel}
          title={fuelMode ? 'ECO ON — MedSurg priority' : 'ECO OFF'}
          className={`eco-toggle ${fuelMode ? 'eco-toggle-on' : 'eco-toggle-off'}`}
          style={{ marginTop:4 }}
        >
          <span className="eco-icon">
            <svg width="13" height="13" viewBox="0 0 20 20" fill="none">
              <rect x="2" y="4" width="11" height="14" rx="2" stroke="currentColor" strokeWidth="1.8"/>
              <path d="M13 8h2a2 2 0 012 2v2a2 2 0 01-2 2h-2" stroke="currentColor" strokeWidth="1.8"/>
              <rect x="4" y="10" width={fuelMode ? 7 : 2} height="3" rx="1" fill="currentColor" style={{transition:'width 0.3s'}}/>
              <line x1="4" y1="8" x2="11" y2="8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
          </span>
          <span>ECO</span>
          <span style={{ width:5, height:5, borderRadius:'50%', flexShrink:0,
            background: fuelMode ? '#f97316' : 'transparent', transition:'background 0.22s' }}/>
        </button>
        </div>
      </div>

      {/* ── Primary stats ── */}
      <div className="dash-section-label">Room Status</div>
      <div style={{ display:'flex', gap:10, alignItems:'stretch', marginBottom:12 }}>
        <DashTile value={vacant}     label="Empty"
          color={vacant > 0 ? 'var(--dash-val)' : 'var(--dash-val-muted)'} />
        <DashTile value={occupied}   label="Occupied"  color="var(--dash-val)" />
        <DashTile value={assigned}   label="Assigned"
          color={allFull ? '#30D158' : 'var(--dash-val)'}
          accentColor={allFull ? '#30D158' : undefined} />
        <DashTile value={unassigned} label="Pending"
          color={unassigned > 0 ? '#FF9F0A' : 'var(--dash-val)'}
          accentColor={unassigned > 0 ? '#FF9F0A' : undefined}
          onClick={onUnassignedClick} active={unassignedOpen} btnRef={unassignedBtnRef} />
        <DashTile value={tele} label="TELE"
          color={tele > 0 ? '#FF453A' : 'var(--dash-val)'}
          accentColor={tele > 0 ? '#FF453A' : undefined} />
        <DashTile value={medsurg} label="MED/SURG"
          color={medsurg > 0 ? '#0ea5e9' : 'var(--dash-val)'}
          accentColor={medsurg > 0 ? '#0ea5e9' : undefined} />
      </div>

      {/* ── Acuity & flag stats ── */}
      <div className="dash-section-label">Acuity Flags</div>
      <div style={{ display:'flex', gap:8, alignItems:'stretch', marginBottom:18 }}>
        <FlagTile icon="👁" value={sitter}      label="SITTER" color="#c4b5fd"
          onClick={()=>toggleStatPopup('sitter',sitterRef)} active={statPopup?.key==='sitter'} btnRef={sitterRef} />
        <FlagTile icon="🚪" value={discharge}   label="DISCHARGE" color="#7dd3fc"
          onClick={()=>toggleStatPopup('discharge',dischargeRef)} active={statPopup?.key==='discharge'} btnRef={dischargeRef} />
        <FlagTile icon="☣" value={isolation}   label="ISO"  color="#fb923c"
          onClick={()=>toggleStatPopup('isolation',isolationRef)} active={statPopup?.key==='isolation'} btnRef={isolationRef} />
        <FlagTile icon="💧" value={foley}       label="FOLEY" color="#a78bfa"
          onClick={()=>toggleStatPopup('foley',foleyRef)} active={statPopup?.key==='foley'} btnRef={foleyRef} />
        <FlagTile icon="⊕" value={centralLine} label="LINE" color="#93c5fd"
          onClick={()=>toggleStatPopup('centralLine',centralLineRef)} active={statPopup?.key==='centralLine'} btnRef={centralLineRef} />
        <FlagTile icon="🧠" value={neuroCheck}  label="NEURO" color="#bfdbfe"
          onClick={()=>toggleStatPopup('neuroCheck',neuroCheckRef)} active={statPopup?.key==='neuroCheck'} btnRef={neuroCheckRef} />
        <FlagTile icon="⚖" value={dailyWeight} label="DW"   color="#6ee7b7"
          onClick={()=>toggleStatPopup('dailyWeight',dailyWeightRef)} active={statPopup?.key==='dailyWeight'} btnRef={dailyWeightRef} />
        <FlagTile icon="🩸" value={glucose}    label="ACCU-CHEK" color="#fca5a5"
          onClick={()=>toggleStatPopup('glucose',glucoseRef)} active={statPopup?.key==='glucose'} btnRef={glucoseRef} />
        <FlagTile icon="💉" value={dialysis}   label="DIALYSIS"  color="#818cf8"
          onClick={()=>toggleStatPopup('dialysis',dialysisRef)} active={statPopup?.key==='dialysis'} btnRef={dialysisRef} />

  const ref = useRef();
  const [dims, setDims] = useState({ w:900, h:580 });

  useEffect(()=>{
    const obs = new ResizeObserver(entries=>{
      const {width,height} = entries[0].contentRect;
      setDims({ w:width, h:height });
    });
    if(ref.current) obs.observe(ref.current);
    return ()=>obs.disconnect();
  },[]);

  const { w, h } = dims;
  const { positions, cw, ch } = getCorridorLayout(w, h);

  const nurseColorMap = {};
  nurses.forEach(n=>(nurseRooms[n.id]||[]).forEach(id=>{ nurseColorMap[id]=n.color; }));

  const PAD=12;
  const rx=PAD, ry=PAD, rw=w-2*PAD-cw, rh=h-2*PAD-ch;

  // Build A/B pair groups for background highlight
  const pairGroups = [];
  ROOM_IDS.forEach((id, i) => {
    if (!id.endsWith('A')) return;
    const bId = id.slice(0,-1) + 'B';
    const bIdx = ROOM_IDS.indexOf(bId);
    if (bIdx < 0) return;
    const aPos = positions[i], bPos = positions[bIdx];
    pairGroups.push({ key: id, aPos, bPos });
  });

  return (
    <div ref={ref} className="corridor-container">
      <div style={{ position:'absolute', inset:0, zIndex:0 }} onClick={onClearSelection}/>

        <rect x={rx+cw/2} y={ry+ch/2} width={rw} height={rh} rx={18} ry={18} className="corridor-path"/>
      </svg>

      {/* A/B pair grouping backgrounds */}
      {pairGroups.map(({ key, aPos, bPos }) => {
        const INSET = 3;
        const x1 = Math.min(aPos.x, bPos.x) - INSET;
        const y1 = Math.min(aPos.y, bPos.y) - INSET;
        const x2 = Math.max(aPos.x, bPos.x) + cw + INSET;
        const y2 = Math.max(aPos.y, bPos.y) + ch + INSET;
        return (
          <div key={key+'-grp'} style={{
            position:'absolute', left:x1, top:y1, width:x2-x1, height:y2-y1,
            borderRadius:11, zIndex:0, pointerEvents:'none',
            border:'1.5px solid rgba(139,92,246,0.32)',
            background:'rgba(139,92,246,0.07)',
          }}/>
        );
      })}

      {/* Center dashboard */}
      <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', pointerEvents:'none' }}>
