s armband must be checked and written on the slip before \n             going to the laboratory for blood check-out.  (Trained Non-licensed personnel can obtain \nblood products from Lab). \n3. \nPer unit of blood product, print Blood Transfusion Order Requisition from electronic \nhealth record (EHR) and staple to green Request for Blood Issue Form and bring both to \nthe lab. \n \nF. \nDonor and recipient information is verified immediately before transfusion in the presence of the \nrecipient, and includes the following: \n           * Conclusive identification of the recipient in the presence of the recipient with two patient \nidentifiers by either two persons (eg. By checking wristband for name and hospital number), or \nusing bedside identification technology (scanning BBID wristband). \n          * Patient identifiers on the blood or component unit label match the identity of the recipient. \n           *Review of intended recipients blood type \n          * Donor unit identification number and donor blood type \n           *Interpretation of crossmatch tests, where applicable \n           *Donor unit expiration date and time \n           *Special transfusion requirements (if warranted) \n           * Sign, date and time the blood slip \n \n \n \n \nIf the Blood Product is administered ","source":"Blood product management.pdf","lastUpdated":"2026-05-31"},{"id":"transfusion_reaction_tip_sheet","title":"Transfusion Reaction Tip Sheet","category":"Lab & Blood","keywords":["transfusion","reaction","tip","sheet","lab","blood"],"content":"","source":"reactionTipSheet.pdf","lastUpdated":"2026-05-31"},{"id":"bladder_management","title":"Bladder Management","category":"Bladder Management","keywords":["bladder","management","effective","date","november","revised","december","page","administrative","protocol","copyright","commonspirit","health","internal","only","subject","number","clinical","national","system","offices","acute","care","facilities","non"],"content":"Effective Date:  November 22, 2021    Revised:  December 7, 2022 \n \n \n \n \nPage 1 of 4 \nBladder Management \nAdministrative Protocol \n\u00a9 Copyright 2021-2022 CommonSpirit Health.  For Internal Use Only \nCOMMONSPIRIT HEALTH \nADMINISTRATIVE PROTOCOL \n \n \nSUBJECT:   Bladder Management Protocol \nPROCEDURE NUMBER:  Clinical A-006PROT \nEFFECTIVE DATE:  November 22, 2021 \nREVISED DATE:  December 7, 2022 \n \n X  National/System Offices  \n X  Acute Care Facilities \n X   Non-Acute Care Facilities \n \n \nASSOCIATED DOCUMENTS:  \nCommonSpirit Administrative Policy  \nClinical A-006, Bladder Management \n \n \nCRITERIA FOR IMPLEMENTATION: A clinician order  \n \n \nPROTOCOL:  \n \nSTEP 1. Assess patients every shift and upon transfer to lower acuity unit to determine the patient\u2019s \nbladder management needs. \n \nBladder management tools such as wraps, external catheters, wicking systems and straight catheterization \nmust always be considered prior to the insertion of an indwelling urinary catheter (IUC).  \n \nRefer to the following table to determine preferred actions based on bladder assessment  \n \nPatient Issue  \nIntervention \n \nIncontinence  \n \nPrefer: Use an external catheter/wicking system with a good fit  \n \nAlternative: Utilize a wrap for men  \n \n \nMeasuring Intake and Output \n \nPrefer: Use an external catheter/wicking system with a good fit \n \nAlternative #1: If an external device cannot maintain a good seal, consider \nusing a wrap and weighing  \n \nAlternative #2: Perform straight catheterization at least every six hours \n  \n \n \n\nEffective Date:  November 22, 2021    Revised:  December 7, 2022 \n \n \n \n \nPage 2 of 4 \nBladder Management \nAdministrative Protocol \n\u00a9 Copyright 2021-2022 CommonSpirit Health.  For Internal Use Only \nPatient Issue  \nIntervention \n \nPre- and Post-Procedure  \n \nPrefer: External catheter/wicking system or straight catheterization at least \nevery 6 hours for non-genitourinary surgical patients.   \n \nAlternative: IUC removed at the conclusion of the case or in recovery  \n \nFollow provider orders for genitourinary surgery \n \nAcute Phase  \nPerineal Wounds \n \nPrefer: External catheter/wicking system or wrap if site can be kept dry  \n \nAlternative: Perform straight catheterization at least every six hours. \n \nObtain a wound care consult  \n \nUrinary Retention \n \nPrefer: Assess medications or conditions that can cause retention and \ndiscuss with the provider if appropriate to reduce or discontinue \n \nAlternative: If this is ineffective, follow Step 3. Urinary Retention \nAssessment and Management for Adults \n \n \nConsult provider for bladder management plan after 3 straight catheterizations. \nIf the preferred and alternative methods are unsuccessful, an IUC may be needed. Confer with the provider \nand obtain an order for IUC insertion if indicated. Re-evaluate the continuing need each shift.  \n \nAn order from a physician is required for the insertion of an IUC. Criteria for insertion or continuation of an \nIUC may include: \n \n\u25cf acute urinary retention that cannot be managed using less-invasive methods \n\u25cf need for accurate I&O in critically ill patients when alternative methods for measurement are \ninadequate \n\u25cf perioperative use for urologic or genitourinary tract procedures \n\u25cf assist in healing of open sacral  or perineal wounds in incontinent patients \n\u25cf end-of-life comfort care \n\u25cf prolonged immobilization due to trauma or surgery \n\u25cf order for physician-managed IUC \n\u25cf epidural in place (for laboring patients in the Family Birth Center, remove an indwelling foley catheter \nprior to the active pushing phase of the second stage of labor) \n \nIf the patient fits any one of the criteria above, document the appropriate justification in the patient\u2019s medical \nrecord \n \n \n \n\nEffective Date:  November 22, 2021    Revised:  December 7, 2022 \n \n \n \n \nPage 3 of 4 \nBladder Management \nAdministrative Protocol \n\u00a9 Copyright 2021-2022 CommonSpirit Health.  For Internal Use Only \nSTEP 2. If the patient does not meet criteria for continuation of an IUC and there is no specific \nphysician order to continue the catheter, the nurse shall remove the IUC. \n \n\u25cf Monitor patients that have not voided more than 300ml or who have symptoms of distention within 6 \nhours of IUC removal for retention (refer to Step 3 \u201cUrinary Retention Assessment for Adults\u201d) \n \n\u25cf Patients who are identified as being anuric for >2 days must have their urinary catheter discontinued \n \n\u25cf For laboring patients, remove an IUC prior to the active pushing phase of the second stage of labor \n \n\u25cf If the RN is uncertain as to whether to remove the IUC, the provider must be contacted \n \n\u25cf Document in the patient's medical record the time the IUC was removed \n \n\u25cf Exceptions: Provider-managed indwelling catheters, end-of-life comfort care (do not collect urine \ncultures). Consult provider for patient self-catheterization plan if applicable \n \nSTEP 3. Urinary Retention Assessment and Management for Adults  \n \nAssessment of the suprapubic area shall be completed at minimum of every 6 hours for any fullness or \nlower abdominal discomfort or when the patient has the urge to void but cannot \n \nAssess patients that have not voided more than 300ml or who have symptoms of distention within 6 hours of \nIUC removal \nPerform Bladder Scan \n(If bladder scanner is not readily available, clinical assessment to determine bladder distention/discomfort must be done) \nIf bladder volume <400 ml \nIf bladder volume is >400 \nand <800 ml  \nIf bladder volume >800 ml \n \n \nObserve patient \n \n \nPerform straight catheterization \nConsult provider for bladder \nmanagement plan after 3 straight \ncatheterizations \n \nPerform straight catheterization \nand consult provider \nContinue to perform bladder scans and assess for symptoms \nof distention at least every 6 hours until return to spontaneous void  \n \nFor patients with low urine output, (i.e. end-stage renal disease), \ncontact the provider for bladder volume criteria and/frequency of \nstraight catheterization \nRe-evaluate with the provider dai","source":"bladderManagement.pdf","lastUpdated":"2026-05-31"},{"id":"interventional_radiology_periprocedural","title":"Interventional Radiology Periprocedural Instructions","category":"IR Procedure","keywords":["interventional","radiology","periprocedural","instructions"],"content":"","source":"Copy of Interventional Radiology - Periprocedural Instructions (1).docx","lastUpdated":"2026-05-31"},{"id":"interventional_radiology_periprocedural","title":"Interventional Radiology Periprocedural Instructions (v2)","category":"IR Procedure","keywords":["interventional","radiology","periprocedural","instructions"],"content":"","source":"Interventional Radiology - Periprocedural Instructions (1).docx","lastUpdated":"2026-05-31"},{"id":"waffle_overlay_protocol","title":"Waffle Overlay Protocol","category":"Skin Care","keywords":["waffle","overlay","protocol","skin","care","update","linet","bed","concerns","too","high","reaching","above","side","rails","reach","out","available","department","lead","shift","guidance","risk","include","scored"],"content":"Waffle\nOverlay\nUpdate:\nIf your patient is on a Linet bed and you have\nconcerns that the waffle overlay may be too\nhigh (reaching above side rails), please reach\nout to any available department lead who is on\nshift for guidance\nAt Risk Patients Include:\n\u25cf\nPatients that are scored as a 1-2 for mobility\nand/or moisture on the Braden Score\n\u25cf\nPatients who score <16 on the Braden scale\n\u25cf\nPatients that are unable to turn independently\nand require assistance for position changes\n\u25cf\nExamples: C-Diff, Diabetes, Incontinence\n\u25cf\nWaffle overlays need to be utilized\nREGARDLESS of the surface (mattress) that\nthe patient is on\nPlease Insure the Waffle Overlay is\nInflated Properly:\n\u25cf\nInflation status of the waffle MUST be\nchecked with every position change\nincluding:\n\u25cb\nBed maneuvers\n\u25cb\nTurning\n\u25cb\nToileting\n\u25cb\nBed height adjustments\n\u25cf\nProper inflation is checked by placing a\ngloved hand under the patient\u2019s sacrum,\nunder the waffle, making sure to have a\nsugar-cube sized space present between the\nwaffle and the surface that the waffle is on\n\u25cf\nIf there is no space - more air is needed\n\u25cf\nIf a large space is present - remove air from\nthe waffle\nONLY 2 Layers are to be\non a Patient Bed:\n\u25cf\nAn example would be a fitted sheet over\nthe waffle overlay and 1 chux pad\n\u25cf\nAny combination of 2 layers is acceptable.\n\u25cf\nThe waffle overlay can be used to help\npull up/reposition the patient in the bed\n\u25cf\nRefrain from using 2 chux pads or several\nlayers under the patient","source":"Waffle Overlay Up.pdf","lastUpdated":"2026-05-31"},{"id":"on_call_quick_note","title":"On Call Quick Note","category":"On Call","keywords":["call","quick","note","keeping","open","assigned","beds","shift","change","supports","represented","employee","icu","always","able","increase","census","immediately","pulling","break","relief","lead","while","waiting","standby"],"content":"- Keeping our open assigned beds at shift change to 4-6 MS/T supports an On Call represented employee. ICU should always be able to increase their census by 1 immediately by pulling Break relief or lead while waiting for their represented standby to come in. \n- This allocated employee is the first on the list to be HC\u2019d. \n- Follow our Call Off list per CBA in reverse order when requiring stand by to report. \n- Standby/Call Back is not utilized by our unrepresented  Department leads. Including the same department leads in the HC opportunities is generous however is not considered mandatory as part of the rotation as the CBA does not include them. \n- Remember - a standby employee at 0930/2130 must be 1) Remaining on call for the remainder of the shift 2) Required to report at 1100 or 3) HC\u2019d for the remainder of the shift. This is 4 or 8 hour increments. They can not be released mid shift. \n- For those updating timecards - Remember to apply HC for any Standby time for them to incur benefit time. If they want to use PTO to complete their pay - please use 815 HCLC to support the dollar aspect of the shift.","source":"on call quicknote.docx","lastUpdated":"2026-05-31"},{"id":"traveler_reminders","title":"Traveler Reminders","category":"Traveler","keywords":["traveler","reminders","list","travelers","assigned","christelle","adalon","noc","start","date","october","february","phone","chelsea","goodrum","day","jess","son","padao","erika","post","florinda","sayson","november","tbd"],"content":"list of travelers who will be assigned to our unit:\n1. Christelle Adalon (NOC)\nStart Date: October 14, 2025 \u2013 February 7, 2026\nPhone: 727-303-6927\n2. Chelsea Goodrum (DAY)\nStart Date: October 14, 2025 \u2013 February 7, 2026\nPhone: 510-909-1259\n3. Jess Son Padao (NOC)\nStart Date: October 28, 2025 \u2013 February 7, 2026\nPhone: 478-283-7170\n4. Erika Post (DAY)\nStart Date: October 28, 2025 \u2013 February 14, 2026\nPhone: 574-207-3871\n5. Florinda Sayson (DAY)\nStart Date: November 10, 2025 \u2013 TBD\nPhone: 707-999-1608\n6. Christy Deakle (DAY)\nStart Date: November 11, 2025 \u2013 February 14, 2026\nPhone: 228-202-4612\n7. Jocelyn Flores (NOC)\nStart Date: November 11, 2025 \u2013 February 21, 2026\nPhone: 916-525-5702\nPlease also keep the following reminders in mind:\n* Travelers should be House Canceled (HC'd) before float pool or staff.\n* If staff Request Self Cancel (RSC), please grant the RSC and bring in the traveler.\n* If you anticipate Mandatory House Canceling a traveler, please check with Raj before proceeding.","source":"traveler reminders.docx","lastUpdated":"2026-05-31"},{"id":"adding_patient_back_to_omnicell__waste_r","title":"Adding Patient Back to Omnicell (Waste/Return)","category":"Allergies & Medications","keywords":["adding","back","omnicell","waste","return","allergies","medications","add","default","login","screen","select","upper","left","fill","out","information","name","fin","number","match","transactions","reconciled","together","new"],"content":"How to add a patient back to Omnicell to waste or return\n1.\nFrom the default login screen select\nin the upper left of the screen.\n2.\nFill out the patient\u2019s information. The name and FIN number must match the patient for the\ntransactions to be reconciled together. Select \u201cAdd new patient\u201d when complete.\n3.\nThis will pull you into that patient profile. You can also select the patient from the local list.\n4.\nSelect waste or return meds button on the right side of the screen.\n5.\nSelect the Stocked Meds\nTab at the bottom of the screen. Find the medication you\nneed to waste or return in the list of medications.\n6.\nSelect \u201cOK\u201d when the fields are completed. This will require a witness.","source":"Adding a patient back to Omnicell to waste or return.pdf","lastUpdated":"2026-05-31"},{"id":"allergy_types_documentation","title":"Allergy Types Documentation","category":"Allergies & Medications","keywords":["allergy","types","documentation","allergies","medications","cerner","support","matters","drug","adding","modifying","information","type","documented","alert","fire","providers","placing","orders","related","specific","substance","change","defaulted","without"],"content":"Cerner Support RN: x36200 (916.733.6200) \n  \nAllergy Types \u2013 It Matters \nDRUG: When adding/modifying patient drug allergy information, if a TYPE other than ALLERGY is documented, \nan alert will not fire to providers when placing orders related to that specific drug/substance.   \nDo not change the defaulted type of Allergy without discussing with the provider. Other options (Side effect, \nIntolerance, Sensitivity, or Other) do not alert providers/pharmacy.  \nFOOD: If the patient has a food allergy, sensitivity, side effect, or intolerance, edit the CATEGORY dropdown to \nFOOD \u2013 this will alert Dietary/Nutrition Services.  If the food allergy is not explicitly listed in Cerner, enter it as \nbest you can with the CATEGORY of FOOD and call the diet office/kitchen to bring it to their attention.","source":"AllergyTypesDocumentation.pdf","lastUpdated":"2026-05-31"},{"id":"waste_management_quick_tips","title":"Waste Management Quick Tips","category":"Waste Management","keywords":["waste","management","quick","tips"],"content":"","source":"Copy of Waste Management Quick Tips.pdf","lastUpdated":"2026-05-31"},{"id":"patient_belongings_and_valuables_policy","title":"Patient Belongings and Valuables Policy 2025","category":"Admission & Discharge","keywords":["belongings","valuables","admission","discharge","effective","date","page","subject","personal","internal","only","mercy","hospital","folsom","associated","documents","own","medications","custody","disposal","prohibited","items","departments","applies","inpatient"],"content":"Effective Date: 12/11/2024  \n \n \n \n \n                                        Page 1 of 8 \nSubject: Patient Personal Belongings and Valuables                                    For Internal Use Only \nMercy Hospital of Folsom \nPolicy and Procedure  \nSUBJECT: Patient Personal Belongings and Valuables  \nASSOCIATED DOCUMENTS: Patient's Own Medications and Custody and Disposal of \nProhibited Items \nDEPARTMENTS:  \nThis Policy applies to all inpatient acute care areas, (e.g., Inpatient Care Units, \nObservation, Emergency Department, Perioperative, and onsite procedural departments).  \n \nPOLICY: It is the policy of Mercy Hospital of Folsom not to accept responsibility for patient \nbelongings and valuables. All valuables are to be left at home or removed from the facility \nand taken to another secure location outside of the facility.  \nPURPOSE: The purpose of this Policy is to establish and implement guidelines relating to \nmanaging patient belongings and/or patient valuables.  \nMercy Hospital of Folsom requests that patients DO NOT keep belongings or valuables in their \nrooms or on their person; if a patient chooses to do so, the patient assumes all risk for the \nloss and or damage. Patients who choose to keep belongings and valuables in their rooms or \non their person assume all responsibility for these belongings and valuables.  \na.   Please note this Policy does not apply to medications brought from home by the \npatient. Please refer to policy titled \"Patient's Own Medications\" \nb.   Staff are to report any loss or damage of the patient\u2019s essential items (as \ndefined below) by following established facility procedures.  \nPROCEDURE:  \nI. GENERAL - ALL PATIENTS  \nA.   See Addendum A (All Care Areas Algorithm)  \n      B.   Admission and registration of the patient  \n1. Admitting personnel will direct patients to send patient belongings and               \nvaluables home with family or designee.  \n2.   If sending with the family or designee is not possible, the patient is encouraged to \nallow valuables to be secured in the hospital\u2019s designated secure location (e.g., \nfacility safe in security office).  \n3.   As a component of the admission and consent for treatment process, patients      \n      will be informed that the hospital assumes no responsibility for items  \nmaintained in their room or on their person. Patients acknowledge this by \nsigning the Consent for Treatment form.  \n \n \nC.   Admission of the patient to care area:  \n1. Facility may accept custody of a patient\u2019s belongings, if it is determined that the \nfollowing three elements are present:  \n                            a. acceptance is in the facility\u2019s and the patient\u2019s best interests;  \n\n \nEffective Date: 12/11/2024  \n \n \n \n \n                                        Page 2 of 8 \nSubject: Patient Personal Belongings and Valuables                                    For Internal Use Only \nb. acceptance is not likely to disrupt or compromise hospital operations,  \n    patient or employee safety;  \nc. the patient is not capable of being responsible for the belongings and   \n    family or designee is unavailable to take custody of the belongings.  \n2. Essential items  \na. On admission, the nurse or designee will document all essential items in \n    detail in the designated area of the EHR (See definition \u201cessential  \n    items\u201d).    \n          i. This includes but is not limited to eye wear, dentures, prosthesis,  \nand hearing aids.  \n                                       ii. This also includes personal necessary medical equipment or  \n                                              supplies such as walkers, canes, and wheelchairs (See definition  \n                                               \u201cMedical equipment or supplies\u201d).  \n3. Any patient valuables that are not sent home or secured are to be documented in   \nthe electronic health record (EHR) in the following manner:  \n                          a. The patient is encouraged by the nurse to secure their valuables.  \n                                           i. The patient is advised the facility does not assume responsibility  \nfor items kept in the facility by a patient and encourages that such  \nitems be sent home with family or designee.  \n                                           ii. Valuables identified to be placed in the facility\u2019s secure location  \n   are documented in the EHR as \u201cValuables inventoried according  \n to facility policy\u201d.  \n                                                       a. Any money is counted in front of the patient or surrogate  \ndecision maker by two staff members and listed on the  \n Valuables receipt.  \nb. Patient signature of valuables inventory obtained.  \n                                                       c. Patient given valuables receipt.  \n                                                       d. If the patient is confused or unconscious at the time of  \n                                                          admission, all valuables will be bagged and logged in the  \n                                                          presence of two staff members and placed in the facility\u2019s  \n                                                           secure location.  \n                                           iii. If the patient refuses to secure their valuables, a record of advice  \nregarding retention of valuables will be recorded in the EHR.  \n  a. Patient asked to sign a disclaimer notice \n                              i. Disclaimer notice placed in the patient\u2019s medical record.  \n                             b. Document  \n                                           i.  Patient advised to send valuables to facility safe in security office to   \n                                               secure and patient refused. \n                              ii. Notation in EHR that a disclaimer notice was signed.  \n                                       iii. A description of the valuables remaining with the patient using   \n                         ","source":"Patient Belongings and Valuable Policy 2025.pdf","lastUpdated":"2026-05-31"},{"id":"inpatient_documentation___suicide_watch","title":"Inpatient Documentation \u2013 Suicide Watch","category":"Behavioral Health","keywords":["inpatient","documentation","suicide","watch","behavioral","health"],"content":"","source":"inpatient documentation suicide.pdf","lastUpdated":"2026-05-31"},{"id":"ehr_tipsheet___personal_belongings","title":"EHR Tipsheet \u2013 Personal Belongings","category":"Admission & Discharge","keywords":["ehr","tipsheet","personal","belongings","admission","discharge","valuables","form","updated","valuable","adhoc","now","displays","workflow","summary","pages","newly","created","associated","task","add","new","content","essential","items"],"content":"Valuables and Belongings Form Updated \nValuable and Belongings AdHoc form has been updated, now displays on \nWorkflow Summary Pages, and has a newly-created associated task. \n \n\u25cf\u200b Valuable and Belongings form has been updated to add new content: \n\u25cb\u200b Essential Items \n\u25cb\u200b Description of Essential Items Remaining with Patient \n\u25cb\u200b Valuables Inventoried According to Facility Policy \n\u25cb\u200b Patient Advised to Send Valuables to Facility Secure Location and \nRefused \n\u25cb\u200b Essential Items Reconciliation Completed \n\u25cb\u200b Essential Items with Patient at Discharge \n\u25cb\u200b Valuables Form Signed by Pt/Caregiver \n\u25cb\u200b Essential Items at Discharge Comment \n \n\u25cf\u200b Valuables component has been added to the following Workflow \nSummary pages: \n\u25cb\u200b BH Discharge Workflow \n\u25cb\u200b Discharge Workflow Nursing \n\u25cb\u200b Nursing Shift Handoff I \n\u25cb\u200b Perioperative Non Provider Inpatient Workflow \n\u25cb\u200b Periop Communication - Postop Summary \n \n\u25cf\u200b New task created to retrieve valuables and medications at discharge or \ntransfer to an outside facility is added. \n\u25cb\u200b Nurses now receive a Done/Not Done task to retrieve valuables \nfrom a secured location when it was documented that valuables \nwere sent to security or medications were sent to pharmacy. \n\u25cb\u200b Previously available tasks are still active. \n \n\n\u25cf\u200b Discharge Instructions currently containing Valuables and Belongings \ninformation are updated with new content.","source":"EHR Tipsheet Personal Belongings.pdf","lastUpdated":"2026-05-31"},{"id":"ua_culture_ticket_to_test","title":"UA Culture Ticket to Test","category":"Lab & Blood","keywords":["culture","ticket","test","lab","blood","urinalysis","reflex","goal","perform","testing","appropriate","indications","change","odor","appearance","cloudy","sediments","urine","alone","prompt","dysuria","urgency","frequency","expected","hours"],"content":"Ticket to Test: Urinalysis with Reflex to Culture - \nThe goal is to perform testing on patients with appropriate indications. \n\u25cf Change in odor or appearance (e.g., cloudy, sediments) of urine alone should NOT prompt testing \n\u25cf Dysuria, Urgency, or Frequency is expected 48 hours after \nindwelling catheter removal and should NOT prompt testing \n\u25cf Altered mental status alone is not an indication for urine culture \nIf at least one is checked, send a urine sample to the lab with this COMPLETED form. (If the patient does not meet criteria, notify the ordering physician) \u2b1c Provider notified and override was requested \nDate/time of submission: ____________________________ \nNurse submitting specimen (please print):_____________________________________________ Manager/Charge nurse reviewer (please print):_________________________________________ THIS FORM IS NOT TO BE PART OF THE PERMANENT RECORD","source":" MHF UA_Culture Ticket to Test.docx","lastUpdated":"2026-05-31"},{"id":"artificial_nails_policy__oct_2024","title":"Artificial Nails Policy (Oct 2024)","category":"Professional Attire","keywords":["artificial","nails","oct","professional","attire","october","know","need","facility","northern","california","division","had","high","limited","finding","tjc","icu","wearing","dignity","health","hand","hygiene","states","basic"],"content":"Artificial Nails October 2024\nKnow: What you Need to Know \nA facility in the Northern California Division had a high limited finding by TJC for an ICU RN wearing artificial nails. (IC.02.01.01)\nDignity Health\u2019s hand hygiene policy states:\nBasic nail polish should not be chipped and in good condition.\nThe natural nails of health care workers are to be kept neatly manicured and short, not extending more than \u00bc inch past the tips of the fingers\nWearing artificial nails is prohibited for personnel who perform direct hands-on patient care or have a role in patient care services, such as environmental services, pharmacy, sterile processing or nutrition services.  \nDignity Health\u2019s hand hygiene policy defines artificial nails as:\nAny fingernail enhancement, resin bonding, shellac or methacrylate polymer (long wearing nail polish), extensions, tips, gels, or acrylics that are not a part of the natural nail. \nDo: What you Need to Do \nCommunicate with appropriate team members the information about nails in the hand hygiene policy.\nPerform leadership rounding to identify violations of the hand hygiene policy.\nContinue to hold team members accountable for violations of the hand hygiene policy.\nReach out to your facility's Infection Preventionist if you have additional questions.\nShare: What you Need to Share \nShare this communication with appropriate team members at huddles.\nEmphasize extensions, wraps, tips, gels, polygels, dips, silk, overlays, acrylics and/or any enhancements not part of the natural nail are considered artificial nails.","source":"Artificial Nails KDS Oct 2024.docx","lastUpdated":"2026-05-31"},{"id":"c__difficile_ticket_to_test","title":"C. difficile Ticket to Test","category":"Infectious Disease","keywords":["difficile","ticket","test","infectious","disease","complete","form","before","collecting","stool","specimen","diff","testing","boxes","checked","meet","criteria","appropriate","call","physician","evening","night","request","order","does"],"content":"Ticket to Test: C. difficile \n \nPlease complete this form before collecting a stool specimen for C. diff testing.  \nAll boxes must be checked to meet the criteria for appropriate testing.  \nDo not call the physician during the evening or at night to request an order for C. diff testing if the patient does not have \nsigns/symptoms of GI infection.  \nAn order is only valid for 24 hours. Do not collect a sample if the order has expired. \n \nIs the stool loose or watery (must take the shape of the \ncontainer) \nYes\u2b1c \nLaxatives with hard stop in EHR (prior \n48 hours): \nHas the patient been tested for C. diff in the last 7 days? \nNo\u2b1c \n\u25cf\u200bBisacodyl \n\u25cf\u200bBisacodyl-magnesium citrate \n\u25cf\u200bCastor oil \n\u25cf\u200bChromium picolinate-inulin \n\u25cf\u200bCitric acid/MgOxide/Na picosulfate \n\u25cf\u200bDocusate-senna \n\u25cf\u200bDulcolax \n\u25cf\u200bGlycerin \n\u25cf\u200bGolytely \n\u25cf\u200bKayexalate \n\u25cf\u200bLactulose \n\u25cf\u200bMag sulfate (excluding IV MgSO4) \n\u25cf\u200bmag/Na/K sulfates \n\u25cf\u200bMagnesium citrate \n\u25cf\u200bMagnesium hydroxide \n\u25cf\u200bMetoclopramide \n\u25cf\u200bMineral oil \n\u25cf\u200bPolyethylene glycol 3350 \n\u25cf\u200bPotassium bitartrate \n\u25cf\u200bPotassium bitartrate-sodium bicarbonate \n\u25cf\u200bPsyllium-senna \n\u25cf\u200bSenna \n\u25cf\u200bSodium biphosphate \n\u25cf\u200bSodium citrate \n\u25cf\u200bSodium picosulfate \n\u25cf\u200bSodium phosphate \n\u25cf\u200bSodium phosphate \n\u25cf\u200bSorbitol \nExamples of procedures and conditions that \ncan induce diarrhea: (Not a hard stop) \n \n\u25cf\u200bFecal impaction \n\u25cf\u200bNew tube feeding \n\u2022\u200b Adjusted protocol in the last 24 hrs \n\u25cf\u200bOral contrast \n\u25cf\u200bEnema \nHas the patient had a positive test for C. diff in the last 30 \ndays? \nNo\u2b1c \nIs the diarrhea clinically signi\ufb01cant (3 or more loose/liquid \nstools in a 24 hour period OR greater than 600mL rectal \ntube or ostomy output in a 24 hour period)? \nYes\u2b1c \nHas the patient taken a laxative in the last 48 hours? \nNo\u2b1c \n(see laxative list in box on the right) \nHas the patient had a procedure, or have a condition \nthat can induce liquid/loose stools? \n \n*This is not a hard stop, but something to consider \nwhen reviewing clinical correlation and discussion with \nproviders on appropriateness of test. \n \nNo\u2b1c \nHas the patient been admitted to our facility for longer than \n3 days? \n \n*If this box is the only section not meeting \ncriteria, contact Infection Prevention for \nconsultation. \n \nNo\u2b1c \n \nIf the patient has been admitted for > 3 days, Infection Prevention must be \nconsulted prior to sending the specimen to the lab.  \n \nIf testing criteria is met, send the specimen to the lab with this COMPLETED and SIGNED form. \n \nNurse submitting specimen (please print):\u200b\n \nManager/Charge nurse reviewer (please print):\u200b\n \nLab employee receiving specimen (please print): \u200b\n\u200b \n    \n                                                                           THIS FORM IS NOT TO BE PART OF THE PERMANENT RECORD                             05/2026 MHF Infection Prevention","source":"MHF C. difficile Ticket to Test.pdf","lastUpdated":"2026-05-31"},{"id":"c__diff_know_do_share_ticket","title":"C. diff Know-Do-Share Ticket","category":"Infectious Disease","keywords":["diff","know","share","ticket","infectious","disease","updated","test","discard","copies","old","start","using","newly","tickets","immediately","update","clinical","summary","refreshed","moving","forward","primarily","formatting","content"],"content":"KNOW DO SHARE \n    \n \n \nUpdated C. diff Ticket-to-Test \n \n \n \nKNOW  \n \n\u200b\n \nDO \n\u25cf\u200b Please discard all copies of the OLD ticket-to-test for C. diff.  \n\u25cf\u200b Start using these newly updated tickets immediately. \n \nSHARE  \n \n\u25cf\u200b Please share this update with all clinical staff. \n \nSummary \n\u25cf\u200b A refreshed ticket- to-test for C. diff will be used moving forward. \n\u25cf\u200b This is primarily a formatting update. The content remains largely unchanged.","source":"C Diff Ticket to Test Know Do Share.pdf","lastUpdated":"2026-05-31"},{"id":"c__diff_refresher_education","title":"C. diff Refresher Education","category":"Infectious Disease","keywords":["diff","refresher","education","infectious","disease","difficile","transmission","prevented","play","critical","role","preventing","spores","transmitted","via","improperly","sanitized","hands","through","contaminated","shared","equipment","meticulous","hand","hygiene"],"content":"C- Difficile Refresher\nHow Can\u00a0C. Difficile\u00a0Transmission Be Prevented?\nStaff play a critical role in preventing\u00a0C. difficile\u00a0transmission. Spores are transmitted from patient to patient via improperly sanitized hands and also through the use of contaminated shared equipment. Meticulous hand hygiene\u2014using soap and water\u2014and strict adherence to isolation protocols are therefore the foundation for effective\u00a0C. difficile\u00a0transmission prevention. \nHandwashing and strict isolation should be observed when caring for patients even after resolution of CDI symptoms, as they are still capable of shedding spores long after clinical symptoms subside. It is important for nurses to communicate with their institutional epidemiology staff to determine appropriate duration of isolation for the patient with a current or prior history of CDI on a case-by-case basis. \nAlso, nurses must be careful to clean equipment that is shared between patients, and partner with housekeeping services to effectively clean areas of potential contamination. Typically, regular active cleansing ingredients in hospital disinfectants are quaternary ammonium compounds and do not kill spores. The Centers for Disease Control (CDC) currently recommends using hypochlorite-based germicides, such as bleach-based solutions, for cleaning\u00a0C. difficile-contaminated environmental surfaces and equipment.\nCommon Spirit Health does not Test for CURE of C-Difficile infections.\nRepeat stool testing for test of cure is NOT recommended. Up to 50% of patients have positive\u00a0C- diff\u00a0PCR for as long as six weeks after the completion of therapy. Therefore, signs and symptoms rather than repeat testing should be used to assess whether a patient has responded to therapy for C.\u00a0diff. Please reach out to Infection Prevention and or your managers if this is requested. \nMHF Infection Prevention February 2023","source":"C.diff refresher educationx.docx","lastUpdated":"2026-05-31"},{"id":"foley_free_initiative___ticket_to_foley","title":"Foley-Free Initiative \u2013 Ticket to Foley","category":"Infectious Disease","keywords":["foley","free","initiative","ticket","infectious","disease"],"content":"","source":"MHF Foley Free Initiative - Ticket To Foley.docx","lastUpdated":"2026-05-31"},{"id":"nasal_decolonization_protocol","title":"Nasal Decolonization Protocol","category":"Infectious Disease","keywords":["nasal","decolonization","protocol","infectious","disease","know","share","apr","surgical","mercy","hospital","folsom","begin","prior","surgery","april","process","reducing","eliminating","bacteria","particularly","staphylococcus","aureus","including","methicillin"],"content":"Know Do Share \n \nApr 10, 2025\n \nNasal Decolonization of Surgical Patients at Mercy Hospital Folsom \nWhat to Know \n\u25cf\u200b Nasal decolonization will begin on all patients prior to surgery on  April 14, 2025 \n\u25cf\u200b Nasal decolonization is a process of reducing or eliminating bacteria, particularly \nStaphylococcus aureus, including Methicillin-resistant Staphylococcus aureus,that may \nbe present in the nose \n\u25cf\u200b Nasal carriage of S. aureus is a known risk factor for surgical site infections (SSIs) \n\u25cf\u200b Reducing these bacteria before surgery can significantly lower the chance of \ndeveloping an infection \nWhat to Do \n\u25cf\u200b Educate all surgical patients about the nasal decolonization protocol \n\u25cf\u200b The Profend Nasal Antiseptic Kit swabsticks are designed to be applied to the \ncircumference of the patient's nostril and anterior nares.  \n\u25cf\u200b Two swabsticks are applied to each nostril for 15 seconds per swabstick. Thus, using 4 \nswabsticks, for a total treatment time of 60 seconds \n\u25cf\u200b Scan here to watch the video \n \nWhat to Share \n\u25cf\u200b Nurses are responsible for educating patients, applying the Profend and charting it in the \nmedical record on every surgical patient prior to surgery, which includes patients being \nheld in other areas of the hospital prior to surgery \n \nFor questions, reach out to \n \nErin Brittell CA-FOLSOM","source":"_Nasal Decolonization KDS 4.10.2025.pdf","lastUpdated":"2026-05-31"},{"id":"nasal_decolonization_protocol__docx","title":"Nasal Decolonization Protocol (DOCX)","category":"Infectious Disease","keywords":["nasal","decolonization","protocol","docx","infectious","disease","know","share","apr","surgical","mercy","hospital","folsom","begin","prior","surgery","april","process","reducing","eliminating","bacteria","particularly","staphylococcus","aureus","including"],"content":"Know Do Share\nApr 10, 2025\nNasal Decolonization of Surgical Patients at Mercy Hospital Folsom\nWhat to Know\nNasal decolonization will begin on all patients prior to surgery on  April 14, 2025\nNasal decolonization is a process of reducing or eliminating bacteria, particularly Staphylococcus aureus, including Methicillin-resistant Staphylococcus aureus,that may be present in the nose\nNasal carriage of S. aureus is a known risk factor for surgical site infections (SSIs)\nReducing these bacteria before surgery can significantly lower the chance of developing an infection\nWhat to Do\nEducate all surgical patients about the nasal decolonization protocol\nThe Profend Nasal Antiseptic Kit swabsticks are designed to be applied to the circumference of the patient's nostril and anterior nares. \nTwo swabsticks are applied to each nostril for 15 seconds per swabstick. Thus, using 4 swabsticks, for a total treatment time of 60 seconds\nScan here to watch the video\n What to Share\nNurses are responsible for educating patients, applying the Profend and charting it in the medical record on every surgical patient prior to surgery, which includes patients being held in other areas of the hospital prior to surgery\nFor questions, reach out to Erin Brittell CA-FOLSOM","source":"Copy of  Nasal Decolonization KDS 4.10.2025.docx","lastUpdated":"2026-05-31"},{"id":"infection_control_education_sheet","title":"Infection Control Education Sheet","category":"Infectious Disease","keywords":["infection","control","education","sheet","infectious","disease","nursing","daily","safety","rounds","focus","hai","prevention","below","content","leaders","locking","completed","leadership","would","like","able","speak","best","practice"],"content":"Education for Nursing for Daily Patient Safety Rounds\nFocus is on HAI prevention\nBelow is the content of the rounds and what leaders will be locking for when Patient Safety Rounds are \ncompleted. Leadership would like you to be able to speak to the below best practice items when a leader \ncomes to you about your patients lines. All of the questions below reflect best practice in preventing \nHospital Acquired Infections (HAI) in our patients.\n\uf0b7\nA HAI affects 1 in 31 patients and these infections are largely preventable.\n\uf0b7\nAll HAIS are the 4th leading cause of Death in the US\n\uf0b7\nThese unanticipated infections develop during the course of health care treatment and result in \nsignificant patient illnesses and deaths (morbidity and mortality); \n\uf0b7\nprolong the duration of hospital stays;\n\uf0b7\nNecessitate additional diagnostic and therapeutic interventions, which generate added costs to \nthose already incurred by the patient\u2019s underlying disease. \n\uf0b7\nHAIs are considered an undesirable outcome, and as most are preventable, they are considered \nan indicator of the quality of patient care, an adverse event, and a patient safety issue.  \nCLABSI Prevention Concerns\nWhat type of central line is in place?\nWhat is the insertion site of the central line?\nIs the central line dressing clean, dry, and intact?\nIs the central line dressing dated per policy?\nIs the CHG impregnated dressing applied at the insertion site?\nIs a securement device in place?\nAre the Curos caps in place on all ports/hubs?\nHAs Daily CHG bath been done per policy?\nIS the IV tubing dates, initialed and timed per policy?\nDo the IV tubing have medication names on labels per policy?\nCAUTI Prevention Concerns\nIs the tamper-resistant red seal intact?\nIs a securement device in place?\nIs the flow of urine unobstructed (no kinks or dependent loops)?\nIs the indwelling urinary catheter free of dependent loops?\nIs the urine collection bag below the level of the bladder?\nIs the urine collection bag off of the floor?\n\n            Dependent loops \nHow the Foley should look\nBedside shift report is the time to hold each other accountable. At this time look at the patient\u2019s lines \nand or Foleys. Make sure that all of the practices are in place from the previous shift. If the nurse has not \nlabeled, dated and initiated or there is not a label than shows what is running in the line, this is the time to \nask them to complete this prior to them ending their shift. This way you are not completing something that \nshould have been done on a prior shift. If there is a pattern with a nurse please escalate this to your \nmanager. \n A Dressing should NEVER look like this!!\n\uf0b7\nA bloody dressing needs to be changed\n\uf0b7\nTape should NEVER be used to reinforce the dressing. You need a NEW dressing \n\uf0b7\nAll lines need to have the insertion date, time and initial for  all dressings    \nInfection Prevention J. Kamuchey 4/24/2023","source":"Education Sheet from Infection Control.pdf","lastUpdated":"2026-05-31"},{"id":"death_form_completion_guide","title":"Death Form Completion Guide","category":"Death & Comfort Care","keywords":["death","form","completion","guide","comfort","care","possible","signing","notification","due","possibly","needing","further","information","know","modifications","entered","everyone","initiating","modifying","document","click","sign","mandatory","fields"],"content":"Death Form Completion\nIt is possible that staff are not signing the Notification of Death form due to possibly needing further information for completion.  Please know that modifications can be entered but EVERYONE initiating and modifying the document, MUST click to SIGN it.\nIt is also MANDATORY that all fields of the Morgue Release of Remains forms be completed.  This includes ALL signatures.","source":"Death Form Completion.docx","lastUpdated":"2026-05-31"},{"id":"code_mercy_workflow","title":"Code Mercy Workflow","category":"Death & Comfort Care","keywords":["code","mercy","workflow","death","comfort","care","mhf","notification","unable","reach","next","kin","message","left","does","apply","contact","made","notified","known","voice","mail","full","leave","units"],"content":"MHF Code Mercy Workflow\nFor notification of death when unable to reach the next of kin and a message is left\nDOES NOT apply when:\nContact is made with the next of kin and they are notified of the death\nWhen there is no known next of kin\nIf there is a next of kin, but voice mail is full or unable to leave message\nUnits Responsibilities:\nUpon pronouncement of death when known next of kin are not present at the bedside and the call goes to voicemail:\nStaff leave the HIPAA compliant scripted voicemail and document in the EMR.\n\u201cThis is {name} calling from Mercy Hospital of Folsom.  Would you please call us back at    (leave your unit\u2019s direct call back number). \nDocument in the EHR the time of the call, who was called, and that a message was left. \nIf there is no returned call from the next of kin by the time the body is transferred to the morgue (or within 4 hours), the staff will call the next of kin again and leave the \u201cCode Mercy\u201d scripted message.. \nThe number is the \u201cCode Mercy\u201d  line that the ANS team will manage.\n\u201cThis is {name} calling from Mercy Hospital of Folsom.  Would you please call us back at 916-984-7288* leave your name and number and reference \u201cCode Mercy.\u201d \nDocument in the EHR the time of the call, who was called, and that a message was left.\nNotify the NSM/Relief Charge of the \u201cCode Mercy\u201d.\nNotify the ANS of the \u201cCode Mercy\u201dwith the patient name, and the name of the next of kin that was called.  \nThe ANS will document the information on the \u201cCode Mercy Tracker\u201d.\nANS Responsibilities:\nThe ANS will receive the Code Mercy contact call on the ANS landline.\nIf there is a voicemail, the ANS will cross reference the caller to a patient via the \u201cCode Mercy Tracker\u201d and return the call.\nIf contact is made, notify the next of kin of the death, inform them the body will be/has been taken to the offsite morgue and to please call them at 916-515-4010 to make further arrangements. If they are inquiring about details of the death, refer them to Regional pathology supervisor (PML) ph 916-515-4010.\nIf no contact is made, leave the HIPAA compliant \u201cCode Mercy\u201d scripted message:\n\u201cThis is {name} calling from Mercy Hospital of Folsom.  Would you please call us back at 916-984-7288 leave your name and number and reference \u201cCode Mercy.\u201d \nDocument in the EHR the time of the call, who was called, and outcome of the call (voicemail or details of conversation).\nUpdate the \u201cCode Mercy Tracker\u201d if contact was made.","source":"MHF Code Mercy Workflow.docx","lastUpdated":"2026-05-31"},{"id":"release_of_remains___know_do_share","title":"Release of Remains \u2013 Know-Do-Share","category":"Death & Comfort Care","keywords":["release","remains","know","share","death","comfort","care","date","february","need","mhf","team","new","floor","form","some","changes","morgue","forms","regarding","decedents","notifications","next","kin","essential"],"content":"Date February 24, 2025 \nWhat you need to Know MHF Team\nNew \u201cRELEASE OF REMAINS FROM FLOOR OR UNIT\u201d form\nThere are some changes to the morgue release of remains forms regarding decedents and notifications of next of kin. It is essential that everyone handling decedents complete all of the necessary documentation and initial and sign the new form. \nWhat to Do \nBedside RN  \n1. Complete notification of death form in Cerner. \n2. Print: \n\u25cf Copy of the notification of death form (with the release of remains signature lines) \n\u25cf Facesheet \n   (Both forms will go to the morgue with the patient) \nNiceTracker form will be filled in the Google drive. Ensure that all jewelry and personal items are removed from the patient. \n4. The Patient Arm/ID Band will remain in place. \n5. Match ID band to toe tag, bag tag, facesheet and notification of death form. \n6. Complete \u201cRELEASE OF REMAINS FROM FLOOR OR UNIT\u201d form. \n\u25cf Make sure to date and initial all boxes of section I and section II of the form \n\u25cf Print and sign your name on the appropriate line \n7. If unable to reach family or patient representatives, complete Code Mercy process and document in both Cerner and on the \u201cRELEASE OF REMAINS FROM FLOOR OR UNIT\u201d form.  ANS to complete Code Mercy tracker form in the Google drive. \n8. Notify transportation in teletracking when post mortem care and paperwork are complete and to pick the patient up to take the patient to the morgue. \n9. The Nurse Shift Manager must review the form before the body goes downstairs \n10. If there are unusual circumstances with family notification or the patient does not have family, leave a copy of the \u201cRELEASE OF REMAINS FROM FLOOR OR UNIT\u201d form with the ANS for follow up with AOC.\n11. Involve Social Work if the patient does not have family. Social Work will partner with Law Enforcement and the County to locate next of kin. \nTransportation \n1. Verify all required paperwork is in the packet, which includes: \n\u25cf \u201cRELEASE OF REMAINS FROM FLOOR OR UNIT\u201d form \n\u25cf Notification of death form (with the release of remains signature lines) \n\u25cf Facesheet \n\u25cf Consent for autopsy \n2. Verify that all jewelry and personal effects have been removed. \n3. Match ID band to toe tag, bag tag, facesheet and notification of death form. \n4. Initial transporter column and print and sign your name on the appropriate line of the,\u201cRELEASE OF REMAINS FROM FLOOR OR UNIT\u201d form.\nWhat to Share \nThis process provides a verification system and is imperative to ensure proper chain of custody of our descendants.","source":"Know Do Share MHF RELEASE OF REMAINS FROM FLOOR OR UNIT_.docx","lastUpdated":"2026-05-31"},{"id":"core_nursing_standards_of_practice","title":"Core Nursing Standards of Practice","category":"Nursing Standards","keywords":["core","nursing","standards","practice","page","commonspirit","health","subject","effective","date","original","national","system","offices","acute","care","facilities","non","purpose","adult","medical","surgical","telemetry","orthopedic","oncology"],"content":"Page 1 of 22 \n \nCOMMONSPIRIT HEALTH \nCORE NURSING STANDARDS OF PRACTICE  \n \n \nSUBJECT : Core Nursing Standards of Practice  \nEFFECTIVE DATE:  5/22/2024 \nORIGINAL EFFECTIVE  \nDATE:  3/12/2021 \n\u2610  National/System Offices \n\u2612  Acute Care Facilities \n\u2610  Non-Acute Care Facilities \n \nPURPOSE \nThe Standards of Practice for adult core nursing (Medical Surgical, Telemetry, \nOrthopedic, Oncology, and Acute Rehab) serve as guidelines for the provision of \nnursing care and professional performance expectations. These standards are based \nupon the 4thedition of the American Nurses Association (ANA) Scope and Standards \nof Practice. They are used in conjunction with CommonSpirit facility policies and \nprocedures and licensed practitioner (LP) orders. These standards of practice do not \nreplace clinical judgment but represent minimal, safe standards. These standards of \npractice provide a framework for evidence based care delivery. \n \nAFFECTED AREAS OR DEPARTMENTS \nMedical Telemetry, Surgical Acute, Medical Acute \n \nSTANDARDS OF CARE \n \nSTANDARD 1: NURSING PROCESS \n1. Assessment \u2013 The registered nurse performs and/or oversees the collection \nof pertinent data and information relative to the patient\u2019s health or the situation. \nData will be obtained by interview, observation, physical examination and \nreview of the patient record. Priority of data collection is determined by the \npatient\u2019s immediate health care needs (ANA, 2021). \na. A focused assessment for chief complaint should be completed within \n30 minutes of admission. \nb. Focused assessments/reassessments are completed PRN as indicated \nby patient condition and/or LP order. A focused assessment should be \ncompleted every 4 hours for the first 24 hours on post-operative/post-\nprocedure patients.  \nc. Vital signs should be obtained within 30 minutes of admission, and \nmonitored approximately every 8 hours thereafter unless patient \ncondition and/or LP order require more frequent monitoring.  \ni. Vital signs include temperature, heart rate, respiratory rate, blood \npressure, pulse oximetry and pain score. \nii. For patients on telemetry, vital signs should be monitored every \n4 hours. \niii. Vital signs should be obtained within 1 hour prior to patient \ntransfer or discharge (AMSN, 2021). See Policy \u201cPatient \n\n \n \n  \nPage 2 of 22 \n \nAssessment/Reassessment and Care Planning\u201d                     \nSee Policy \u201cBasic Unit Care Standards\u201d \nd. Admission history should be completed within 24 hours; updates should \nbe documented PRN when new/additional data is obtained. The \nadmission history includes the following information: \n1. \nReview general information: chief complaint,  \npreferred language, sensory deficits, etc. \n2. \nHeight and weight \n3. \nHealth history \n4. \nInfluenza/vaccination screening \n5. \nInfectious disease risk screening \n6. \nAllergies and current medications \n7. \nPsycho-social history \n8. \nSocial history \n9. \nNutrition \n10. \nEnvironmental/functional \n11. \nAdvance Directives status/review/assistance  \n12. \nSuicide Risk Screening \ne. Laboratory values and test results should be reviewed upon admission, \nevery shift, and PRN for new results. \ni. Critical results and values should be reported to the LP within 60 \nminutes of the nurse receiving the results. See Policy \u201cCritical \nResults of Tests, Management of\u201d \nf. Valuables and belongings should be accounted for, secured, and \ndocumented upon admission, with transfer, and at discharge. See \nPolicy \u201cPatient Valuables And Property\u201d \ng. Physical assessment should be completed within 4 hours of admission, \nwithin 4 hours of the start of each shift, and PRN for change in \ncondition. Follow the procedures outlined in Elsevier Clinical Skills-                  \nAssessment: Focused-CE/NCPD. \ni. Neurologic \n1. \nNeurologic assessment includes but is not limited \nto: level of consciousness (LOC), orientation status, \npupillary reaction to light, facial symmetry, sensory and \nmotor function, and notation of speech. \n2. \nFollow the procedure in Elsevier Clinical Skills -  \nAssessment: Musculoskeletal and Neurologic - CE/NCPD \nii. Cardiovascular \n1. \nCardiovascular assessment includes but is not \nlimited to: heart rate, regularity, and rhythm (if on \ntelemetry); auscultation of heart sounds; peripheral pulse \nstrength, rate, and regularity; capillary refill; presence of \nedema; complaints of shortness of breath or chest pain; \nand presence of devices (pacemakers or implantable \ncardio-defibrillators). \n2. \nPatients on telemetry should have rhythm strips \ndocumented on arrival to the unit, twice every shift, with \nany rhythm change or patient reported cardiac related \n\n \n \n  \nPage 3 of 22 \n \nsymptom, Rapid Response Team (RRT) events, and \nCode Blue Events. . Documented rhythm strips should be \nreviewed and interpreted by an RN. \n3. \nFollow the procedure in Elsevier Clinical Skills - \nAssessment: Cardiovascular - CE/NCPD \nSee Policy \u201cContinuous Cardiac Monitoring via Telemetry \n(Telemetry Monitoring)\u201d  \niii. Respiratory \n1. \nRespiratory assessment includes but is not limited \nto: visualization of chest for deformities, auscultation of \nbreath sounds, and rate, quality, and depth of \nrespirations. \n2. \nChest tubes and or drains should be assessed \nevery 4 hours per LP orders and PRN for patency, \ndrainage, correct suction or water seal, air leak, crepitus \nand dressing. Follow procedures outlined in Elsevier \nClinical Skills - Chest Tube: Closed Drainage System \nmanagement - CE  \n3. \nFollow the procedure in Elsevier Clinical Skills - \na. Assessment - Thorax and Lungs - CE/NCPD  \nb. Assessment: Respirations - CE/NCPD  \niv. Gastrointestinal \n1. \nGastrointestinal assessment includes but is not \nlimited to: visualization, auscultation, and palpation of the \nabdomen, bowel movements, nausea and vomiting, and \npresence of tubes/drains/ostomies. \na. Follow the procedure in Elsevier Clinical Skills - \nAssessment: Abdomen, Genitalia, and Rectum - \nCE/NCPD  \nb. Document type of tubes, location(s) and character \nof drainage","source":"Core Nursing Standards Of Practice.pdf","lastUpdated":"2026-05-31"},{"id":"roundtrip_access_request_process","title":"Roundtrip Access Request Process","category":"Administration","keywords":["roundtrip","access","request","process","administration","dignity","health","completing","education","module","attended","live","training","session","leaders","educators","provisioning","adh","application","section","type","location","drop","down","locate"],"content":"Roundtrip Access Request Process \nAccess Dignity Health  \nAfter completing the Roundtrip education module or attended a Roundtrip live training session, leaders/educators can request provisioning access in Access Dignity Health (ADH)\nAccess Dignity Health (ADH) Process \nIn the Application section type RoundTrip\nIn the Location section use the drop down to locate: \nHospital Facility Name\nOR \nEnterprise-ENT if you are CSH System Office Leader\nIn the Access Level section you have three levels to choose from: \nRide Viewer (limited access/view only)\nRide Requestor (Ability to book transportation rides. This will be the main access type for most end users)\nLeadership- Reporting (ability to book rides and also pull data. Used by hospital leaders that want to see transportation performance data) \nIn the Additional details for RoundTrip Section: \nIn the Other Access** section you will have the option to choose from additional access levels \nFor hospital based users: Select from either Inpatient or Emergency. If your role is exclusively in the emergency department or considered an outpatient service, select Emergency.  All other hospital areas will select Inpatient.  House Supervisors and Care Coordination Staff may want to have Inpatient and Emergency access to see both dashboards.  This will require two separate access requests.  \nFor Grant Program based users: Select from the specific grant program listed in the Other Access drop down options:  \nAlzheimer's and Memory Disorders Grant AZ\nHuman Trafficking Response Program Grant (MSH)\nMedical Safe Haven Grant Mercy Family Health Center Grant\nMedical Safe Haven Program Northridge Grant \nMedical Safe Haven Grant- Santa Maria\nMedical Safe Haven Grant- San Francisco \nSt Mary Long Beach HIV/AIDS Grant \nHelping Hands of Henderson (NV Grant)\nPathways (NV Grant)\nMedical Home Disease Management (NV Grant)\nRed Rose (NV Gant)\nNote: Roundtrip does not allow more than one request for Roundtrip at a time so you will have to submit and go through the process several times to add multiple sites.  \nFor CSH System Office Leadership: Select: \nSystem Office Leadership\nIn the Mirror Access Section: If you want to mirror someone's access you can enter it here. This is not a required field \nIn the MANDATORY Date Pathways Education Completed: This is a Mandatory field: Enter the date that staff member has completed the Roundtrip training modules or live training sessions.  If the training has not been completed, STOP and do not request user access until training has been completed. \nOnce all sections have been completed, click Add to Cart and Submit. If you need access to multiple sites, repeat the process and add the additional facility or additional access (Inpatient & Emergency or multiple grant locations) to the cart.  You will need to repeat this process one at a time.  It will not allow multiple submissions at one time. \nYou will see Access Selections appear, verify information is accurate and submit.  If you need to add more than one Other Access type, you will repeat this process to add the additional access. \nIf information is not accurate, select the red trash can and start the process again. \nExisting ADH Access That Needs Upgrade or Downgrade \nIn order to change someones access level up or down, you will need to go into Access Dignity Health (ADH) and in the Applications tab locate the Remove Access Icon \nClick on the Remove Access to launch the removal form. \nEnter staff members name you need to remove access, then scroll down to locate the assignment you want removed. \nMove the access from Current Access Assignment to the Access to Remove section and then submit. \nOnce you have submitted the removal access process, then you will need to follow the access request process to enter a request for the appropriate access level.  \nIn the Application section type RoundTrip\nIn the Location section use the drop down to locate: \nHospital Facility Name\nOR \nEnterprise-ENT if you are CSH System Office Leader\nIn the Access Level section you have three levels to choose from: \nRide Viewer (limited access/view only)\nRide Requestor (Ability to book transportation rides. This will be the main access type for most end users)\nLeadership- Reporting (ability to book rides and also pull data. Used by hospital leaders that want to see transportation performance data) \nIn the Additional details for RoundTrip Section: \nIn the Other Access** section you will have the option to choose from additional access levels \nFor hospital based users: Select from either Inpatient or Emergency. If your role is exclusively in the emergency department or considered an outpatient service, select Emergency.  All other hospital areas will select Inpatient.  House Supervisors and Care Coordination Staff may want to have Inpatient and Emergency access. \nSailPoint Access Requests\nLog into Sailpoint \nLocate the Request Center  and click on the tab\nRequest access options will become visible \n(you may have more options if you are a leader and need to put in access for an entire team)\nClick on Applications \nThen type  Roundtrip in the Search Access section \nThen select the The Roundtrip application \nNext Search for your facility. Most sites will have approximately 6 options to choose from.  Please pay close attention to access options\nLeadership- Emergency\nLeadership-Inpatient\nRide Requestor- Emergency\nRide Requestor-Inpatient\nRide Viewer-Emergency\nRide Viewer-Inpatient \nAccess Types \nRide Viewer (limited access/view only)\nRide Requestor (Ability to book transportation rides. This will be the main access type for most end users)\nLeadership- Reporting (ability to book rides and also pull data. Used by hospital leaders that want to see transportation performance data) \nNext select the option you would like to request \nThen locate at the bottom of the page the Save Selection option \nThen locate the Review Request in the top right corner of your Request Center Page- Click Review Request \nThen click the Submit Req","source":"Roundtrip Access Request Process Access Dignity Health and Sailpoint.docx","lastUpdated":"2026-05-31"},{"id":"medication_administration_policy","title":"Medication Administration Policy","category":"Medication Management","keywords":["medication","administration","policy","seven","rights","right","patient","dose","route","time","reason","documentation","emar","prn","stat","verbal","telephone","order","pharmacy","pharmacist","scan","barcode","allergy","iv","oral","po","controlled","substance","omnicell","trough","vancomycin","aminoglycoside","gentamicin","tobramycin","tpn","transdermal","patch","fentanyl","drip","infusion","pump","storage","security","potassium","sodium","electrolyte","waste","discharge","administer","licensed","nurse","rn","lvn","physician","practitioner","respiratory","therapist","pediatric","neonatal","weight","kg","titrate","taper","high","risk","bedside","two","identifiers","education","pain","adr","adverse","reaction","ketorolac","insulin","antibiotic","first","dose","cerner","ehr"],"content":"SUBJECT: Medication Management Administration\nDEPARTMENTS: All Clinical Departments where medications are administered and Pharmacy Services\nPURPOSE: To provide guidelines for the safe administration of medications.\n\nPOLICY:\nMedications may only be administered by Licensed Care Givers permitted to do so within their scope of practice and State/Federal Law. When any medication is administered, two identifiers must be verified along with the seven Patient Rights of Medication Administration.\n\nA. APPROPRIATE MEDICATION ORDERS\n\n1. Individuals who may Enter and Initiate Medication Orders:\n   - Physicians\n   - Physician Assistants\n   - Nurse Practitioners\n   - Registered Nurses (RNs)\n   - Pharmacists\n   - Respiratory Therapists\n   - Radiology Technologist\n\n2. Required elements for a complete medication order:\n   a. Name of medication (generic or brand)\n   b. Dose\n   c. Route\n   d. Frequency (ED orders are one-time unless otherwise specified)\n   e. Time\n   f. Date\n   g. Signature\n\n3. Parameters must be provided if dose is ordered to be titrated or tapered.\n4. Indication for use must be provided for all PRN medications if more than one indication exists.\n5. Medication orders via standardized procedure will be authenticated by a physician.\n6. Clarify orders with unacceptable abbreviations, range dosing, incomplete, illegible, or unclear orders. Use of renew, repeat, and continue orders is not acceptable.\n7. Do not accept verbal orders unless it is an emergency. Verbal orders must be repeated back to the requesting physician. Authentication must occur before the physician leaves the unit.\n8. Telephone Orders must be entered into Cerner immediately, read back to physician. Physician must co-sign within 48 hrs.\n9. Admitting physician orders supersede all ED temporary admission orders.\n10. Neonatal/pediatric orders (0-14 years) must include dose per body weight (kg) and calculated dose.\n\nTIME FRAMES:\n   - STAT orders: dispensed within 15 minutes, administered no later than 30 minutes.\n   - NOW orders: dispensed within 1 hour, administered no later than 2 hours.\n   - Time-Critical meds: administer as close to scheduled time as possible.\n   - Time-Critical includes: pre-prandial insulin (rapid/short/ultra-short acting), STAT meds, first dose of antibiotics.\n   - All doses: administer within 30 minutes before or after scheduled time. Document reason if outside 1-hour window.\n\nB. TRANSMIT MEDICATION ORDERS\n\n1. Transmit orders to Pharmacy by direct computer entry, facsimile, or Pharmacy copy from chart.\n2. Ensure patient age, sex, weight, pregnancy status, lactation status, current medications, and allergies are in EHR.\n3. To request a missing medication: right-click on the medication on the EMAR and select Medication Request.\n\nC. ADMINISTER MEDICATION\n\n1. Authorized individuals to administer medications:\n   - Physicians, Registered Nurses, Licensed Vocational Nurses (LVN within scope)\n   - Respiratory Therapists, Nuclear Medicine/Radiology Technologists (within scope)\n   - Physical Therapists, Nurse Midwives, Physician Assistants, Nurse Practitioners\n   - Pharmacists (within scope)\n\n2. All medication orders must be reviewed by a pharmacist prior to administration. Exceptions: emergency situations or when physician controls ordering, dispensing, and administration.\n\n3. SEVEN RIGHTS of Medication Administration:\n   a. Right Patient\n   b. Right Medication\n   c. Right Dose\n   d. Right Route\n   e. Right Time\n   f. Right Reason\n   g. Right Documentation\n\n4. Administer medications to only one patient at a time. Verify unusually large or small doses with pharmacy.\n5. Check patient allergies before administering. Use allergy band for all patients with allergies.\n\n6. BEDSIDE SCANNING PROCESS:\n   - Scan patient identification band for verification.\n   - EMAR auto-populates scheduled meds, PRN meds, and continuous IV fluids due within 1 hour.\n   - Scan each medication bar code immediately prior to administration.\n   - If unable to scan armband: verify two identifiers (name + DOB), proceed with meds, then request new armband.\n   - If barcode is unreadable: verify manually, administer, document in EMAR, send med request to pharmacy.\n   - If order includes range of doses: clarify with physician. Until clarified, give lowest dose at most frequent interval.\n\nORAL MEDICATION SAFETY:\n   - Elevate HOB 90 degrees while administering PO meds.\n   - Question patient about how they take meds at home.\n   - Observe patient to confirm swallowing. Do not leave medications at bedside.\n   - Use amber-colored oral syringe for oral liquid medications.\n   - If pill aspiration suspected: treat as medical emergency, notify physician, activate RRT.\n   - Refer to list of medications that should not be crushed before crushing any medication.\n\nIV MEDICATION GUIDELINES:\n   - All IV admixtures prepared by pharmacy except in emergencies (maintain aseptic technique).\n   - Do not add medications to hanging parenteral nutrition solutions or IV solutions.\n   - Labels must be verified by two nurses if preparer is not the administering nurse.\n   - Do not force connections when equipment offers clear resistance.\n   - Label IV tubing at distal end (near patient connection) with medication name.\n   - Trace IV tubing from patient to point of origin: before connecting/reconnecting, at care transitions, during handoff.\n   - All peripheral and central IVs infused via electronic infusion pump.\n   - Use standardized concentration of continuous infusion medications.\n\nTRANSDERMAL PATCHES:\n   - Always label with date, time, and initials. Document location on EMAR.\n   - Multiple Fentanyl patches not applied except when dose exceeds 100 mcg.\n   - Always remove old patch when new order received. Document removal in EHR.\n\nHIGH-RISK MEDICATIONS:\n   - Aminoglycosides (gentamicin, tobramycin) and Vancomycin >24 hours: placed on pharmacy protocol.\n     First dose may be given as written; all subsequent doses ordered by pharmacist.\n     Do not give next dose until trough level verified. Document trough on EMAR before administering.\n   - TPN: compare label with written order. Remove from refrigerator 30 minutes prior to administration.\n\nPATIENT DRUG EDUCATION:\n   - At minimum, educate on: name of medication, purpose, effects, significant signs/symptoms.\n   - Upon discharge: provide verbal and/or written instructions on new medications.\n   - Provide information on food/drug interactions in patient native language when possible.\n\nDOCUMENT ADMINISTRATION:\n   - Document on EMAR during medication administration.\n   - Hold medications that slow HR if HR < 55; contact MD.\n   - Hold medications that decrease BP if SBP < 100; contact MD.\n   - Document pain level (0-10) before and after pain medication.\n   - Assess pain response: within 30 min for oral/IM meds, within 15 min for IV meds.\n   - Document actual time administered, injection site, all IVs including fluids.\n   - Evaluate for ADRs. Document per ADR policy.\n\nCONTROLLED SUBSTANCES:\n   - Obtain from Omnicell or controlled drug inventory, debit dose on controlled drug form.\n   - Two licensed care givers observe and document wastage.\n   - Chart new syringe and waste of Epidurals or PCA in EMAR.\n\nDISCONTINUE MEDICATIONS:\n   - IV ketorolac auto-stopped after 5 days. All other orders: auto-renewal to provider after 30 days.\n   - On patient transfer: provider reviews active meds and discontinues no longer needed.\n   - On transfer to surgery: sending unit suspends all meds (except titratable drips).\n   - Discard partially used meds, IV bags/tubing, and medication patches in Pharmaceutical Waste bins.\n\nMEDICATION STORAGE AND SECURITY:\n   - Store unit doses in medication cassette or Pharmacy (locked Medication Room on unit).\n   - Medication refrigerator must be locked or in a secure area.\n   - Return discontinued/discharged patient meds to Pharmacy Out Box (NOT controlled substances).\n   - Return controlled substances: Omnicell meds to Omnicell Return Bin; pharmacy-dispensed meds to pharmacy directly.\n   - Concentrated electrolytes stored ONLY in pharmacy:\n     Potassium Chloride, Potassium Phosphate, Potassium Acetate, Sodium Chloride, Sodium Phosphate, Sodium Acetate.\n\nBoard Approval Date: 12/9/21 | Originated: 05/2015","source":"Medication Administration Policy.pdf","lastUpdated":"2026-06-08"},{"id":"patient_owned_rented_medical_devices","title":"Patient Owned/Rented Medical Devices","category":"Patient Safety","keywords":["patient","owned","rented","medical","device","equipment","biomed","biomedical","engineering","insulin","pump","infusion","acknowledgement","form","admission","history","physician","pharmacy","tnf","non-formulary","electrical","safety","check","calibration","repair","respiratory","therapy","after","hours","sticker","shift","glucose","hypoglycemia","criteria","critical","care","consciousness","suicide","home","implantable","medication","delivery","reconciliation","inspection","clearance","ehr","document"],"content":"SUBJECT: Patient Owned/Rented Medical Devices\nDEPARTMENTS: All\n\nPOLICY:\nPatient-owned equipment/devices brought to the hospital should be sent home whenever possible. With agreement between patient (family) and physician, patient-owned/rented devices can be utilized with a signed Patient Understanding Acknowledgement of Using Own Medical Device Form.\n\nPURPOSE: To safely manage patient-owned/rented medical devices brought to the facility.\n\nPROCEDURE:\n- When a patient with a patient-managed medication delivery device is admitted, contact Pharmacy to review requirements for management.\n- Patient managed devices can be used if criteria are met, physician agrees, and Acknowledgement Form is signed and placed in chart.\n- Patient may use the device during the assessment/inspection phase.\n\nPATIENT RESPONSIBILITIES:\n- Clean any reusable equipment brought in for their use.\n\nNURSING RESPONSIBILITIES:\n- Document the patient-owned/rented device or medication pump in Admission History Form under Environmental/Functional Assessment.\n- Ensure physician is aware and patient/family signs the Patient Acknowledgement Form. Fax copy to Pharmacy if medication device.\n- As soon as possible after admission, contact Biomed Engineering to inspect device for mechanical/electrical soundness.\n- For after-hours devices: Respiratory Therapy staff inspects device, logs details, and places Safety Checked sticker on device.\n- Any calibration, adjustment, or repair is the responsibility of the owner.\n- Document inspection and clearance in the electronic health record.\n- If patient brings medications for delivery with device (e.g. implantable infusion pump), provide medication to Pharmacy for verification prior to administration.\n- Document medication delivered via device as part of medication reconciliation (Enter as TNF).\n- Document presence of medical device every shift. If appropriate, inspect infusion site every shift.\n\nFOR INSULIN PUMP PATIENTS:\n- Verify blood glucose results and need for medication adjustments.\n- Implement hypoglycemia policy when indicated.\n- If device fails or patient/family unable to fulfill responsibilities, contact physician.\n\nPHYSICIAN RESPONSIBILITIES:\nCriteria for use (all must be met):\n- Patient is NOT in a critical care unit\n- Patient does NOT have an altered state of consciousness\n- Patient is NOT at risk for suicide\n- Patient is willing and able to manage the device\n- Patient has signed Acknowledgement Form\n\nFor medication delivery devices, patient/family must agree to:\n- Insert prescribed medication into device and program per physician order\n- Change any equipment on the device as needed\n- Provide necessary supplies\n- Display and demonstrate total dose of medication received to nurse every shift\n\n- Write an order for use of the patient-owned/rented device.\n- If medication delivery device: enter complete medication order in EHR.\n- For insulin pumps: consider contacting physician managing insulin therapy.\n- Order alternative therapy if patient management is not appropriate.\n\nPHARMACIST RESPONSIBILITIES:\n- Verify or enter physician order for medication.\n- Document orders for patient-managed medication delivery devices as TNF order in EHR; note dose in comments.\n  (TNF = Template Non-Formulary, found in computer under TNF)\n- Verify contents of prescription container. Verify medication with patient home infusion company when appropriate.\n\nBoard Approval Date: 8/26/2021 | Originated: 03/2015","source":"Patient Own Device.pdf","lastUpdated":"2026-06-08"},{"id":"post_fall_checklist","title":"Post Fall Checklist","category":"Fall Prevention","keywords":["fall","post","checklist","assess","injury","nsm","charge","rn","ans","physician","patient","representative","notify","document","nursing","progress","note","assessment","condition","returned","bed","sph","safe","patient","handling","poc","plan","care","johns","hopkins","fall","risk","assessment","tool","ivOS","event","report","online","debrief","tool","bedside","report","shift","change","family","incident","interventions","update"],"content":"POST FALL CHECKLIST\n\n1st - Assess your patient for injury\n      Determine if patient can be moved and returned to bed using SPH (Safe Patient Handling).\n\n2nd - Notify:\n      - NSM or Charge RN\n      - ANS (Administrative Nursing Supervisor)\n      - Physician\n      - Patient Representative\n\n3rd - Document:\n      - Nursing Progress Note: include patient assessment (condition), explanation of what happened,\n        how the patient was returned to bed, notification of physician and patient representative (family),\n        and any interventions implemented.\n      - Update POC (Plan of Care) and Johns Hopkins Fall Risk Assessment Tool.\n      - Complete an online event report (iVOS).\n      - Complete a Post Fall Debrief Tool.\n      - Ensure completed Post Fall Debrief Tool is sent to NSM for review.\n\n4th - Include the fall incident during bedside report at shift change.","source":"Post Fall Checklist.docx","lastUpdated":"2026-06-08"},{"id":"insulin_dual_verification_kds","title":"All Insulin Administrations - Dual Verification (KDS)","category":"Medication Management","keywords":["insulin","dual","verification","witness","double","check","high","alert","medication","subcutaneous","sub","q","subq","route","commonspirit","kds","know","do","share","sacramento","market","five","rights","independent","sign","off","emar","administration","safety","committee","pharmacy","therapeutics","nursing","executive","council","two","practitioners","name","dose","time"],"content":"KNOWDOSHARE - SACRAMENTO\nAll Insulin Administrations - Dual Verification\nEffective July 8, 2026\n\nWHAT YOU NEED TO KNOW:\n- All insulin doses, including subcutaneous route, require dual-witness upon administration in the Sacramento Market.\n- Insulin is a High-Alert Medication: carries significant risk of severe patient harm if administered incorrectly.\n- System-Wide Guideline Update:
