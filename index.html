<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChargeFlow — MED/TELE Charge Nurse</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* ═══════════════════════════════════════════════════════════
     CSS VARIABLES — Night mode (default)
  ═══════════════════════════════════════════════════════════ */
  :root {
    /* ── macOS Dark — system colors ── */
    --bg-base:        #040404;
    --bg-panel:       #1C1C1E;
    --bg-card:        #2C2C2E;
    --border:         rgba(84,84,88,0.45);
    --border-sub:     rgba(84,84,88,0.65);
    --text-1:         rgba(255,255,255,0.92);
    --text-2:         rgba(235,235,245,0.60);
    --text-3:         rgba(235,235,245,0.30);
    --text-4:         rgba(235,235,245,0.18);
    --text-5:         rgba(235,235,245,0.10);
    --input-bg:       rgba(118,118,128,0.24);
    --cap-bg:         rgba(118,118,128,0.24);
    --legend-bg:      #2C2C2E;
    --corridor-path:  rgba(10,132,255,0.40);
    --station-bg:     rgba(28,28,30,0.92);
    --station-border: rgba(10,132,255,0.30);
    --station-label:  #0A84FF;
    --room-vacant-bg: rgba(118,118,128,0.18);
    --room-vacant-br: rgba(84,84,88,0.65);
    --room-vacant-tx: rgba(235,235,245,0.30);
    --room-male-bg:   rgba(10,132,255,0.18);
    --room-male-br:   rgba(10,132,255,0.50);
    --room-male-tx:   #409CFF;
    --room-female-bg: rgba(255,150,180,0.12);
    --room-female-br: rgba(255,150,180,0.38);
    --room-female-tx: #FFB3CB;
    --dd-bg:          #2C2C2E;
    --dd-border:      rgba(84,84,88,0.65);
    --dd-hover:       rgba(118,118,128,0.28);
    --dd-active:      rgba(10,132,255,0.25);
    --dd-text:        rgba(255,255,255,0.85);
    --dd-label:       rgba(235,235,245,0.40);
    --sel-bar-bg:     rgba(10,132,255,0.15);
    --sel-bar-border: rgba(10,132,255,0.40);
    --sel-bar-text:   #0A84FF;
    --trash-bg:       #2C2C2E;
    --trash-border:   rgba(84,84,88,0.65);
    --modal-bg:       #1C1C1E;
    --scrollbar:      rgba(84,84,88,0.65);
    --btn-ghost-bg:   rgba(118,118,128,0.28);
    --btn-ghost-tx:   rgba(255,255,255,0.75);
    --stat-border:    rgba(84,84,88,0.45);
    /* ── Dashboard text layer (dark mode) ── */
    --dash-val:       rgba(255,255,255,0.92);
    --dash-val-muted: rgba(255,255,255,0.28);
    --dash-label:     rgba(255,255,255,0.55);
    --dash-section:   rgba(255,255,255,0.35);
    --dash-head:      rgba(255,255,255,0.92);
    --dash-head-sub:  rgba(255,255,255,0.40);
  }

  /* ═══════════════════════════════════════════════════════════
     CSS VARIABLES — Day mode overrides
  ═══════════════════════════════════════════════════════════ */
  body[data-theme="day"] {
    /* ── macOS Light — system colors ── */
    --bg-base:        #F2F2F7;
    --bg-panel:       rgba(255,255,255,0.80);
    --bg-card:        #FFFFFF;
    --border:         rgba(0,0,0,0.08);
    --border-sub:     rgba(0,0,0,0.12);
    --text-1:         rgba(0,0,0,0.85);
    --text-2:         rgba(60,60,67,0.60);
    --text-3:         rgba(60,60,67,0.30);
    --text-4:         rgba(60,60,67,0.18);
    --text-5:         rgba(60,60,67,0.10);
    --input-bg:       rgba(120,120,128,0.12);
    --cap-bg:         rgba(120,120,128,0.12);
    --legend-bg:      #FFFFFF;
    --corridor-path:  rgba(0,122,255,0.35);
    --station-bg:     rgba(242,242,247,0.96);
    --station-border: rgba(0,122,255,0.25);
    --station-label:  #007AFF;
    --room-vacant-bg: rgba(120,120,128,0.12);
    --room-vacant-br: rgba(60,60,67,0.25);
    --room-vacant-tx: rgba(60,60,67,0.45);
    --room-male-bg:   rgba(0,122,255,0.10);
    --room-male-br:   rgba(0,122,255,0.40);
    --room-male-tx:   #0071E3;
    --room-female-bg: rgba(255,45,85,0.09);
    --room-female-br: rgba(255,45,85,0.35);
    --room-female-tx: #D70015;
    --dd-bg:          #FFFFFF;
    --dd-border:      rgba(0,0,0,0.10);
    --dd-hover:       rgba(0,0,0,0.04);
    --dd-active:      rgba(0,122,255,0.10);
    --dd-text:        rgba(0,0,0,0.85);
    --dd-label:       rgba(60,60,67,0.50);
    --sel-bar-bg:     rgba(0,122,255,0.08);
    --sel-bar-border: rgba(0,122,255,0.30);
    --sel-bar-text:   #007AFF;
    --trash-bg:       #F2F2F7;
    --trash-border:   rgba(60,60,67,0.20);
    --modal-bg:       #FFFFFF;
    --scrollbar:      rgba(0,0,0,0.15);
    --btn-ghost-bg:   rgba(120,120,128,0.16);
    --btn-ghost-tx:   rgba(0,0,0,0.75);
    --stat-border:    rgba(0,0,0,0.08);
    /* ── Dashboard text layer (day mode) ── */
    --dash-val:       rgba(0,0,0,0.85);
    --dash-val-muted: rgba(0,0,0,0.35);
    --dash-label:     rgba(0,0,0,0.55);
    --dash-section:   rgba(0,0,0,0.45);
    --dash-head:      rgba(0,0,0,0.85);
    --dash-head-sub:  rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, 'SF Pro Text', 'SF Pro Display', BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: var(--bg-base);
    color: var(--text-1);
    transition: background 0.3s, color 0.3s;
  }
  .nurse-panel { width: 25vw; min-width: 320px; flex-shrink: 0; }
  .room-panel  { flex: 1; position: relative; overflow: visible; }
  .corridor-container { position: relative; width: 100%; height: 100%; }

  /* ── Room card — macOS tinted glass tiles ── */
  .room-card {
    position: absolute;
    border-radius: 10px;
    border: 1.5px solid transparent;
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.12s ease;
    user-select: none; z-index: 1; overflow: visible;
    backdrop-filter: blur(8px);
  }
  .room-card:hover { transform: scale(1.12); z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,0.30); }
  .room-card.selected { border-color: #30D158 !important;
    box-shadow: 0 0 0 3px rgba(48,209,88,0.30); z-index: 10; }
  .vacant  { background: var(--room-vacant-bg); border-color: var(--room-vacant-br); color: var(--room-vacant-tx); }
  .female  { background: var(--room-female-bg); border-color: var(--room-female-br); color: var(--room-female-tx); }
  .male    { background: var(--room-male-bg);   border-color: var(--room-male-br);   color: var(--room-male-tx); }

  /* Assign button */
  .assign-btn {
    display: none;
    position: absolute; top: 2px; right: 2px;
    width: 15px; height: 15px; border-radius: 4px;
    background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.20);
    color: rgba(255,255,255,0.75); font-size: 11px; line-height: 1;
    cursor: pointer; align-items: center; justify-content: center; z-index: 5;
    backdrop-filter: blur(8px);
  }
  body[data-theme="day"] .assign-btn {
    background: rgba(255,255,255,0.75); border-color: rgba(0,0,0,0.15); color: rgba(0,0,0,0.60);
  }
  .room-card:hover .assign-btn { display: flex; }

  /* ── Nurse card — macOS sidebar item ── */
  .nurse-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px; margin-bottom: 6px; position: relative;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.25s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }
  .nurse-card.drag-over {
    border-color: #30D158;
    box-shadow: 0 0 0 3px rgba(48,209,88,0.20);
    background: rgba(48,209,88,0.06);
  }

  /* ── Badges — macOS pill chips ── */
  .badge {
    display: inline-flex; align-items: center; gap: 2px;
    padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 700;
    cursor: grab; margin: 2px; white-space: nowrap;
    transition: opacity 0.1s, transform 0.1s;
  }
  .badge:hover { transform: scale(1.04); }
  .badge:active { cursor: grabbing; opacity: 0.7; }
  .badge-male   { background: var(--room-male-bg);   color: var(--room-male-tx);   border: 1px solid var(--room-male-br); }
  .badge-female { background: var(--room-female-bg); color: var(--room-female-tx); border: 1px solid var(--room-female-br); }
  .badge-preview {
    display: inline-flex; align-items: center; gap: 2px;
    padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 700;
    margin: 2px; white-space: nowrap;
    background: rgba(48,209,88,0.14); color: #30D158;
    border: 1.5px dashed #30D158; opacity: 0.90;
    animation: pulse-in 0.2s ease;
  }
  @keyframes pulse-in { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 0.90; } }

  /* ── Trash zone ── */
  .trash-zone {
    width: 26px; height: 26px; border-radius: 8px;
    background: transparent; border: 1px solid rgba(48,209,88,0.30);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; transition: all 0.15s; cursor: pointer; flex-shrink: 0;
    opacity: 0.70;
  }
  .trash-zone:hover { opacity: 1; background: rgba(48,209,88,0.18); border-color: #30D158; }
  .trash-zone.drag-over { background: rgba(48,209,88,0.55); border-color: #30D158; opacity: 1; transform: scale(1.45); box-shadow: 0 0 12px rgba(48,209,88,0.55); font-size: 17px; }

  /* ── Modal — macOS sheet style ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.50);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
  }
  .modal {
    background: var(--modal-bg); border-radius: 16px; width: 500px;
    border: 1px solid var(--border);
    box-shadow: 0 24px 64px rgba(0,0,0,0.60), 0 0 0 0.5px rgba(255,255,255,0.08);
    transition: background 0.25s;
    display: flex; flex-direction: column;
    max-height: 96vh; overflow: hidden;
  }
  .modal-header { padding: 16px 20px 10px; flex-shrink: 0; }
  .modal-body { padding: 0 20px; overflow-y: auto; flex: 1; min-height: 0; }
  .modal-footer {
    padding: 10px 20px 14px; flex-shrink: 0;
    border-top: 1px solid var(--border);
  }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .toggle-grid-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 8px 7px 4px; border-bottom: 1px solid var(--border);
    gap: 8px;
  }
  .toggle-grid-item:nth-child(odd) { border-right: 1px solid var(--border); padding-right: 12px; }
  .toggle-grid-item:nth-child(even) { padding-left: 12px; }

  /* iOS-style toggle */
  .toggle {
    width: 44px; height: 26px; border-radius: 13px;
    background: rgba(120,120,128,0.32); position: relative;
    cursor: pointer; transition: background 0.25s cubic-bezier(0.34,1.56,0.64,1);
    border: none; flex-shrink: 0;
  }
  .toggle.on { background: #30D158; }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%; background: white;
    transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 2px 6px rgba(0,0,0,0.30);
  }
  .toggle.on::after { transform: translateX(18px); }

  /* ── Toast ── */
  .warn-toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(30,30,30,0.90); color: #FF453A;
    padding: 10px 20px; border-radius: 12px;
    font-size: 13px; z-index: 2000;
    border: 1px solid rgba(255,69,58,0.40); white-space: nowrap;
    animation: fadeout 3s forwards;
    box-shadow: 0 8px 32px rgba(0,0,0,0.40);
    backdrop-filter: blur(20px);
  }
  @keyframes fadeout { 0%{opacity:1} 70%{opacity:1} 100%{opacity:0;pointer-events:none} }

  /* ── Misc ── */
  .corridor-path { fill: none; stroke: var(--corridor-path); stroke-width: 1.5; stroke-dasharray: 6 4; opacity: 0.50; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 10px; }
  .nurse-color-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  input[type=text] {
    background: var(--input-bg); border: 1px solid var(--border); color: var(--text-1);
    border-radius: 8px; padding: 7px 11px; font-size: 13px; width: 100%; outline: none;
    transition: background 0.2s, border-color 0.15s;
    font-family: inherit;
  }
  input[type=text]:focus { border-color: #0A84FF; box-shadow: 0 0 0 3px rgba(10,132,255,0.20); }
  body[data-theme="day"] input[type=text]:focus { border-color: #007AFF; box-shadow: 0 0 0 3px rgba(0,122,255,0.15); }

  /* macOS-style buttons */
  .btn {
    border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: none; transition: all 0.15s; font-family: inherit;
    letter-spacing: -0.1px;
  }
  .btn:hover { filter: brightness(1.10); }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #0A84FF; color: white; }
  body[data-theme="day"] .btn-primary { background: #007AFF; }
  .btn-ghost {
    background: var(--btn-ghost-bg); color: var(--btn-ghost-tx);
    border: 1px solid var(--border);
  }

  .cap-bar  { height: 4px; border-radius: 2px; background: var(--cap-bg); overflow: hidden; margin-top: 6px; }
  .cap-fill { height: 100%; border-radius: 2px; transition: width 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  .flag { font-size: 9px; background: rgba(255,255,255,0.12); border-radius: 4px; padding: 1px 4px; margin: 1px; display: inline-block; line-height: 1.3; }
  body[data-theme="day"] .flag { background: rgba(0,0,0,0.08); }

  /* ── Room dropdown — macOS menu ── */
  .room-dropdown {
    position: fixed; z-index: 9999;
    background: var(--dd-bg); border: 1px solid var(--dd-border); border-radius: 12px;
    padding: 5px; min-width: 210px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.50), 0 0 0 0.5px rgba(255,255,255,0.06);
    animation: dd-in 0.15s cubic-bezier(0.34,1.56,0.64,1);
    backdrop-filter: blur(40px) saturate(180%);
  }
  @keyframes dd-in { from { opacity:0; transform: translateY(-6px) scale(0.97); } to { opacity:1; transform: translateY(0) scale(1); } }
  .dd-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 8px; cursor: pointer;
    font-size: 13px; color: var(--dd-text); transition: background 0.1s;
  }
  .dd-item:hover { background: var(--dd-hover); }
  .dd-item.active { background: var(--dd-active); }

  /* ── Theme toggle ── */
  .theme-btn {
    width: 34px; height: 20px; border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    cursor: pointer; position: relative;
    display: flex; align-items: center; padding: 2px;
    transition: background 0.25s; flex-shrink: 0;
  }
  .theme-btn-knob {
    width: 14px; height: 14px; border-radius: 50%;
    background: #0A84FF; transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; line-height: 1;
  }
  body[data-theme="day"] .theme-btn-knob { transform: translateX(14px); background: #FF9F0A; }

  /* ── Center Dashboard ── */
  .dash-card {
    position: relative;
    isolation: isolate;
    border-radius: 22px;
    transition: background 0.25s;
    width: 50vw;           /* 1/2 of screen width */
    min-width: 400px;
  }
  .dash-card::before {
    content: '';
    position: absolute; inset: -1px;
    border-radius: 23px;
    background: linear-gradient(135deg, rgba(10,132,255,0.30), rgba(48,209,88,0.12));
    z-index: -1;
  }
  .dash-title { display: inline-block; }
  .dash-sub   { opacity: 0.80; }

  /* ── Dashboard — macOS widget glass panel ── */
  .dash-cockpit {
    background: rgba(28,28,30,0.85) !important;
    backdrop-filter: blur(40px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(40px) saturate(180%) !important;
    border: 1px solid rgba(255,255,255,0.12) !important;
  }
  body[data-theme="day"] .dash-cockpit {
    background: rgba(255,255,255,0.75) !important;
    border: 1px solid rgba(0,0,0,0.10) !important;
  }

  /* ── Primary stat tiles ── */
  .dash-tile {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px; padding: 11px 10px 9px; border-radius: 12px;
    flex: 1 1 0; min-width: 0;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.10);
    transition: background 0.15s, transform 0.1s;
  }
  body[data-theme="day"] .dash-tile {
    background: rgba(0,0,0,0.05);
    border: 1px solid rgba(0,0,0,0.08);
  }
  .dash-tile-btn { cursor: pointer; }
  .dash-tile-btn:hover { background: rgba(255,255,255,0.14); }
  body[data-theme="day"] .dash-tile-btn:hover { background: rgba(0,0,0,0.08); }
  .dash-tile-btn:active { transform: scale(0.93); }
  .dash-tile-active {
    background: rgba(10,132,255,0.20);
    border-color: rgba(10,132,255,0.45);
  }
  body[data-theme="day"] .dash-tile-active {
    background: rgba(0,122,255,0.12);
    border-color: rgba(0,122,255,0.35);
  }

  /* ── Acuity flag tiles (compact pill) ── */
  .flag-tile {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px; padding: 8px 6px 7px; border-radius: 12px;
    flex: 1 1 0; min-width: 0;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.10);
    transition: background 0.15s, transform 0.10s;
    cursor: default;
  }
  body[data-theme="day"] .flag-tile {
    background: rgba(0,0,0,0.05);
    border: 1px solid rgba(0,0,0,0.08);
  }
  .flag-tile-btn { cursor: pointer; }
  .flag-tile-btn:hover { background: rgba(255,255,255,0.14); }
  body[data-theme="day"] .flag-tile-btn:hover { background: rgba(0,0,0,0.08); }
  .flag-tile-btn:active { transform: scale(0.92); }
  .flag-tile-active {
    background: rgba(10,132,255,0.18);
    border-color: rgba(10,132,255,0.40);
  }
  body[data-theme="day"] .flag-tile-active {
    background: rgba(0,122,255,0.10);
    border-color: rgba(0,122,255,0.30);
  }

  /* ── Stat section label ── */
  .dash-section-label {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--dash-section);
    padding: 14px 2px 7px; user-select: none;
  }

  /* ── Rabbit animation ── */
  /* Absolute overlay — full card width, no padding constraints */
  .rabbit-track {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 64px;
    overflow: visible;
    pointer-events: none;
    z-index: 10;
    border-radius: 20px 20px 0 0;
    border-bottom: 1.5px solid rgba(255,255,255,0.28);
    box-shadow: 0 2px 8px rgba(0,0,0,0.22);
  }
  .rabbit-track::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 10px;
    background: linear-gradient(to top, rgba(255,255,255,0.07) 0%, transparent 100%);
    pointer-events: none;
  }
  /*
   * 22s cycle — monkey stays within left/right borders the whole time:
   *   0s –  3s  (0%–13.64%)    : walk left border → mid
   *   3s –  8s  (13.64%–36.36%): pause 5s at mid   ← speech bubble
   *   8s – 11s  (36.36%–50%)   : walk mid → right border
   *  11s – 14s  (50%–63.64%)   : walk right border → mid
   *  14s – 19s  (63.64%–86.36%): pause 5s at mid   ← speech bubble
   *  19s – 22s  (86.36%–100%)  : walk mid → left border
   */

  /* Layer 1: the whole group slides horizontally */
  .rabbit-runner {
    position: absolute;
    bottom: 6px;
    left: 6px;
    cursor: pointer;
    pointer-events: auto;
    animation: monkey-walk 22s linear infinite;
  }

  /* Inner wrapper for position relative (bubble anchor) */
  .monkey-group {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 2px;
  }

  /* Speech bubble */
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

  .monkey-bubble {
    position: absolute;
    bottom: calc(100% + 18px);
    left: 50%;
    transform: translateX(-50%) scale(0.6);
    background: linear-gradient(135deg, #fef08a 0%, #fde047 60%, #fbbf24 100%);
    color: #7c2d12;
    border-radius: 20px;
    padding: 10px 18px;
    font-family: 'Fredoka One', 'Pacifico', 'Comic Sans MS', cursive;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.03em;
    white-space: nowrap;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4), 0 0 0 2px #f59e0b, 0 0 14px rgba(251,191,36,0.6);
    opacity: 0;
    pointer-events: auto;
    cursor: pointer;
    z-index: 20;
    animation: bubble-show 22s linear infinite;
    transform-origin: bottom center;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  .monkey-bubble:hover {
    background: linear-gradient(135deg, #fef9c3 0%, #fef08a 60%, #fde047 100%);
    box-shadow: 0 6px 22px rgba(0,0,0,0.5), 0 0 0 2px #f59e0b, 0 0 22px rgba(251,191,36,0.8);
    transform: translateX(-50%) scale(1.06) !important;
  }
  .monkey-bubble::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 10px solid transparent;
    border-top-color: #fbbf24;
  }

  /* Layer 2: flips direction — 22s, instant snap at 50% */
  .rabbit-flip {
    animation: monkey-flip 22s step-end infinite;
    display: flex;
    align-items: flex-end;
    gap: 3px;
  }

  /* Monkey body — walk bob */
  .rabbit-emoji {
    display: inline-block;
    font-size: 32px;
    line-height: 1;
    transform-origin: center bottom;
    animation: monkey-body 0.45s ease-in-out infinite;
    filter: drop-shadow(0 0 3px rgba(0,0,0,0.5));
  }

  /* Banana — swings as held arm */
  .monkey-banana {
    display: inline-block;
    font-size: 20px;
    line-height: 1;
    transform-origin: top center;
    animation: banana-swing 0.45s ease-in-out infinite;
    margin-bottom: 4px;
  }

  /* Ground shadow */
  .monkey-shadow {
    position: absolute;
    bottom: -2px;
    left: 50%;
    width: 36px;
    height: 6px;
    background: rgba(0,0,0,0.25);
    border-radius: 50%;
    animation: shadow-pulse 0.45s ease-in-out infinite;
  }

  /* ── Keyframes ── */

  /* Position: stays within left/right borders at all times */
  @keyframes monkey-walk {
    0%      { left: 6px; }                  /* left border */
    13.64%  { left: calc(50% - 30px); }     /* arrive mid going right */
    36.36%  { left: calc(50% - 30px); }     /* still mid (5s pause) */
    50%     { left: calc(100% - 62px); }    /* right border */
    63.64%  { left: calc(50% - 30px); }     /* arrive mid going left */
    86.36%  { left: calc(50% - 30px); }     /* still mid (5s pause) */
    100%    { left: 6px; }                  /* back to left border */
  }

  /* Flip at exactly the turnaround (50%) — step-end snaps instantly */
  @keyframes monkey-flip {
    0%   { transform: scaleX(1);  }   /* going right */
    50%  { transform: scaleX(-1); }   /* going left  */
    100% { transform: scaleX(1);  }
  }

  /* Speech bubble: fade in during each 5s pause */
  @keyframes bubble-show {
    0%,   12%  { opacity: 0; transform: translateX(-50%) scale(0.6); }
    17%        { opacity: 1; transform: translateX(-50%) scale(1);   }
    33%        { opacity: 1; transform: translateX(-50%) scale(1);   }
    38%        { opacity: 0; transform: translateX(-50%) scale(0.6); }
    62%        { opacity: 0; transform: translateX(-50%) scale(0.6); }
    67%        { opacity: 1; transform: translateX(-50%) scale(1);   }
    83%        { opacity: 1; transform: translateX(-50%) scale(1);   }
    88%        { opacity: 0; transform: translateX(-50%) scale(0.6); }
    100%       { opacity: 0; transform: translateX(-50%) scale(0.6); }
  }

  /* Walk cycle bob */
  @keyframes monkey-body {
    0%   { transform: translateY(0px)  rotate(-3deg); }
    25%  { transform: translateY(-6px) rotate(0deg);  }
    50%  { transform: translateY(0px)  rotate(3deg);  }
    75%  { transform: translateY(-5px) rotate(0deg);  }
    100% { transform: translateY(0px)  rotate(-3deg); }
  }

  /* Banana arm swing */
  @keyframes banana-swing {
    0%   { transform: rotate(-20deg); }
    50%  { transform: rotate(20deg);  }
    100% { transform: rotate(-20deg); }
  }

  @keyframes shadow-pulse {
    0%, 100% { transform: translateX(-50%) scaleX(1);    opacity: 0.5;  }
    25%, 75% { transform: translateX(-50%) scaleX(0.7);  opacity: 0.25; }
    50%      { transform: translateX(-50%) scaleX(1);    opacity: 0.5;  }
  }

  /* Grogu idle — shadow freezes when standing still */
  /* grogu-idle on the runner kills child animations via higher specificity — no JS inline style needed */
  .rabbit-runner.grogu-idle .rabbit-emoji {
    animation: none;
    transition: transform 0.15s ease-out;
  }
  .rabbit-runner.grogu-idle .monkey-shadow {
    animation: none;
    transform: translateX(-50%) scaleX(1);
    opacity: 0.45;
  }

  /* ── ECO Toggle button ── */
  .eco-toggle {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer;
    font-weight: 700; font-size: 10px; letter-spacing: 0.07em;
    min-width: 76px; justify-content: center;
    transition: background 0.22s, color 0.22s, box-shadow 0.22s, border-color 0.22s;
  }
  .eco-toggle-off {
    background: rgba(118,118,128,0.24);
    color: var(--dash-label);
    border-color: rgba(118,118,128,0.30);
  }
  .eco-toggle-off:hover {
    background: rgba(118,118,128,0.36);
    color: var(--dash-head);
  }
  .eco-toggle-on {
    background: #FF9F0A;
    color: #fff;
    border-color: rgba(255,159,10,0.70);
    box-shadow: 0 2px 10px rgba(255,159,10,0.40);
  }
  .eco-icon {
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* ── "crazy" title word ── */
  .crazy-word {
    font-size: 22px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: -0.8px;
    display: inline-block;
    transform: rotate(-2deg) skewX(-3deg);
    background: linear-gradient(110deg, #0A84FF 0%, #5E5CE6 50%, #30D158 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    background-size: 200% auto;
    animation: crazy-shimmer 4s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(10,132,255,0.35));
  }
  body[data-theme="day"] .crazy-word {
    background: linear-gradient(110deg, #007AFF 0%, #5856D6 50%, #34C759 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 0 4px rgba(0,122,255,0.20));
  }
  @keyframes crazy-shimmer {
    0%, 100% { background-position: 0% center; }
    50%       { background-position: 100% center; }
  }
  @keyframes crazy-wobble {
    0%, 100% { transform: rotate(-4deg) skewX(-4deg) scale(1); }
    25%       { transform: rotate(-2deg) skewX(-2deg) scale(1.04); }
    75%       { transform: rotate(-5deg) skewX(-5deg) scale(0.97); }
  }

  /* ── OpenAssign AI button ── */
  .zap-btn {
    position: relative; overflow: hidden;
    width: 100%; border: none; border-radius: 14px;
    padding: 13px 16px;
    background: #0A84FF;
    background-size: 100%;
    color: #fff; font-weight: 600; font-size: 14px; letter-spacing: -0.1px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 4px 16px rgba(10,132,255,0.45);
    transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
    user-select: none;
  }
  .zap-btn::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(255,255,255,0.14) 0%, transparent 60%);
    border-radius: inherit; pointer-events: none;
  }
  .zap-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(10,132,255,0.55);
    filter: brightness(1.08);
  }
  .zap-btn:active:not(:disabled), .zap-btn.zap-pressed {
    transform: scale(0.96) translateY(1px);
    box-shadow: 0 2px 6px rgba(109,40,217,0.3);
    filter: brightness(0.95);
  }
  .zap-btn:disabled { opacity: 0.75; cursor: default; }
  @keyframes zap-bg {
    0%,100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  /* Icon spin */
  @keyframes zap-spin {
    to { transform: rotate(360deg); }
  }
  .zap-icon-spin { animation: zap-spin 0.3s linear infinite; display: inline-flex; }
  /* Shimmer sweep on press */
  @keyframes zap-shimmer {
    0%   { left: -120%; }
    100% { left: 140%; }
  }
  .zap-btn.zap-pressed::before {
    content: ''; position: absolute; top: 0; left: -120%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
    animation: zap-shimmer 0.4s ease forwards;
  }
</style>

const FB_KEY = 'careflow_feedback_v1';
const FB_BASELINE = { diam:1.0, load:1.0, acuity:1.0, teleCluster:1.0 };
function loadFB() {
  try { const s = JSON.parse(localStorage.getItem(FB_KEY)); return s || { entries:[], weights:{...FB_BASELINE} }; }
  catch { return { entries:[], weights:{...FB_BASELINE} }; }
}
function saveFB(store) {
  try { localStorage.setItem(FB_KEY, JSON.stringify(store)); } catch {}
}

const DOUBLE_ROOMS = new Set([1110,1111,1129,1130,1131,1132,1133,1134,1135]);
function generateRooms() {
  const list = [];
  for (let n = 1101; n <= 1135; n++) {
    DOUBLE_ROOMS.has(n) ? list.push(n+'A', n+'B') : list.push(String(n));
  }
  return list; // exactly 44
}
const ROOM_IDS = generateRooms();

const POLICY_DB_DEFAULT = [{"id":"fall_checklist","title":"Fall Checklist","category":"Fall Prevention","keywords":["fall","checklist","prevention","assessment","neuro","wise","chart","notified","score","reassessed","check","trust","verify","updated","plan","interventions","equipment","transfer","family","nsm","manager","ans","remember","times","one"],"content":"1. re-assessment Neuro wise in the chart?\n2. MD notified\n3. Fall score reassessed\n5. Check (Trust by Verify) if the RN updated plan and interventions in chart\n6. What equipment used to transfer pt after fall?\n7. Family notified?\n8. NSM/Manager/ANS notified?- Remember there are times when one of us might not be there. \n9. Post fall huddles.","source":"Fall checklist.docx","lastUpdated":"2026-05-31"},{"id":"central_line_assessment_and_documentatio","title":"Central Line Assessment and Documentation","category":"Vascular & Central Line","keywords":["central","line","assessment","documentation","vascular","assessed","insertion","least","once","shift","site","care","dressing","change","discontinuation","prn","signs","symptoms","phlebitis","infection","infiltration","extravasation","occlusion","thrombosis","secondary"],"content":"Central Line Assessment and Documentation\nCentral line will be assessed at insertion, at least once per shift,  with each use, with site care and dressing change, with discontinuation, and PRN for signs and symptoms of phlebitis, infection, infiltration / extravasation, occlusion, thrombosis, and secondary malposition.\nCVC site should be assessed at least every four hours in the setting of an intermittent or continuous vesicant infusion.\nPatiency assessment ( ability to flush without resistance and obtain blood return )should be performed for all lumens at least once per shift.\nDialysis catheter access ports are assessed for patency when initiating hemodialysis by Dialysis RN.The infusion port lumen for TRIALYSIS CATHETER ( center lumen that may be located between the two main access ports of a dialysis catheter) is assessed for patency as any other CVC by primary RN\nConsult IVT and get an order to declot CVC with Alteplase (tpa) when assessment indicates the line may have an occlusion as indicated by sluggish or no blood return.\nAssess for catheter migration each shift, with every dressing change and with any change in the amount of catheter externally visible as compared to the insertion measurement.\nDressing will be changed every seven days and PRN for soiled, loosened and or contaminated equipment.\nNotify MD and IVT if CVC presents upon admission.\nChange the IV tubing when transitioning infusion from\nPeripheral to a Central line","source":"Updated  Central Line Assessment and Documentation (1).docx","lastUpdated":"2026-05-31"},{"id":"central_line_assessment_and_documentatio","title":"Central Line Assessment and Documentation (PDF)","category":"Vascular & Central Line","keywords":["central","line","assessment","documentation","pdf","vascular","assessed","insertion","least","once","shift","site","care","dressing","change","discontinuation","prn","signs","symptoms","phlebitis","infection","infiltration","extravasation","occlusion","thrombosis"],"content":"Central Line Assessment and Documentation\n\u25cf\nCentral line will be assessed at insertion, at least once per shift, with each use,\nwith site care and dressing change, with discontinuation, and PRN for signs and\nsymptoms of phlebitis, infection, infiltration / extravasation, occlusion, thrombosis,\nand secondary malposition.\n\u25cf\nCVC site should be assessed at least every four hours in the setting of an\nintermittent or continuous vesicant infusion.\n\u25cf\nPatiency assessment ( ability to flush without resistance and obtain blood return\n)should be performed for all lumens at least once per shift.\n\u25cf\nDialysis catheter access ports are assessed for patency when initiating\nhemodialysis by Dialysis RN.The infusion port lumen for TRIALYSIS CATHETER\n( center lumen that may be located between the two main access ports of a\ndialysis catheter) is assessed for patency as any other CVC by primary RN\n\u25cf\nConsult IVT and get an order to declot CVC with Alteplase (tpa) when\nassessment indicates the line may have an occlusion as indicated by sluggish or\nno blood return.\n\u25cf\nAssess for catheter migration each shift, with every dressing change and with\nany change in the amount of catheter externally visible as compared to the\ninsertion measurement.\n\u25cf\nDressing will be changed every seven days and PRN for soiled, loosened and or\ncontaminated equipment.\n\u25cf\nNotify MD and IVT if CVC presents upon admission.\nSee on the other side for required documentation","source":"Updated  Central Line Assessment and Documentation.pdf","lastUpdated":"2026-05-31"},{"id":"vascular_education_poster","title":"Vascular Education Poster","category":"Vascular & Central Line","keywords":["vascular","education","poster","central","line","peripheral","catheter","assess","site","every","hours","frequently","high","risk","sites","critically","ill","sedated","cognitive","deficits","receiving","irritating","infusions","vesicants","rotate"],"content":"Peripheral IV Catheter\nAssess site every 4 hours\n\u2022  More frequently for high risk sites (critically \nill, sedated, cognitive deficits, or receiving \nirritating infusions/vesicants)\n\u2022  Rotate sites when clinically indicated\n\u2022  An LIP order is required to discontinue a PIVC \nand not reinsert\n\u2022  Transparent dressings to be changed every \nseven days and prn\n\u2022  Dressings with gauze change every 2 days\n\u2022  Dressings are to be labeled with time, date and \ninitials\nTubing Change\u2013Peripheral/Central\n\u2022  Tubing to be labeled with the name of the \nmedication at the infusion port closest to the \npatient and to the pump.\n\u2022  Continuous tubing q 96 hrs\n\u2022  Intermittent admin sets q 24 hrs\n\u2022  TPN/PPN/IGG/Albumin q 24 hrs\n\u2022  Lipid based infusions q 12 hrs (lipids,  \npropofol, etc\u2026)\n\u2022  Blood admin sets q4 or at the end of the unit\n\u2022  Chemotherapy set after each use\n\u2022  Tubing should be labeled with the date/time/\ninitials (date to be changed)\nNeedleless Connector:\n\u2022  Primary set change, PRN due to inability to clear \nblood, contamination, prior to drawing blood \nculture or anytime it is removed from lumen\nNote: with intermittent sets, change connector \nno more frequently than 96 hours.\nVascular Education\nCLABSI Prevention\nInsertion\n\u2022 Clip hair - DO NOT SHAVE\n\u2022  Perform proper hand hygiene\n\u2022  Prep site with hospital approved prep (alcohol/\nChlorhexidine [CHG])\n\u2022  Maximal sterile barrier precautions during \nprocedure, including a full body barrier drape \non patient\n\u2022  No observed break in sterile technique\n\u2022  CHG impregnated sterile dressing placed and \nlabeled\n\u2022  Use a sutureless securement device\nDaily Assessment\n\u2022  Assess at least once per shift\n\u2022  At least q 4 hours if an intermittent or \ncontinuous vesicant infusion\nIndications for central line includes: \n\u2022  Continuous vesicant medication\n\u2022  Complex infusions (multiple, incompatibility)\n\u2022  Invasive hemodynamic monitoring needed\n\u2022  Total parenteral nutrition\nCan the CVC be replaced/removed? \n\u2022  When criteria for CVC has been resolved\nMaintenance\n\u2022  Catheter lumens & injection ports clear and free \nof blood/residue\n\u2022  Lumens covered with needleless connectors\n\u2022  Change dressing every 7 days and/or when \ndressing or securement devices are wet, soiled \nor dislodged. Label with date/time.\n\u2022  CHG sponge/dressing in place and positioned \ncorrectly\n\u2022  Maintain securement device (sutureless is \nrecommended)\n\u2022  IV tubing labeled with date and time to be \nchanged with initial\n\u2022  Daily CHG bath unless patient has an allergy \u2013 \nuse soap and water\nExtravasation Policy\nExtravasation\n\u201cInadvertent leakage or infiltration of a vesicant \nsolution or medication into surrounding tissue\u201d\nDocument in IView under wounds\nSigns/Symptoms\n\u2022  Swelling, induration or discoloration at \nthe site\n\u2022  Blanching or temperature change at the \nsite or surrounding tissue\n\u2022  Fluid leaking from the site\n\u2022  Lack of blood return\n\u2022  Resistance to flushing\n\u2022  Absence of clinical effect of the \nmedication\n\u2022  Patient reports \u201cnumbness, \ntingling,burning, altered sensation, \ntightness\u201d\nActions\n\u2022  Stop infusion\n\u2022  Attempt to aspirate any amount of \nvesicant from PIVC before removing\n\u2022  Notify provider, Notify IV therapy if \navailable\n\u2022  Manage per orders\n\u2022  Monitor and document site for pain, \nerythema, swelling, induration, necrosis, \nskin integrity, fever, mobility of limb q 1 hr \nx2 then q 4 for the first 24 hr, then every \nshift\n\u2022  Review site at every hand off\n\u2022  Notify provider if site is not improving or \nworsens\n\u2022  May need wound consult if available\nGuidelines for Flushing\nType of \nCatheter\nFlushing/ \nLocking\nBlood \nDraws \nShort/\nPeripheral\n5-10mL NS with \neach use, every \n12-24 hours when \nnot in use\nNot preferred\nCentral/\nIntroducer/ \nPICC\nFlush with 10mL \nNS for routine \nflushing, after \nmed admin and \nwhen not in \nuse every 12-24 \nhours\nFlush with  \n10-20mL if \nblood/dextrose \nin the line\nFlush with 10mL \nNS, pre-draw, \nthen draw \ndiscard (2-3x \ninner lumen-\ngenerally 5mL)\nDraw specimen, \nthen flush with  \n10-20mL\nNS to clear the \nline\nImplanted \nport/ \nHemodialysis \ncatheter\nTunneled:\n\u2022  Closed-ended: \nflush then lock \nwith 10 mL NS \nweekly\n\u2022  Open-ended: \nflush then lock \nwith 10 mL NS \nM-W-F\nImplanted port:\n\u2022  Closed-ended: \nflush then lock \nwith 10mL NS \nmonthly and \nafter each use \nor per facility \nprotocol\n\u2022  Open-ended: \nflush then lock \nwith 10 mL NS, \nthen may use \nheparin lock \nmonthly or per \nfacility protocol\nNOTE: if drawing \nto establish a \ntherapeutic level \nof a medication \n(e.g., PTT, \nVancomycin \ntrough), that \nis or has been \ninfusing in \nthat line, direct \nperipheral \ndraw is \nrecommended\n\u2022  No peripheral \noption, pre-\nflush with 10 \nmL NS, draw \n10 mL discard, \ndraw specimen, \nthen flush with \n20 mL NS","source":"VascularEd_poster (2).pdf","lastUpdated":"2026-05-31"},{"id":"documentation_tips","title":"Documentation Tips","category":"RN Shift Workflow","keywords":["documentation","tips","shift","workflow","admission","complete","adult","history","completed","within","hours","order","entry","detail","screening","valuables","belongings","forms","via","hoc","focused","assessment","chief","complaint","documented"],"content":"Admission:\n\u25cfComplete Adult Admission History( should be completed within 24 hours of\nadmission) ,Order Entry Detail, Shift Screening and  Valuables/Belongings\nforms via Ad Hoc.\n\u25cfA focused assessment of the chief complaint should be documented within\n30 minutes of admission.\n\u25cfComplete  head to toe  assessment within four hours of admission to the\nunit.\n\u25cf2 RN skin check on all admissions /transfers from other units with\ndocumentation on who you checked the skin with .\n\u25cfSend the belongings with family/ send it to security as appropriate/ send\nmedication to the pharmacy as appropriate.We have a Patient belonging\nenvelope available for security and pharmacy. Please document  the\nenvelope number in the belonging list.\n\u25cfAdult admission history to include actual weight on admission as well as the\nmechanism used to weigh them.\n\u25cfED RNs are expected to complete the home medication history including\ncompliance, but it is your duty to ensure it is completed and up to date.\n\u25cfEnsure the patient's preferred pharmacy is up to date.\n\u25cfInitiate the  care plan based on the patient's condition.\n\u25cfSCD will be initiated as soon as possible if appropriate for moderate and\nhigh risk patients for VTE , but not to exceed four hours after admission.\nDaily Documentation:\n\u25cfAssessment,Vital signs and Shift Screen including patient education\n\u25cfTele patients: Rhythm strips to be reviewed and interpreted by RN\n\u25cfADL/ Activities and Interventions\n\u25cfNutrition/percentage of meal eaten\n\u25cfMedication Administration including patient education regarding purpose\nand side effect\n\u25cfLines,tube, and drain insertion management and care\n\u25cfPlan of care needs to be updated\n\u25cfInterpreter service as appropriate\n\n\u25cfSCD application and removal, scd\u2019s will be removed at least once per shift\nfor 30 minutes\n\u25cfRestraints as  appropriate\n\u25cfIntake and output\n\u25cfNursing progress note/ End of Shift Summary\n\u25cfCritical Event Note in any critical events ( Code Blue,RRT called, Patient fall\n,Any event in which patient was harmed or could have been harmed,\nnotification of physician for change in patient condition etc)\n\u25cfPreceptor review note as appropriate\n\u25cfPatch medication monitoring as appropriate( fentanyl, nicotine etc).\n\u25cfMake sure all your orders are reviewed and signed and activities and\ninterventions are cleaned up.\n\u25cfRASS documented on any patient receiving benzo or sedatives\n\u25cfRefusal of care as appropriate ( refusing medication,SCD etc)\nCare Plans:\n\u25cfTo be started on admission and updated every shift.\n\u25cfIf a new problem arises during their stay, you should start a new care plan\n(i.e. restraints, skin integrity, pain, etc.)\n\u25cfGuide your care plan to the patient\u2019s specific problems. For example, a\ndialysis patient should have electrolyte imbalance as part of their care plan\n\u25cfPatient specific care plans for stroke,suicide patient etc with specific patient\ngoal and intervention.Right click,modify the patient specifil goal and patient\nspecific intervention.\nAssessments:\n\u25cfA focused assessment for the chief complaint should be completed within\n30 minutes of the admission.\n\u25cfThe patient will have a complete physical assessment within four hours of\nadmission\n\u25cfThe physical assessment( \u2018\u2019 head to toe\u2019\u2019) will be performed and\ndocumented within 2 hours of the start of each shift.\n\u25cf\nThe reassessment is every 4 hours if a patient is on telemetry\n\n\u25cfOnce a shift for medical patients and reassessed one more time during\nyour shift including vital signs and pain assessment.\n\u25cfNeuro patients cannot have \u201cWDL\u201d entered for follow up neuro\nassessments. You must describe your findings even if unchanged. Please\nrefer to the neurogram attached for the required documentation for\nstroke/TIA patients.\n\u25cfAs needed.\nHead to Toe Physical Assessment:\n\u25cfNeuro assessment includes but is not limited to: LOC,orientation\nstatus,pupillary reaction to light,facial symmetry,sensory and motor\nfunction and notation of speech.\n\u25cfCardiovascular assessment includes but is not limited to: heart rate,\nregularity, and rhythm (if on telemetry), auscultation of heart sounds,\nperipheral pulse strength, capillary refill, presence of edema, complaints\nof sob or chest pain, and presence of device ( pacemakers or AICD )\n\u25cfResp assessment includes but is not limited to : Visual of chest for\ndeformities, auscultation of breath sounds, rate, quality and depth of\nrespiration\n\u25cfChest  tube should be assessed each shift and prn for\npatency,drainage,correct suction or water seal and dressing\n\n\u25cfGI assessment includes but is not limited to : visualization, auscultation,\nand palpitation of the abdomen, bowel movements, N/V and presence of\ntubes/drains/ostomies.\n\u25cfDocument types of tubes, location and character of drainage with each\nassessment.\n\u25cfAssess for placement/patency of NGT or tube feeding with each\nassessment ,before meds administration or bolus feeding and prn.\n\u25cfEmpty ostomy pouch a minimum of every shift and prn.Change ostomy\ndressing and pouch per MD order or a minimum of every five days and prn\nfor leakage or skin irritation\n\u25cfGU assessment includes but is not limited to: urination, characteristics of\nurine, and presence of catheters\n\u25cfEmpty urostomy pouch a minimum of every shift and PRN and change\nurostomy appliance every 5 days and PRN for leakage or skin irritation\n\u25cfEmpty suprapubic catheter pouch a minimum of every shift and PRN\nDialysis Patients:\n\nAV Shunt - Auscultation for bruit and palpation for thrill.\nPeritoneal dialysis catheter - inspect for signs and symptoms of infection\nand malposition\nHemodialysis catheter - inspect for s/s of phlebitis, infection, infiltration,\nand malposition.\nRhythm Strips:\n\u25cfTelemetry patients should have rhythm strips documented on arrival to the\nunit, every shift and with any rhythm change. Documented rhythm strips\nshould be reviewed and interpreted by a RN\nVital Signs:\n\u25cfVital signs will be obtained  within 30 minutes of the admission.\n\u25cfEvery 4 hours and as needed for tele patients.\n\u25cfEvery 8 hours and as needed for non tele patients.\n\u25cfPost OP patients: Every hour for the first 2 hours, ever","source":"Documenattion Tips.docx.pdf","lastUpdated":"2026-05-31"},{"id":"mews___modified_early_warning_score","title":"MEWS \u2013 Modified Early Warning Score","category":"RN Shift Workflow","keywords":["mews","modified","early","warning","score","shift","workflow","commonspirit","nursing","professional","practice","council","system","education","supplement","alison","mason","director","kimberly","porter","dnp","phn","cen","community","hospital"],"content":"CommonSpirit Nursing \nProfessional Practice Council\nModified Early Warning System\nEducation Supplement\nAlison Mason, MS, RN\nSystem Director Professional Practice\nKimberly Porter, DNP, RN, PHN, CEN\nDirector of Education, Community Hospital of \nSan Bernardino\nJuly 2023\nupdated August 3, November 28, 2023\n\nModified Early Warning System (MEWS)\n2\n\u25cf\nThe Modified Early Warning System (MEWS) is a clinical decision making tool which \ncan be used to recognize and respond to clinical deterioration, thus preventing failure to \nrescue (FTR).\n\u25cb\nFailure to rescue occurs when healthcare providers do not recognize signs and \nsymptoms of clinical deterioration nor act upon these symptoms in a timely \nmanner.  \n\u25cf\nThe use of an early warning scoring systems, such as MEWS can be used to  promote \nthe nursing identification of early warning signs clinical deterioration from any etiology.\n\u25cf\nLiterature has shown:\n\u25cb\n80% of patients who require in hospital cardiopulmonary arrest show signs of \ninstability hours before cardiac arrest.\n\nModified Early Warning System (MEWS)\n3\n\u25cf\nMEWS\n\u25cb\nScoring system which can be used for detecting those who have or are developing a \ncritical illness\n\u25cb\nProvides a quickly calculated score which is easily understood \n\u25cb\nAssists with clinical decision-making skills\n\u25cb\nUsed throughout Europe, Canada, Australia etc. as a standard of care\n\u25cb\nEndorsed by Institute for Healthcare Improvement (IHI)\n\u25cb\nMEWS is a type of early warning system (EWS) tool used as a scoring system for \ndetecting adult medical patients who have or are developing a critical illness\n\nModified Early Warning System (MEWS)\n4\n\u25cf\nMEWS\n\u25cb\nUsed for patients 18 years old and older\n\u25a0\nDoes not replace the MEWT (for pregnant patients) or the PEWS (for \npediatric patients)\n\u25cb\nCan be used by RNs and LVN/LPNs\n\u25cb\nUsed in acute care inpatient settings excluding ICU and Behavioral Health \nUnits\n\u25a0\nIncluding patients held in ED as in patients\n\u25cb\nServes as a guide to recognize and know how to respond to clinical \ndeterioration\n\nModified Early Warning System (MEWS)\n5\n\u25cf\nMEWS\n\u25cb\nThe MEWS calculation assigns a \"number\" value to five physiologic parameters.\n\u25a0\nEach parameter is evaluated and assigned the appropriate number value.\n\u25a0\nThe sum of all five parameters constitutes a MEWS total score, allowing \nhealth professionals to accurately predict and prevent a code situation.\n\u25cb\nCan identify signs of clinical deterioration by examining:\n\u25a0\nCentral Nervous System (CNS): level of consciousness (LOC)\n\u25a0\nRespiratory Rate (RR) (breaths/min)\n\u25a0\nHeart Rate (HR) (beats/min)\n\u25a0\nSystolic Blood Pressure (SBP) (mm/hg) \n\u25a0\nTemperature (T) (Fahrenheit - F or Celsius - C)\n\nALERT:\nAll adult patients will be \nassessed utilizing the \nMEWS Scoring System \nupon admission and \nevery four to six hours \nor with routine vital \nsigns. Be advised that \ncertain conditions \nincluding pregnancy \nshould be assessed and \nscored on an individual \nbasis. A score greater \nthan 4 will prompt \nincreased Vital Sign and \nMEWS Calculation \nfrequency to every 1 \nhour x 3 hours and \ninclude pulse oximetry.\n6\nModified Early Warning System (MEWS)\nSCORE \n3  \n2   \n1   \n0   \n1   \n2   \n3\nCentral Nervous System (CNS)\n-\nLevel of Consciousness\nConfused\nor agitated  \nAlert\nDrowsy /\nRespond\nto voice or\nnewly\nconfused\nRespond\nto pain\nUnresponsive\nRespiratory Rate\n(breaths/min)\n\u2264 8\n9-14\n15-20\n21-29\n\u2265 30\nHeart Rate\n(beats/min)\n\u2264 40\n41-50\n51-100\n101-110\n111-129\n\u2265 130\nSystolic Blood Pressure\n(mm/Hg)\n\u2264 70 \n71-80\n81-100 101-199\n\u2265 200\nTemperature\nCelsius (C)\n\u226435.0 \u2103\n35.06oC\n\u226538.5oC\n\n7\nModified Early Warning System (MEWS)\nBased on the patient's most current vital signs, the nurse will assign a number value for each of \nthe parameters:\nRR = Respiratory Rate (breaths/min); HR = Heart Rate (beats/min); SBP = Systolic Blood Pressure \n(mmHg)\nValue 0 = Alert\nValue 1 = Drowsy, \nResponds to Voice or \nNewly Confused\nValue 2 = \nConfused/Agitated or \nPain\nValue 3 = Unresponsive\nRR 9-14\nHR 51-100\nSBP 101-199            \nTemperature 35.1-38.4\u2103\nRR 15-20\nHR 40-50 or 101-110\nSBP 81-100\nRR \u2264 8 or 21-29\nHR <40 or 111-129\nSBP 71-80 or \u2265200\nTemperature \u2264 35o C or \n\u226538.5o C\nRR\u226530\nHR \u2265130\nSBP \u226470\n\nModified Early Warning System (MEWS)\n8\n\u25cb\nBased on the patient's most current vital signs and level of \nconsciousness  the nurse will assign a number value for each \nof the parameters:\n\u25cb\nEach item evaluated is given a score between 1 and 3\n\u25cb\nScores are tallied and the MEWS Action Algorithm is used to \nassist the nurse in a course of action\n\n9\nMEWS ACTION ALGORITHM \nMEWS\nInpatients Action (EXCLUDES Comfort Care / Hospice Patients)\n**Note: Nurses may notify RRT (Rapid Rescue Team) for any score at their discretion\n0-2\nContinue routine/ordered monitoring\n3\nIncrease VS frequency to every 4 hours X 3; Calculate the MEWS each time.\nNotify Licensed Provider\n4\nNotify Licensed Provider and consider Rapid Response Team activation. Increase VS frequency to every\n1 hour X 3; include pulse oximetry - Calculate MEWS each time.  Strict I&O - Call\nIf UOP < 100 mL/4 hr or if urinary catheter present, if urine output <30 mL/hr.\n5\nCall Rapid Response Team and Licensed Provider. Increase VS frequency to every 1 hour include pulse oximetry - Calculate \nMEWS each time.  Strict I&O - call if UOP < 100 mL/4 hr or if urinary catheter present, if urine output <30 mL/hr.  \nInform physician/provider.  If the patient remains \"5\" for three consecutive readings, request order for possible transfer to\nhigher level of care.\n\u2265 6\nCall Rapid Response Team and Licensed Provider stat.  Recommend transfer to higher level of care.\n\n10\nOutcomes\n\u25cf\nExpected Outcomes:\n\u25cb\nA score of 0-2 requires no additional intervention; continue routine/ordered monitoring.\n\u25cf\nUnexpected Outcomes:\n\u25cb\nA score of 3 requires increased monitoring of vital signs to every 4 hours x 3, calculating \nthe MEWS each time. Inform licensed provider.\n\u25cb\nA score of 4 nurse should notify Licensed Provider and consider Rapid Response Team \nactivation. Increase vital sign frequency to every 1 hour x 3; include pulse oximetry and ","source":"MEWS.pdf","lastUpdated":"2026-05-31"},{"id":"accucath_clinician_observation_checklist","title":"AccuCath Clinician Observation Checklist","category":"Ultrasound VAT","keywords":["accucath","clinician","observation","checklist","ultrasound","vat","intravascular","catheter","insertion"],"content":"checklist\nO B S E R V A T I O N\nAccuCath\u00ae \nIntravascular Catheter Insertion\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n ..................................\n .........................\n ..................................\n ..................................\n ......................... ........\nTraining Component\t\n\t\n\t\n\t\n\t\n\t\n        Date Accomplished\t                              Performed Satisfactorily \nHas completed Bard Access Systems Website Videos and  \nprovided documentation:\n 1.  Drug pH and osmolarity\n2.  Introduction to Ultrasound for Vascular Access\t\nHas completed didactic training including any relevant  \npresentation(s) and insertion video(s)\n\t\nDemonstrates an understanding of the INS, CDC, and other \nnationally accepted standards or guidelines relating to use of  \nshort peripheral catheters\n\t\nDemonstrates an understanding of proper vascular access device \nselection-factors including; drug composition considerations  \n(pH and osmolarity, etc), duration of therapy, etc. \n\t\nDemonstrates an understanding of the Bard Access Systems\u2019  \ndevice related collateral, specifically the care and maintenance of  \nthe catheter, and the risks, safety information, indications,  \ncontraindications, warnings and precautions delineated in the  \nInstructions for Use.\t\nPerformance Criteria\t\n\t\n\t\n\t\n\t\n\t\n\t\n\t\nDate:    Date:     Date:         Comments\nPrior to AccuCath\u00ae Intravascular Catheter insertion, instructor demonstrates:\n\u2022  Obtain and review order for AccuCath\u00ae Intravascular Catheter insertion,  \n    if required by institution\n    \u2022  Review patient allergies \n    \u2022  Review patient contraindications to vascular access device placement\n\u2022  Reviews patient\u2019s medical history\nThe following observations will be completed for actual patient insertions.\nClinician Name  \t\n\t\n\t\n\t\n     \t\n        Facility Name\nObserver Name and Title\t\n\t\n\t\n\t\n\t\n                       Observation Dates\nObservation: This documentation of observation of the use of AccuCath\u00ae Intravascular Catheter is intended \nto assist instructors in verifying some of the knowledge and skills required to safely insert the AccuCath\u00ae \nIntravascular Catheter in accordance with the device\u2019s Instructions for Use. This observation checklist is \nnot intended as a supplement to or a replacement for the Instructions for Use. Please refer to the complete \nInstructions for Use for risks, safety information, instructions, contraindications, warnings and precautions, etc.\nIndications:  The AccuCath\u00ae BC Intravascular Catheter System is inserted into a patient\u2019s vascular system \nto sample blood, monitor blood pressure, or administer fluids intravenously. This device may be used with \nconsideration given to adequacy of vascular anatomy, appropriateness of the solution being infused and \nduration of therapy. The Accucath\u00ae BC is suitable for use with low pressure power injectors having maximum \npressure setting of 300 psi and a maximum flow rate of 6 mL/second.\nPlease consult product labels and inserts for any indications, contraindications, hazards, warnings, \nprecautions, and directions for use.\n\nPerformance Criteria\t\n\t\n\t\n\t\n\t\n\t\n\t\n\t\nDate:\t\nDate:\t\nDate:\t\n    Comments\nGathers supplies and imaging equipment, if desired\nPatient Preparation:\n\u2022  Position patient for procedure. Perform ultrasound pre-scan, if desired\n\u2022  Select and mark the vein based on patient assessment\n\u2022  Select catheter gauge and length based on vein size, location, \n      depth and infusate properties\nSkin Preparation, clinician will:\n\u2022  Perform hand hygiene and don prep gloves\n\u2022  Prepare site with antiseptic solution according to institutional policy\nCatheter Preparation, clinician will:\n\u2022  Apply tourniquet\n\u2022  Remove needle cover and inspect coiled tip. If missing or damaged,  \n    discard unit\n\u2022  Advance guidewire from the current position by moving slider toward  \n   the catheter tip until it stops. Then fully retract the guidewire by moving  \n   slider away from catheter tip until it stops and coiled tip is no longer  \n    visible.  Guidewire must be fully retracted prior to venipuncture\n Perform Venipuncture, instructor will:\n\u2022  Anesthetize with local anesthesia, if desired as per institutional protocol\n\u2022  Cannulate vein. May use ultrasound guidance (if desired)\n\u2022  Lower catheter to  appropriate angle as needed and ensure catheter is  \n    stabilized Slowly deploy guidewire into vein by  gently moving slider  \n    toward catheter tip until fully deployed. Do not force or retract guidewire.  \n    The guidewire must be fully deployed prior to advancing the catheter off  \n    the needle\n\u2022  Advance catheter using two fingers at catheter hub and opposite hand  \n    to stabilize the device. Avoid simultaneously pulling the needle out as  \n    catheter is pushed in\n\u2022  Release the tourniquet\n\u2022  Depress the safety activation button while stabilizing the catheter with  \n    opposite hand. This will retract the needle and proximal portion of the  \n    guidewire into the safety chamber. Do not add any pressure on the needle  \n    during activation and do not let go of the device.  Always ensure the  \n     needle has retracted. Coiled tip","source":"AccuCath Clinician Observation Checklist_interactive BASACCU09150009 (4).pdf","lastUpdated":"2026-05-31"},{"id":"vessel_purchase_in_peripheral_catheters","title":"Vessel Purchase in Peripheral Catheters","category":"Ultrasound VAT","keywords":["vessel","purchase","peripheral","catheters","ultrasound","vat","understanding","insertion","angle","catheter","depth","com","logo","trademarks","becton","dickinson","company","affiliates","property","respective","owners","rights","reserved","cont","length"],"content":"Understanding  \nVessel Purchase in  \nPeripheral Catheters\nInsertion \nangle\nCatheter vessel purchase\nVessel \ndepth\n\nbd.com\nBD and the BD Logo are trademarks of Becton, Dickinson and Company or its affiliates.  \nAll other trademarks are the property of their respective owners. \u00a9 2020 BD. All rights reserved. BD-20368 (8/20)\nUnderstanding Vessel Purchase  \nin Peripheral Catheters (cont\u2019d.)\nVessel depth (cm)\nInsertion angle (\u00b0)\nCatheter length\nCatheter vessel \npurchase (in.)\n% Catheter in vessel\n0.5\n30\n1 in.\n0.6\n61%\n1.25 in.\n0.9\n69%\n1.88 in.\n1.5\n79%\n2.25 in.\n1.9\n83%\n8 cm (3.15 in.)\n2.7\n88%\n10 cm (3.94 in.)\n3.5\n90%\n45\n1 in.\n0.7\n72%\n1.25 in.\n1.0\n78%\n1.88 in.\n1.6\n85%\n2.25 in.\n2.0\n88%\n8 cm (3.15 in.)\n2.8\n91%\n10 cm (3.94 in.)\n3.6\n93%\n1\n30\n1 in.\n0.2\n22%\n1.25 in.\n0.5\n38%\n1.88 in.\n1.1\n59%\n2.25 in.\n1.5\n65%\n8 cm (3.15 in.)\n2.3\n75%\n10 cm (3.94 in.)\n3.1\n80%\n45\n1 in.\n0.4\n45%\n1.25 in.\n0.7\n56%\n1.88 in.\n1.3\n71%\n2.25 in.\n1.7\n75%\n8 cm (3.15 in.)\n2.6\n82%\n10 cm (3.94 in.)\n3.3\n86%\n1.5\n30\n1 in.\n-0.2\n-17%\n1.25 in.\n0.1\n6%\n1.88 in.\n0.7\n38%\n2.25 in.\n1.1\n48%\n8 cm (3.15 in.)\n2.0\n63%\n10 cm (3.94 in.)\n2.7\n70%\n45\n1 in.\n0.2\n17%\n1.25 in.\n0.4\n34%\n1.88 in.\n1.1\n56%\n2.25 in.\n1.4\n63%\n8 cm (3.15 in.)\n2.3\n73%\n10 cm (3.94 in.)\n3.1\n79%\n2\n30\n1 in.\n-0.6\n-56%\n1.25 in.\n-0.3\n-25%\n1.88 in.\n0.3\n17%\n2.25 in.\n0.7\n31%\n8 cm (3.15 in.)\n1.6\n50%\n10 cm (3.94 in.)\n2.3\n60%\n45\n1 in.\n-0.1\n-10%\n1.25 in.\n0.1\n12%\n1.88 in.\n0.8\n41%\n2.25 in.\n1.1\n51%\n8 cm (3.15 in.)\n2.0\n65%\n10 cm (3.94 in.)\n2.8\n72%\nThis chart is not for clinical purposes and does not describe \nthe actual amount of vessel purchase in human anatomy.","source":"BD-20368 Vessel Purchase in Peripheral Catheters .pdf","lastUpdated":"2026-05-31"},{"id":"domestic_abuse___sexual_assault_report_p","title":"Domestic Abuse / Sexual Assault Report Process","category":"Domestic Abuse","keywords":["domestic","abuse","sexual","assault","report","process","occurred","facility","call","police","long","term","linel","california","community","line","voicemail","home","aps"],"content":"Domestic abuse or sexual assault report process\nIf occurred in facility:\nCall police\nLong term facility report lineL 18002314024\nCalifornia community report line 8445388766 voicemail: 9162634700\nIf occurred at home: \nCall PD\nAPS","source":"Domestic abuse or sexual assault report process.docx","lastUpdated":"2026-05-31"},{"id":"massive_blood_transfusion_protocol","title":"Massive Blood Transfusion Protocol","category":"Lab & Blood","keywords":["massive","blood","transfusion","protocol","lab","process","mtp","physician","verbally","communicated","need","call","bank","let","them","know","initiating","completes","purple","form","emergency","issue","donor","available","bring"],"content":"Massive Blood Transfusion Protocol Process (MTP)\n1. Physician verbally communicated need for massive transfusion\n2. RN will call blood bank ( 37485 ) and let them know that we are\ninitiating MTP\n3. RN completes the purple form ( Emergency Issue of Donor Blood ) if\navailable , if not bring the green form to blood bank\n4. Blood bank will dispense the available units\n5. Blood bank will give you the purple form ,complete it when possible\nwith MD signature and return to blood bank within 12 to 24 hours of\ninitiation of protocol\n6. RN enters the order for Massive Blood Transfusion Protocol in Cerner\nwhen possible.\n7. Once patient\u2019s bleeding is controlled/ stable, MD calls an end to MTP","source":"Massive Blood Transfusion Protocol Process.pdf","lastUpdated":"2026-05-31"},{"id":"blood_product_management","title":"Blood Product Management","category":"Lab & Blood","keywords":["blood","product","management","lab","mercy","hospital","folsom","page","printed","copies","reference","only","refer","electronic","copy","manager","current","document","version","subject","products","departments","nursing","units","laboratory"],"content":"Mercy Hospital Folsom \n \n \n \nPage 1 of 14 \nPrinted copies are for reference only.  Refer to the electronic copy in Policy Manager for current \ndocument version. \n \n \nSUBJECT: \nBlood Products Management \n \nDEPARTMENTS: \nAll Nursing Units, Laboratory, Surgery \n   \nPURPOSE: \n \nTo outline the management of the patient receiving blood and blood products.  \n \nPOLICY: \nA. \nPatients scheduled for elective surgery/procedures and for whom a PRBC Requisition or Type \nand Screen, FFP Requisition, or Platelet Requisition is ordered must have documentation in the \nmedical record, completed by the surgeon/physician, that the Paul Gann Blood Transfusion (risk, \nbenefits, and directed donor) information was provided. \n \nB. \nInpatient and Outpatients for whom a PRBC Requisition, FFP Requisition, or Platelet \nRequisition has been ordered and it is not a life-threatening situation, are also considered to be \nunder the Paul Gann Transfusion Law.   \nThese patients must be provided with the \u201cWhat You Need to Know: Blood Transfusions\u201d \ninformation. \n \nC.        If documentation of informed consent is not available, notify the surgeon/physician \n              that this must be documented in the medical record prior to the surgery/procedure or  \n              transfusion beginning. \n \nD. \nThe patient has the right to refuse Blood and Blood Products.  \n1. \nNotify the physician immediately and document refusal in the medical record. \n2. \nThe patient\u2019s consent for blood/blood product transfusions or the refusal of blood/blood \nproducts can be changed by the patient at any time during their hospitalization. \n \nE. \nMedications or fluids other than 0.9% NaCl may NOT be added to blood or components. \n \nF. \nBlood Bank personnel will notify the appropriate nursing department when blood products \nordered STAT or ASAP are available for administration. Nursing staff will administer STAT or \nASAP blood products within 1 hour of notification that the blood product is ready for \nadministration. \n \nG. \nOnce blood product is received, transfuse within 30 minutes of its release from the Blood Bank; \nproducts CANNOT be returned for re-issue once they have left the Blood Bank. They can be \nreturned, but they will be disposed of. \n \nH. \nIn a non-emergent situation blood may not be infused in less than 1 \u00bd hours without a physician  \n             order. \n \nI. \nTransfusion must be completed within 4 hours after release of the blood from the Blood Bank. \n \nJ. \nHold blood bags 4 hours after transfusion in case of delayed reaction. Discard blood bag and \ntubing in Bio-Hazardous waste receptacle. \n \nPROCEDURE: (Refer to attachment \u201cStandard Blood Request Process\u201d Algorithm) \nA. \nReview order from physician for blood transfusions.  Assure the following is included in the order: \n1. \nProducts to be administered \n2. \nNumber of units/volume to be administered and/or hold instructions \n3. \nDate to be administered \n4. \nSpecial processing (i.e. CMV negative; irradiated) \n5. \nPre-medication orders, if indicated \n\nMercy Hospital Folsom \n \n \nPage 2 of 14 \nPrinted copies are for reference only.  Refer to the electronic copy in Policy Manager for current \ndocument version. \n \n \nB. \nAssessment \n1. \nAssess if patient has received transfusions in the past and the patient\u2019s response to \nblood products such as febrile reactions or fluid overload. \n2.       Obtain physician order to pre-medicate if patient has history of febrile reactions to blood \nproducts, especially if they receive frequent blood products for chronic conditions.  Allow \n30-60 minutes for oral pre-medication, 10 minutes for IV pre-medication to become \neffective.  \n \nC. \nAssess for presence and accuracy of Blood Bank ID Band (BBID).   \n1. \nA BBID is required for Packed Red Blood cells, Whole Blood, Granulocytes and \nAutologous Blood. \n2.          A BBID is NOT required for Fresh Frozen Plasma, Platelets, Rh Immune Globulin and  \n \nCryoprecipitates. \n3.          The BBID number, patient name, medical record number and date of birth MUST  \n \n \nMATCH. \n4.  \nIf NOT present or incorrect, notify the Blood Bank. \n \nD. \nObtain patient or patient\u2019s representative signature on the \u201cConsent For Blood/Blood Product \nTransfusion\u201d Consent Form, which is to be used for all blood and blood product transfusions.  \n1.       Place completed consent form in the chart.  \n2. \nThe consent remains in effect for the duration of hospitalization or the outpatient series \nadmission.  \n \nE.  \nObtain blood products from the lab no more than 30 minutes prior to beginning of transfusion.   \n1. \nThe Dignity Health Request for Blood Issue, which includes BBID number is necessary to \nobtain blood product from the lab.  \n2.       The BBID number from patient\u2019s armband must be checked and written on the slip before \n             going to the laboratory for blood check-out.  (Trained Non-licensed personnel can obtain \nblood products from Lab). \n3. \nPer unit of blood product, print Blood Transfusion Order Requisition from electronic \nhealth record (EHR) and staple to green Request for Blood Issue Form and bring both to \nthe lab. \n \nF. \nDonor and recipient information is verified immediately before transfusion in the presence of the \nrecipient, and includes the following: \n           * Conclusive identification of the recipient in the presence of the recipient with two patient \nidentifiers by either two persons (eg. By checking wristband for name and hospital number), or \nusing bedside identification technology (scanning BBID wristband). \n          * Patient identifiers on the blood or component unit label match the identity of the recipient. \n           *Review of intended recipients blood type \n          * Donor unit identification number and donor blood type \n           *Interpretation of crossmatch tests, where applicable \n           *Donor unit expiration date and time \n           *Special transfusion requirements (if warranted) \n           * Sign, date and time the blood slip \n \n \n \n \nIf the Blood Product is administered ","source":"Blood product management.pdf","lastUpdated":"2026-05-31"},{"id":"blood_transfusion_protocol","title":"Blood Transfusion Protocol","category":"Lab & Blood","keywords":["blood","transfusion","protocol","lab","greater","sacramento","division","laboratories","printed","copies","reference","only","refer","electronic","copy","latest","version","page","subject","reaction","departments","services","sites","met","mgh"],"content":"Greater Sacramento Division Laboratories \n____________________________________________________________________ \n \nPrinted copies are for reference only. Please refer to the electronic copy for the latest version. \nPage 1 of 10 \n \n \nSUBJECT: \n \nTransfusion Reaction \n \nDEPARTMENTS: \nTransfusion Services \n \nSITES:  \n \nMET, MGH, MHF, MSJ, WHC, and SNMH \n \nDATE APPROVED: \n3/29/2022 \n \nAPPROVERS: \nOswal MD, Hemlata; Rodriguez MD, Rafael; Sonu MD, Rebecca; Wang MD, \nKim; Wilton MD, Maaya; Wong MD, Anna \n \nPURPOSE: \n \n \nIn spite of extensive donor screening and laboratory testing, a small number of transfused patients \nexperience adverse transfusion reactions.  The cellular or fluid portions of the blood, anticoagulant-\npreservative solution, metabolic by-products, and circulating or contaminant microorganisms may cause \nadverse reactions. \n \nAll reactions should be considered as potentially life-threatening and an investigation must be \nperformed STAT. No other blood components should be transfused until the preliminary post-\ntransfusion testing is completed. \n \nLaboratory evaluation of a suspected hemolytic reaction should follow a hierarchic approach. Testing is \ndivided into two workups: Basic and Extended. A Basic workup is designed to detect an acute hemolytic \ntransfusion reaction; a negative basic workup rules out an acute hemolytic reaction. The second tier of \ntesting is performed if the first tier of testing indicates that hemolysis has occurred. It is intended to \nestablish the diagnosis of immune hemolysis.   \n \nPROCEDURE OBJECTIVES: \n \n1. Determine if any adverse symptom(s) during or post-transfusion is due to a transfusion reaction \n2. Classify transfusion reaction to determine extent of workup \n3. Determine if transfusion needs to be discontinued \n \nSAFETY PRECAUTIONS: \n \n \nFollow standard specimen precautions \n \nSPECIMEN REQUIREMENTS:  \n \n1. A Transfusion Reaction (TRXN) Power Plan must be ordered by nursing in PowerChart. \n \n2. Basic Transfusion Reaction Workup \n \n2.1. Pre-Transfusion blood bank specimen labeled with BBID system \n \n2.2. One post-transfusion blood bank specimen tube - avoid hemolysis. DO NOT RE-BAND and DO \nNOT CUT OFF pre-transfusion BBID; confirm and write on the specimen tube or use the BBID \nsticker from the pre-transfusion BBID. This creates a second bedside clerical check and \nidentification of the patient, yet still keeps the original cross-matched units available for the \npatient following the transfusion work-up. \n \n2.3. Empty or partially empty blood bag, transfusion tag attached, and IV set with IV solution attached \n(keep sealed and clamped, but remove needle) \n \n\nGreater Sacramento Division Laboratories \n____________________________________________________________________ \n \nPrinted copies are for reference only. Please refer to the electronic copy for the latest version. \nPage 2 of 10 \n \n \n2.4. If temperature elevation is 2\u00b0F or more, instruct RN to contact MD. If MD orders Blood Cultures, \ndraw two (2) post transfusion blood culture sets from patient at 15 minute intervals. \n \n3. Extended Transfusion Reaction Workup \n3.1. Basic Transfusion Reaction Specimens \n \n3.2. 1st voided urine specimen \n \n3.3. One post-transfusion light green heparin serum separator tube \n \n4. Upon completion of work-up, save all related blood specimens, donor blood bag(s), and I.V. solutions \nfor seven (7) days and until all the culture reports are final. \n \n4.1. Place the blood bag in a sealed plastic bag.  Attach a label to the plastic bag, listing the patient\u2019s \nname and discard date.  Place the bag in the Quarantine or Biohazard area in the blood bank \nrefrigerator. \n \nPROCEDURE: \nNURSING ACTIONS: \n \nSymptom/Reaction Chart \nMost Symptoms occur during or within 4 hours of the completion of the transfusion. \nSymptoms of a delayed reaction, including TRALI and TACO may occur more than 4 hours post-\ntransfusion \nSymptoms listed may lead to the numbered type of transfusion reaction. \n1. Allergic Reaction \n2. Acute hemolytic transfusion reaction (AHTR) \n3. Delayed transfusion reaction (hemolytic or serologic) \n4. Febrile (FNHTR) (Change \u02c3 2\u00b0F or 1.2\u00b0C) \n5. Hypotensive transfusion reaction \n6. Post-transfusion purpura (PTP) \n7. Transfusion-associated circulatory overload (TACO) \n8. Transfusion-related acute lung injury (TRALI) \n9. Transfusion-associated dyspnea (TAD) \n10. Transfusion-associated graft vs. host disease (TAGVHD) \n11. Transfusion-transmitted infection (TTI) \n12. Anaphylactic \n \nBack Pain 2 \nFlushing 1, 5, 12 \nPulse Increase 4, 7 \nB/P Significant change from \nbaseline 2, 7 \nHeadache 4, 7, 11 \nRash 1 \nBreathing Difficulty  2, 7, 8, 9, 12 \nHives 1, 12 \nRespiratory Arrest 8, 12 \nCardiac Arrest 12 \nHypotension 2, 5, 8, 11, 12 \nShock 11 \nChest Pain 2, 6, 12 \nHypoxia 8, 12 \nSyncope/Faint/Dizzy 12 \nChills 2, 4, 8, 11 \nItching 1 \nTemp. Change of 2\u00b0F or more 2, \n3, 4, 8, 10, 11 \nClotting failure 2, 6 \nI.V. Site Pain 2 \nUrine-Dark, Bloody 2 \nConjunctival Erythema (See pg. 9, \n#4) \nMuscle Aching 11 \nUrine-Decreased Output 2, 11 \nConvulsions 2 \nNausea/Vomiting 4, 10, 12 \nDecreased Hgb/Hct in absence of \nactive bleeding 3 \nCyanosis 2, 4, 8, 12 \nPetechia/Purpura 6 \nJaundice 3 \nDeath 2, 8, 12 \nPulmonary Edema 7, 8  \nPositive DAT or IDAT 3 \n\nGreater Sacramento Division Laboratories \n____________________________________________________________________ \n \nPrinted copies are for reference only. Please refer to the electronic copy for the latest version. \nPage 3 of 10 \n \n \n \n1. Stop the transfusion, but do not disconnect.  Determine if temperature change is greater than 2 \ndegrees Fahrenheit or 1.2 degrees Celsius.  Use the chart below to convert the pre- and post-\ntransfusion temperatures to degrees Fahrenheit. \n \n\u02daC \n\u02daF \n\u02daC \n\u02daF \n\u02daC \n\u02daF \n\u02daC \n\u02daF \n\u02daC \n\u02daF \n\u02daC \n\u02daF \n34.0 \n93.2 \n35.2 \n95.4 \n36.4 \n97.5 \n37.6 \n99.7 \n38.8 \n101.8 \n40.1 \n104.0 \n34.1 \n93.4 \n35.3 \n95.5 \n36.5 \n97.7 \n37.7 \n99.9 \n38.9 \n102.0 \n40.2 \n104.2 \n34.2 \n93.6 \n35.4 \n95.7 \n36.6 \n97.9 \n37.8 \n100.0 \n39.0 \n102.2 \n40.3 \n104.4 \n34.","source":"bloodTransfusion.pdf","lastUpdated":"2026-05-31"},{"id":"blood_transfusion_in_powerchart","title":"Blood Transfusion in PowerChart","category":"Lab & Blood","keywords":["blood","transfusion","powerchart","lab"],"content":"","source":"Blood transfusion in power chart.pdf","lastUpdated":"2026-05-31"},{"id":"blood_product_management__updated","title":"Blood Product Management (Updated)","category":"Lab & Blood","keywords":["blood","product","management","updated","lab","mercy","hospital","folsom","page","printed","copies","reference","only","refer","electronic","copy","manager","current","document","version","subject","products","departments","nursing","units"],"content":"Mercy Hospital Folsom \n \n \n \nPage 1 of 14 \nPrinted copies are for reference only.  Refer to the electronic copy in Policy Manager for current \ndocument version. \n \n \nSUBJECT: \nBlood Products Management \n \nDEPARTMENTS: \nAll Nursing Units, Laboratory, Surgery \n   \nPURPOSE: \n \nTo outline the management of the patient receiving blood and blood products.  \n \nPOLICY: \nA. \nPatients scheduled for elective surgery/procedures and for whom a PRBC Requisition or Type \nand Screen, FFP Requisition, or Platelet Requisition is ordered must have documentation in the \nmedical record, completed by the surgeon/physician, that the Paul Gann Blood Transfusion (risk, \nbenefits, and directed donor) information was provided. \n \nB. \nInpatient and Outpatients for whom a PRBC Requisition, FFP Requisition, or Platelet \nRequisition has been ordered and it is not a life-threatening sit
